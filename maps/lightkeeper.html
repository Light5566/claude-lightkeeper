t stops. All of them advise; none can block.\n\n## Modules\n\n- [[Hook runner]] — The single entry point for all four hook events, plus the plumbing they share: payload handling, the vault lookup and the per-session state file\n- [[Session primer]] — On SessionStart, tells Claude the vault exists and how to query it\n- [[Prompt hints]] — On UserPromptSubmit, matches the prompt against note names, aliases and flags and names up to three notes to read first\n- [[Pre-edit pointer]] — On PreToolUse for Write and Edit, points Claude at the note that owns the file before the edit lands\n- [[Stop reminder]] — On Stop, checks whether watched code moved this session while the vault didn't, and names the exact notes the changed files belong to\n"},"Keeping the map honest":{"path":"1 Domains/Keeping the map honest.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The linter, the maintenance signals it computes, and the tidy pass that works them.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [domain]\n---\n\n# Keeping the map honest\n\n## What it is\n\nThe linter, the maintenance signals it computes, and the tidy pass that works them.\n\n## Modules\n\n- [[Check]] — `vault check` lints the vault; with `--write` it also rebuilds the index and regenerates Coverage, the Vault Changelog, Attention, status.json and the canvas\n- [[Tidy]] — `/lightkeeper:tidy` and the vault-tidy skill work the attention list, or tidy one named note, and report before and after\n"},"Setup":{"path":"1 Domains/Setup.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"Getting a vault onto a machine: the init command, the scaffold every new vault starts from, and the `vault` launcher on the PATH.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [domain]\n---\n\n# Setup\n\n## What it is\n\nGetting a vault onto a machine: the init command, the scaffold every new vault starts from, and the `vault` launcher on the PATH.\n\n## Modules\n\n- [[Init]] — Creates a new vault, clones a teammate's, or adopts an existing Obsidian folder, then registers it so the hooks can find it\n- [[Scaffold]] — The folder every new vault is copied from: the eight note folders, Home, the conventions, the note templates and the Bases views\n- [[CLI launcher]] — The `vault` command\n"},"Teams":{"path":"1 Domains/Teams.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"Keeping one map true when several people and machines push code: the catch-up report, the git hooks, the vault backup and the pull-request bot.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [domain]\n---\n\n# Teams\n\n## What it is\n\nKeeping one map true when several people and machines push code: the catch-up report, the git hooks, the vault backup and the pull-request bot.\n\n## Modules\n\n- [[Sync]] — `vault sync` reports what landed on each repo since the vault last caught up, grouped by owning note, and the vault-sync skill walks the catch-up\n- [[Git report hooks]] — `post-merge` and `pre-push` hooks in a code checkout that print how far the vault is behind the branch\n- [[Backup push]] — A post-commit hook inside the vault repo that pushes every vault commit to its remote, so a one-machine vault is never more than a commit behind its backup\n- [[PR comment action]] — A GitHub Action that comments on each pull request with the notes owning its changed files and lists files that match no note\n"},"Writing notes":{"path":"1 Domains/Writing notes.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The commands and the skill that turn code into notes: seeding a fresh vault, tracing a journey, recording a release, and the rules Claude follows when it writes.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [domain]\n---\n\n# Writing notes\n\n## What it is\n\nThe commands and the skill that turn code into notes: seeding a fresh vault, tracing a journey, recording a release, and the rules Claude follows when it writes.\n\n## Modules\n\n- [[Seed]] — `/lightkeeper:seed` proposes the first domains and module stubs from the repo's shape, asks, then writes them with real file paths\n- [[Trace]] — `/lightkeeper:trace` follows a route, console command or job through the code and drafts a flow note with one reasoned link per module it crosses\n- [[Release]] — `/lightkeeper:release` drafts a release note from what moved per owning note\n- [[Knowledge-vault skill]] — The skill that tells Claude when to query the vault and how to write a note: the one rule, the Where it lives table, the honesty fields, and that updating the note is part of done\n"},"Backup push":{"path":"2 Modules/Backup push.md","type":"module","status":"shipped","depth":"stub","domain":"Teams","repo":"lightkeeper","updated":"2026-10-20","summary":"A post-commit hook inside the vault repo that pushes every vault commit to its remote, so a one-machine vault is never more than a commit behind its backup.","aliases":[],"tags":["module","domain/teams"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Teams\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/teams]\n---\n\n# Backup push\n\n## What it is\n\nA post-commit hook inside the vault repo that pushes every vault commit to its remote, so a one-machine vault is never more than a commit behind its backup.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook | `lib/git-hooks/post-commit` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Teams]] — this module's area\n- [[Init]] — enabled by `--backup-remote`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- It pushes synchronously with a timeout and `GIT_TERMINAL_PROMPT=0`: a background push can be killed with the shell, and a prompt would hang the commit.\n\n## History\n\n-\n"},"CLI launcher":{"path":"2 Modules/CLI launcher.md","type":"module","status":"shipped","depth":"stub","domain":"Setup","repo":"lightkeeper","updated":"2026-10-20","summary":"The `vault` command.","aliases":["vault command"],"tags":["module","domain/setup"],"flags":[],"inbound":4,"body":"---\ntype: module\naliases: [vault command]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Setup\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/setup]\n---\n\n# CLI launcher\n\n## What it is\n\nThe `vault` command. It finds the installed plugin and hands each subcommand to the matching script in `lib/`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Launcher | `bin/vault` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Setup]] — this module's area\n- [[Init]] — `--install-cli` copies this file to `~/.local/bin/vault`\n- [[Claude Code]] — finds the plugin through Claude Code's `installed_plugins.json`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- It looks for an install key starting `lightkeeper@` or `vault@` (the plugin was renamed in 2.3.0). The copy in `~/.local/bin` doesn't update itself, so a launcher installed before 2.3.0 needs `/lightkeeper:init --install-cli` once.\n- The CLI kept the name `vault` on purpose when the plugin became Lightkeeper.\n\n## History\n\n-\n"},"Check":{"path":"2 Modules/Check.md","type":"module","status":"shipped","depth":"full","domain":"Keeping the map honest","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault check` lints the vault; with `--write` it also rebuilds the index and regenerates Coverage, the Vault Changelog, Attention, status.json and the canvas.","aliases":["vault check"],"tags":["module","domain/keeping-the-map-honest"],"flags":[],"inbound":7,"body":"---\ntype: module\naliases: [vault check]\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Keeping the map honest\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/keeping-the-map-honest]\n---\n\n# Check\n\n## What it is\n\n`vault check` lints the vault; with `--write` it also rebuilds the index and regenerates Coverage, the Vault Changelog, Attention, status.json and the canvas.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/check.py` |\n\n## How it works\n\nLints links that don't resolve, duplicate filenames, links without a reason, container directories in Where it lives, off-schema frontmatter, orphans, stale notes and secret-shaped text. With `--write` it computes the maintenance signals: consolidate, re-verify, promote, path rot and link rot.\n\n## Connects to\n\n- [[Keeping the map honest]] — this module's area\n- [[Index and resolver]] — rebuilds `_meta/index.json`\n- [[World canvas]] — regenerates `World.canvas`\n- [[Tidy]] — writes the attention list that tidy works\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Only notes with a `type:` are linted, so an adopted vault can be typed gradually.\n\n## History\n\n-\n"},"Find":{"path":"2 Modules/Find.md","type":"module","status":"shipped","depth":"full","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault find` answers \"which notes cover this topic\" and \"which notes own these files\", printing each hit with its neighbours and the reason for each link.","aliases":["vault find"],"tags":["module","domain/command-line"],"flags":[],"inbound":2,"body":"---\ntype: module\naliases: [vault find]\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# Find\n\n## What it is\n\n`vault find` answers \"which notes cover this topic\" and \"which notes own these files\", printing each hit with its neighbours and the reason for each link.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/find.py` |\n\n## How it works\n\nTerm search runs in tiers: names, aliases and flags first, then tags and domain, then a full-text grep over the notes. `--paths` resolves files through the reverse index. The neighbour list is the blast radius of a change.\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Index and resolver]] — reads the index and the reverse file index\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Git report hooks":{"path":"2 Modules/Git report hooks.md","type":"module","status":"shipped","depth":"stub","domain":"Teams","repo":"lightkeeper","updated":"2026-10-20","summary":"`post-merge` and `pre-push` hooks in a code checkout that print how far the vault is behind the branch.","aliases":[],"tags":["module","domain/teams"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Teams\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/teams]\n---\n\n# Git report hooks\n\n## What it is\n\n`post-merge` and `pre-push` hooks in a code checkout that print how far the vault is behind the branch. Report only: they never block git.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook body | `lib/git-hooks/report.sh` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Teams]] — this module's area\n- [[Sync]] — runs `vault sync --brief --no-fetch` for the current branch\n- [[Init]] — installed by `--git-hook`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Silent on machines without the vault or the `vault` launcher, so teammates without Lightkeeper aren't bothered.\n\n## History\n\n-\n"},"HTML export":{"path":"2 Modules/HTML export.md","type":"module","status":"shipped","depth":"stub","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault export --html` writes the whole vault as one self-contained page: a force-directed graph with a reader panel for each note.","aliases":["vault export"],"tags":["module","domain/command-line"],"flags":[],"inbound":2,"body":"---\ntype: module\naliases: [vault export]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# HTML export\n\n## What it is\n\n`vault export --html` writes the whole vault as one self-contained page: a force-directed graph with a reader panel for each note. The gallery's maps are made this way.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/export_html.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Index and resolver]] — draws nodes and edges from the index\n- [[GitHub]] — the exported maps are served from the repo's Pages site\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Before 2.1.3 a phone-width page opened mostly empty once the note panel shrank the graph; a ResizeObserver now refits until the reader pans or zooms.\n- `--html` and `--out` are the same option since 2.2.1, and without `--vault` it uses the vault covering the current folder.\n- d3 comes from cdnjs, the page's only network request.\n\n## History\n\n-\n"},"Hook runner":{"path":"2 Modules/Hook runner.md","type":"module","status":"shipped","depth":"full","domain":"Hooks","repo":"lightkeeper","updated":"2026-10-20","summary":"The single entry point for all four hook events, plus the plumbing they share: payload handling, the vault lookup and the per-session state file.","aliases":[],"tags":["module","domain/hooks"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Hooks\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/hooks]\n---\n\n# Hook runner\n\n## What it is\n\nThe single entry point for all four hook events, plus the plumbing they share: payload handling, the vault lookup and the per-session state file.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Declaration | `hooks/hooks.json` |\n| Entry point | `lib/hooks/run.py` |\n| Shared | `lib/hooks/_util.py` |\n\n## How it works\n\nEvery hook goes through `run.py`, which finds the vault covering the project and calls the hook's `run(payload)`. A hook prints at most one JSON object and always exits 0. It is silent when no vault covers the project or the vault can't be read.\n\n## Connects to\n\n- [[Hooks]] — this module's area\n- [[Index and resolver]] — resolves the vault from `CLAUDE_PROJECT_DIR`, then the payload's cwd\n- [[Claude Code]] — `hooks.json` registers SessionStart, UserPromptSubmit, PreToolUse and Stop\n- [[Advisory hooks, never blocking]] — the runner is where the never-block rule is enforced\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A non-zero exit from a UserPromptSubmit hook erases the user's prompt, so every path exits 0 and errors are swallowed.\n- Each command in `hooks.json` starts with `command -v python3`; without Python the hook drains stdin and stays silent.\n- Session state is a small JSON per session under `TMPDIR`, pruned after 24 h.\n\n## History\n\n-\n"},"Index and resolver":{"path":"2 Modules/Index and resolver.md","type":"module","status":"shipped","depth":"stub","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"The shared library behind every command and hook.","aliases":["vaultlib"],"tags":["module","domain/command-line"],"flags":[],"inbound":14,"body":"---\ntype: module\naliases: [vaultlib]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# Index and resolver\n\n## What it is\n\nThe shared library behind every command and hook. It parses notes, builds the search index and reverse file index, and finds which vault covers the current project.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Library | `lib/vaultlib.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Find]] — find is the index's query front end\n- [[Check]] — check rebuilds `_meta/index.json` with `--write`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `_meta/index.json` is generated and gitignored; it rebuilds when a note's mtime changes.\n- A vault's `remote` matches the project's origin by substring after normalising, and the longest match wins, so one registry can route many repos.\n\n## History\n\n-\n"},"Init":{"path":"2 Modules/Init.md","type":"module","status":"shipped","depth":"stub","domain":"Setup","repo":"lightkeeper","updated":"2026-10-20","summary":"Creates a new vault, clones a teammate's, or adopts an existing Obsidian folder, then registers it so the hooks can find it.","aliases":["vault init"],"tags":["module","domain/setup"],"flags":[],"inbound":6,"body":"---\ntype: module\naliases: [vault init]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Setup\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/setup]\n---\n\n# Init\n\n## What it is\n\nCreates a new vault, clones a teammate's, or adopts an existing Obsidian folder, then registers it so the hooks can find it. With flags it also installs the `vault` launcher, the report-only git hooks and a backup remote.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Entry point | `lib/init.py` |\n| Command | `commands/init.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Setup]] — this module's area\n- [[Scaffold]] — a fresh vault is a copy of the scaffold plus a generated `vault.json`\n- [[CLI launcher]] — `--install-cli` copies `bin/vault` into `~/.local/bin`\n- [[Git report hooks]] — `--git-hook` writes `report.sh` as the checkout's `post-merge` and `pre-push`\n- [[Backup push]] — `--backup-remote` sets the vault's `core.hooksPath` to the post-commit pusher\n- [[Index and resolver]] — registers the vault in `~/.claude/vaults`, the registry the resolver reads\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `--git-hook` must never replace a hook it didn't write. It recognises its own file by the header line `# claude-vault git hook body`; until 2026-10-20 it matched any hook containing the text `claude-vault`, which would have overwritten a private pre-push gate whose path contains that word.\n- The repo key is the checkout's folder name, and the remote keeps an SSH host alias such as `github-light`. A remote with an alias doesn't match clones made from github.com, so trim `vault.json`'s `remote` to `owner/name`.\n\n## History\n\n- 2.3.2 (2026-10-20): `--git-hook` recognises its own hooks by their header line, and the install message names only the hooks it wrote.\n"},"Knowledge-vault skill":{"path":"2 Modules/Knowledge-vault skill.md","type":"module","status":"shipped","depth":"stub","domain":"Writing notes","repo":"lightkeeper","updated":"2026-10-20","summary":"The skill that tells Claude when to query the vault and how to write a note: the one rule, the Where it lives table, the honesty fields, and that updating the note is part of done.","aliases":["knowledge-vault"],"tags":["module","domain/writing-notes"],"flags":[],"inbound":4,"body":"---\ntype: module\naliases: [knowledge-vault]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Writing notes\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/writing-notes]\n---\n\n# Knowledge-vault skill\n\n## What it is\n\nThe skill that tells Claude when to query the vault and how to write a note: the one rule, the Where it lives table, the honesty fields, and that updating the note is part of done.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Skill | `skills/knowledge-vault/SKILL.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Writing notes]] — this module's area\n- [[Scaffold]] — teaches the conventions the scaffold writes into every vault\n- [[Stop reminder]] — the reminder sends Claude back to this skill\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Log":{"path":"2 Modules/Log.md","type":"module","status":"shipped","depth":"stub","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault log \u003cnote>` prints a note's history from the vault's own git log.","aliases":["vault log"],"tags":["module","domain/command-line"],"flags":[],"inbound":1,"body":"---\ntype: module\naliases: [vault log]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# Log\n\n## What it is\n\n`vault log \u003cnote>` prints a note's history from the vault's own git log.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/log.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Index and resolver]] — resolves the note name to its file\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"PR comment action":{"path":"2 Modules/PR comment action.md","type":"module","status":"shipped","depth":"stub","domain":"Teams","repo":"lightkeeper","updated":"2026-10-20","summary":"A GitHub Action that comments on each pull request with the notes owning its changed files and lists files that match no note.","aliases":["PR notes","vault-notes"],"tags":["module","domain/teams"],"flags":[],"inbound":4,"body":"---\ntype: module\naliases: [PR notes, vault-notes]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Teams\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/teams]\n---\n\n# PR comment action\n\n## What it is\n\nA GitHub Action that comments on each pull request with the notes owning its changed files and lists files that match no note. Advisory; it never fails the build.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Action | `action/action.yml` |\n| Renderer | `action/pr_notes.py` |\n| Docs | `action/README.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Teams]] — this module's area\n- [[Index and resolver]] — imports the plugin's own `lib/` to match files to notes\n- [[GitHub]] — runs as a composite action and posts with the workflow's token\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- When it can't read the vault, the comment says so instead of exiting non-zero.\n- It reads `GITHUB_TOKEN` to post the comment, which the plugin directory holds for manual review.\n\n## History\n\n-\n"},"Pre-edit pointer":{"path":"2 Modules/Pre-edit pointer.md","type":"module","status":"shipped","depth":"full","domain":"Hooks","repo":"lightkeeper","updated":"2026-10-20","summary":"On PreToolUse for Write and Edit, points Claude at the note that owns the file before the edit lands.","aliases":["file guard"],"tags":["module","domain/hooks"],"flags":[],"inbound":4,"body":"---\ntype: module\naliases: [file guard]\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Hooks\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/hooks]\n---\n\n# Pre-edit pointer\n\n## What it is\n\nOn PreToolUse for Write and Edit, points Claude at the note that owns the file before the edit lands. A stub note gets different wording: write down what you learn.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook | `lib/hooks/file_guard.py` |\n\n## How it works\n\nResolves the edited path to its owning notes, skips notes already shown this session, and injects the note's path, `updated` date and neighbours.\n\n## Connects to\n\n- [[Hooks]] — this module's area\n- [[Hook runner]] — runs as the `file_guard` hook\n- [[Index and resolver]] — looks the file up in the reverse index built from every note's Where it lives table\n- [[Prompt hints]] — shares the once-per-session state\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- It emits only `additionalContext`, never a permission decision, so it can't block or alter an edit.\n- Per-file results are cached in the session state, so a burst of edits on one file doesn't reload the index.\n\n## History\n\n-\n"},"Prompt hints":{"path":"2 Modules/Prompt hints.md","type":"module","status":"shipped","depth":"stub","domain":"Hooks","repo":"lightkeeper","updated":"2026-10-20","summary":"On UserPromptSubmit, matches the prompt against note names, aliases and flags and names up to three notes to read first.","aliases":[],"tags":["module","domain/hooks"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Hooks\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/hooks]\n---\n\n# Prompt hints\n\n## What it is\n\nOn UserPromptSubmit, matches the prompt against note names, aliases and flags and names up to three notes to read first. A prompt that sounds like a decision gets a one-time nudge to record it.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook | `lib/hooks/prompt_hint.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Hooks]] — this module's area\n- [[Hook runner]] — runs as the `prompt_hint` hook\n- [[Index and resolver]] — uses the tier-1 term match (names, aliases, flags) only\n- [[Pre-edit pointer]] — shares the session state, so a note is suggested once per session across both hooks\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- It never greps note bodies: precision over recall, because a wrong hint costs attention on every prompt.\n\n## History\n\n-\n"},"Release":{"path":"2 Modules/Release.md","type":"module","status":"shipped","depth":"stub","domain":"Writing notes","repo":"lightkeeper","updated":"2026-10-20","summary":"`/lightkeeper:release` drafts a release note from what moved per owning note.","aliases":["vault release"],"tags":["module","domain/writing-notes"],"flags":[],"inbound":1,"body":"---\ntype: module\naliases: [vault release]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Writing notes\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/writing-notes]\n---\n\n# Release\n\n## What it is\n\n`/lightkeeper:release` drafts a release note from what moved per owning note. `vault release` prints the data behind it and writes nothing.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Command | `commands/release.md` |\n| Data | `lib/release.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Writing notes]] — this module's area\n- [[Index and resolver]] — groups the release's changed files by owning note\n- [[Sync]] — both read the repo's production ref and version log from `vault.json`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A release note describes production: if the version's tag isn't on the production ref, `vault release` says so.\n\n## History\n\n-\n"},"Scaffold":{"path":"2 Modules/Scaffold.md","type":"module","status":"shipped","depth":"stub","domain":"Setup","repo":"lightkeeper","updated":"2026-10-20","summary":"The folder every new vault is copied from: the eight note folders, Home, the conventions, the note templates and the Bases views.","aliases":[],"tags":["module","domain/setup"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Setup\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/setup]\n---\n\n# Scaffold\n\n## What it is\n\nThe folder every new vault is copied from: the eight note folders, Home, the conventions, the note templates and the Bases views. Obsidian settings live beside it and are covered by the Obsidian note.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Entry page | `scaffold/Home.md` |\n| Conventions | `scaffold/_meta/Conventions.md`, `How to update.md` |\n| Templates | `scaffold/_templates/Module.md`, `Flow.md`, `Integration.md`, `Decision.md`, `Release.md` |\n| Views | `scaffold/_meta/views/Coverage.base`, `Stale.base`, `Recent.base`, `Decisions.base` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Setup]] — this module's area\n- [[Init]] — init copies this folder into every new vault\n- [[Knowledge-vault skill]] — the skill teaches the rules written in `Conventions.md` and `How to update.md`\n- [[Obsidian]] — the Bases views and templates are Obsidian features\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Templates hold placeholders such as `{{title}}`; a seeded note must replace them, and rows it can't fill are deleted, not left as prose.\n\n## History\n\n-\n"},"Seed":{"path":"2 Modules/Seed.md","type":"module","status":"shipped","depth":"stub","domain":"Writing notes","repo":"lightkeeper","updated":"2026-10-20","summary":"`/lightkeeper:seed` proposes the first domains and module stubs from the repo's shape, asks, then writes them with real file paths.","aliases":[],"tags":["module","domain/writing-notes"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Writing notes\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/writing-notes]\n---\n\n# Seed\n\n## What it is\n\n`/lightkeeper:seed` proposes the first domains and module stubs from the repo's shape, asks, then writes them with real file paths.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Command | `commands/seed.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Writing notes]] — this module's area\n- [[Scaffold]] — every stub starts from `_templates/Module.md`\n- [[Check]] — finishes with `vault check --write` until it exits 0\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A command's `argument-hint` that starts with `[` must be quoted. YAML reads it as a list, which broke this command's header in the plugin directory's validator (fixed in 2.3.1).\n\n## History\n\n-\n"},"Session primer":{"path":"2 Modules/Session primer.md","type":"module","status":"shipped","depth":"full","domain":"Hooks","repo":"lightkeeper","updated":"2026-10-20","summary":"On SessionStart, tells Claude the vault exists and how to query it.","aliases":[],"tags":["module","domain/hooks"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Hooks\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/hooks]\n---\n\n# Session primer\n\n## What it is\n\nOn SessionStart, tells Claude the vault exists and how to query it. Once a day it also mentions how many maintenance signals are waiting.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook | `lib/hooks/session_start.py` |\n\n## How it works\n\nA static primer naming the vault root and the `vault find` commands. The source field of the payload picks the variant: startup gets the full primer, compact a one-liner, resume nothing.\n\n## Connects to\n\n- [[Hooks]] — this module's area\n- [[Hook runner]] — runs as the `session_start` hook\n- [[Check]] — reads the signal count from `_meta/status.json`, which `vault check --write` writes\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- It must be near-instant, so it never loads the index.\n- Silent on resume, because the primer is already in the transcript; after a compaction it sends a one-line reminder instead.\n\n## History\n\n-\n"},"Status":{"path":"2 Modules/Status.md","type":"module","status":"shipped","depth":"stub","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault status` shows the vault on one screen: coverage, stale notes, attention signals and sync drift.","aliases":["vault status"],"tags":["module","domain/command-line"],"flags":[],"inbound":1,"body":"---\ntype: module\naliases: [vault status]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# Status\n\n## What it is\n\n`vault status` shows the vault on one screen: coverage, stale notes, attention signals and sync drift.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/status.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Check]] — reads `_meta/status.json`, which `vault check --write` writes\n- [[Sync]] — runs the sync report without fetching\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Stop reminder":{"path":"2 Modules/Stop reminder.md","type":"module","status":"shipped","depth":"full","domain":"Hooks","repo":"lightkeeper","updated":"2026-10-20","summary":"On Stop, checks whether watched code moved this session while the vault didn't, and names the exact notes the changed files belong to.","aliases":["Stop hook"],"tags":["module","domain/hooks"],"flags":[],"inbound":4,"body":"---\ntype: module\naliases: [Stop hook]\nstatus: shipped\ndepth: full\nrepo: lightkeeper\ndomain: Hooks\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/hooks]\n---\n\n# Stop reminder\n\n## What it is\n\nOn Stop, checks whether watched code moved this session while the vault didn't, and names the exact notes the changed files belong to.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook | `lib/hooks/stop_reminder.py` |\n\n## How it works\n\nCompares git status and recent commits in the repo's `watched` folders with the vault's own git state. When code moved and the vault is clean and uncommitted in the window, it sends a system message naming the notes, and once per session the same text as context so Claude can act on it.\n\n## Connects to\n\n- [[Hooks]] — this module's area\n- [[Hook runner]] — runs as the `stop_reminder` hook\n- [[Index and resolver]] — maps the changed files to their owning notes\n- [[Knowledge-vault skill]] — the reminder tells Claude to update the notes the way the skill describes\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Any vault commit inside the window (`stop_window_hours`, default 6) counts as the vault moving and mutes the reminder. Since 2.1.5 a commit that only touches `.obsidian` doesn't count; before that, saving Obsidian settings silenced it.\n- It is quiet when `stop_hook_active` is set, which breaks the loop after Claude responds to it.\n\n## History\n\n-\n"},"Sync":{"path":"2 Modules/Sync.md","type":"module","status":"shipped","depth":"stub","domain":"Teams","repo":"lightkeeper","updated":"2026-10-20","summary":"`vault sync` reports what landed on each repo since the vault last caught up, grouped by owning note, and the vault-sync skill walks the catch-up.","aliases":["vault sync","vault-sync"],"tags":["module","domain/teams"],"flags":[],"inbound":5,"body":"---\ntype: module\naliases: [vault sync, vault-sync]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Teams\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/teams]\n---\n\n# Sync\n\n## What it is\n\n`vault sync` reports what landed on each repo since the vault last caught up, grouped by owning note, and the vault-sync skill walks the catch-up.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| CLI | `lib/sync.py` |\n| Skill | `skills/vault-sync/SKILL.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Teams]] — this module's area\n- [[Index and resolver]] — groups the landed files by owning note\n- [[Git report hooks]] — the git hooks print a brief, no-fetch sync report\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Advance the cursor (`--advance`) only after the notes are updated, or the missed work disappears from the report.\n\n## History\n\n-\n"},"Tidy":{"path":"2 Modules/Tidy.md","type":"module","status":"shipped","depth":"stub","domain":"Keeping the map honest","repo":"lightkeeper","updated":"2026-10-20","summary":"`/lightkeeper:tidy` and the vault-tidy skill work the attention list, or tidy one named note, and report before and after.","aliases":["vault-tidy"],"tags":["module","domain/keeping-the-map-honest"],"flags":[],"inbound":2,"body":"---\ntype: module\naliases: [vault-tidy]\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Keeping the map honest\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/keeping-the-map-honest]\n---\n\n# Tidy\n\n## What it is\n\n`/lightkeeper:tidy` and the vault-tidy skill work the attention list, or tidy one named note, and report before and after.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Command | `commands/tidy.md` |\n| Skill | `skills/vault-tidy/SKILL.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Keeping the map honest]] — this module's area\n- [[Check]] — works the signals check writes to `_meta/Attention.md`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Consolidating regroups and dedupes Gotchas; it must never drop a trap.\n\n## History\n\n-\n"},"Trace":{"path":"2 Modules/Trace.md","type":"module","status":"shipped","depth":"stub","domain":"Writing notes","repo":"lightkeeper","updated":"2026-10-20","summary":"`/lightkeeper:trace` follows a route, console command or job through the code and drafts a flow note with one reasoned link per module it crosses.","aliases":[],"tags":["module","domain/writing-notes"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Writing notes\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/writing-notes]\n---\n\n# Trace\n\n## What it is\n\n`/lightkeeper:trace` follows a route, console command or job through the code and drafts a flow note with one reasoned link per module it crosses.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Command | `commands/trace.md` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Writing notes]] — this module's area\n- [[Knowledge-vault skill]] — writes the flow note by the same conventions\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"World canvas":{"path":"2 Modules/World canvas.md","type":"module","status":"shipped","depth":"stub","domain":"Command line","repo":"lightkeeper","updated":"2026-10-20","summary":"Generates `World.canvas`: one group per domain, its modules inside, and cross-domain links as labelled edges.","aliases":[],"tags":["module","domain/command-line"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\ndomain: Command line\nsince: \nupdated: 2026-10-20\nflags: []\ntags: [module, domain/command-line]\n---\n\n# World canvas\n\n## What it is\n\nGenerates `World.canvas`: one group per domain, its modules inside, and cross-domain links as labelled edges.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Generator | `lib/canvas.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Command line]] — this module's area\n- [[Check]] — `vault check --write` regenerates the canvas\n- [[Obsidian]] — JSON Canvas is Obsidian's canvas format\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- The output is deterministic, so an unchanged vault produces an identical file and no git noise. Never edit the canvas by hand.\n\n## History\n\n-\n"},"An edit session":{"path":"3 Flows/An edit session.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"What happens in one Claude Code session in a covered repo, from opening to stopping.","aliases":[],"tags":["flow"],"flags":[],"inbound":1,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nsince: \nupdated: 2026-10-20\ntags: [flow]\n---\n\n# An edit session\n\n## What happens\n\nWhat happens in one Claude Code session in a covered repo, from opening to stopping.\n\n## Steps\n\n1. The session starts and the primer names the vault and how to query it.\n2. The user's prompt mentions a module by name or alias, and the hint names up to three notes to read.\n3. Claude goes to edit a file; before the edit lands, the pointer names the note that owns it.\n4. Claude finishes and tries to stop. If watched code moved and the vault didn't, the reminder names the notes to update.\n5. Claude updates the notes and commits the vault; the next stop is quiet.\n\n## Modules crossed\n\n- [[Session primer]] — step 1: tells Claude the vault exists and how to query it\n- [[Prompt hints]] — step 2: names the notes the prompt mentions, once each per session\n- [[Pre-edit pointer]] — step 3: names the note that owns the file before the edit lands\n- [[Stop reminder]] — steps 4 and 5: names the stale notes, then goes quiet once the vault is committed\n\n## Where it breaks\n\n- A vault commit inside the Stop window mutes step 4 even when it didn't touch the notes this session needed.\n\n## History\n\n-\n"},"Anthropic plugin directory":{"path":"4 Integrations/Anthropic plugin directory.md","type":"integration","status":"shipped","depth":"stub","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The official listing, fed by a push webhook that scans every push to `main`.","aliases":[],"tags":["integration"],"flags":[],"inbound":1,"body":"---\ntype: integration\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\nsince: \nupdated: 2026-10-20\ntags: [integration]\n---\n\n# Anthropic plugin directory\n\n## What it is\n\nThe official listing, fed by a push webhook that scans every push to `main`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Listing icon | `.claude-plugin/icon.png` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Claude Code]] — lists the plugin as Claude Code installs it\n- [[PR comment action]] — the action's token use is held for manual review\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Every file in the plugin folder, which is the whole repo, must be under 5 MiB; the README GIF had to be re-encoded at 1040 px.\n- The plugin name must be distinctive, which is why `vault` became `lightkeeper`.\n- The icon is taken only on the first save or submit.\n\n## History\n\n-\n"},"Claude Code":{"path":"4 Integrations/Claude Code.md","type":"integration","status":"shipped","depth":"stub","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The host.","aliases":[],"tags":["integration"],"flags":[],"inbound":4,"body":"---\ntype: integration\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\nsince: \nupdated: 2026-10-20\ntags: [integration]\n---\n\n# Claude Code\n\n## What it is\n\nThe host. The repo is a plugin marketplace holding one plugin, `lightkeeper`, whose commands, skills and hooks Claude Code discovers by folder.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Plugin manifest | `.claude-plugin/plugin.json` |\n| Marketplace | `.claude-plugin/marketplace.json` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Hook runner]] — Claude Code calls the four hook events declared in `hooks.json`\n- [[CLI launcher]] — the launcher reads Claude Code's install record to find the plugin\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- The install key is `lightkeeper@claude-lightkeeper`: plugin name, then marketplace name. Renaming either breaks existing installs, so the 2.3.0 changelog carries the move steps.\n\n## History\n\n-\n"},"GitHub":{"path":"4 Integrations/GitHub.md","type":"integration","status":"shipped","depth":"stub","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"Hosts the repo, the Pages gallery of exported maps, and the PR comment action.","aliases":[],"tags":["integration"],"flags":[],"inbound":2,"body":"---\ntype: integration\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\nsince: \nupdated: 2026-10-20\ntags: [integration]\n---\n\n# GitHub\n\n## What it is\n\nHosts the repo, the Pages gallery of exported maps, and the PR comment action.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Workflow | `.github/workflows/vault-notes.yml` |\n| Gallery | `docs/index.html` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[PR comment action]] — the action runs in GitHub Actions\n- [[HTML export]] — the gallery serves exported maps from `docs/maps`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Pages must serve `main` + `/docs`; the repo root serves the README instead of the gallery.\n- GitHub's image cache keeps serving an old file at the same name, so every new README GIF gets a new filename.\n\n## History\n\n-\n"},"Obsidian":{"path":"4 Integrations/Obsidian.md","type":"integration","status":"shipped","depth":"stub","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The optional reader.","aliases":[],"tags":["integration"],"flags":[],"inbound":2,"body":"---\ntype: integration\nstatus: shipped\ndepth: stub\nrepo: lightkeeper\nsince: \nupdated: 2026-10-20\ntags: [integration]\n---\n\n# Obsidian\n\n## What it is\n\nThe optional reader. A vault is plain markdown that Obsidian renders with the graph, Properties, Bases views and the canvas.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Settings | `scaffold/.obsidian/graph.json`, `app.json`, `appearance.json`, `core-plugins.json`, `templates.json` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Scaffold]] — the scaffold's views and templates are Obsidian features\n- [[World canvas]] — the canvas is Obsidian's JSON Canvas format\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Before 2.1.4 the scaffold shipped no `.obsidian` settings, so a new vault's graph was grey. The colour groups key on folder and `depth`.\n\n## History\n\n-\n"},"Stdlib Python 3.9":{"path":"5 Platform/Stdlib Python 3.9.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"Everything runs on the system `python3` of any machine that has a vault: standard library only, Python 3.9 syntax, no install step and no network calls.","aliases":[],"tags":["platform"],"flags":[],"inbound":2,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [platform]\n---\n\n# Stdlib Python 3.9\n\n## What it is\n\nEverything runs on the system `python3` of any machine that has a vault: standard library only, Python 3.9 syntax, no install step and no network calls.\n\n## Connects to\n\n- [[Hook runner]] — hooks run on whatever `python3` the machine has\n- [[Index and resolver]] — the shared library holds the same rule\n\n## Gotchas\n\n- `check.sh` is the self-test: it builds a throwaway vault and runs every hook and command against it. Run it before every push.\n"},"Advisory hooks, never blocking":{"path":"6 Decisions/Advisory hooks, never blocking.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"Every hook only adds context or a message.","aliases":[],"tags":["decision"],"flags":[],"inbound":2,"body":"---\ntype: decision\nstatus: accepted\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [decision]\n---\n\n# Advisory hooks, never blocking\n\n## Decision\n\nEvery hook only adds context or a message. None blocks a tool call, edits a prompt or fails a session.\n\n## Context\n\nA hook that blocks work gets disabled. A wrong pointer that only advises costs a second of attention.\n\n## Why this and not the alternative\n\nBlocking an edit until the note is read would guarantee reading, but one false positive would block real work, and people turn such hooks off.\n\n## Consequences\n\nEnforcement comes from repetition and naming the exact notes, not from refusal. The git hooks and the PR action follow the same rule.\n\n## Affects\n\n- [[Hook runner]] — enforces exit 0 and one JSON object\n- [[Pre-edit pointer]] — emits no permission decision\n- [[PR comment action]] — never fails a build\n"},"Rename to Lightkeeper":{"path":"6 Decisions/Rename to Lightkeeper.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The brand, repo and plugin are Lightkeeper (`claude-lightkeeper`, `lightkeeper`); the `vault` CLI, the vault folders and internal markers keep the old name.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [decision]\n---\n\n# Rename to Lightkeeper\n\n## Decision\n\nThe brand, repo and plugin are Lightkeeper (`claude-lightkeeper`, `lightkeeper`); the `vault` CLI, the vault folders and internal markers keep the old name.\n\n## Context\n\nThe plugin directory asks for a distinctive name, and `vault` is a generic word that matches a known product.\n\n## Why this and not the alternative\n\nRenaming the CLI and the internal markers too would be tidier, but it would break every installed launcher, git hook and state file for no gain to the reader.\n\n## Consequences\n\nExisting installs move with uninstall, marketplace update, install. Markers such as the git-hook header and `STATE_PREFIX` still say claude-vault, so don't rename them: installed hooks and state files are found by them.\n\n## Affects\n\n- [[Anthropic plugin directory]] — its naming rule prompted the rename\n- [[CLI launcher]] — finds the plugin under either name\n- [[Init]] — recognises its git hooks by the old `claude-vault` header\n"},"Vault outside the repo":{"path":"6 Decisions/Vault outside the repo.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The map is its own git repo, outside the code repos it covers.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [decision]\n---\n\n# Vault outside the repo\n\n## Decision\n\nThe map is its own git repo, outside the code repos it covers.\n\n## Context\n\nA busy repo has many worktrees and branches, and a system often spans several repos. An in-repo map would be copied into every checkout, lag behind every branch and favour one repo.\n\n## Why this and not the alternative\n\nAn in-repo docs folder is simpler to commit with the code, but a stale copy in one worktree looks exactly like the current one, and notes on a branch stay invisible until it merges.\n\n## Consequences\n\nThe cost is that a map update is a separate commit git can't couple to the code change. The hooks and `vault check` exist to pay that cost.\n\n## Affects\n\n- [[Stop reminder]] — the reminder exists because git can't couple the two commits\n- [[Sync]] — catch-up is needed because others' pushes carry no note update\n"},"lightkeeper":{"path":"8 Repos/lightkeeper.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"lightkeeper","updated":"2026-10-20","summary":"The Lightkeeper Claude Code plugin.","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: lightkeeper\nupdated: 2026-10-20\ntags: [repo]\n---\n\n# lightkeeper\n\n## What it is\n\nThe Lightkeeper Claude Code plugin. The repo root is both the marketplace `claude-lightkeeper` and the plugin `lightkeeper`.\n\n## Where it lives\n\n`Light5566/claude-lightkeeper` on GitHub — production branch `origin/main`; the hooks watch `action, bin, commands, hooks, lib, scaffold, skills`. Code is in `lib/` (the `vault` CLI and the hooks), the Claude-facing parts in `commands/`, `skills/` and `hooks/hooks.json`, the PR bot in `action/`, the Pages gallery in `docs/`, and a sample BookStack vault in `demo/`.\n\n## How it works\n\nRun `bash check.sh` (the self-test) before every push. Release: bump `.claude-plugin/plugin.json`, add a `CHANGELOG.md` entry, run the self-test, commit, push, tag, then `claude plugin marketplace update claude-lightkeeper && claude plugin update lightkeeper@claude-lightkeeper`. The changelog is `CHANGELOG.md`.\n\n## Connects to\n\n- [[Home]] — the vault's entry page lists this repo\n- [[Claude Code]] — the repo is a Claude Code plugin marketplace\n- [[Stdlib Python 3.9]] — every script here holds to it\n\n## Gotchas\n\n- The local checkout folder is still called `claude-vault`; only the GitHub repo was renamed.\n- The pre-push hook in the checkout is a private gate that is not part of the repo. `vault init --git-hook` leaves it alone.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"A living map of how Lightkeeper is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# Lightkeeper — the world\n\nA living map of how Lightkeeper is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[lightkeeper]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Setup]] | init, the scaffold, the `vault` launcher |\n| [[Hooks]] | the session primer, prompt hints, the pre-edit pointer, the Stop reminder |\n| [[Writing notes]] | seed, trace, release, the knowledge-vault skill |\n| [[Command line]] | the index, find, status, log, the HTML export, the canvas |\n| [[Keeping the map honest]] | check and its signals, tidy |\n| [[Teams]] | sync, the git hooks, the vault backup, the PR comment bot |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[An edit session]] — primer, hint, pre-edit pointer, Stop reminder, note update\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n- [[Stdlib Python 3.9]] — no dependencies, no network, `check.sh` before every push\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Vault outside the repo]] — the map is its own repo; the hooks pay for the separate commit\n- [[Advisory hooks, never blocking]] — every hook advises, none refuses\n- [[Rename to Lightkeeper]] — the plugin is `lightkeeper`, the CLI and markers stay `vault`\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/lightkeeper:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**6 of 24 module notes are `full`.** 46 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n- [[Check]] — Keeping the map honest\n- [[Find]] — Command line\n- [[Hook runner]] — Hooks\n- [[Pre-edit pointer]] — Hooks\n- [[Session primer]] — Hooks\n- [[Stop reminder]] — Hooks\n\n## Stub — promote on next touch\n\n- [[Backup push]] — Teams\n- [[CLI launcher]] — Setup\n- [[Git report hooks]] — Teams\n- [[HTML export]] — Command line\n- [[Index and resolver]] — Command line\n- [[Init]] — Setup\n- [[Knowledge-vault skill]] — Writing notes\n- [[Log]] — Command line\n- [[PR comment action]] — Teams\n- [[Prompt hints]] — Hooks\n- [[Release]] — Writing notes\n- [[Scaffold]] — Setup\n- [[Seed]] — Writing notes\n- [[Status]] — Command line\n- [[Sync]] — Teams\n- [[Tidy]] — Keeping the map honest\n- [[Trace]] — Writing notes\n- [[World canvas]] — Command line\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/lightkeeper:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-20","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-20\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-20 · seed: 6 domains, 24 module stubs, 8 Repos/lightkeeper · `23ff418` · 1 Domains: Command line, Hooks, Keeping the map honest, Setup, Teams, Writing notes; 2 Modules: Backup push, CLI launcher, Check, Find, Git report hooks, HTML export (+18); 3 Flows: An edit session; 4 Integrations: Anthropic plugin directory, Claude Code, GitHub, Obsidian; 5 Platform: Stdlib Python 3.9; 6 Decisions: Advisory hooks, never blocking, Rename to Lightkeeper, Vault outside the repo; 8 Repos: claude-vault, lightkeeper; .: Home\n- 2026-10-20 · Start the Lightkeeper knowledge vault · `821b465` · 8 Repos: claude-vault; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"Command line","to":"Index and resolver","reason":"The shared library behind every command and hook"},{"from":"Command line","to":"Find","reason":"vault find answers \"which notes cover this topic\" and \"which notes own these files\", printing each hit with its neighbours and the reason for each link"},{"from":"Command line","to":"Status","reason":"vault status shows the vault on one screen: coverage, stale notes, attention signals and sync drift"},{"from":"Command line","to":"Log","reason":"vault log \u003cnote> prints a note's history from the vault's own git log"},{"from":"Command line","to":"HTML export","reason":"vault export --html writes the whole vault as one self-contained page: a force-directed graph with a reader panel for each note"},{"from":"Command line","to":"World canvas","reason":"Generates World.canvas: one group per domain, its modules inside, and cross-domain links as labelled edges"},{"from":"Hooks","to":"Hook runner","reason":"The single entry point for all four hook events, plus the plumbing they share: payload handling, the vault lookup and the per-session state file"},{"from":"Hooks","to":"Session primer","reason":"On SessionStart, tells Claude the vault exists and how to query it"},{"from":"Hooks","to":"Prompt hints","reason":"On UserPromptSubmit, matches the prompt against note names, aliases and flags and names up to three notes to read first"},{"from":"Hooks","to":"Pre-edit pointer","reason":"On PreToolUse for Write and Edit, points Claude at the note that owns the file before the edit lands"},{"from":"Hooks","to":"Stop reminder","reason":"On Stop, checks whether watched code moved this session while the vault didn't, and names the exact notes the changed files belong to"},{"from":"Keeping the map honest","to":"Check","reason":"vault check lints the vault; with --write it also rebuilds the index
