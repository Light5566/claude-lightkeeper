<script id="data" type="application/json">{"vault":"Mastodon","built_at":"2026-10-19T10:26:12","notes":{"Accounts":{"path":"1 Domains/Accounts.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Profiles, follows, blocks and mutes: who an account is and who it is connected to, plus sign-up, migration, and import and export.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Accounts\n\n## What it is\n\nProfiles, follows, blocks and mutes: who an account is and who it is connected to, plus sign-up, migration, and import and export.\n\n## Modules\n\n- [[Profiles]] — An `Account` is a public identity, local or remote; profile edits go through `UpdateAccountService` and reach other servers five seconds later as an `Update` from `ActivityPub::UpdateDistributionWorker`\n- [[Follows]] — `FollowService` follows an unlocked local account at once and creates a `FollowRequest` for a locked account, for any remote account, or when the follower is silenced\n- [[Blocks & Mutes]] — A block removes follows in both directions, clears the blocked account from your feeds, notifications and conversations, and sends a `Block` to a remote account's server\n- [[Account Migration]] — Moving sets a redirect on the old account and sends a `Move` to its followers' servers; `MoveWorker` points this server's followers at the new account and carries over local users' notes, blocks and mutes, but does not touch posts\n- [[Sign-up & Login]] — A `User` is the local login behind an `Account`, created through the web form or the API's `AppSignUpService`\n- [[Import & Export]] — CSV imports of follows, blocks, mutes, domain blocks, bookmarks, lists and filters are stored as `BulkImportRow` records and applied one row per `Import::RowWorker` job on the `pull` queue; in overwrite mode `BulkImportService` first undoes existing entries missing from the file, and deletes all existing filters\n"},"Administration":{"path":"1 Domains/Administration.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Server settings, roles, announcements and webhooks: how the server is configured and run.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Administration\n\n## What it is\n\nServer settings, roles, announcements and webhooks: how the server is configured and run.\n\n## Modules\n\n- [[Server Settings]] — Admin settings are rows in the `settings` table holding YAML values, read through `Setting` with the Rails cache in front and defaults from `config/settings.yml`\n- [[Roles]] — A role is a bitmask of permissions from `UserRole::FLAGS` plus a position\n- [[Announcements]] — Announcements are server-wide notices from staff, with optional start and end times and emoji reactions\n- [[Webhooks]] — Staff subscribe a URL to events from `Webhook::EVENTS` (account, report and status events); each event is serialized once and posted to every enabled webhook by `Webhooks::DeliveryWorker`, signed with an HMAC-SHA256 of the body in `X-Hub-Signature`\n"},"Explore":{"path":"1 Domains/Explore.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Search, trends and follow suggestions: how people find posts, hashtags and accounts they do not follow yet.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Explore\n\n## What it is\n\nSearch, trends and follow suggestions: how people find posts, hashtags and accounts they do not follow yet.\n\n## Modules\n\n- [[Search]] — `SearchService` splits a query into account, status and hashtag searches, and with `resolve` set a pasted URL is fetched from its server through `ResolveURLService`\n- [[Trends]] — Posts, hashtags and links are scored from recent activity, and the scores are refreshed every five minutes; a post qualifies only if it is public, not a reply, not marked sensitive, has no content warning, and its author is discoverable and not silenced\n- [[Follow Suggestions]] — `AccountSuggestions` merges five sources, among them staff-featured accounts, friends of friends, similar profiles and a server-wide ranking, and caches the shuffled result per account for 15 minutes\n"},"Federation":{"path":"1 Domains/Federation.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Inbox, delivery and lookups: how this server exchanges ActivityPub activities with other servers.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Federation\n\n## What it is\n\nInbox, delivery and lookups: how this server exchanges ActivityPub activities with other servers.\n\n## Modules\n\n- [[Inbox]] — Other servers POST activities here\n- [[Delivery]] — Outgoing activities are queued and sent by `ActivityPub::DeliveryWorker`, one job per inbox\n- [[Remote Resolution]] — `ResolveAccountService` turns `user@domain` into an `Account`, asking the other server through WebFinger only when the account is unknown or was last checked more than a day ago (`Account::STALE_THRESHOLD`)\n- [[Relays]] — A relay is a remote inbox that this server sends its public posts to and receives public posts from\n"},"Moderation":{"path":"1 Domains/Moderation.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Reports, account actions and domain blocks: how staff act on single accounts and on whole servers.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Moderation\n\n## What it is\n\nReports, account actions and domain blocks: how staff act on single accounts and on whole servers.\n\n## Modules\n\n- [[Reports]] — A report names an account and optionally statuses, and staff with `manage_reports` are notified unless the account already has another unresolved report\n- [[Account Actions & Strikes]] — `Admin::AccountAction` applies one of `none`, `disable`, `sensitive`, `silence` or `suspend`, records a strike as an `AccountWarning`, and resolves every unresolved report on the account (for `none`, only the report it was taken from)\n- [[Domain Blocks]] — A domain block has a severity of `silence`, `suspend` or `noop` plus `reject_media` and `reject_reports` flags, and covers the domain and all its subdomains, the most specific block winning\n"},"Notifications":{"path":"1 Domains/Notifications.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Notifications, filtered requests and web push: how an account hears about mentions, follows, favourites and other events.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Notifications\n\n## What it is\n\nNotifications, filtered requests and web push: how an account hears about mentions, follows, favourites and other events.\n\n## Modules\n\n- [[Notification Dispatch]] — `LocalNotificationWorker` turns an event into a call to `NotifyService`, which drops it, saves it as filtered, or saves it and pushes it to the streaming server and to web push\n- [[Notification Filtering]] — Each account's `NotificationPolicy` sets accept, filter or drop for six kinds of sender: people you do not follow, people who do not follow you (or followed less than three days ago), accounts younger than 30 days, unsolicited private mentions, limited accounts and bots\n- [[Web Push]] — A client registers a push endpoint with the alert types it wants, and `Web::PushNotificationWorker` sends each matching notification to it encrypted\n"},"Posting":{"path":"1 Domains/Posting.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Statuses, media, polls and quotes: what a user publishes, how it is edited, scheduled or deleted, and the favourites and boosts it collects.","aliases":[],"tags":["domain"],"flags":[],"inbound":7,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Posting\n\n## What it is\n\nStatuses, media, polls and quotes: what a user publishes, how it is edited, scheduled or deleted, and the favourites and boosts it collects.\n\n## Modules\n\n- [[Statuses]] — A status is a post: text, visibility, and optional media, poll and quote\n- [[Status Edits]] — Editing a status stores each version as a `StatusEdit`, and the first edit also snapshots the original\n- [[Media Attachments]] — Images, video, GIFs and audio are uploaded first and attached by id when the status is created\n- [[Polls]] — A poll belongs to one status\n- [[Scheduled Posts]] — A post with a future `scheduled_at` is stored as a `ScheduledStatus` holding the original parameters; the time must be more than five minutes ahead (a past time posts at once), with at most 25 a day and 300 in total\n- [[Quote Posts]] — A `Quote` links a quoting status to the quoted one and has a state: pending, accepted, rejected, revoked or deleted\n- [[Favourites & Boosts]] — A boost is a status of its own with `reblog` set and empty text, so it is fanned out and federated like a post\n"},"Timelines":{"path":"1 Domains/Timelines.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Home, lists, hashtags and the live feeds: where posts are read, the keyword filters applied to them, and the streaming server that pushes new ones to open clients.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [domain]\n---\n# Timelines\n\n## What it is\n\nHome, lists, hashtags and the live feeds: where posts are read, the keyword filters applied to them, and the streaming server that pushes new ones to open clients.\n\n## Modules\n\n- [[Home Feed]] — Each account's home timeline is a Redis sorted set that posts are written into when they are published\n- [[Public Timelines]] — The local, federated and hashtag timelines are database queries run when they are read, through `PublicFeed` and `TagFeed`\n- [[Lists]] — A list is a feed of chosen accounts, stored in Redis like the home feed and filled by the same fan-out\n- [[Hashtags]] — Local posts get their hashtags from the text with `Extractor.extract_hashtags`; remote posts take them from the activity's `tag` entries\n- [[Keyword Filters]] — A filter is a set of keywords or chosen statuses with contexts (home, notifications, public, thread, account), an action (warn, hide or blur) and an optional expiry\n- [[Streaming API]] — A separate Node.js server holds clients' streaming connections and relays messages that Rails publishes to Redis channels such as `timeline:\u003caccount id>` and `timeline:public`\n"},"Account Actions & Strikes":{"path":"2 Modules/Account Actions & Strikes.md","type":"module","status":"shipped","depth":"stub","domain":"Moderation","repo":"mastodon","updated":"2026-10-19","summary":"`Admin::AccountAction` applies one of `none`, `disable`, `sensitive`, `silence` or `suspend`, records a strike as an `AccountWarning`, and resolves every unresolved report on the account (for `none`, only the report it was taken from).","aliases":[],"tags":["module","domain/moderation"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Moderation\nupdated: 2026-10-19\ntags: [module, domain/moderation]\n---\n# Account Actions & Strikes\n\n## What it is\n\n`Admin::AccountAction` applies one of `none`, `disable`, `sensitive`, `silence` or `suspend`, records a strike as an `AccountWarning`, and resolves every unresolved report on the account (for `none`, only the report it was taken from). A local user is emailed and notified unless staff turn off `send_email_notification`, and can appeal a strike for 20 days.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Action | `app/models/admin/account_action.rb`, `app/models/admin/base_action.rb`, `app/controllers/admin/account_actions_controller.rb` |\n| Strikes | `app/models/account_warning.rb` |\n| Appeals | `app/models/appeal.rb`, `app/services/appeal_service.rb`, `app/controllers/disputes/appeals_controller.rb` |\n| Suspension | `app/workers/admin/suspension_worker.rb`, `app/services/suspend_account_service.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Moderation]] — this module's business area\n- [[Reports]] — reports are resolved inside the same transaction as the action\n- [[Notification Dispatch]] — the strike notice is a `moderation_warning` notification\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Account Migration":{"path":"2 Modules/Account Migration.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"Moving sets a redirect on the old account and sends a `Move` to its followers' servers; `MoveWorker` points this server's followers at the new account and carries over local users' notes, blocks and mutes, but does not touch posts.","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Account Migration\n\n## What it is\n\nMoving sets a redirect on the old account and sends a `Move` to its followers' servers; `MoveWorker` points this server's followers at the new account and carries over local users' notes, blocks and mutes, but does not touch posts. The new account must list the old one in `also_known_as`, and an account can start a move only once every 30 days.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/services/move_service.rb` |\n| Models | `app/models/account_migration.rb`, `app/models/account_alias.rb` |\n| Workers | `app/workers/move_worker.rb`, `app/workers/activitypub/move_distribution_worker.rb` |\n| Incoming | `app/lib/activitypub/activity/move.rb` |\n| Settings | `app/controllers/settings/migrations_controller.rb`, `app/controllers/settings/aliases_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Follows]] — remote targets are re-followed through `UnfollowFollowWorker`\n- [[Inbox]] — incoming `Move` activities are handled by `ActivityPub::Activity::Move`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Announcements":{"path":"2 Modules/Announcements.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"mastodon","updated":"2026-10-19","summary":"Announcements are server-wide notices from staff, with optional start and end times and emoji reactions.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Announcements\n\n## What it is\n\nAnnouncements are server-wide notices from staff, with optional start and end times and emoji reactions. Publishing one pushes an `announcement` event to every recently active user who has an open stream.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/announcement.rb` |\n| Admin | `app/controllers/admin/announcements_controller.rb` |\n| API | `app/controllers/api/v1/announcements_controller.rb` |\n| Publishing | `app/workers/publish_scheduled_announcement_worker.rb`, `app/workers/unpublish_announcement_worker.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Streaming API]] — `PublishScheduledAnnouncementWorker` publishes to each connected user's `timeline:\u003cid>` channel\n- [[Scheduled Posts]] — both are released by `Scheduler::ScheduledStatusesScheduler`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Blocks & Mutes":{"path":"2 Modules/Blocks & Mutes.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"A block removes follows in both directions, clears the blocked account from your feeds, notifications and conversations, and sends a `Block` to a remote account's server.","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Blocks & Mutes\n\n## What it is\n\nA block removes follows in both directions, clears the blocked account from your feeds, notifications and conversations, and sends a `Block` to a remote account's server. A mute stays on this server; a mute that also hides notifications runs the same cleanup as a block through `BlockWorker`, and a timed mute is lifted by `DeleteMuteWorker`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Services | `app/services/block_service.rb`, `app/services/mute_service.rb`, `app/services/after_block_service.rb` |\n| Workers | `app/workers/block_worker.rb`, `app/workers/mute_worker.rb`, `app/workers/delete_mute_worker.rb` |\n| Models | `app/models/block.rb`, `app/models/mute.rb`, `app/models/account_domain_block.rb` |\n| API | `app/controllers/api/v1/blocks_controller.rb`, `app/controllers/api/v1/mutes_controller.rb`, `app/controllers/api/v1/domain_blocks_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Home Feed]] — `FeedManager#clear_from_home` removes the account's posts from the feed\n- [[Notification Dispatch]] — `AfterBlockService` deletes notifications from the blocked account\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Delivery":{"path":"2 Modules/Delivery.md","type":"module","status":"shipped","depth":"full","domain":"Federation","repo":"mastodon","updated":"2026-10-19","summary":"Outgoing activities are queued and sent by `ActivityPub::DeliveryWorker`, one job per inbox.","aliases":[],"tags":["module","domain/federation"],"flags":[],"inbound":11,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: mastodon\ndomain: Federation\nupdated: 2026-10-19\ntags: [module, domain/federation]\n---\n# Delivery\n\n## What it is\n\nOutgoing activities are queued and sent by `ActivityPub::DeliveryWorker`, one job per inbox. Each POST is signed as the author, and a server that keeps failing is marked unavailable and skipped.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Workers | `app/workers/activitypub/raw_distribution_worker.rb`, `app/workers/activitypub/distribution_worker.rb`, `app/workers/activitypub/delivery_worker.rb` |\n| Reach | `app/lib/status_reach_finder.rb` |\n| Failure tracking | `app/lib/delivery_failure_tracker.rb`, `app/models/unavailable_domain.rb` |\n| HTTP client | `app/lib/request.rb` |\n\n## How it works\n\n`ActivityPub::RawDistributionWorker` is the base class: it works out a list of inbox URLs and pushes one `ActivityPub::DeliveryWorker` job per inbox, in batches of 1,000. Subclasses change the list and the payload. `ActivityPub::DistributionWorker` serializes a status as a `Create`, or an `Announce` for a boost, and asks `StatusReachFinder` for the inboxes. That list is the author's followers (none for direct posts), the mentioned and quoted accounts, every accepted `Relay` for public posts, and, for public and unlisted posts, the replied-to account and everyone who boosted, favourited, quoted or replied to it. Account scopes become URLs through `Account.inboxes`, which prefers each account's shared inbox, so followers who share one inbox cost one request, and which drops domains listed in `UnavailableDomain`.\n\nEach `DeliveryWorker` signs the POST as the author with `Request#on_behalf_of`, runs it behind a circuit breaker keyed by inbox URL (10 failures, 60 seconds cool-off), and records the outcome in `DeliveryFailureTracker`: a success clears the record, a failed attempt adds the current day to a Redis set, and failures on seven different days create an `UnavailableDomain`.\n\n## Connects to\n\n- [[Federation]] — this module's business area\n- [[HTTP signatures]] — `Request#on_behalf_of` signs every delivery\n- [[Relays]] — public posts also go to every accepted relay\n- [[Services and workers]] — deliveries run on the `push` queue\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Once a domain is in `UnavailableDomain`, `ActivityPub::DeliveryWorker` returns without sending. It is cleared when a signed request from that server reaches an inbox here, when a follow request (sent with `bypass_availability`) gets through, when a relay to it is enabled or disabled, or when an admin restarts delivery.\n- A 501, or any 4xx other than 401, 408 and 429, ends the job with no retry and no failure recorded. A 401 is retried unless the sending account is permanently gone.\n- The worker retries 16 times with extra jitter and is declared `dead: false`, so a delivery that never succeeds is dropped instead of landing in the dead set.\n- Private posts carry a `Collection-Synchronization` header so the receiver can compare its copy of the follower list, but only when the author has fewer than `MAX_FOLLOWERS_FOR_SYNCHRONIZATION` (25,000) followers and `DISABLE_FOLLOWERS_SYNCHRONIZATION` is not `true`.\n\n## History\n\n-\n"},"Domain Blocks":{"path":"2 Modules/Domain Blocks.md","type":"module","status":"shipped","depth":"stub","domain":"Moderation","repo":"mastodon","updated":"2026-10-19","summary":"A domain block has a severity of `silence`, `suspend` or `noop` plus `reject_media` and `reject_reports` flags, and covers the domain and all its subdomains, the most specific block winning.","aliases":[],"tags":["module","domain/moderation"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Moderation\nupdated: 2026-10-19\ntags: [module, domain/moderation]\n---\n# Domain Blocks\n\n## What it is\n\nA domain block has a severity of `silence`, `suspend` or `noop` plus `reject_media` and `reject_reports` flags, and covers the domain and all its subdomains, the most specific block winning. `BlockDomainService` silences or suspends the known accounts from that domain, and a suspension runs `DeleteAccountService` on each of them.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/domain_block.rb`, `app/models/domain_allow.rb` |\n| Service | `app/services/block_domain_service.rb` |\n| Admin | `app/controllers/admin/domain_blocks_controller.rb` |\n| Check | `app/helpers/domain_control_helper.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Moderation]] — this module's business area\n- [[Inbox]] — `domain_not_allowed?` is checked on signatures and incoming activities\n- [[Reports]] — `reject_reports` makes incoming `Flag` activities from the domain be ignored\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Favourites & Boosts":{"path":"2 Modules/Favourites & Boosts.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"A boost is a status of its own with `reblog` set and empty text, so it is fanned out and federated like a post.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Favourites & Boosts\n\n## What it is\n\nA boost is a status of its own with `reblog` set and empty text, so it is fanned out and federated like a post. A favourite is a row plus a `Like` sent only to the author's server, and a bookmark stays on this server.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Services | `app/services/favourite_service.rb`, `app/services/unfavourite_service.rb`, `app/services/reblog_service.rb` |\n| Models | `app/models/favourite.rb`, `app/models/bookmark.rb` |\n| API | `app/controllers/api/v1/statuses/favourites_controller.rb`, `app/controllers/api/v1/statuses/reblogs_controller.rb`, `app/controllers/api/v1/statuses/bookmarks_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Notification Dispatch]] — both services queue `LocalNotificationWorker` when the author is local\n- [[Trends]] — `FavouriteService` and `ReblogService` register the status with `Trends`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Follow Suggestions":{"path":"2 Modules/Follow Suggestions.md","type":"module","status":"shipped","depth":"stub","domain":"Explore","repo":"mastodon","updated":"2026-10-19","summary":"`AccountSuggestions` merges five sources, among them staff-featured accounts, friends of friends, similar profiles and a server-wide ranking, and caches the shuffled result per account for 15 minutes.","aliases":[],"tags":["module","domain/explore"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Explore\nupdated: 2026-10-19\ntags: [module, domain/explore]\n---\n# Follow Suggestions\n\n## What it is\n\n`AccountSuggestions` merges five sources, among them staff-featured accounts, friends of friends, similar profiles and a server-wide ranking, and caches the shuffled result per account for 15 minutes. Dismissing a suggestion stores a `FollowRecommendationMute`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Sources | `app/models/account_suggestions.rb`, `app/models/account_suggestions/setting_source.rb`, `app/models/account_suggestions/friends_of_friends_source.rb`, `app/models/account_suggestions/similar_profiles_source.rb`, `app/models/account_suggestions/global_source.rb` |\n| API | `app/controllers/api/v2/suggestions_controller.rb` |\n| Global ranking | `app/models/follow_recommendation.rb`, `app/workers/scheduler/follow_recommendations_scheduler.rb` |\n| Dismissals | `app/models/follow_recommendation_mute.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Explore]] — this module's business area\n- [[Follows]] — `FollowRequest` deletes the cached suggestions in `invalidate_follow_recommendations_cache`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Follows":{"path":"2 Modules/Follows.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"`FollowService` follows an unlocked local account at once and creates a `FollowRequest` for a locked account, for any remote account, or when the follower is silenced.","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Follows\n\n## What it is\n\n`FollowService` follows an unlocked local account at once and creates a `FollowRequest` for a locked account, for any remote account, or when the follower is silenced. A remote follow becomes a `Follow` only when that server's `Accept` arrives, and `FollowRequest#authorize!` then backfills the home feed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Services | `app/services/follow_service.rb`, `app/services/unfollow_service.rb`, `app/services/authorize_follow_service.rb`, `app/services/reject_follow_service.rb` |\n| Models | `app/models/follow.rb`, `app/models/follow_request.rb` |\n| API | `app/controllers/api/v1/accounts_controller.rb`, `app/controllers/api/v1/follow_requests_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Inbox]] — the remote `Accept` is handled by `ActivityPub::Activity::Accept`\n- [[Home Feed]] — `MergeWorker` copies the followed account's posts into the home feed\n- [[Following a remote account]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Hashtags":{"path":"2 Modules/Hashtags.md","type":"module","status":"shipped","depth":"stub","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"Local posts get their hashtags from the text with `Extractor.extract_hashtags`; remote posts take them from the activity's `tag` entries.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Hashtags\n\n## What it is\n\nLocal posts get their hashtags from the text with `Extractor.extract_hashtags`; remote posts take them from the activity's `tag` entries. Following a hashtag puts matching public posts into the follower's home feed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/tag.rb`, `app/models/tag_follow.rb`, `app/models/featured_tag.rb` |\n| Processing | `app/services/process_hashtags_service.rb` |\n| API | `app/controllers/api/v1/tags_controller.rb`, `app/controllers/api/v1/followed_tags_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Home Feed]] — `FanOutOnWriteService#deliver_to_hashtag_followers!` feeds followed hashtags into home\n- [[Trends]] — `Trends.tags` ranks hashtags by recent use\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Home Feed":{"path":"2 Modules/Home Feed.md","type":"module","status":"shipped","depth":"full","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"Each account's home timeline is a Redis sorted set that posts are written into when they are published.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":13,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Home Feed\n\n## What it is\n\nEach account's home timeline is a Redis sorted set that posts are written into when they are published. Followers who have not signed in recently are skipped, and their feed is rebuilt when they return.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Feed store | `app/lib/feed_manager.rb`, `app/models/home_feed.rb`, `app/models/feed.rb` |\n| Fan-out | `app/services/fan_out_on_write_service.rb`, `app/workers/distribution_worker.rb`, `app/workers/feed_insert_worker.rb` |\n| Rebuild | `app/workers/regeneration_worker.rb`, `app/services/precompute_feed_service.rb`, `app/workers/merge_worker.rb` |\n| API | `app/controllers/api/v1/timelines/home_controller.rb` |\n| Activity window | `app/models/concerns/user/activity.rb` |\n\n## How it works\n\nA home timeline is the Redis sorted set `feed:home:\u003caccount id>`, with status ids as members and scores, trimmed to `FeedManager::MAX_ITEMS` (800). Posts are written in when they are published, not looked up when the timeline is read. `DistributionWorker` takes a lock on the status and runs `FanOutOnWriteService`, which pushes the author's own copy, queues mention notifications, then queues one `FeedInsertWorker` per local follower who signed in recently (for a direct post, only the followers it mentions), one per list that contains the author, and, for public posts, one per local follower of each hashtag.\n\n`FeedInsertWorker` asks `FeedManager#filter` whether the post belongs in that feed: blocked or muted accounts, replies to someone the reader does not follow, a language the reader did not choose for that follow, or an author who is in one of the reader's exclusive lists. It then calls `push_to_home`, or `unpush_from_home` for an edit that is now filtered. `push_to_home` queues `PushUpdateWorker` only when a `subscribed:timeline:\u003cid>` key says the reader has an open stream.\n\nReading is `HomeFeed#get`: a range read on the sorted set, then the statuses are loaded from Postgres. New follows are merged in by `MergeWorker`, and a full rebuild is `RegenerationWorker` calling `PrecomputeFeedService`.\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Statuses]] — new posts reach the feed through `DistributionWorker`\n- [[Streaming API]] — `FeedManager#push_to_home` queues `PushUpdateWorker` for readers with an open stream\n- [[Fan-out on write]] — the design this module implements\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Followers whose last sign-in is older than `USER_ACTIVE_DAYS` (default 7) get nothing at post time, and `Vacuum::FeedsVacuum` deletes their stored feeds. When they come back, `User#regenerate_feed!` queues `RegenerationWorker`, and `Api::V1::Timelines::HomeController` answers 206 until the rebuild finishes.\n- Block, mute and reply checks run only when a post is inserted. Reading applies only optional parameters such as `exclude_reblogs`, so a later mute or block takes effect in the feed only because `MuteWorker` or `BlockWorker` clears the stored entries.\n- When the reader's `aggregates_reblogs?` setting is on, a boost is not inserted if the original or another boost of it is already within the top `REBLOG_FALLOFF` (80) entries.\n- Posts from members of an exclusive list come back from `filter_from_home` as `:skip_home`: they reach that list but never the home feed.\n\n## History\n\n-\n"},"Import & Export":{"path":"2 Modules/Import & Export.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"CSV imports of follows, blocks, mutes, domain blocks, bookmarks, lists and filters are stored as `BulkImportRow` records and applied one row per `Import::RowWorker` job on the `pull` queue; in overwrite mode `BulkImportService` first undoes","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Import & Export\n\n## What it is\n\nCSV imports of follows, blocks, mutes, domain blocks, bookmarks, lists and filters are stored as `BulkImportRow` records and applied one row per `Import::RowWorker` job on the `pull` queue; in overwrite mode `BulkImportService` first undoes existing entries missing from the file, and deletes all existing filters. The archive export is a zip that `BackupService` fills with the outbox, media, likes, bookmarks and actor as ActivityPub JSON.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Import | `app/models/bulk_import.rb`, `app/services/bulk_import_service.rb`, `app/services/bulk_import_row_service.rb`, `app/workers/bulk_import_worker.rb`, `app/workers/import/row_worker.rb` |\n| Archive | `app/services/backup_service.rb`, `app/workers/backup_worker.rb` |\n| Settings | `app/controllers/settings/imports_controller.rb`, `app/controllers/settings/exports_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Follows]] — imported follows go through `FollowService`, and overwrite unfollows through `UnfollowService`\n- [[Services and workers]] — import rows run on the `pull` queue\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Inbox":{"path":"2 Modules/Inbox.md","type":"module","status":"shipped","depth":"full","domain":"Federation","repo":"mastodon","updated":"2026-10-19","summary":"Other servers POST activities here.","aliases":[],"tags":["module","domain/federation"],"flags":[],"inbound":11,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: mastodon\ndomain: Federation\nupdated: 2026-10-19\ntags: [module, domain/federation]\n---\n# Inbox\n\n## What it is\n\nOther servers POST activities here. The controller checks the HTTP signature, queues the body and answers 202, and a worker on the `ingress` queue hands it to the `ActivityPub::Activity` subclass for its type.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controller | `app/controllers/activitypub/inboxes_controller.rb` |\n| Worker | `app/workers/activitypub/processing_worker.rb` |\n| Processing | `app/services/activitypub/process_activity_service.rb` |\n| Handlers | `app/lib/activitypub/activity.rb`, `app/lib/activitypub/activity/create.rb`, `app/lib/activitypub/activity/delete.rb`, `app/lib/activitypub/activity/follow.rb`, `app/lib/activitypub/activity/accept.rb`, `app/lib/activitypub/activity/update.rb`, `app/lib/activitypub/activity/undo.rb` |\n\n## How it works\n\nEvery inbox route in `config/routes.rb` (the shared one, each account's, and the instance actor's) ends in `ActivityPub::InboxesController#create`. Before the action runs, the controller answers 413 for a body over `ActivityPub::Activity::MAX_JSON_SIZE` (1 MB), answers 202 at once for a `Delete` or `Update` of an actor this server has never stored, and requires a valid HTTP signature.\n\nThe action itself is cheap: it clears the sender's delivery-failure record with `DeliveryFailureTracker.reset!`, handles a `Collection-Synchronization` header if there is one, queues `ActivityPub::ProcessingWorker` with the raw body, and returns 202.\n\nThe worker runs `ActivityPub::ProcessActivityService`. It compacts the JSON-LD only when the payload carries a Linked Data signature, verifies that signature when the activity's actor is not the account that signed the request (a relayed activity), and stops for local actors and for suspended actors, except for `Delete`, `Reject`, `Undo` and `Update`. `ActivityPub::Activity.factory` then maps the `type` to a handler class under `app/lib/activitypub/activity/`, and the handler's `perform` does the work.\n\n## Connects to\n\n- [[Federation]] — this module's business area\n- [[HTTP signatures]] — `require_actor_signature!` runs before every inbox request\n- [[Delivery]] — a signed request from a server clears its `DeliveryFailureTracker` record\n- [[Receiving an activity in an inbox]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Once the signature checks out the sender always gets 202, so a dropped activity shows up only in the logs: an unknown `type` makes `ActivityPub::Activity.factory` return `nil`, and `ActivityPub::ProcessingWorker` swallows `ActiveRecord::RecordInvalid`.\n- `Create` keeps a public post only if `related_to_local_activity?` holds: a local account follows the author, it came through an enabled relay, it replies to a local post or to an account followed here, or it addresses a local account. Anything else is rejected after delivery.\n- A `Delete` from the object's own server writes a `Tombstone` and a six-hour `delete_upon_arrival` Redis key, so a `Create` for that URI that arrives later is ignored, and the tombstone keeps it ignored after the key expires.\n- Votes on local polls arrive as a `Create` of a `Note` whose `name` is one of the options; `Create#poll_vote?` records a `PollVote` instead of creating a status.\n\n## History\n\n-\n"},"Keyword Filters":{"path":"2 Modules/Keyword Filters.md","type":"module","status":"shipped","depth":"stub","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"A filter is a set of keywords or chosen statuses with contexts (home, notifications, public, thread, account), an action (warn, hide or blur) and an optional expiry.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Keyword Filters\n\n## What it is\n\nA filter is a set of keywords or chosen statuses with contexts (home, notifications, public, thread, account), an action (warn, hide or blur) and an optional expiry. Filters never remove posts from feeds: matches are computed when a status is rendered for a reader and returned in its `filtered` field.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/custom_filter.rb`, `app/models/custom_filter_keyword.rb` |\n| API | `app/controllers/api/v2/filters_controller.rb`, `app/controllers/api/v2/filters/keywords_controller.rb` |\n| Settings | `app/controllers/filters_controller.rb` |\n| Matching | `app/lib/status_cache_hydrator.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Streaming API]] — the streaming server re-implements keyword matching for public streams\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- On public and hashtag streams the streaming server matches keyword filters itself, with its own SQL in `streaming/index.js`, and maps the action through `['warn', 'hide']`. A `blur` filter (enum value 2) therefore reaches those clients with no action, and status-based filters are not applied there at all.\n\n## History\n\n-\n"},"Lists":{"path":"2 Modules/Lists.md","type":"module","status":"shipped","depth":"stub","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"A list is a feed of chosen accounts, stored in Redis like the home feed and filled by the same fan-out.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Lists\n\n## What it is\n\nA list is a feed of chosen accounts, stored in Redis like the home feed and filled by the same fan-out. Members must be accounts the owner follows or has asked to follow, and an exclusive list keeps its members' posts out of the home feed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/list.rb`, `app/models/list_account.rb`, `app/models/list_feed.rb` |\n| API | `app/controllers/api/v1/lists_controller.rb`, `app/controllers/api/v1/lists/accounts_controller.rb`, `app/controllers/api/v1/timelines/list_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Home Feed]] — `FeedInsertWorker` writes list feeds with `FeedManager#push_to_list`\n- [[Follows]] — `ListAccount` needs a `Follow` or `FollowRequest` for every member\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Media Attachments":{"path":"2 Modules/Media Attachments.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"Images, video, GIFs and audio are uploaded first and attached by id when the status is created.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Media Attachments\n\n## What it is\n\nImages, video, GIFs and audio are uploaded first and attached by id when the status is created. Through the v2 endpoint, video, GIF and audio are processed in the background by `PostProcessMediaWorker` (the API answers 202), and uploads never attached to a post are deleted by the vacuum once they are a day old.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `app/controllers/api/v2/media_controller.rb`, `app/controllers/api/v1/media_controller.rb` |\n| Model | `app/models/media_attachment.rb` |\n| Processing | `app/workers/post_process_media_worker.rb` |\n| Cleanup | `app/lib/vacuum/media_attachments_vacuum.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Statuses]] — `PostStatusService#validate_media!` rejects media that is still processing\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Notification Dispatch":{"path":"2 Modules/Notification Dispatch.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications","repo":"mastodon","updated":"2026-10-19","summary":"`LocalNotificationWorker` turns an event into a call to `NotifyService`, which drops it, saves it as filtered, or saves it and pushes it to the streaming server and to web push.","aliases":[],"tags":["module","domain/notifications"],"flags":[],"inbound":9,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Notifications\nupdated: 2026-10-19\ntags: [module, domain/notifications]\n---\n# Notification Dispatch\n\n## What it is\n\n`LocalNotificationWorker` turns an event into a call to `NotifyService`, which drops it, saves it as filtered, or saves it and pushes it to the streaming server and to web push. Email follows two minutes later, and only when the user has no open stream and no web push subscription, unless they chose to always get emails.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/services/notify_service.rb`, `app/workers/local_notification_worker.rb` |\n| Models | `app/models/notification.rb`, `app/models/notification_group.rb` |\n| API | `app/controllers/api/v2/notifications_controller.rb`, `app/controllers/api/v1/notifications_controller.rb` |\n| Email | `app/mailers/notification_mailer.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications]] — this module's business area\n- [[Notification Filtering]] — `NotifyService` applies the recipient's `NotificationPolicy`\n- [[Web Push]] — `push_to_web_push_subscriptions!` queues `Web::PushNotificationWorker`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Notification Filtering":{"path":"2 Modules/Notification Filtering.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications","repo":"mastodon","updated":"2026-10-19","summary":"Each account's `NotificationPolicy` sets accept, filter or drop for six kinds of sender: people you do not follow, people who do not follow you (or followed less than three days ago), accounts younger than 30 days, unsolicited private menti","aliases":[],"tags":["module","domain/notifications"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Notifications\nupdated: 2026-10-19\ntags: [module, domain/notifications]\n---\n# Notification Filtering\n\n## What it is\n\nEach account's `NotificationPolicy` sets accept, filter or drop for six kinds of sender: people you do not follow, people who do not follow you (or followed less than three days ago), accounts younger than 30 days, unsolicited private mentions, limited accounts and bots. Filtered mentions and quotes are grouped into a `NotificationRequest` per sender, and accepting one stores a `NotificationPermission` so later notifications from that sender pass.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/notification_policy.rb`, `app/models/notification_request.rb`, `app/models/notification_permission.rb` |\n| Services | `app/services/accept_notification_request_service.rb`, `app/services/dismiss_notification_request_service.rb` |\n| API | `app/controllers/api/v1/notifications/requests_controller.rb`, `app/controllers/api/v2/notifications/policies_controller.rb` |\n| Unfilter | `app/workers/unfilter_notifications_worker.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications]] — this module's business area\n- [[Notification Dispatch]] — the policy is evaluated inside `NotifyService`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Polls":{"path":"2 Modules/Polls.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"A poll belongs to one status.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Polls\n\n## What it is\n\nA poll belongs to one status. A vote on a remote poll is sent to the author's server as one activity per chosen option, and the results of a local poll go out three minutes after a vote unless totals are hidden.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `app/models/poll.rb`, `app/models/poll_vote.rb` |\n| Voting | `app/services/vote_service.rb`, `app/controllers/api/v1/polls/votes_controller.rb` |\n| API | `app/controllers/api/v1/polls_controller.rb` |\n| Expiry | `app/workers/poll_expiration_notify_worker.rb` |\n| Results | `app/workers/activitypub/distribute_poll_update_worker.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Statuses]] — a poll is created with its status, and `PostStatusService` queues the expiry job\n- [[Inbox]] — remote votes on local polls arrive as `Create` activities handled by `ActivityPub::Activity::Create`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Profiles":{"path":"2 Modules/Profiles.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"An `Account` is a public identity, local or remote; profile edits go through `UpdateAccountService` and reach other servers five seconds later as an `Update` from `ActivityPub::UpdateDistributionWorker`.","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Profiles\n\n## What it is\n\nAn `Account` is a public identity, local or remote; profile edits go through `UpdateAccountService` and reach other servers five seconds later as an `Update` from `ActivityPub::UpdateDistributionWorker`. Turning off the locked setting approves every pending follow request except those from silenced accounts.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/account.rb` |\n| Update | `app/services/update_account_service.rb`, `app/controllers/api/v1/accounts/credentials_controller.rb`, `app/controllers/settings/profiles_controller.rb` |\n| Link verification | `app/services/verify_link_service.rb`, `app/workers/verify_account_links_worker.rb` |\n| Federation | `app/workers/activitypub/update_distribution_worker.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Follows]] — `UpdateAccountService` queues `AuthorizeFollowWorker` for pending requests when an account is unlocked\n- [[Delivery]] — profile updates go to the inboxes `AccountReachFinder` returns\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Public Timelines":{"path":"2 Modules/Public Timelines.md","type":"module","status":"shipped","depth":"stub","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"The local, federated and hashtag timelines are database queries run when they are read, through `PublicFeed` and `TagFeed`.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Public Timelines\n\n## What it is\n\nThe local, federated and hashtag timelines are database queries run when they are read, through `PublicFeed` and `TagFeed`. They show public posts from accounts that are neither suspended nor silenced, and the settings `local_live_feed_access` and `remote_live_feed_access` decide who may read them.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Feeds | `app/models/public_feed.rb`, `app/models/tag_feed.rb` |\n| API | `app/controllers/api/v1/timelines/public_controller.rb`, `app/controllers/api/v1/timelines/tag_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Server Settings]] — the two live-feed access settings are admin settings\n- [[Streaming API]] — new public posts reach open clients on the `timeline:public` channels\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Quote Posts":{"path":"2 Modules/Quote Posts.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"A `Quote` links a quoting status to the quoted one and has a state: pending, accepted, rejected, revoked or deleted.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Quote Posts\n\n## What it is\n\nA `Quote` links a quoting status to the quoted one and has a state: pending, accepted, rejected, revoked or deleted. Quoting a local post is accepted at once when `StatusPolicy` allows it; quoting a remote post sends a `QuoteRequest` and waits for that server's `Accept`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/quote.rb` |\n| Request | `app/workers/activitypub/quote_request_worker.rb` |\n| Verification | `app/services/activitypub/verify_quote_service.rb` |\n| Revocation | `app/services/revoke_quote_service.rb` |\n| API | `app/controllers/api/v1/statuses/quotes_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Statuses]] — `PostStatusService#attach_quote!` creates the quote\n- [[Inbox]] — `ActivityPub::Activity::Accept#accept_quote!` marks a remote approval\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Relays":{"path":"2 Modules/Relays.md","type":"module","status":"shipped","depth":"stub","domain":"Federation","repo":"mastodon","updated":"2026-10-19","summary":"A relay is a remote inbox that this server sends its public posts to and receives public posts from.","aliases":[],"tags":["module","domain/federation"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Federation\nupdated: 2026-10-19\ntags: [module, domain/federation]\n---\n# Relays\n\n## What it is\n\nA relay is a remote inbox that this server sends its public posts to and receives public posts from. Enabling one sends a `Follow` of the public collection from the instance actor; once the relay accepts, every public post is also delivered to it, and public posts arriving through it are kept even when nobody here follows the author.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/relay.rb` |\n| Admin | `app/controllers/admin/relays_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Federation]] — this module's business area\n- [[Delivery]] — `StatusReachFinder` adds the inbox of every accepted relay for public posts\n- [[Inbox]] — the relay's `Accept` is matched by `follow_activity_id` in `ActivityPub::Activity::Accept`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Remote Resolution":{"path":"2 Modules/Remote Resolution.md","type":"module","status":"shipped","depth":"stub","domain":"Federation","repo":"mastodon","updated":"2026-10-19","summary":"`ResolveAccountService` turns `user@domain` into an `Account`, asking the other server through WebFinger only when the account is unknown or was last checked more than a day ago (`Account::STALE_THRESHOLD`).","aliases":[],"tags":["module","domain/federation"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Federation\nupdated: 2026-10-19\ntags: [module, domain/federation]\n---\n# Remote Resolution\n\n## What it is\n\n`ResolveAccountService` turns `user@domain` into an `Account`, asking the other server through WebFinger only when the account is unknown or was last checked more than a day ago (`Account::STALE_THRESHOLD`). `ResolveURLService` does the same for a pasted URL, and `WellKnown::WebfingerController` answers WebFinger lookups for local accounts.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Accounts | `app/services/resolve_account_service.rb`, `app/services/activitypub/fetch_remote_account_service.rb`, `app/services/activitypub/process_account_service.rb` |\n| URLs | `app/services/resolve_url_service.rb`, `app/services/fetch_resource_service.rb`, `app/services/fetch_remote_status_service.rb` |\n| WebFinger | `app/lib/webfinger.rb`, `app/controllers/well_known/webfinger_controller.rb` |\n| Refresh | `app/workers/remote_account_refresh_worker.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Federation]] — this module's business area\n- [[Search]] — `resolve` queries for handles and URLs land here\n- [[Follows]] — `ActivityPub::Activity::Accept` queues `RemoteAccountRefreshWorker` when a remote account gets its first local follower\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Reports":{"path":"2 Modules/Reports.md","type":"module","status":"shipped","depth":"stub","domain":"Moderation","repo":"mastodon","updated":"2026-10-19","summary":"A report names an account and optionally statuses, and staff with `manage_reports` are notified unless the account already has another unresolved report.","aliases":[],"tags":["module","domain/moderation"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Moderation\nupdated: 2026-10-19\ntags: [module, domain/moderation]\n---\n# Reports\n\n## What it is\n\nA report names an account and optionally statuses, and staff with `manage_reports` are notified unless the account already has another unresolved report. A report on a remote account can be forwarded to its server as a `Flag` sent by the instance actor, and an incoming `Flag` is ignored when the sender's domain block has `reject_reports` set.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/services/report_service.rb` |\n| Model | `app/models/report.rb` |\n| API | `app/controllers/api/v1/reports_controller.rb` |\n| Admin | `app/controllers/admin/reports_controller.rb` |\n| Incoming | `app/lib/activitypub/activity/flag.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Moderation]] — this module's business area\n- [[Account Actions & Strikes]] — acting on an account resolves its open reports\n- [[Notification Dispatch]] — staff get an `admin.report` notification through `LocalNotificationWorker`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Roles":{"path":"2 Modules/Roles.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"mastodon","updated":"2026-10-19","summary":"A role is a bitmask of permissions from `UserRole::FLAGS` plus a position.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Roles\n\n## What it is\n\nA role is a bitmask of permissions from `UserRole::FLAGS` plus a position. Every role also has the permissions of the built-in everyone role, `administrator` grants all of them, and staff cannot grant permissions they lack or a position above their own.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/user_role.rb` |\n| Admin | `app/controllers/admin/roles_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Sign-up & Login]] — a user without a role falls back to `UserRole.everyone`\n- [[Notification Dispatch]] — mentions from staff whose role passes `bypass_block?` skip the recipient's filtering policy\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Scheduled Posts":{"path":"2 Modules/Scheduled Posts.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"A post with a future `scheduled_at` is stored as a `ScheduledStatus` holding the original parameters; the time must be more than five minutes ahead (a past time posts at once), with at most 25 a day and 300 in total.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Scheduled Posts\n\n## What it is\n\nA post with a future `scheduled_at` is stored as a `ScheduledStatus` holding the original parameters; the time must be more than five minutes ahead (a past time posts at once), with at most 25 a day and 300 in total. Every five minutes the scheduler queues the ones due soon, and `PublishScheduledStatusWorker` deletes the row before calling `PostStatusService`, so a post that fails when it is published is lost.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/scheduled_status.rb` |\n| Publishing | `app/workers/scheduler/scheduled_statuses_scheduler.rb`, `app/workers/publish_scheduled_status_worker.rb` |\n| API | `app/controllers/api/v1/scheduled_statuses_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Statuses]] — publishing goes through `PostStatusService`, the same path as posting now\n- [[Announcements]] — the same `Scheduler::ScheduledStatusesScheduler` run also publishes scheduled announcements\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Search":{"path":"2 Modules/Search.md","type":"module","status":"shipped","depth":"stub","domain":"Explore","repo":"mastodon","updated":"2026-10-19","summary":"`SearchService` splits a query into account, status and hashtag searches, and with `resolve` set a pasted URL is fetched from its server through `ResolveURLService`.","aliases":[],"tags":["module","domain/explore"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Explore\nupdated: 2026-10-19\ntags: [module, domain/explore]\n---\n# Search\n\n## What it is\n\n`SearchService` splits a query into account, status and hashtag searches, and with `resolve` set a pasted URL is fetched from its server through `ResolveURLService`. Full-text status search needs the search index enabled with `ES_ENABLED=true` and a signed-in user, and `StatusesSearchService` returns an empty list when the index cannot be reached.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Services | `app/services/search_service.rb`, `app/services/account_search_service.rb`, `app/services/statuses_search_service.rb`, `app/services/tag_search_service.rb` |\n| API | `app/controllers/api/v2/search_controller.rb` |\n| Indexes | `app/chewy/statuses_index.rb`, `app/chewy/public_statuses_index.rb`, `app/chewy/accounts_index.rb` |\n| Query syntax | `app/lib/search_query_parser.rb`, `app/lib/search_query_transformer.rb` |\n| Config | `config/initializers/chewy.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Explore]] — this module's business area\n- [[Remote Resolution]] — URL and `user@domain` queries go through `ResolveURLService` and `ResolveAccountService`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Server Settings":{"path":"2 Modules/Server Settings.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"mastodon","updated":"2026-10-19","summary":"Admin settings are rows in the `settings` table holding YAML values, read through `Setting` with the Rails cache in front and defaults from `config/settings.yml`.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Server Settings\n\n## What it is\n\nAdmin settings are rows in the `settings` table holding YAML values, read through `Setting` with the Rails cache in front and defaults from `config/settings.yml`. Some can be forced from the environment: `AUTHORIZED_FETCH` wins over the admin choice, and limited federation mode always turns authorized fetch on.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Form | `app/models/form/admin_settings.rb`, `app/controllers/admin/settings_controller.rb` |\n| Store | `app/models/setting.rb` |\n| Defaults | `config/settings.yml` |\n| Overrides | `app/helpers/authorized_fetch_helper.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Public Timelines]] — `local_live_feed_access` and `remote_live_feed_access` are read from here\n- [[Sign-up & Login]] — `registrations_mode` decides who can sign up\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Sign-up & Login":{"path":"2 Modules/Sign-up & Login.md","type":"module","status":"shipped","depth":"stub","domain":"Accounts","repo":"mastodon","updated":"2026-10-19","summary":"A `User` is the local login behind an `Account`, created through the web form or the API's `AppSignUpService`.","aliases":[],"tags":["module","domain/accounts"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Accounts\nupdated: 2026-10-19\ntags: [module, domain/accounts]\n---\n# Sign-up & Login\n\n## What it is\n\nA `User` is the local login behind an `Account`, created through the web form or the API's `AppSignUpService`. Sign-up is closed while `registrations_mode` is `none` (the default in `config/settings.yml`) unless the person has a valid invite, and new users wait for approval unless the mode is `open`, they came through LDAP or single sign-on, or their invite bypasses approval; IP, email-domain and username rules can force approval even then.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/controllers/auth/registrations_controller.rb`, `app/controllers/auth/sessions_controller.rb`, `app/controllers/auth/confirmations_controller.rb` |\n| API sign-up | `app/services/app_sign_up_service.rb` |\n| Rules | `app/helpers/registration_helper.rb` |\n| Model | `app/models/user.rb` |\n| Invites | `app/models/invite.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Accounts]] — this module's business area\n- [[Server Settings]] — `registrations_mode` is an admin setting\n- [[Home Feed]] — `User#update_sign_in!` triggers the feed rebuild for returning users\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Status Edits":{"path":"2 Modules/Status Edits.md","type":"module","status":"shipped","depth":"stub","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"Editing a status stores each version as a `StatusEdit`, and the first edit also snapshots the original.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Status Edits\n\n## What it is\n\nEditing a status stores each version as a `StatusEdit`, and the first edit also snapshots the original. `UpdateStatusService` discards an edit that changes nothing, and changing a poll's options or its multiple-choice setting resets the votes.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/services/update_status_service.rb` |\n| Model | `app/models/status_edit.rb` |\n| API | `app/controllers/api/v1/statuses/histories_controller.rb`, `app/controllers/api/v1/statuses/sources_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Statuses]] — an edit changes an existing status in place and is fanned out again with `DistributionWorker`\n- [[Polls]] — `UpdateStatusService#update_poll!` calls `reset_votes!` when the options change\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Statuses":{"path":"2 Modules/Statuses.md","type":"module","status":"shipped","depth":"full","domain":"Posting","repo":"mastodon","updated":"2026-10-19","summary":"A status is a post: text, visibility, and optional media, poll and quote.","aliases":[],"tags":["module","domain/posting"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: mastodon\ndomain: Posting\nupdated: 2026-10-19\ntags: [module, domain/posting]\n---\n# Statuses\n\n## What it is\n\nA status is a post: text, visibility, and optional media, poll and quote. `PostStatusService` creates it and queues every side effect, and `RemoveStatusService` takes it back out of feeds and off other servers.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `app/controllers/api/v1/statuses_controller.rb` |\n| Create | `app/services/post_status_service.rb` |\n| Delete | `app/services/remove_status_service.rb`, `app/workers/removal_worker.rb` |\n| Model | `app/models/status.rb` |\n| Spam check | `app/lib/antispam.rb` |\n\n## How it works\n\n`Api::V1::StatusesController#create` passes the request to `PostStatusService`. The service fills in defaults from the user's settings (visibility, sensitive), builds the status, runs `ProcessMentionsService`, attaches a `Quote` if one was asked for, runs the spam check and saves inside a transaction. If `scheduled_at` is set, the same input becomes a `ScheduledStatus` instead.\n\nAfter the save, `postprocess_status!` attaches hashtags with `ProcessHashtagsService`, registers them with `Trends.tags`, and queues the side effects: `LinkCrawlWorker` for the preview card, `DistributionWorker` for local feeds, `ActivityPub::DistributionWorker` for other servers, and `PollExpirationNotifyWorker` when there is a poll. With an `Idempotency-Key` header, a Redis lock plus a one-hour key make a repeated request return the first status instead of posting twice.\n\nDeleting runs the other way. The controller soft-deletes with `discard_with_reblogs` and queues `RemovalWorker`, which calls `RemoveStatusService`: it removes the status from home and list feeds, sends the deletion (a `Delete`, or an `Undo` for a boost) to every inbox `StatusReachFinder` returns with `unsafe: true`, removes the status's boosts, and publishes delete events to the hashtag and public streams.\n\n## Connects to\n\n- [[Posting]] — this module's business area\n- [[Home Feed]] — `PostStatusService` queues `DistributionWorker`, which fans the post into local home feeds\n- [[Delivery]] — `ActivityPub::DistributionWorker` sends the post to other servers\n- [[Posting a status]] — the end-to-end journey of one post\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `Antispam#local_preflight_check!` can raise `Antispam::SilentlyDrop`, which `PostStatusService` rescues: the caller gets a status object with an id, but nothing is saved or delivered. It fires when the text contains an entry of the Redis set `antispam:all_time_spammy_texts` (or of `antispam:spammy_texts` for accounts younger than a week) and no account the post replies to or mentions follows the author.\n- A silenced account's `public` post is saved as `unlisted`, and quoting a private post turns a `public` or `unlisted` post into `private`. Neither change raises an error or tells the client.\n- A status that has been reported is only soft-deleted: `RemoveStatusService#permanently?` returns false when `reported?` is true, so moderators can still open it.\n\n## History\n\n-\n"},"Streaming API":{"path":"2 Modules/Streaming API.md","type":"module","status":"shipped","depth":"stub","domain":"Timelines","repo":"mastodon","updated":"2026-10-19","summary":"A separate Node.js server holds clients' streaming connections and relays messages that Rails publishes to Redis channels such as `timeline:\u003caccount id>` and `timeline:public`.","aliases":[],"tags":["module","domain/timelines"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Timelines\nupdated: 2026-10-19\ntags: [module, domain/timelines]\n---\n# Streaming API\n\n## What it is\n\nA separate Node.js server holds clients' streaming connections and relays messages that Rails publishes to Redis channels such as `timeline:\u003caccount id>` and `timeline:public`. It refreshes `subscribed:` keys for its open channels, and Rails checks those keys before rendering a per-user update.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Server | `streaming/index.js`, `streaming/redis.js` |\n| Publisher | `app/workers/push_update_worker.rb` |\n| Redirect | `app/controllers/api/v1/streaming_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Timelines]] — this module's business area\n- [[Home Feed]] — `push_to_home` publishes only when a `subscribed:timeline:` key exists\n- [[Notification Dispatch]] — `NotifyService` publishes to `timeline:\u003cid>:notifications`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Trends":{"path":"2 Modules/Trends.md","type":"module","status":"shipped","depth":"stub","domain":"Explore","repo":"mastodon","updated":"2026-10-19","summary":"Posts, hashtags and links are scored from recent activity, and the scores are refreshed every five minutes; a post qualifies only if it is public, not a reply, not marked sensitive, has no content warning, and its author is discoverable and","aliases":[],"tags":["module","domain/explore"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Explore\nupdated: 2026-10-19\ntags: [module, domain/explore]\n---\n# Trends\n\n## What it is\n\nPosts, hashtags and links are scored from recent activity, and the scores are refreshed every five minutes; a post qualifies only if it is public, not a reply, not marked sensitive, has no content warning, and its author is discoverable and not silenced. A trending post is listed only once staff approve it or its author, unless `trendable_by_default` is on.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Engine | `app/models/trends.rb`, `app/models/trends/statuses.rb`, `app/models/trends/tags.rb`, `app/models/trends/links.rb` |\n| Refresh | `app/workers/scheduler/trends/refresh_scheduler.rb` |\n| API | `app/controllers/api/v1/trends/statuses_controller.rb`, `app/controllers/api/v1/trends/tags_controller.rb`, `app/controllers/api/v1/trends/links_controller.rb` |\n| Review | `app/controllers/admin/trends/statuses_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Explore]] — this module's business area\n- [[Hashtags]] — hashtag trends are registered from each new post\n- [[Server Settings]] — `trends` and `trendable_by_default` are admin settings\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Web Push":{"path":"2 Modules/Web Push.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications","repo":"mastodon","updated":"2026-10-19","summary":"A client registers a push endpoint with the alert types it wants, and `Web::PushNotificationWorker` sends each matching notification to it encrypted.","aliases":[],"tags":["module","domain/notifications"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Notifications\nupdated: 2026-10-19\ntags: [module, domain/notifications]\n---\n# Web Push\n\n## What it is\n\nA client registers a push endpoint with the alert types it wants, and `Web::PushNotificationWorker` sends each matching notification to it encrypted. A 4xx answer other than 408 or 429 deletes the subscription, and a notification older than 48 hours is not pushed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/web/push_subscription.rb` |\n| Worker | `app/workers/web/push_notification_worker.rb` |\n| API | `app/controllers/api/v1/push/subscriptions_controller.rb` |\n| Encryption | `app/lib/web_push_request.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications]] — this module's business area\n- [[Notification Dispatch]] — `NotifyService` queues one push job per subscription that is `pushable?`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Webhooks":{"path":"2 Modules/Webhooks.md","type":"module","status":"shipped","depth":"stub
