","domain":"Administration","repo":"mastodon","updated":"2026-10-19","summary":"Staff subscribe a URL to events from `Webhook::EVENTS` (account, report and status events); each event is serialized once and posted to every enabled webhook by `Webhooks::DeliveryWorker`, signed with an HMAC-SHA256 of the body in `X-Hub-Si","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: mastodon\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Webhooks\n\n## What it is\n\nStaff subscribe a URL to events from `Webhook::EVENTS` (account, report and status events); each event is serialized once and posted to every enabled webhook by `Webhooks::DeliveryWorker`, signed with an HMAC-SHA256 of the body in `X-Hub-Signature`. Unlike federation requests, these may go to private network addresses, because the worker passes `allow_local: true`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `app/models/webhook.rb` |\n| Trigger | `app/workers/trigger_webhook_worker.rb`, `app/services/webhook_service.rb` |\n| Delivery | `app/workers/webhooks/delivery_worker.rb` |\n| Admin | `app/controllers/admin/webhooks_controller.rb` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Sign-up & Login]] — `User#prepare_new_user!` triggers the `account.approved` event\n- [[Reports]] — `report.created` and `report.updated` are among the events\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Following a remote account":{"path":"3 Flows/Following a remote account.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"A user follows someone on another server.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [flow]\n---\n# Following a remote account\n\n## What happens\n\nA user follows someone on another server. A follow request is stored and a `Follow` activity is sent; when the other server answers with `Accept`, the request becomes a follow and the home feed is backfilled.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the API receives the follow | `Api::V1::AccountsController#follow` | [[Follows]] |\n| 2 | a remote target always gets a follow request | `FollowService#request_follow!` | [[Follows]] |\n| 3 | the request's uri becomes the Follow activity id | `FollowRequest#set_uri` | [[Follows]] |\n| 4 | the Follow is sent even if the server is marked unavailable | `ActivityPub::DeliveryWorker` | [[Delivery]] |\n| 5 | the remote Accept arrives at the inbox | `ActivityPub::InboxesController#create` | [[Inbox]] |\n| 6 | the request is found by its uri | `ActivityPub::Activity::Accept#accept_follow!` | [[Follows]] |\n| 7 | the follow is created and the request deleted | `FollowRequest#authorize!` | [[Follows]] |\n| 8 | stored posts are merged into the home feed | `FeedManager#merge_into_home` | [[Home Feed]] |\n| 9 | a first local follower triggers a profile refresh | `RemoteAccountRefreshWorker` | [[Remote Resolution]] |\n\n## Modules crossed\n\n- [[Follows]] — the API receives the follow\n- [[Delivery]] — the Follow is sent even if the server is marked unavailable\n- [[Inbox]] — the remote Accept arrives at the inbox\n- [[Home Feed]] — stored posts are merged into the home feed\n- [[Remote Resolution]] — a first local follower triggers a profile refresh\n\n## Where it breaks\n\n- Until the `Accept` arrives the relationship is only a `FollowRequest`, even when the remote account is not locked; if the other server never answers, it stays pending. The backfill copies at most `FeedManager::MAX_ITEMS / 4` (200) posts and only ones this server already stores for that account.\n"},"Posting a status":{"path":"3 Flows/Posting a status.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"A user publishes a post.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [flow]\n---\n# Posting a status\n\n## What happens\n\nA user publishes a post. It is saved, fanned into the home feeds of active local followers (and, when public, onto the live streams), and sent to the inboxes of every other server that should see it.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the API receives the post | `Api::V1::StatusesController#create` | [[Statuses]] |\n| 2 | defaults, mentions and quote are applied and the status is saved | `PostStatusService#process_status!` | [[Statuses]] |\n| 3 | hashtags are attached and the side-effect workers queued | `PostStatusService#postprocess_status!` | [[Statuses]] |\n| 4 | local fan-out starts under a per-status lock | `DistributionWorker` | [[Home Feed]] |\n| 5 | one insert job per recently active local follower | `FanOutOnWriteService#deliver_to_all_followers!` | [[Home Feed]] |\n| 6 | the post is filtered and written into each home feed | `FeedInsertWorker#check_and_insert` | [[Home Feed]] |\n| 7 | public posts are published to the live streams | `FanOutOnWriteService#broadcast_to_public_streams!` | [[Streaming API]] |\n| 8 | remote inboxes are worked out | `StatusReachFinder#inboxes` | [[Delivery]] |\n| 9 | one signed POST per inbox | `ActivityPub::DeliveryWorker#perform` | [[Delivery]] |\n\n## Modules crossed\n\n- [[Statuses]] — the API receives the post\n- [[Home Feed]] — local fan-out starts under a per-status lock\n- [[Streaming API]] — public posts are published to the live streams\n- [[Delivery]] — remote inboxes are worked out\n\n## Where it breaks\n\n- Home-feed fan-out reaches only local followers who signed in within `USER_ACTIVE_DAYS` (default 7); the rest see the post when their feed is rebuilt on return. A silenced author's `public` post is saved as `unlisted`, so it never reaches the public streams or hashtag followers.\n"},"Receiving an activity in an inbox":{"path":"3 Flows/Receiving an activity in an inbox.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Another server POSTs an activity.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [flow]\n---\n# Receiving an activity in an inbox\n\n## What happens\n\nAnother server POSTs an activity. The signature is checked, the body is queued and acknowledged with 202, and a worker turns it into local records such as a status, a follow or a deletion.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | size and unknown-actor guards run | `ActivityPub::InboxesController#skip_large_payload` | [[Inbox]] |\n| 2 | the HTTP signature is verified | `SignatureVerification#signed_request_actor` | [[HTTP signatures]] |\n| 3 | the sender is marked reachable again | `DeliveryFailureTracker.reset!` | [[Delivery]] |\n| 4 | the body is queued on ingress and 202 returned | `ActivityPub::InboxesController#process_payload` | [[Inbox]] |\n| 5 | JSON-LD, relayed signatures and suspended actors are handled | `ActivityPub::ProcessActivityService#call` | [[Inbox]] |\n| 6 | the handler class is picked by type | `ActivityPub::Activity.factory` | [[Inbox]] |\n| 7 | a Create is checked for relevance and saved | `ActivityPub::Activity::Create#create_status` | [[Inbox]] |\n| 8 | the new status is fanned into local feeds | `ActivityPub::Activity::Create#distribute` | [[Home Feed]] |\n\n## Modules crossed\n\n- [[Inbox]] — size and unknown-actor guards run\n- [[HTTP signatures]] — the HTTP signature is verified\n- [[Delivery]] — the sender is marked reachable again\n- [[Home Feed]] — the new status is fanned into local feeds\n\n## Where it breaks\n\n- The sender gets 202 as soon as the signature checks out, before anything is processed, so it never learns that an activity was dropped: an unknown `type` falls through `ActivityPub::Activity.factory` as `nil`, a `Create` that fails `related_to_local_activity?` is rejected, and a `Create` whose URI has a `Tombstone` is ignored.\n"},"HTTP signatures":{"path":"5 Platform/HTTP signatures.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Server-to-server requests are signed with an actor's key.","aliases":[],"tags":["platform"],"flags":[],"inbound":6,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [platform]\n---\n# HTTP signatures\n\n## What it is\n\nServer-to-server requests are signed with an actor's key. On the way in, `SignatureVerification#signed_request_actor` reads the `keyId`, finds a stored `Keypair` or fetches it with `ActivityPub::FetchRemoteKeyService`, and verifies the request through `SignedRequest`, which accepts both the draft-cavage `Signature` header and RFC 9421 message signatures (a `signature-input` header). If the stored key fails, the actor's key is refreshed once and the check repeated. Both schemes must cover the creation time and, on a POST, a SHA-256 digest of the body; the creation time may be at most an hour in the future, and the signature expires five minutes after creation unless it says otherwise, never later than twelve hours, with an hour of clock-skew margin. On the way out, `Request#on_behalf_of` picks the actor's RSA key and `Request#perform` signs with the draft, retrying with RFC 9421 on a 400 or 401. Activities relayed by a third party are checked separately against Linked Data signatures in `ActivityPub::ProcessActivityService`.\n\n## Connects to\n\n- [[Inbox]] — `require_actor_signature!` guards every inbox POST\n- [[Delivery]] — every `ActivityPub::DeliveryWorker` request is signed as the author\n- [[Sign with the draft first, retry with RFC 9421]] — the outgoing choice of scheme\n\n## Gotchas\n\n- Key fetches and refreshes run behind a circuit breaker keyed by the sender's IP, with a threshold of one failure and a five-minute cool-off; in that window, requests from that IP that need a key fetch get 503.\n- A `keyId` on a blocked domain (or one not allowed in limited federation mode) gets 403 through `domain_not_allowed?` before any fetch.\n- For the draft scheme, verification is tried with and then without the query string in `(request-target)`, because some Mastodon versions leave it out when signing.\n"},"Services and workers":{"path":"5 Platform/Services and workers.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Business actions live in `app/services` as classes that subclass `BaseService` and expose one `call`, such as `PostStatusService` or `FollowService`.","aliases":[],"tags":["platform"],"flags":[],"inbound":4,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [platform]\n---\n# Services and workers\n\n## What it is\n\nBusiness actions live in `app/services` as classes that subclass `BaseService` and expose one `call`, such as `PostStatusService` or `FollowService`. Slow or remote work runs in Sidekiq workers under `app/workers`, which are mostly thin: they load records by id and call a service or `FeedManager`. `config/sidekiq.yml` lists the queues with weights: `default` 8, `push` 6 (outgoing ActivityPub, web push and webhooks), `ingress` 4 (incoming inbox activities), `mailers` 2, then `pull` (fetching remote data, imports, backups), `scheduler` and `fasp`. The `scheduler` queue carries the periodic jobs listed under `:schedule:`, such as `Scheduler::ScheduledStatusesScheduler` every five minutes. When a read replica is configured, workers such as `FeedInsertWorker` load records inside `with_primary` and do their heavy reads inside `with_read_replica` from `DatabaseHelper`.\n\n## Connects to\n\n- [[Delivery]] — outgoing activities run on the `push` queue\n- [[Inbox]] — incoming activities run on the `ingress` queue\n- [[Home Feed]] — fan-out is a burst of `FeedInsertWorker` jobs on the `default` queue\n\n## Gotchas\n\n- Many workers, such as `DistributionWorker`, `FeedInsertWorker` and `MergeWorker`, rescue `ActiveRecord::RecordNotFound` and return `true`, so a job whose record was deleted in the meantime finishes as a success with nothing logged.\n- `ActivityPub::DeliveryWorker`, `Webhooks::DeliveryWorker`, `Import::RowWorker` and `PostProcessMediaWorker` are declared `dead: false`: when their retries run out the job is discarded instead of going to the dead set.\n"},"Fan-out on write":{"path":"6 Decisions/Fan-out on write.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Home and list timelines are precomputed: when a status is posted, its id is written into a Redis sorted set for each local follower who signed in within `USER_ACTIVE_DAYS`.","aliases":[],"tags":["decision"],"flags":[],"inbound":3,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Fan-out on write\n\n## Decision\n\nHome and list timelines are precomputed: when a status is posted, its id is written into a Redis sorted set for each local follower who signed in within `USER_ACTIVE_DAYS`. Public and hashtag timelines are not stored; `PublicFeed` and `TagFeed` query the database when they are read.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nReading a home timeline becomes a range read on one sorted set, with block, mute and reply filtering already done. The cost moves to posting time, and the active-user window bounds it; the comment in `app/models/concerns/user/activity.rb` frames that window as a trade-off: a shorter one saves fan-out work for people who rarely check their feed, a longer one saves rebuild work when they come back.\n\n## Consequences\n\nA post from an account with many local followers queues one `FeedInsertWorker` per active follower. A reader who was away longer than the window comes back to a feed that `RegenerationWorker` has to rebuild, and the home timeline API answers 206 until it is done. Because filtering happens at insert time, a later mute or block needs its own cleanup (`MuteWorker`, `BlockWorker`) to take effect in stored feeds.\n\n## Affects\n\n- [[Home Feed]] — the stored feeds this decision creates\n- [[Public Timelines]] — the timelines that stay query-on-read\n- [[Lists]] — list feeds are stored and filled the same way\n"},"Sign with the draft first, retry with RFC 9421":{"path":"6 Decisions/Sign with the draft first, retry with RFC 9421.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Outgoing requests are signed with the draft-cavage HTTP Signatures scheme first.","aliases":[],"tags":["decision"],"flags":[],"inbound":2,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Sign with the draft first, retry with RFC 9421\n\n## Decision\n\nOutgoing requests are signed with the draft-cavage HTTP Signatures scheme first. If a signed request gets a 400 or 401, `Request#perform` sends it again signed with RFC 9421 HTTP Message Signatures; the code calls this a double-knock. Incoming requests are accepted in either scheme.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nOne request is enough for every server that accepts the draft, and servers that only accept RFC 9421 are still reached, without this server storing which scheme each peer wants.\n\n## Consequences\n\nA peer that rejects the draft costs two requests on every delivery, because nothing remembers the outcome. A 400 or 401 for an unrelated reason also triggers the second attempt.\n\n## Affects\n\n- [[HTTP signatures]] — both schemes, in and out\n- [[Delivery]] — every delivery goes through `Request#perform`\n"},"mastodon":{"path":"8 Repos/mastodon.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"mastodon","updated":"2026-10-19","summary":"Mastodon is a federated social network server (AGPL-3.0).","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: mastodon\nupdated: 2026-10-19\ntags: [repo]\n---\n# mastodon\n\n## What it is\n\nMastodon is a federated social network server (AGPL-3.0). People post statuses, follow accounts on any server that speaks ActivityPub, and read home, list and public timelines. This vault is a demo map of its codebase at one commit; every path and identifier in it was checked against the checkout.\n\n## Where it lives\n\nA Rails application plus a separate Node.js streaming server. Controllers are in `app/controllers` (the REST API under `app/controllers/api`, ActivityPub endpoints under `app/controllers/activitypub`, staff screens under `app/controllers/admin`), business actions in `app/services`, Sidekiq jobs in `app/workers`, ActivityPub handlers in `app/lib/activitypub`, the web client in `app/javascript`, and the streaming server in `streaming/index.js`. Routes are in `config/routes.rb` and the files under `config/routes`.\n\n## How it works\n\n`bin/dev` starts the four processes in `Procfile.dev`: Puma (`web`), Sidekiq (`sidekiq`), the streaming server (`stream`, port 4000) and Vite (`vite`). Setup instructions are in `docs/DEVELOPMENT.md`. The default branch is `main`, the version is in `lib/mastodon/version.rb`, and releases are listed in `CHANGELOG.md`.\n\n## Connects to\n\n- [[Home]] — the entry page lists the domains\n- [[Services and workers]] — how work is split between services and Sidekiq queues\n- [[HTTP signatures]] — how servers authenticate each other\n- [[Fan-out on write]] — why home timelines are stored, not queried\n\n## Gotchas\n\n- Rails and the streaming server share Postgres and Redis but are separate processes; the streaming server reads blocks, mutes and keyword filters with its own SQL in `streaming/index.js`, so a schema change there needs a matching change in JavaScript.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A living map of how Mastodon is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Mastodon — the world\n\nA living map of how Mastodon is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[mastodon]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Posting]] | Statuses, media, polls and quotes |\n| [[Timelines]] | Home, lists, hashtags and the live feeds |\n| [[Notifications]] | Notifications, filtered requests and web push |\n| [[Accounts]] | Profiles, follows, blocks and mutes |\n| [[Explore]] | Search, trends and follow suggestions |\n| [[Federation]] | Inbox, delivery and lookups |\n| [[Moderation]] | Reports, account actions and domain blocks |\n| [[Administration]] | Server settings, roles, announcements and webhooks |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[Posting a status]] — A user publishes a post\n- [[Receiving an activity in an inbox]] — Another server POSTs an activity\n- [[Following a remote account]] — A user follows someone on another server\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n- [[Services and workers]] · [[HTTP signatures]]\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Fan-out on write]] — Home and list timelines are precomputed: when a status is posted, its id is written into a Redis sorted set for each local follower who signed in within `USER_ACTIVE_DAYS`\n- [[Sign with the draft first, retry with RFC 9421]] — Outgoing requests are signed with the draft-cavage HTTP Signatures scheme first\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/vault:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**4 of 36 module notes are `full`.** 58 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n- [[Delivery]] — Federation\n- [[Home Feed]] — Timelines\n- [[Inbox]] — Federation\n- [[Statuses]] — Posting\n\n## Stub — promote on next touch\n\n- [[Account Actions & Strikes]] — Moderation\n- [[Account Migration]] — Accounts\n- [[Announcements]] — Administration\n- [[Blocks & Mutes]] — Accounts\n- [[Domain Blocks]] — Moderation\n- [[Favourites & Boosts]] — Posting\n- [[Follow Suggestions]] — Explore\n- [[Follows]] — Accounts\n- [[Hashtags]] — Timelines\n- [[Import & Export]] — Accounts\n- [[Keyword Filters]] — Timelines\n- [[Lists]] — Timelines\n- [[Media Attachments]] — Posting\n- [[Notification Dispatch]] — Notifications\n- [[Notification Filtering]] — Notifications\n- [[Polls]] — Posting\n- [[Profiles]] — Accounts\n- [[Public Timelines]] — Timelines\n- [[Quote Posts]] — Posting\n- [[Relays]] — Federation\n- [[Remote Resolution]] — Federation\n- [[Reports]] — Moderation\n- [[Roles]] — Administration\n- [[Scheduled Posts]] — Posting\n- [[Search]] — Explore\n- [[Server Settings]] — Administration\n- [[Sign-up & Login]] — Accounts\n- [[Status Edits]] — Posting\n- [[Streaming API]] — Timelines\n- [[Trends]] — Explore\n- [[Web Push]] — Notifications\n- [[Webhooks]] — Administration\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/vault:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-19 · Seed the Mastodon map: 8 domains, 36 modules, 3 flows, 2 platform notes, 2 decisions · `ff9336e` · 1 Domains: Accounts, Administration, Explore, Federation, Moderation, Notifications (+2); 2 Modules: Account Actions & Strikes, Account Migration, Announcements, Blocks & Mutes, Delivery, Domain Blocks (+30); 3 Flows: Following a remote account, Posting a status, Receiving an activity in an inbox; 5 Platform: HTTP signatures, Services and workers; 6 Decisions: Fan-out on write, Sign with the draft first, retry with RFC 9421; 8 Repos: mastodon; .: Home\n- 2026-10-19 · Start the Mastodon knowledge vault · `940a842` · 8 Repos: mastodon; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"Accounts","to":"Profiles","reason":"An Account is a public identity, local or remote; profile edits go through UpdateAccountService and reach other servers five seconds later as an Update from ActivityPub::UpdateDistributionWorker"},{"from":"Accounts","to":"Follows","reason":"FollowService follows an unlocked local account at once and creates a FollowRequest for a locked account, for any remote account, or when the follower is silenced"},{"from":"Accounts","to":"Blocks & Mutes","reason":"A block removes follows in both directions, clears the blocked account from your feeds, notifications and conversations, and sends a Block to a remote account's server"},{"from":"Accounts","to":"Account Migration","reason":"Moving sets a redirect on the old account and sends a Move to its followers' servers; MoveWorker points this server's followers at the new account and carries over local users' notes, blocks and mutes, but does not touch posts"},{"from":"Accounts","to":"Sign-up & Login","reason":"A User is the local login behind an Account, created through the web form or the API's AppSignUpService"},{"from":"Accounts","to":"Import & Export","reason":"CSV imports of follows, blocks, mutes, domain blocks, bookmarks, lists and filters are stored as BulkImportRow records and applied one row per Import::RowWorker job on the pull queue; in overwrite mode BulkImportService first undoes existing entries missing from the file, and deletes all existing filters"},{"from":"Administration","to":"Server Settings","reason":"Admin settings are rows in the settings table holding YAML values, read through Setting with the Rails cache in front and defaults from config/settings.yml"},{"from":"Administration","to":"Roles","reason":"A role is a bitmask of permissions from UserRole::FLAGS plus a position"},{"from":"Administration","to":"Announcements","reason":"Announcements are server-wide notices from staff, with optional start and end times and emoji reactions"},{"from":"Administration","to":"Webhooks","reason":"Staff subscribe a URL to events from Webhook::EVENTS (account, report and status events); each event is serialized once and posted to every enabled webhook by Webhooks::DeliveryWorker, signed with an HMAC-SHA256 of the body in X-Hub-Signature"},{"from":"Explore","to":"Search","reason":"SearchService splits a query into account, status and hashtag searches, and with resolve set a pasted URL is fetched from its server through ResolveURLService"},{"from":"Explore","to":"Trends","reason":"Posts, hashtags and links are scored from recent activity, and the scores are refreshed every five minutes; a post qualifies only if it is public, not a reply, not marked sensitive, has no content warning, and its author is discoverable and not silenced"},{"from":"Explore","to":"Follow Suggestions","reason":"AccountSuggestions merges five sources, among them staff-featured accounts, friends of friends, similar profiles and a server-wide ranking, and caches the shuffled result per account for 15 minutes"},{"from":"Federation","to":"Inbox","reason":"Other servers POST activities here"},{"from":"Federation","to":"Delivery","reason":"Outgoing activities are queued and sent by ActivityPub::DeliveryWorker, one job per inbox"},{"from":"Federation","to":"Remote Resolution","reason":"ResolveAccountService turns user@domain into an Account, asking the other server through WebFinger only when the account is unknown or was last checked more than a day ago (Account::STALE_THRESHOLD)"},{"from":"Federation","to":"Relays","reason":"A relay is a remote inbox that this server sends its public posts to and receives public posts from"},{"from":"Moderation","to":"Reports","reason":"A report names an account and optionally statuses, and staff with manage_reports are notified unless the account already has another unresolved report"},{"from":"Moderation","to":"Account Actions & Strikes","reason":"Admin::AccountAction applies one of none, disable, sensitive, silence or suspend, records a strike as an AccountWarning, and resolves every unresolved report on the account (for none, only the report it was taken from)"},{"from":"Moderation","to":"Domain Blocks","reason":"A domain block has a severity of silence, suspend or noop plus reject_media and reject_reports flags, and covers the domain and all its subdomains, the most specific block winning"},{"from":"Notifications","to":"Notification Dispatch","reason":"LocalNotificationWorker turns an event into a call to NotifyService, which drops it, saves it as filtered, or saves it and pushes it to the streaming server and to web push"},{"from":"Notifications","to":"Notification Filtering","reason":"Each account's NotificationPolicy sets accept, filter or drop for six kinds of sender: people you do not follow, people who do not follow you (or followed less than three days ago), accounts younger than 30 days, unsolicited private mentions, limited accounts and bots"},{"from":"Notifications","to":"Web Push","reason":"A client registers a push endpoint with the alert types it wants, and Web::PushNotificationWorker sends each matching notification to it encrypted"},{"from":"Posting","to":"Statuses","reason":"A status is a post: text, visibility, and optional media, poll and quote"},{"from":"Posting","to":"Status Edits","reason":"Editing a status stores each version as a StatusEdit, and the first edit also snapshots the original"},{"from":"Posting","to":"Media Attachments","reason":"Images, video, GIFs and audio are uploaded first and attached by id when the status is created"},{"from":"Posting","to":"Polls","reason":"A poll belongs to one status"},{"from":"Posting","to":"Scheduled Posts","reason":"A post with a future scheduled_at is stored as a ScheduledStatus holding the original parameters; the time must be more than five minutes ahead (a past time posts at once), with at most 25 a day and 300 in total"},{"from":"Posting","to":"Quote Posts","reason":"A Quote links a quoting status to the quoted one and has a state: pending, accepted, rejected, revoked or deleted"},{"from":"Posting","to":"Favourites & Boosts","reason":"A boost is a status of its own with reblog set and empty text, so it is fanned out and federated like a post"},{"from":"Timelines","to":"Home Feed","reason":"Each account's home timeline is a Redis sorted set that posts are written into when they are published"},{"from":"Timelines","to":"Public Timelines","reason":"The local, federated and hashtag timelines are database queries run when they are read, through PublicFeed and TagFeed"},{"from":"Timelines","to":"Lists","reason":"A list is a feed of chosen accounts, stored in Redis like the home feed and filled by the same fan-out"},{"from":"Timelines","to":"Hashtags","reason":"Local posts get their hashtags from the text with Extractor.extract_hashtags; remote posts take them from the activity's tag entries"},{"from":"Timelines","to":"Keyword Filters","reason":"A filter is a set of keywords or chosen statuses with contexts (home, notifications, public, thread, account), an action (warn, hide or blur) and an optional expiry"},{"from":"Timelines","to":"Streaming API","reason":"A separate Node.js server holds clients' streaming connections and relays messages that Rails publishes to Redis channels such as timeline:\u003caccount id> and timeline:public"},{"from":"Account Actions & Strikes","to":"Moderation","reason":"this module's business area"},{"from":"Account Actions & Strikes","to":"Reports","reason":"reports are resolved inside the same transaction as the action"},{"from":"Account Actions & Strikes","to":"Notification Dispatch","reason":"the strike notice is a moderation_warning notification"},{"from":"Account Migration","to":"Accounts","reason":"this module's business area"},{"from":"Account Migration","to":"Follows","reason":"remote targets are re-followed through UnfollowFollowWorker"},{"from":"Account Migration","to":"Inbox","reason":"incoming Move activities are handled by ActivityPub::Activity::Move"},{"from":"Announcements","to":"Administration","reason":"this module's business area"},{"from":"Announcements","to":"Streaming API","reason":"PublishScheduledAnnouncementWorker publishes to each connected user's timeline:\u003cid> channel"},{"from":"Announcements","to":"Scheduled Posts","reason":"both are released by Scheduler::ScheduledStatusesScheduler"},{"from":"Blocks & Mutes","to":"Accounts","reason":"this module's business area"},{"from":"Blocks & Mutes","to":"Home Feed","reason":"FeedManager#clear_from_home removes the account's posts from the feed"},{"from":"Blocks & Mutes","to":"Notification Dispatch","reason":"AfterBlockService deletes notifications from the blocked account"},{"from":"Delivery","to":"Federation","reason":"this module's business area"},{"from":"Delivery","to":"HTTP signatures","reason":"Request#on_behalf_of signs every delivery"},{"from":"Delivery","to":"Relays","reason":"public posts also go to every accepted relay"},{"from":"Delivery","to":"Services and workers","reason":"deliveries run on the push queue"},{"from":"Domain Blocks","to":"Moderation","reason":"this module's business area"},{"from":"Domain Blocks","to":"Inbox","reason":"domain_not_allowed? is checked on signatures and incoming activities"},{"from":"Domain Blocks","to":"Reports","reason":"reject_reports makes incoming Flag activities from the domain be ignored"},{"from":"Favourites & Boosts","to":"Posting","reason":"this module's business area"},{"from":"Favourites & Boosts","to":"Notification Dispatch","reason":"both services queue LocalNotificationWorker when the author is local"},{"from":"Favourites & Boosts","to":"Trends","reason":"FavouriteService and ReblogService register the status with Trends"},{"from":"Follow Suggestions","to":"Explore","reason":"this module's business area"},{"from":"Follow Suggestions","to":"Follows","reason":"FollowRequest deletes the cached suggestions in invalidate_follow_recommendations_cache"},{"from":"Follows","to":"Accounts","reason":"this module's business area"},{"from":"Follows","to":"Inbox","reason":"the remote Accept is handled by ActivityPub::Activity::Accept"},{"from":"Follows","to":"Home Feed","reason":"MergeWorker copies the followed account's posts into the home feed"},{"from":"Follows","to":"Following a remote account","reason":"the end-to-end journey"},{"from":"Hashtags","to":"Timelines","reason":"this module's business area"},{"from":"Hashtags","to":"Home Feed","reason":"FanOutOnWriteService#deliver_to_hashtag_followers! feeds followed hashtags into home"},{"from":"Hashtags","to":"Trends","reason":"Trends.tags ranks hashtags by recent use"},{"from":"Home Feed","to":"Timelines","reason":"this module's business area"},{"from":"Home Feed","to":"Statuses","reason":"new posts reach the feed through DistributionWorker"},{"from":"Home Feed","to":"Streaming API","reason":"FeedManager#push_to_home queues PushUpdateWorker for readers with an open stream"},{"from":"Home Feed","to":"Fan-out on write","reason":"the design this module implements"},{"from":"Import & Export","to":"Accounts","reason":"this module's business area"},{ <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
const COLORS = [
  ['module', '#e8832a', 'module'], ['stub', '#708090', 'stub'], ['deprecated', '#9b1c1c', 'deprecated'],
  ['domain', '#e0609a', 'domain'], ['flow', '#3aa65b', 'flow'], ['integration', '#3b7ddd', 'integration'],
  ['platform', '#8e5bd6', 'platform'], ['decision', '#d9b400', 'decision'], ['release', '#8d8d8d', 'release'],
  ['repo', '#2a9d8f', 'repo'], ['meta', '#b5b5b5', 'other']];
const COLOR = Object.fromEntries(COLORS.map(c => [c[0], c[1]]));
const colorOf = n => n.status === 'deprecated' ? COLOR.deprecated : n.depth === 'stub' ? COLOR.stub : (COLOR[n.type] || COLOR.meta);

// --- data shaping ----------------------------------------------------------
const nodes = Object.keys(data.notes).sort().map(id => Object.assign({id: id}, data.notes[id]));
const byId = new Map(nodes.map(n => [n.id, n]));
const pairs = new Map();            // one drawn line per unordered pair; every reason kept
for (const l of data.links) {
  const k = l.from < l.to ? l.from + '\u0001' + l.to : l.to + '\u0001' + l.from;
  let p = pairs.get(k);
  if (!p) { p = {source: l.from, target: l.to, reasons: []}; pairs.set(k, p); }
  p.reasons.push(l);
}
const links = Array.from(pairs.values());
const degree = new Map();
for (const l of links) { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); }
const radius = n => 4 + Math.sqrt(degree.get(n.id) || 0) * 1.6;
const lookup = new Map();           // lowercased name or alias -> id
for (const n of nodes) { lookup.set(n.id.toLowerCase(), n.id); for (const a of n.aliases || []) lookup.set(String(a).toLowerCase(), n.id); }
for (const a in data.aliases) if (byId.has(data.aliases[a])) lookup.set(a.toLowerCase(), data.aliases[a]);
const resolve = name => lookup.get(name.trim().toLowerCase()) || null;

document.getElementById('stats').textContent = nodes.length + ' notes · ' + data.links.length + ' links · ' + data.vault + (data.built_at ? ' · built ' + data.built_at : '');
document.getElementById('legend').innerHTML = COLORS.map(c => '<span style="--c:' + c[1] + '">' + c[2] + '</span>').join('');

// --- graph -----------------------------------------------------------------
const svg = d3.select('#graph');
const g = svg.append('g');
const tip = document.getElementById('tip');
const moveTip = e => { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 400) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); };
const hideTip = () => { tip.style.display = 'none'; };

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
// A wide transparent twin of each edge is the hover target: a 1px line is unhoverable.
const hit = g.append('g').attr('class', 'hits').selectAll('line').data(links).join('line')
  .on('mouseenter', (e, d) => { d.el.classList.add('hover'); showTip(e, d.reasons.map(r => '<b>' + esc(r.from) + '</b> → <b>' + esc(r.to) + '</b>' + (r.reason ? ': ' + esc(r.reason) : '')).join('<br>')); })
  .on('mousemove', moveTip).on('mouseleave', (e, d) => { d.el.classList.remove('hover'); hideTip(); });
link.each(function (d) { d.el = this; });
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
  .on('click', (e, d) => { e.stopPropagation(); select(d.id, false); })
  .on('mouseenter', (e, d) => showTip(e, '<b>' + esc(d.id) + '</b> <small>' + esc([d.type, d.status, d.depth].filter(Boolean).join(' · ')) + '</small>' + (d.summary ? '<br>' + esc(d.summary) : '')))
  .on('mousemove', moveTip).on('mouseleave', hideTip);
node.append('circle').attr('r', radius).attr('fill', colorOf);
node.append('text').attr('dx', d => radius(d) + 3).attr('dy', '0.35em').text(d => d.id);

const draw = () => {
  for (const s of [link, hit]) s.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .force('center', d3.forceCenter(0, 0))
  .force('x', d3.forceX(0).strength(0.04))   // keep unlinked notes near the rest
  .force('y', d3.forceY(0).strength(0.04))
  .on('tick', draw)
  .stop();
sim.tick(300);                      // settle synchronously: first paint is the final layout
draw();

let moved = false;                  // the viewer zoomed or panned: stop refitting for them
const zoom = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => {
  if (e.sourceEvent) moved = true;
  g.attr('transform', e.transform);
  node.selectAll('text').style('display', e.transform.k < 0.55 ? 'none' : null);
});
svg.call(zoom).on('click', () => select(null));
let fitted = true;
fit(false);                         // first paint lands fitted; later fits animate

function size() {               // falls back to the window: a hidden page reports a 0x0 svg
  const r = svg.node().getBoundingClientRect();
  return [r.width || window.innerWidth, r.height || window.innerHeight];
}
function fit(animate = true) {
  const [w, h] = size();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const k = Math.min(1, 0.9 * Math.min(w / (x1 - x0 + 1), h / (y1 - y0 + 1)));
  if (!(k > 0 && isFinite(k))) { fitted = false; return; }   // retried on the next resize
  const target = d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, target);
}
function centerOn(n) {
  const [w, h] = size(), k = Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
}
window.addEventListener('resize', () => { if (!fitted && sim.alpha() < sim.alphaMin()) { fitted = true; fit(); } });
// On narrow screens the reader panel sits under the graph; opening a note shrinks the graph, so refit it.
if (window.ResizeObserver) new ResizeObserver(() => { if (!moved) fit(false); }).observe(svg.node());
function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }

// --- selection, search, dimming ---------------------------------------------
let selected = null;
function focus(set) {               // ids to keep bright, or null for all
  node.classed('dim', d => !!set && !set.has(d.id)).classed('sel', d => d.id === selected);
  link.classed('dim', d => !!set && !(set.has(d.source.id) && set.has(d.target.id)))
      .classed('hot', d => !!selected && (d.source.id === selected || d.target.id === selected));
}
function neighbours(id) {           // [dir, other, reason], reasoned first, deduplicated
  const out = [], seen = new Set();
  for (const l of data.links) {
    const r = l.from === id ? ['→', l.to, l.reason] : l.to === id ? ['←', l.from, l.reason] : null;
    if (!r) continue;
    const k = r.join('\u0001');
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((a, b) => (a[2] == null) - (b[2] == null) || (a[0] > b[0]) - (a[0] < b[0]) || a[1].localeCompare(b[1]));
}
function focusSelected() {
  focus(selected ? new Set([selected].concat(neighbours(selected).map(x => x[1]))) : null);
}
const panel = document.getElementById('panel');
const obsidianUrl = n => 'obsidian://open?vault=' + encodeURIComponent(data.vault) + '&file=' + encodeURIComponent(n.path.replace(/\.md$/, ''));
function select(id, center) {
  selected = id;
  focusSelected();
  if (!id) { panel.className = 'empty'; panel.textContent = 'Click a node to read its note. Hover an edge for the link reason.'; return; }
  const n = byId.get(id), nb = neighbours(id);
  const meta = [n.type, n.status, n.depth, n.domain, n.repo, n.updated && 'updated ' + n.updated].filter(Boolean).map(esc).join(' · ');
  panel.className = '';
  panel.innerHTML = '<h2>' + esc(id) + '</h2><div class="meta">' + meta + '<br><a href="' + obsidianUrl(n) + '" title="Open in Obsidian">' + esc(n.path) + '</a></div>'
    + '<div class="body">' + md(n.body || n.summary || '') + '</div>'
    + '<div class="nb"><h3>Neighbours (' + nb.length + ')</h3><ul>'
    + nb.map(x => '<li>' + x[0] + ' <a href="#" data-node="' + esc(x[1]) + '">' + esc(x[1]) + '</a>' + (x[2] ? ' <span class="r">— ' + esc(x[2]) + '</span>' : '') + '</li>').join('')
    + '</ul></div>';
  panel.scrollTop = 0;
  if (center) centerOn(n);
}
panel.addEventListener('click', e => {
  const a = e.target.closest('a[data-node]');
  if (a) { e.preventDefault(); select(a.dataset.node, true); }
});

const q = document.getElementById('q'), hits = document.getElementById('hits');
function matches(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  return nodes.filter(n => n.id.toLowerCase().includes(t) || (n.aliases || []).some(a => String(a).toLowerCase().includes(t)));
}
q.addEventListener('input', () => {
  const m = matches(q.value);
  if (!m) { hits.innerHTML = ''; focusSelected(); return; }
  focus(new Set(m.map(n => n.id)));
  hits.innerHTML = m.slice(0, 30).map(n => '<li data-node="' + esc(n.id) + '">' + esc(n.id) + ' <small>' + esc(n.type || '') + '</small></li>').join('') || '<li><small>no matches</small></li>';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const m = matches(q.value); if (m && m.length) { select(m[0].id, true); hits.innerHTML = ''; } }
  if (e.key === 'Escape') { q.value = ''; hits.innerHTML = ''; focusSelected(); }
});
hits.addEventListener('click', e => { const li = e.target.closest('li[data-node]'); if (li) { select(li.dataset.node, true); hits.innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.innerHTML = ''; });

// --- minimal markdown --------------------------------------------------------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  const out = [];
  const keep = html => { out.push(html); return '\u0002' + (out.length - 1) + '\u0003'; };
  s = s.replace(/`([^`]+)`/g, (m, c) => keep('<code>' + esc(c) + '</code>'))
       .replace(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, a) => {
         const id = resolve(t), label = esc(a || t);
         return keep(id ? '<a href="#" data-node="' + esc(id) + '">' + label + '</a>' : '<span class="dead">' + label + '</span>');
       });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0003/g, (m, i) => out[i]);
}
function md(text) {
  const lines = text.replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n');
  const html = [];
  let i = 0, list = null, para = [], m;
  const flushPara = () => { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  const cells = r => r.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => inline(c.replace(/\\\|/g, '|').trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushPara(); closeList(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      flushPara(); closeList();
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      html.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => (k ? '<td>' : '<th>') + c + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {     // ponytail: nested lists flattened
      flushPara();
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); list = kind; html.push('<' + kind + '>'); }
      html.push('<li>' + inline(m[2]) + '</li>'); i++; continue;
    }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    closeList(); para.push(line); i++;
  }
  flushPara(); closeList();
  return html.join('\n');
}
})();
</script>
<script>(function () {  // open one note on arrival
  var t = [].find.call(document.querySelectorAll('.node text'), function (x) { return x.textContent === "Posting a status"; });
  if (t) t.parentNode.dispatchEvent(new MouseEvent('click', {bubbles: true}));
})();</script>
</body>
