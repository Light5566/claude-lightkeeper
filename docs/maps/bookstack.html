e Sign-on]] — External identity: SAML2, OpenID Connect, LDAP and social providers\n- [[User Invites]] — An admin can create a user without a password; the user receives an invite link to set one\n"},"Activity & Integrations":{"path":"1 Domains/Activity & Integrations.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"What happened and who should hear about it: activity, comments, tags, favourites, watching, webhooks.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [domain]\n---\n# Activity & Integrations\n\n## What it is\n\nWhat happened and who should hear about it: activity, comments, tags, favourites, watching, webhooks.\n\n## Modules\n\n- [[Tags]] — Name-value tags on any entity, browsable and searchable\n- [[Comments]] — Threaded comments on pages, with mentions\n- [[Favourites]] — Users can star any entity to find it again from their favourites list\n- [[Watching & Notifications]] — Users watch a shelf, book, chapter or page at a chosen level and get emailed about updates and comments\n- [[Activity Log]] — One row per action anything in the system takes\n- [[Webhooks]] — Outgoing HTTP calls for chosen activity types, sent from a queued job\n"},"Content":{"path":"1 Domains/Content.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"Shelves, books, chapters and pages: the hierarchy readers browse, with revisions, templates, sorting and the recycle bin.","aliases":[],"tags":["domain"],"flags":[],"inbound":8,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [domain]\n---\n# Content\n\n## What it is\n\nShelves, books, chapters and pages: the hierarchy readers browse, with revisions, templates, sorting and the recycle bin.\n\n## Modules\n\n- [[Bookshelves]] — Shelves group books\n- [[Books]] — A book holds chapters and pages in order\n- [[Chapters]] — A chapter groups pages inside a book\n- [[Pages]] — A page is the document people read and edit, in the WYSIWYG or markdown editor\n- [[Page Revisions]] — Every page save keeps the previous content as a revision, and drafts are revisions too\n- [[Page Templates]] — A page marked as a template can be inserted into new pages, and a book or chapter can name a default template for pages created inside it\n- [[Recycle Bin]] — Deleted shelves, books, chapters and pages go to the recycle bin first, where they can be restored or destroyed for good\n- [[Sort Rules]] — Sort rules are reusable orderings (by name, date, type) that a book can apply automatically to its chapters and pages\n"},"Export & Import":{"path":"1 Domains/Export & Import.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"Getting content out as HTML, PDF or ZIP, and bringing ZIP exports back in.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [domain]\n---\n# Export & Import\n\n## What it is\n\nGetting content out as HTML, PDF or ZIP, and bringing ZIP exports back in.\n\n## Modules\n\n- [[Exports]] — Any page, chapter or book can be exported as contained HTML, plain text, PDF or a portable ZIP\n- [[Import]] — A ZIP export from any BookStack instance can be uploaded, validated and imported as new content\n"},"Media":{"path":"1 Domains/Media.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"Images and file attachments stored alongside content.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [domain]\n---\n# Media\n\n## What it is\n\nImages and file attachments stored alongside content.\n\ h":"stub","domain":"Search & References","repo":"BookStack","updated":"2026-10-18","summary":"Full-text search over all content with filters and term syntax.","aliases":[],"tags":["module","domain/search-references"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Search & References\nupdated: 2026-10-18\ntags: [module, domain/search-references]\n---\n# Search\n\n## What it is\n\nFull-text search over all content with filters and term syntax. The index is a table of weighted terms per entity, rebuilt whenever content changes.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/Search/SearchController.php`, `app/Search/SearchApiController.php` |\n| Runner | `app/Search/SearchRunner.php` |\n| Index | `app/Search/SearchIndex.php`, `app/Search/SearchTerm.php`, `app/Search/SearchTextTokenizer.php` |\n| Options | `app/Search/SearchOptions.php`, `app/Search/SearchOptionSet.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Search & References]] — this module's business area\n- [[Pages]] — page content is tokenised into search terms\n- [[Entity Permissions]] — results are filtered by the joint permissions of the current user\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Settings":{"path":"2 Modules/Settings.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Settings","repo":"BookStack","updated":"2026-10-18","summary":"Instance-wide settings: name, branding, registration, features.","aliases":[],"tags":["module","domain/users-settings"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Users & Settings\nupdated: 2026-10-18\ntags: [module, domain/users-settings]\n---\n# Settings\n\n## What it is\n\nInstance-wide settings: name, branding, registration, features. Stored in the database and read through one service.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controller | `app/Settings/SettingController.php` |\n| Service | `app/Settings/SettingService.php`, `app/Settings/AppSettingsStore.php` |\n| Model | `app/Settings/Setting.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Settings]] — this module's business area\n- [[Theme System]] — custom head content and theme settings are read alongside settings\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Single Sign-on":{"path":"2 Modules/Single Sign-on.md","type":"module","status":"shipped","depth":"stub","domain":"Access & Permissions","repo":"BookStack","updated":"2026-10-18","summary":"External identity: SAML2, OpenID Connect, LDAP and social providers.","aliases":[],"tags":["module","domain/access-permissions"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Access & Permissions\nupdated: 2026-10-18\ntags: [module, domain/access-permissions]\n---\n# Single Sign-on\n\n## What it is\n\nExternal identity: SAML2, OpenID Connect, LDAP and social providers. Each service maps the external identity to a user and can sync the provider's groups to roles.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| SAML2 | `app/Access/Saml2Service.php`, `app/Access/Controllers/Saml2Controller.php` |\n| OIDC | `app/Access/Oidc/OidcService.php`, `app/Access/Controllers/OidcController.php` |\n| LDAP | `app/Access/LdapService.php`, `app/Access/Ldap.php` |\n| Social | `app/Access/SocialAuthService.php`, `app/Access/Controllers/SocialController.php` |\n| Group sync | `app/Access/GroupSyncService.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Access & Permissions]] — this module's business area\n- [[Authentication]] — every SSO flow finishes through LoginService\n- [[Roles]] — GroupSyncService maps external groups to roles\n- [[Logging in with single sign-on]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Sort Rules":{"path":"2 Modules/Sort Rules.md","type":"module","status":"shipped","depth":"stub","domain":"Content","repo":"BookStack","updated":"2026-10-18","summary":"Sort rules are reusable orderings (by name, date, type) that a book can apply automatically to its chapters and pages.","aliases":[],"tags":["module","domain/content"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Content\nupdated: 2026-10-18\ntags: [module, domain/content]\n---\n# Sort Rules\n\n## What it is\n\nSort rules are reusable orderings (by name, date, type) that a book can apply automatically to its chapters and pages.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/Sorting/SortRuleController.php`, `app/Sorting/BookSortController.php` |\n| Sorter | `app/Sorting/BookSorter.php` |\n| Model | `app/Sorting/SortRule.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Content]] — this module's business area\n- [[Books]] — a book opts into a sort rule\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Tags":{"path":"2 Modules/Tags.md","type":"module","status":"shipped","depth":"stub","domain":"Activity & Integrations","repo":"BookStack","updated":"2026-10-18","summary":"Name-value tags on any entity, browsable and searchable.","aliases":[],"tags":["module","domain/activity-integrations"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Activity & Integrations\nupdated: 2026-10-18\ntags: [module, domain/activity-integrations]\n---\n# Tags\n\n## What it is\n\nName-value tags on any entity, browsable and searchable.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/Activity/Controllers/TagController.php`, `app/Activity/Controllers/TagApiController.php` |\n| Repo | `app/Activity/TagRepo.php` |\n| Model | `app/Activity/Models/Tag.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Activity & Integrations]] — this module's business area\n- [[Search]] — tags are a search filter\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Theme System":{"path":"2 Modules/Theme System.md","type":"module","status":"shipped","depth":"stub","domain":"API & Theming","repo":"BookStack","updated":"2026-10-18","summary":"A theme folder can override views, add custom head content and hook into named events without changing the application code.","aliases":[],"tags":["module","domain/api-theming"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: API & Theming\nupdated: 2026-10-18\ntags: [module, domain/api-theming]\n---\n# Theme System\n\n## What it is\n\nA theme folder can override views, add custom head content and hook into named events without changing the application code.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/Theming/ThemeService.php`, `app/Theming/ThemeEvents.php` |\n| Modules | `app/Theming/ThemeModuleManager.php`, `app/Theming/ThemeModule.php` |\n| Controller | `app/Theming/ThemeController.php` |\n| Views | `app/Theming/ThemeViews.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[API & Theming]] — this module's business area\n- [[Settings]] — custom head content is configured in settings\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"User Invites":{"path":"2 Modules/User Invites.md","type":"module","status":"shipped","depth":"stub","domain":"Access & Permissions","repo":"BookStack","updated":"2026-10-18","summary":"An admin can create a user without a password; the user receives an invite link to set one.","aliases":[],"tags":["module","domain/access-permissions"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Access & Permissions\nupdated: 2026-10-18\ntags: [module, domain/access-permissions]\n---\n# User Invites\n\n## What it is\n\nAn admin can create a user without a password; the user receives an invite link to set one.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `app/Access/UserInviteService.php` |\n| Controller | `app/Access/Controllers/UserInviteController.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Access & Permissions]] — this module's business area\n- [[Users]] — an invite completes a user record an admin created\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"User Preferences":{"path":"2 Modules/User Preferences.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Settings","repo":"BookStack","updated":"2026-10-18","summary":"Per-user choices: language, dark mode, keyboard shortcuts, notification preferences and the user's own account settings.","aliases":[],"tags":["module","domain/users-settings"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Users & Settings\nupdated: 2026-10-18\ntags: [module, domain/users-settings]\n---\n# User Preferences\n\n## What it is\n\nPer-user choices: language, dark mode, keyboard shortcuts, notification preferences and the user's own account settings.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/Users/Controllers/UserPreferencesController.php`, `app/Users/Controllers/UserAccountController.php` |\n| Stores | `app/Settings/UserNotificationPreferences.php`, `app/Settings/UserShortcutMap.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Settings]] — this module's business area\n- [[Users]] — preferences hang off the user record\n- [[Watching & Notifications]] — notification preferences decide which activity emails a user\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Users":{"path":"2 Modules/Users.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Settings","repo":"BookStack","updated":"2026-10-18","summary":"User accounts, their profile pages and the admin screens that manage them.","aliases":[],"tags":["module","domain/users-settings"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Users & Settings\nupdated: 2026-10-18\ntags: [module, domain/users-settings]\n---\n# Users\n\n## What it is\n\nUser accounts, their profile pages and the admin screens that manage them.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controllers | `app/Users/Controllers/UserController.php`, `app/Users/Controllers/UserApiController.php`, `app/Users/Controllers/UserProfileController.php`, `app/Users/Controllers/UserSearchController.php` |\n| Repo | `app/Users/UserRepo.php` |\n| Model | `app/Users/Models/User.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Settings]] — this module's business area\n- [[Roles]] — users are assigned roles\n- [[User Preferences]] — each user keeps their own preferences\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Watching & Notifications":{"path":"2 Modules/Watching & Notifications.md","type":"module","status":"shipped","depth":"stub","domain":"Activity & Integrations","repo":"BookStack","updated":"2026-10-18","summary":"Users watch a shelf, book, chapter or page at a chosen level and get emailed about updates and comments.","aliases":[],"tags":["module","domain/activity-integrations"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Activity & Integrations\nupdated: 2026-10-18\ntags: [module, domain/activity-integrations]\n---\n# Watching & Notifications\n\n## What it is\n\nUsers watch a shelf, book, chapter or page at a chosen level and get emailed about updates and comments.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controller | `app/Activity/Controllers/WatchController.php` |\n| Levels | `app/Activity/WatchLevels.php` |\n| Tools | `app/Activity/Tools/EntityWatchers.php`, `app/Activity/Tools/UserEntityWatchOptions.php` |\n| Notifications | `app/Activity/Notifications/NotificationManager.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Activity & Integrations]] — this module's business area\n- [[Activity Log]] — ActivityLogger hands every logged action to NotificationManager\n- [[User Preferences]] — a user's notification preferences gate the emails\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Webhooks":{"path":"2 Modules/Webhooks.md","type":"module","status":"shipped","depth":"stub","domain":"Activity & Integrations","repo":"BookStack","updated":"2026-10-18","summary":"Outgoing HTTP calls for chosen activity types, sent from a queued job.","aliases":[],"tags":["module","domain/activity-integrations"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: BookStack\ndomain: Activity & Integrations\nupdated: 2026-10-18\ntags: [module, domain/activity-integrations]\n---\n# Webhooks\n\n## What it is\n\nOutgoing HTTP calls for chosen activity types, sent from a queued job.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Controller | `app/Activity/Controllers/WebhookController.php` |\n| Job | `app/Activity/DispatchWebhookJob.php` |\n| Formatter | `app/Activity/Tools/WebhookFormatter.php` |\n| Models | `app/Activity/Models/Webhook.php`, `app/Activity/Models/WebhookTrackedEvent.php` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Activity & Integrations]] — this module's business area\n- [[Activity Log]] — a webhook fires from a logged activity, never directly\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Editing a page":{"path":"3 Flows/Editing a page.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"A user saves a page.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [flow]\n---\n# Editing a page\n\n## What happens\n\nA user saves a page. The save stores a revision, logs the activity, updates cross-links, and the activity fan-out notifies watchers and fires webhooks.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | PageController receives the form | `PageController::update` | [[Pages]] |\n| 2 | PageRepo updates the page | `PageRepo::update` | [[Pages]] |\n| 3 | the previous content becomes a revision | `RevisionRepo::storeNewForPage` | [[Page Revisions]] |\n| 4 | cross-links are rewritten | `ReferenceUpdater` | [[References]] |\n| 5 | the action is logged | `Activity::add` | [[Activity Log]] |\n| 6 | watchers are notified | `ActivityLogger::setNotification` | [[Watching & Notifications]] |\n| 7 | webhooks are queued | `ActivityLogger::dispatchWebhooks` | [[Webhooks]] |\n\n## Modules crossed\n\n- [[Pages]] — PageController receives the form\n- [[Page Revisions]] — the previous content becomes a revision\n- [[References]] — cross-links are rewritten\n- [[Activity Log]] — the action is logged\n- [[Watching & Notifications]] — watchers are notified\n- [[Webhooks]] — webhooks are queued\n\n## Where it breaks\n\n- The side effects hang off the activity log, so a page saved any other way (API, import) gets the same fan-out only if it logs an activity.\n"},"Exporting a book":{"path":"3 Flows/Exporting a book.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"A reader asks for a book as HTML, PDF or ZIP.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [flow]\n---\n# Exporting a book\n\n## What happens\n\nA reader asks for a book as HTML, PDF or ZIP. The formatter walks the book's chapters and pages and renders them into one contained document.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the request arrives | `BookExportController` | [[Exports]] |\n| 2 | the book's contents are walked | `ExportFormatter::bookToContainedHtml` | [[Books]] |\n| 3 | PDF is rendered from that HTML | `PdfGenerator` | [[Exports]] |\n| 4 | ZIP bundles content plus images and attachments | `ZipExportBuilder` | [[Exports]] |\n\n## Modules crossed\n\n- [[Exports]] — the request arrives\n- [[Books]] — the book's contents are walked\n\n## Where it breaks\n\n- The export respects the reader's permissions: pages the reader cannot see are left out, so two users can get different PDFs of the same book.\n"},"Logging in with single sign-on":{"path":"3 Flows/Logging in with single sign-on.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"An identity provider vouches for the user.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [flow]\n---\n# Logging in with single sign-on\n\n## What happens\n\nAn identity provider vouches for the user. The matching service maps the identity to a user, syncs groups to roles, and starts the session through the same LoginService as a password login.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the provider redirects back | `Saml2Controller / OidcController` | [[Single Sign-on]] |\n| 2 | the service validates the response | `Saml2Service / OidcService` | [[Single Sign-on]] |\n| 3 | external groups become roles | `GroupSyncService` | [[Roles]] |\n| 4 | the session starts | `LoginService` | [[Authentication]] |\n\n## Modules crossed\n\n- [[Single Sign-on]] — the provider redirects back\n- [[Roles]] — external groups become roles\n- [[Authentication]] — the session starts\n\n## Where it breaks\n\n- Group sync only runs when the provider's group attribute is configured; without it the user keeps the roles an admin set.\n"},"Entity hierarchy":{"path":"5 Platform/Entity hierarchy.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"Bookshelf, Book, Chapter and Page share one Entity base model with slugs, ownership and soft deletion; BookChild marks the levels that live inside a book.","aliases":[],"tags":["platform"],"flags":[],"inbound":1,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [platform]\n---\n# Entity hierarchy\n\n## What it is\n\nBookshelf, Book, Chapter and Page share one Entity base model with slugs, ownership and soft deletion; BookChild marks the levels that live inside a book. Most tools (cloner, parent changer, slug generator) are written once against Entity.\n\n## Connects to\n\n- [[Books]] — a Book is a container Entity\n- [[Pages]] — a Page is a BookChild Entity\n- [[Recycle Bin]] — soft deletion is what makes the bin possible\n\n## Gotchas\n\n-\n"},"Permission evaluation":{"path":"5 Platform/Permission evaluation.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"Entity permissions are flattened into a joint_permissions table by JointPermissionBuilder, and PermissionApplicator::restrictEntityQuery() joins that table into every content query, so visibility is decided in SQL rather than per row in PHP","aliases":[],"tags":["platform"],"flags":[],"inbound":2,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [platform]\n---\n# Permission evaluation\n\n## What it is\n\nEntity permissions are flattened into a joint_permissions table by JointPermissionBuilder, and PermissionApplicator::restrictEntityQuery() joins that table into every content query, so visibility is decided in SQL rather than per row in PHP.\n\n## Connects to\n\n- [[Entity Permissions]] — the overrides that get flattened\n- [[Search]] — search results go through the same query restriction\n\n## Gotchas\n\n-\n"},"Side effects hang off the activity log":{"path":"6 Decisions/Side effects hang off the activity log.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"Notifications and webhooks are triggered from ActivityLogger::add(), not from the repositories that change content.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-18\nupdated: 2026-10-18\ntags: [decision]\n---\n# Side effects hang off the activity log\n\n## Decision\n\nNotifications and webhooks are triggered from ActivityLogger::add(), not from the repositories that change content.\n\n## Context\n\nObserved in the code while seeding this vault; reason not recorded by the project itself.\n\n## Why this and not the alternative\n\nEvery content change already logs an activity for the audit trail; reusing that single point means a new activity type gets notifications and webhooks for free, and an unlogged change gets neither.\n\n## Consequences\n\nA content change made without logging an activity produces no notification and no webhook.\n\n## Affects\n\n- [[Activity Log]] — the single fan-out point\n- [[Webhooks]] — fired from the logger\n- [[Watching & Notifications]] — notified from the logger\n"},"BookStack":{"path":"8 Repos/BookStack.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"BookStack","updated":"2026-10-18","summary":"BookStack is an open-source wiki platform (MIT) organised as shelves, books, chapters and pages.","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: BookStack\nupdated: 2026-10-18\ntags: [repo]\n---\n# BookStack\n\n## What it is\n\nBookStack is an open-source wiki platform (MIT) organised as shelves, books, chapters and pages. This vault is a demo map of its codebase, seeded from the directory structure and verified against the code where a note claims a call.\n\n## Where it lives\n\n`github.com/BookStackApp/BookStack`, a Laravel application: controllers, repos and models grouped by area under `app/`, routes in `routes/web.php` and `routes/api.php`, Blade views under `resources/views`.\n\n## How it works\n\nEach area under `app/` (Entities, Access, Permissions, Search, Activity, Uploads, Exports, Api, Theming) is one or more modules in this vault. Business logic sits in `*Repo` and `*Service` classes; controllers stay thin.\n\n## Connects to\n\n- [[Home]] — the entry page lists the domains\n- [[Entity hierarchy]] — the base model every content type shares\n- [[Permission evaluation]] — how visibility is decided\n\n## Gotchas\n\n- The `version` file is the running version; the changelog lives in the project's release notes, not in the repo.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"A living map of how BookStack is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# BookStack — the world\n\nA living map of how BookStack is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[BookStack]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Content]] | Shelves, books, chapters and pages |\n| [[Access & Permissions]] | Who can log in and what they may see |\n| [[Users & Settings]] | User accounts, preferences, instance settings, maintenance and the audit log. |\n| [[Search & References]] | Finding content |\n| [[Media]] | Images and file attachments stored alongside content. |\n| [[Activity & Integrations]] | What happened and who should hear about it |\n| [[Export & Import]] | Getting content out as HTML, PDF or ZIP, and bringing ZIP exports back in. |\n| [[API & Theming]] | The REST API and the theme system that customises the instance. |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[Editing a page]] — A user saves a page\n- [[Logging in with single sign-on]] — An identity provider vouches for the user\n- [[Exporting a book]] — A reader asks for a book as HTML, PDF or ZIP\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n[[Permission evaluation]] · [[Entity hierarchy]]\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Side effects hang off the activity log]] — Notifications and webhooks are triggered from ActivityLogger::add(), not from the repositories that change content.\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/vault:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**0 of 33 module notes are `full`.** 54 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n\n## Stub — promote on next touch\n\n- [[Activity Log]] — Activity & Integrations\n- [[Attachments]] — Media\n- [[Audit Log]] — Users & Settings\n- [[Authentication]] — Access & Permissions\n- [[Books]] — Content\n- [[Bookshelves]] — Content\n- [[Chapters]] — Content\n- [[Comments]] — Activity & Integrations\n- [[Entity Permissions]] — Access & Permissions\n- [[Exports]] — Export & Import\n- [[Favourites]] — Activity & Integrations\n- [[Images]] — Media\n- [[Import]] — Export & Import\n- [[Maintenance]] — Users & Settings\n- [[Multi-factor Authentication]] — Access & Permissions\n- [[Page Revisions]] — Content\n- [[Page Templates]] — Content\n- [[Pages]] — Content\n- [[REST API]] — API & Theming\n- [[Recycle Bin]] — Content\n- [[References]] — Search & References\n- [[Roles]] — Access & Permissions\n- [[Search]] — Search & References\n- [[Settings]] — Users & Settings\n- [[Single Sign-on]] — Access & Permissions\n- [[Sort Rules]] — Content\n- [[Tags]] — Activity & Integrations\n- [[Theme System]] — API & Theming\n- [[User Invites]] — Access & Permissions\n- [[User Preferences]] — Users & Settings\n- [[Users]] — Users & Settings\n- [[Watching & Notifications]] — Activity & Integrations\n- [[Webhooks]] — Activity & Integrations\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/vault:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-18","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-18\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-18 · Start the BookStack knowledge vault · `89fd006` · 8 Repos: BookStack; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"API & Theming","to":"REST API","reason":"A token-authenticated REST API over the same controllers' API variants, with generated docs"},{"from":"API & Theming","to":"Theme System","reason":"A theme folder can override views, add custom head content and hook into named events without changing the application code"},{"from":"Access & Permissions","to":"En Entity hierarchy","to":"Recycle Bin","reason":"soft deletion is what makes the bin possible"},{"from":"Permission evaluation","to":"Entity Permissions","reason":"the overrides that get flattened"},{"from":"Permission evaluation","to":"Search","reason":"search results go through the same query restriction"},{"from":"Side effects hang off the activity log","to":"Activity Log","reason":"the single fan-out point"},{"from":"Side effects hang off the activity log","to":"Webhooks","reason":"fired from the logger"},{"from":"Side effects hang off the activity log","to":"Watching & Notifications","reason":"notified from the logger"},{"from":"BookStack","to":"Home","reason":"the entry page lists the domains"},{"from":"BookStack","to":"Entity hierarchy","reason":"the base model every content type shares"},{"from":"BookStack","to":"Permission evaluation","reason":"how visibility is decided"},{"from":"Home","to":"Editing a page","reason":"A user saves a page"},{"from":"Home","to":"Logging in with single sign-on","reason":"An identity provider vouches for the user"},{"from":"Home","to":"Exporting a book","reason":"A reader asks for a book as HTML, PDF or ZIP"},{"from":"Home","to":"Side effects hang off the activity log","reason":"Notifications and webhooks are triggered from ActivityLogger::add(), not from the repositories that change content"}],"aliases":{}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
const COLORS = [
  ['module', '#e8832a', 'module'], ['stub', '#708090', 'stub'], ['deprecated', '#9b1c1c', 'deprecated'],
  ['domain', '#e0609a', 'domain'], ['flow', '#3aa65b', 'flow'], ['integration', '#3b7ddd', 'integration'],
  ['platform', '#8e5bd6', 'platform'], ['decision', '#d9b400', 'decision'], ['release', '#8d8d8d', 'release'],
  ['repo', '#2a9d8f', 'repo'], ['meta', '#b5b5b5', 'other']];
const COLOR = Object.fromEntries(COLORS.map(c => [c[0], c[1]]));
const colorOf = n => n.status === 'deprecated' ? COLOR.deprecated : n.depth === 'stub' ? COLOR.stub : (COLOR[n.type] || COLOR.meta);

// --- data shaping ----------------------------------------------------------
const nodes = Object.keys(data.notes).sort().map(id => Object.assign({id: id}, data.notes[id]));
const byId = new Map(nodes.map(n => [n.id, n]));
const pairs = new Map();            // one drawn line per unordered pair; every reason kept
for (const l of data.links) {
  const k = l.from < l.to ? l.from + '\u0001' + l.to : l.to + '\u0001' + l.from;
  let p = pairs.get(k);
  if (!p) { p = {source: l.from, target: l.to, reasons: []}; pairs.set(k, p); }
  p.reasons.push(l);
}
const links = Array.from(pairs.values());
const degree = new Map();
for (const l of links) { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); }
const radius = n => 4 + Math.sqrt(degree.get(n.id) || 0) * 1.6;
const lookup = new Map();           // lowercased name or alias -> id
for (const n of nodes) { lookup.set(n.id.toLowerCase(), n.id); for (const a of n.aliases || []) lookup.set(String(a).toLowerCase(), n.id); }
for (const a in data.aliases) if (byId.has(data.aliases[a])) lookup.set(a.toLowerCase(), data.aliases[a]);
const resolve = name => lookup.get(name.trim().toLowerCase()) || null;

document.getElementById('stats').textContent = nodes.length + ' notes · ' + data.links.length + ' links · ' + data.vault + (data.built_at ? ' · built ' + data.built_at : '');
document.getElementById('legend').innerHTML = COLORS.map(c => '<span style="--c:' + c[1] + '">' + c[2] + '</span>').join('');

// --- graph -----------------------------------------------------------------
const svg = d3.select('#graph');
const g = svg.append('g');
const tip = document.getElementById('tip');
const moveTip = e => { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 400) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); };
const hideTip = () => { tip.style.display = 'none'; };

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
// A wide transparent twin of each edge is the hover target: a 1px line is unhoverable.
const hit = g.append('g').attr('class', 'hits').selectAll('line').data(links).join('line')
  .on('mouseenter', (e, d) => { d.el.classList.add('hover'); showTip(e, d.reasons.map(r => '<b>' + esc(r.from) + '</b> → <b>' + esc(r.to) + '</b>' + (r.reason ? ': ' + esc(r.reason) : '')).join('<br>')); })
  .on('mousemove', moveTip).on('mouseleave', (e, d) => { d.el.classList.remove('hover'); hideTip(); });
link.each(function (d) { d.el = this; });
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
  .on('click', (e, d) => { e.stopPropagation(); select(d.id, false); })
  .on('mouseenter', (e, d) => showTip(e, '<b>' + esc(d.id) + '</b> <small>' + esc([d.type, d.status, d.depth].filter(Boolean).join(' · ')) + '</small>' + (d.summary ? '<br>' + esc(d.summary) : '')))
  .on('mousemove', moveTip).on('mouseleave', hideTip);
node.append('circle').attr('r', radius).attr('fill', colorOf);
node.append('text').attr('dx', d => radius(d) + 3).attr('dy', '0.35em').text(d => d.id);

const draw = () => {
  for (const s of [link, hit]) s.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .force('center', d3.forceCenter(0, 0))
  .force('x', d3.forceX(0).strength(0.04))   // keep unlinked notes near the rest
  .force('y', d3.forceY(0).strength(0.04))
  .on('tick', draw)
  .stop();
sim.tick(300);                      // settle synchronously: first paint is the final layout
draw();

const zoom = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => {
  g.attr('transform', e.transform);
  node.selectAll('text').style('display', e.transform.k < 0.55 ? 'none' : null);
});
svg.call(zoom).on('click', () => select(null));
let fitted = true;
fit(false);                         // first paint lands fitted; later fits animate

function size() {               // falls back to the window: a hidden page reports a 0x0 svg
  const r = svg.node().getBoundingClientRect();
  return [r.width || window.innerWidth, r.height || window.innerHeight];
}
function fit(animate = true) {
  const [w, h] = size();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const k = Math.min(1, 0.9 * Math.min(w / (x1 - x0 + 1), h / (y1 - y0 + 1)));
  if (!(k > 0 && isFinite(k))) { fitted = false; return; }   // retried on the next resize
  const target = d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, target);
}
function centerOn(n) {
  const [w, h] = size(), k = Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
}
window.addEventListener('resize', () => { if (!fitted && sim.alpha() < sim.alphaMin()) { fitted = true; fit(); } });
function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }

// --- selection, search, dimming ---------------------------------------------
let selected = null;
function focus(set) {               // ids to keep bright, or null for all
  node.classed('dim', d => !!set && !set.has(d.id)).classed('sel', d => d.id === selected);
  link.classed('dim', d => !!set && !(set.has(d.source.id) && set.has(d.target.id)))
      .classed('hot', d => !!selected && (d.source.id === selected || d.target.id === selected));
}
function neighbours(id) {           // [dir, other, reason], reasoned first, deduplicated
  const out = [], seen = new Set();
  for (const l of data.links) {
    const r = l.from === id ? ['→', l.to, l.reason] : l.to === id ? ['←', l.from, l.reason] : null;
    if (!r) continue;
    const k = r.join('\u0001');
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((a, b) => (a[2] == null) - (b[2] == null) || (a[0] > b[0]) - (a[0] < b[0]) || a[1].localeCompare(b[1]));
}
function focusSelected() {
  focus(selected ? new Set([selected].concat(neighbours(selected).map(x => x[1]))) : null);
}
const panel = document.getElementById('panel');
const obsidianUrl = n => 'obsidian://open?vault=' + encodeURIComponent(data.vault) + '&file=' + encodeURIComponent(n.path.replace(/\.md$/, ''));
function select(id, center) {
  selected = id;
  focusSelected();
  if (!id) { panel.className = 'empty'; panel.textContent = 'Click a node to read its note. Hover an edge for the link reason.'; return; }
  const n = byId.get(id), nb = neighbours(id);
  const meta = [n.type, n.status, n.depth, n.domain, n.repo, n.updated && 'updated ' + n.updated].filter(Boolean).map(esc).join(' · ');
  panel.className = '';
  panel.innerHTML = '<h2>' + esc(id) + '</h2><div class="meta">' + meta + '<br><a href="' + obsidianUrl(n) + '" title="Open in Obsidian">' + esc(n.path) + '</a></div>'
    + '<div class="body">' + md(n.body || n.summary || '') + '</div>'
    + '<div class="nb"><h3>Neighbours (' + nb.length + ')</h3><ul>'
    + nb.map(x => '<li>' + x[0] + ' <a href="#" data-node="' + esc(x[1]) + '">' + esc(x[1]) + '</a>' + (x[2] ? ' <span class="r">— ' + esc(x[2]) + '</span>' : '') + '</li>').join('')
    + '</ul></div>';
  panel.scrollTop = 0;
  if (center) centerOn(n);
}
panel.addEventListener('click', e => {
  const a = e.target.closest('a[data-node]');
  if (a) { e.preventDefault(); select(a.dataset.node, true); }
});

const q = document.getElementById('q'), hits = document.getElementById('hits');
function matches(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  return nodes.filter(n => n.id.toLowerCase().includes(t) || (n.aliases || []).some(a => String(a).toLowerCase().includes(t)));
}
q.addEventListener('input', () => {
  const m = matches(q.value);
  if (!m) { hits.innerHTML = ''; focusSelected(); return; }
  focus(new Set(m.map(n => n.id)));
  hits.innerHTML = m.slice(0, 30).map(n => '<li data-node="' + esc(n.id) + '">' + esc(n.id) + ' <small>' + esc(n.type || '') + '</small></li>').join('') || '<li><small>no matches</small></li>';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const m = matches(q.value); if (m && m.length) { select(m[0].id, true); hits.innerHTML = ''; } }
  if (e.key === 'Escape') { q.value = ''; hits.innerHTML = ''; focusSelected(); }
});
hits.addEventListener('click', e => { const li = e.target.closest('li[data-node]'); if (li) { select(li.dataset.node, true); hits.innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.innerHTML = ''; });

// --- minimal markdown --------------------------------------------------------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  const out = [];
  const keep = html => { out.push(html); return '\u0002' + (out.length - 1) + '\u0003'; };
  s = s.replace(/`([^`]+)`/g, (m, c) => keep('<code>' + esc(c) + '</code>'))
       .replace(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, a) => {
         const id = resolve(t), label = esc(a || t);
         return keep(id ? '<a href="#" data-node="' + esc(id) + '">' + label + '</a>' : '<span class="dead">' + label + '</span>');
       });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0003/g, (m, i) => out[i]);
}
function md(text) {
  const lines = text.replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n');
  const html = [];
  let i = 0, list = null, para = [], m;
  const flushPara = () => { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  const cells = r => r.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => inline(c.replace(/\\\|/g, '|').trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushPara(); closeList(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      flushPara(); closeList();
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      html.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => (k ? '<td>' : '<th>') + c + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {     // ponytail: nested lists flattened
      flushPara();
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); list = kind; html.push('<' + kind + '>'); }
      html.push('<li>' + inline(m[2]) + '</li>'); i++; continue;
    }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    closeList(); para.push(line); i++;
  }
  flushPara(); closeList();
  return html.join('\n');
}
})();
</script>
<script>(function () {  // open one note on arrival
  var t = [].find.call(document.querySelectorAll('.node text'), function (x) { return x.textContent === "Editing a page"; });
  if (t) t.parentNode.dispatchEvent(new MouseEvent('click', {bubbles: true}));
})();</script>
