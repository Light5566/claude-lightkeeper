 |\n| 6 | the merge commit is recorded, then pushed to the base repository with the PR ID in the environment | `doMergeAndPush` | [[Merging]] |\n| 7 | if the merger cannot push to the protected branch directly, pre-receive rechecks merge permission, status checks and reviews | `preReceiveBranch` | [[Branches & Protection]] |\n| 8 | post-receive handles the push like any other | `HookPostReceive` | [[Push Hooks]] |\n| 9 | the pull request is marked merged and its issue closed in one transaction | `MarkAsMerged` | [[Pull Request Lifecycle]] |\n| 10 | the merge is announced to every notifier | `notify_service.MergePullRequest` | [[Notifier fan-out]] |\n| 11 | issues referenced with closing keywords are closed | `handleCloseCrossReferences` | [[Issues & Comments]] |\n\n## Modules crossed\n\n- [[Pull Request Lifecycle]] — the merge form arrives\n- [[Merging]] — permission, work in progress, conflicts, branch protection, signing and dependencies are checked\n- [[Auto-merge]] — with merge when checks succeed, the merge is scheduled instead\n- [[Branches & Protection]] — if the merger cannot push to the protected branch directly, pre-receive rechecks merge permission, status checks and reviews\n- [[Push Hooks]] — post-receive handles the push like any other\n- [[Notifier fan-out]] — the merge is announced to every notifier\n- [[Issues & Comments]] — issues referenced with closing keywords are closed\n\n## Where it breaks\n\n- The push is the point of no return. `recordMergeIntent` stores the merge commit before pushing; if the push fails, `clearMergeIntent` runs only when the commit is verifiably absent from the base branch, and if the server stops between the push and `MarkAsMerged`, the mergeability checker finishes the job later (`restoreInterruptedMerge`). After `MarkAsMerged`, errors in notifications and in closing referenced issues are only logged.\n"},"Pushing to a repository":{"path":"3 Flows/Pushing to a repository.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"A `git push` over SSH or HTTP.","aliases":[],"tags":["flow"],"flags":[],"inbound":4,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [flow]\n---\n# Pushing to a repository\n\n## What happens\n\nA `git push` over SSH or HTTP. Git runs Gitea's hook scripts, which call back into the server: pre-receive enforces branch protection, post-receive syncs the branch table and queues the push, and a queue worker announces it to the feed, webhooks, Actions, the code indexer and push mirrors.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | pre-receive checks every ref; one rejection fails the push | `HookPreReceive` | [[Branches & Protection]] |\n| 2 | after git writes the refs, the hook process posts them to the internal API in batches of 500 | `runHookPostReceive` | [[Push Hooks]] |\n| 3 | branch and tag updates are kept, branches synced to the `branch` table, the rest queued | `HookPostReceive` | [[Push Hooks]] |\n| 4 | the queue worker loads the new commits | `pushQueueHandleUpdates` | [[Push Hooks]] |\n| 5 | open pull requests from the pushed branch are retested | `pull_service.AddTestPullRequestTask` | [[Mergeability Checks]] |\n| 6 | issues named in commit messages get reference comments; closing keywords on the default branch close them | `issue_service.UpdateIssuesCommit` | [[Issues & Comments]] |\n| 7 | every registered notifier receives the push | `notify_service.PushCommits` | [[Notifier fan-out]] |\n| 8 | feed rows are written for the pusher and watchers | `actionNotifier.PushCommits` | [[Activity Feed]] |\n| 9 | matching webhooks get hook tasks | `webhookNotifier.PushCommits` | [[Webhooks]] |\n| 10 | workflows on the pushed commit are detected | `actionsNotifier.PushCommits` | [[Workflow Runs]] |\n| 11 | push mirrors that sync on commit are queued | `mirrorNotifier.PushCommits` | [[Mirrors]] |\n\n## Modules crossed\n\n- [[Branches & Protection]] — pre-receive checks every ref; one rejection fails the push\n- [[Push Hooks]] — after git writes the refs, the hook process posts them to the internal API in batches of 500\n- [[Mergeability Checks]] — open pull requests from the pushed branch are retested\n- [[Issues & Comments]] — issues named in commit messages get reference comments; closing keywords on the default branch close them\n- [[Notifier fan-out]] — every registered notifier receives the push\n- [[Activity Feed]] — feed rows are written for the pusher and watchers\n- [[Webhooks]] — matching webhooks get hook tasks\n- [[Workflow Runs]] — workflows on the pushed commit are detected\n- [[Mirrors]] — push mirrors that sync on commit are queued\n\n## Where it breaks\n\n- Everything after the refs are written is best effort. `HookPostReceive` logs errors instead of failing the push, and the fan-out runs later from the `push_update` queue, so a push can succeed while its feed entries, webhooks or workflow runs never appear.\n"},"Running a workflow job":{"path":"3 Flows/Running a workflow job.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"A workflow job goes from a repository event to a runner.","aliases":[],"tags":["flow"],"flags":[],"inbound":3,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [flow]\n---\n# Running a workflow job\n\n## What happens\n\nA workflow job goes from a repository event to a runner. Runs and jobs are inserted when the event arrives, a version counter tells polling runners that work is waiting, and the first runner whose labels match claims the job.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | a detected workflow becomes a run; fork pull request runs from untrusted users wait for approval | `buildApproveAndInsertRun` | [[Workflow Runs]] |\n| 2 | jobs are parsed and inserted, and the tasks version is bumped if any job is waiting | `InsertRun` | [[Workflow Runs]] |\n| 3 | the counter goes up for the instance, the owner and the repository | `IncreaseTaskVersion` | [[Runners]] |\n| 4 | a runner polls with its last version; an equal version returns no task | `FetchTask` | [[Runners]] |\n| 5 | a semaphore bounds how many runners pick at once | `TryPickTask` | [[Runners]] |\n| 6 | waiting jobs are scanned oldest first and the first whose labels match is claimed | `CreateTaskForRunner` | [[Runners]] |\n| 7 | the commit gets a running status | `CreateCommitStatusForRunJobs` | [[Commit Statuses]] |\n| 8 | the runner reports state, outputs and results | `UpdateTask` | [[Runners]] |\n| 9 | the job emitter resolves `needs` and releases the next jobs | `EmitJobsIfReadyByRun` | [[Workflow Runs]] |\n\n## Modules crossed\n\n- [[Workflow Runs]] — a detected workflow becomes a run; fork pull request runs from untrusted users wait for approval\n- [[Runners]] — the counter goes up for the instance, the owner and the repository\n- [[Commit Statuses]] — the commit gets a running status\n\n## Where it breaks\n\n- Jobs whose `runs-on` labels no runner carries are skipped by `CanMatchLabels` without any message and sit waiting until `cancel_abandoned_jobs` cancels them after `ABANDONED_JOB_TIMEOUT`. Assignment also depends on the tasks version: a code path that makes a job waiting without `IncreaseTaskVersion` leaves idle runners asleep.\n"},"Layers: routers, services, models":{"path":"5 Platform/Layers: routers, services, models.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"The backend follows one dependency direction, written down in `docs/guidelines-backend.md`: `cmd` to `routers` to `services` to `models` to `modules`, never the reverse.","aliases":[],"tags":["platform"],"flags":[],"inbound":2,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [platform]\n---\n# Layers: routers, services, models\n\n## What it is\n\nThe backend follows one dependency direction, written down in `docs/guidelines-backend.md`: `cmd` to `routers` to `services` to `models` to `modules`, never the reverse. `routers` hold HTTP handlers in four trees: `routers/web` for the HTML UI, `routers/api/v1` for the REST API, `routers/private` for the internal API that git hooks and `gitea serv` call, and `routers/install`. `services` hold business logic and side effects such as notifications; `models` hold XORM structs and queries, one package per area; `modules` are shared libraries (git, settings, queues, storage). Most features therefore appear once per layer, for example `routers/web/repo/pull.go`, `services/pull/pull.go` and `models/issues/pull.go`.\n\n## Connects to\n\n- [[Push Hooks]] — the internal API in `routers/private` is what the hook processes call\n- [[Merging]] — `Merge` in the service layer relies on its callers to have run `CheckPullMergeable`\n- [[Repository Permissions]] — routers get the actor's permission from `services/context/repo.go` before calling services\n\n## Gotchas\n\n- The service layer does not always repeat the router's checks. `Merge` in `services/pull/merge.go` says its caller should check the pull request is ready; the web handler, the API handler and the auto-merge worker each call `CheckPullMergeable` first, and a new caller has to as well.\n- `gitea hook` and `gitea serv` are separate processes that reach `routers/private` over HTTP at `LOCAL_ROOT_URL` (`setting.LocalURL`, by default the local HTTP address and port), authenticated by `InternalToken`. If that URL does not reach the running server, pushes fail in the hook.\n"},"Notifier fan-out":{"path":"5 Platform/Notifier fan-out.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Most side effects of a domain event (a push, a new issue, a merged pull request, a finished workflow job) are not called directly by the code that raises it.","aliases":[],"tags":["platform"],"flags":[],"inbound":13,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [platform]\n---\n# Notifier fan-out\n\n## What it is\n\nMost side effects of a domain event (a push, a new issue, a merged pull request, a finished workflow job) are not called directly by the code that raises it. Services call one function in `services/notify/notify.go`, such as `notify_service.PushCommits`, and it loops over every `Notifier` added with `RegisterNotifier`. Each subscriber (`feed`, `webhook`, `actions`, `uinotification`, `mailer`, `indexer`, `mirror`, `automerge`, `audit`, `websocket`) embeds `NullNotifier` and overrides only the events it cares about. Subscribers push slow work onto named queues: `webhook_sender`, `notification-service`, `mail` and `pr_auto_merge`, which are on-disk `level` queues by default.\n\n## Connects to\n\n- [[Push Hooks]] — the push queue worker raises `PushCommits`, `CreateRef` and `DeleteRef`\n- [[Webhooks]] — a subscriber that turns events into hook tasks\n- [[Workflow Runs]] — a subscriber that turns events into workflow runs\n- [[Notifications]] — a subscriber that writes inbox rows\n\n## Gotchas\n\n- Registration differs per subscriber: webhook, mirror and audit register in a Go `init()`, the rest from their `Init` during `InitWebInstalled`, and some only when their feature is on (mail with `ENABLE_NOTIFY_MAIL` and a configured mailer, Actions when enabled).\n- Each dispatch function defers `recoverPanic` once around its loop, so a panic in one notifier is logged and the notifiers after it in the list never see that event.\n- Notifiers run on the caller's goroutine in registration order. Slow work inside one (the Actions notifier reads workflow files from git) delays the web request or queue worker that raised the event.\n"},"Merges are pushed through the git hooks":{"path":"6 Decisions/Merges are pushed through the git hooks.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A pull request merge is made in a temporary clone and pushed to the base repository with `git push`, carrying the pull request ID in `GITEA_PR_ID`, rather than by moving the branch directly.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Merges are pushed through the git hooks\n\n## Decision\n\nA pull request merge is made in a temporary clone and pushed to the base repository with `git push`, carrying the pull request ID in `GITEA_PR_ID`, rather than by moving the branch directly.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nWhat it gets: branch protection is enforced in one place, `HookPreReceive`, which has a dedicated path for merges (it rechecks `IsUserAllowedToMerge` and `CheckPullBranchProtections` when the merger could not push directly), and the push events and feed entries for a merge come from the same post-receive pipeline as a user's push.\n\n## Consequences\n\nA merge costs a clone and a push and holds the per-pull-request lock throughout. The comment on the push in `doMergeAndPush` notes that it triggers a call to the post-receive endpoint and that merge database work belongs outside it to avoid a deadlock. `Merge` also starts `AddTestPullRequestTask` directly, a call the code marks as a duplicate of what the push queue does.\n\n## Affects\n\n- [[Merging]] — where the push happens\n- [[Push Hooks]] — both hooks run for the merge push\n- [[Branches & Protection]] — the rules the merge push is checked against\n"},"Runners poll against a task version":{"path":"6 Decisions/Runners poll against a task version.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Runners poll `FetchTask`, and the server scans for waiting jobs only when the tasks version a runner sends differs from the version stored for its scope.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Runners poll against a task version\n\n## Decision\n\nRunners poll `FetchTask`, and the server scans for waiting jobs only when the tasks version a runner sends differs from the version stored for its scope.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nWhat the design buys: an idle runner's poll costs one version lookup instead of a scan of the waiting jobs.\n\n## Consequences\n\nCorrectness depends on the bump. `InsertRun`, job status changes in `models/actions/run_job.go`, reruns and enabling or disabling a runner all call `IncreaseTaskVersion`, and the comment in `models/actions/run_job.go` explains that without the bump on job completion idle runners would skip `PickTask`. A throttled pick hands the runner its old version back so that it retries on the next poll.\n\n## Affects\n\n- [[Runners]] — the polling side\n- [[Workflow Runs]] — inserting runs is the main source of bumps\n"},"gitea":{"path":"8 Repos/gitea.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Gitea is a self-hosted git service written in Go (MIT): repositories, issues, pull requests, a package registry and a built-in CI (Actions) that reads GitHub Actions-style workflow files.","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [repo]\n---\n# gitea\n\n## What it is\n\nGitea is a self-hosted git service written in Go (MIT): repositories, issues, pull requests, a package registry and a built-in CI (Actions) that reads GitHub Actions-style workflow files. This vault is a demo map of its codebase; every note was checked against the code at the pinned commit of `main`.\n\n## Where it lives\n\ngithub.com/go-gitea/gitea, production branch `main`. One Go binary built from `main.go`, with subcommands in `cmd` (`web`, `serv`, `hook`, `admin`, `doctor` and more). Backend code is split into `routers`, `services`, `models` and `modules`; HTML templates are in `templates`, the frontend in `web_src`, and configuration defaults are documented in `custom/conf/app.example.ini`. `make help` lists the build targets and the developer docs are in `docs`.\n\n## How it works\n\nOne process serves the web UI, the REST API at `/api/v1`, the package registry at `/api/packages`, the runner API at `/api/actions` and the internal API at `/api/internal` that git hooks and `gitea serv` call (`NormalRoutes` in `routers/init.go`). Events fan out through [[Notifier fan-out]]; long work runs on named queues and scheduled work on [[Cron Tasks]]. [[Layers: routers, services, models]] describes the dependency direction.\n\n## Connects to\n\n- [[Home]] — the entry page lists the domains\n- [[Layers: routers, services, models]] — how the packages depend on each other\n- [[Notifier fan-out]] — how one event reaches webhooks, feeds, mail and Actions\n\n## Gotchas\n\n- There is no changelog file in the tree: `cliff.toml` groups Conventional Commit messages (`feat`, `enhance`, `fix` and others) into release notes, and `docs/release-management.md` covers the release cycle.\n- The Go module is named gitea.dev (see `go.mod`), so import paths start with gitea.dev rather than the GitHub URL.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A living map of how Gitea is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Gitea — the world\n\nA living map of how Gitea is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[gitea]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Code]] | Repositories and everything git |\n| [[Issues]] | Issues and what organises them |\n| [[Pull Requests]] | Proposing, reviewing and merging changes |\n| [[Actions]] | The built-in CI |\n| [[Packages]] | The package registry |\n| [[Users & Organizations]] | Who owns things and who may touch them |\n| [[Authentication]] | How a request proves who it is |\n| [[Notifications & Webhooks]] | Telling people and systems what happened |\n| [[Site Administration]] | Instance-wide upkeep for administrators |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[Pushing to a repository]] — A `git push` over SSH or HTTP\n- [[Merging a pull request]] — A user presses the merge button\n- [[Running a workflow job]] — A workflow job goes from a repository event to a runner\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n- [[Notifier fan-out]] · [[Layers: routers, services, models]]\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Merges are pushed through the git hooks]] — A pull request merge is made in a temporary clone and pushed to the base repository with `git push`, carrying the pull request ID in `GITEA_PR_ID`, rather than by moving the branch directly\n- [[Runners poll against a task version]] — Runners poll `FetchTask`, and the server scans for waiting jobs only when the tasks version a runner sends differs from the version stored for its scope\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/vault:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**4 of 36 module notes are `full`.** 59 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n- [[Cron Tasks]] — Site Administration\n- [[Push Hooks]] — Code\n- [[Runners]] — Actions\n- [[Webhooks]] — Notifications & Webhooks\n\n## Stub — promote on next touch\n\n- [[AGit Flow]] — Pull Requests\n- [[Access Tokens & OAuth2]] — Authentication\n- [[Activity Feed]] — Notifications & Webhooks\n- [[Artifacts]] — Actions\n- [[Audit Log]] — Site Administration\n- [[Auto-merge]] — Pull Requests\n- [[Branches & Protection]] — Code\n- [[Code Review]] — Pull Requests\n- [[Commit Statuses]] — Code\n- [[Email]] — Notifications & Webhooks\n- [[Git LFS]] — Code\n- [[Git over HTTP and SSH]] — Code\n- [[Issues & Comments]] — Issues\n- [[Labels & Milestones]] — Issues\n- [[Mergeability Checks]] — Pull Requests\n- [[Merging]] — Pull Requests\n- [[Mirrors]] — Code\n- [[Notifications]] — Notifications & Webhooks\n- [[Organizations & Teams]] — Users & Organizations\n- [[Package Registry]] — Packages\n- [[Projects]] — Issues\n- [[Pull Request Lifecycle]] — Pull Requests\n- [[Releases]] — Code\n- [[Repositories]] — Code\n- [[Repository Permissions]] — Users & Organizations\n- [[SSH & GPG Keys]] — Users & Organizations\n- [[Search Indexers]] — Code\n- [[Secrets & Variables]] — Actions\n- [[Sign-in]] — Authentication\n- [[Users]] — Users & Organizations\n- [[Wiki]] — Code\n- [[Workflow Runs]] — Actions\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/vault:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-19 · Seed the Gitea map: 9 domains, 36 modules, 3 flows, 2 platform notes, 2 decisions · `01749b9` · 1 Domains: Actions, Authentication, Code, Issues, Notifications & Webhooks, Packages (+3); 2 Modules: AGit Flow, Access Tokens & OAuth2, Activity Feed, Artifacts, Audit Log, Auto-merge (+30); 3 Flows: Merging a pull request, Pushing to a repository, Running a workflow job; 5 Platform: Layers: routers, services, models, Notifier fan-out; 6 Decisions: Merges are pushed through the git hooks, Runners poll against a task version; 8 Repos: gitea; .: Home\n- 2026-10-19 · Start the Gitea knowledge vault · `3d5d2ab` · 8 Repos: gitea; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"Actions","to":"Workflow Runs","reason":"Turning repository events into workflow runs"},{"from":"Actions","to":"Runners","reason":"The machines that execute jobs"},{"from":"Actions","to":"Artifacts","reason":"Files uploaded by workflow jobs, through either the older pipeline-style API under /api/actions_pipeline or the v4 API served by ArtifactsV4Routes"},{"from":"Actions","to":"Secrets & Variables","reason":"Values that workflows read"},{"from":"Authentication","to":"Sign-in","reason":"Who a request is from"},{"from":"Authentication","to":"Access Tokens & OAuth2","reason":"Personal access tokens with scopes, and Gitea as an OAuth2 and OpenID Connect provider for other applications"},{"from":"Code","to":"Repositories","reason":"A repository is a Repository row plus a git directory on disk"},{"from":"Code","to":"Git over HTTP and SSH","reason":"Clone, fetch and push over smart HTTP and over SSH"},{"from":"Code","to":"Push Hooks","reason":"What happens when git receives a push"},{"from":"Code","to":"Branches & Protection","reason":"Branch lists come from a branch table that SyncBranchesToDB updates on every push, not from git"},{"from":"Code","to":"Commit Statuses","reason":"Build and check results attached to a commit, posted by Actions or by outside CI through the API"},{"from":"Code","to":"Git LFS","reason":"Large files through the Git LFS batch API, plus file locks"},{"from":"Code","to":"Mirrors","reason":"Pull mirrors fetch a remote repository on a schedule and are read-only; push mirrors push this repository to a remote"},{"from":"Code","to":"Releases","reason":"Releases and tags share the release table: a pushed tag with no release still gets a row with IsTag set"},{"from":"Code","to":"Wiki","reason":"The wiki is a second git repository beside the code one (\u003cname>.wiki)"},{"from":"Code","to":"Search Indexers","reason":"Full-text search for issues and code"},{"from":"Issues","to":"Issues & Comments","reason":"Issues and the comment timeline"},{"from":"Issues","to":"Labels & Milestones","reason":"Labels belong to a repository or to an organization (OrgID)"},{"from":"Issues","to":"Projects","reason":"Kanban boards with columns"},{"from":"Notifications & Webhooks","to":"Webhooks","reason":"Outgoing HTTP calls on repository, organization and system events, in the Gitea format or the message format of a chat service"},{"from":"Notifications & Webhooks","to":"Notifications","reason":"The in-app inbox for issue and pull request activity and pending repository transfers"},{"from":"Notifications & Webhooks","to":"Email","reason":"Outgoing mail for account events and for issue, pull request, release and workflow activity, queued on mail and sent by SMTP or sendmail"},{"from":"Notifications & Webhooks","to":"Activity Feed","reason":"The dashboard and profile timelines and their RSS and Atom feeds"},{"from":"Packages","to":"Package Registry","reason":"A registry that speaks each package manager's own protocol (npm, Maven, PyPI, container images and many more, one folder each under routers/api/packages) at /api/packages, with the container registry at /v2, which has to sit at the site root"},{"from":"Pull Requests","to":"Pull Request Lifecycle","reason":"A pull request is an issue plus a pull_request row naming head and base"},{"from":"Pull Requests","to":"Code Review","reason":"Line comments either post at once or collect in a pending review until it is submitted as approve, comment or request changes (SubmitReview)"},{"from":"Pull Requests","to":"Merging","reason":"Performing a merge in one of five styles: merge, rebase, rebase-merge, squash or fast-forward-only"},{"from":"Pull Requests","to":"Auto-merge","reason":"Merge when checks succeed"},{"from":"Pull Requests","to":"Mergeability Checks","reason":"Whether a pull request merges cleanly"},{"from":"Pull Requests","to":"AGit Flow","reason":"Opening a pull request without a fork or a branch: push to a ref under refs/for/ named after the target branch"},{"from":"Site Administration","to":"Cron Tasks","reason":"Scheduled background jobs: mirror syncs, cleanup of artifacts, packages, webhook history and audit events, repository health checks and more"},{"from":"Site Administration","to":"Audit Log","reason":"A record of security-relevant actions with actor, scope and metadata, viewable by admins and in user, organization and repository settings"},{"from":"Users & Organizations","to":"Users","reason":"Accounts, profiles, email addresses and personal settings"},{"from":"Users & Organizations","to":"Organizations & Teams","reason":"An organization is a user row of type organization (type Organization user_model.User)"},{"from":"Users & Organizations","to":"Repository Permissions","reason":"GetDoerRepoPermission works out what the current actor may do in a repository, per repo unit"},{"from":"Users & Organizations","to":"SSH & GPG Keys","reason":"Users' SSH and GPG public keys, plus per-repository deploy keys"},{"from":"AGit Flow","to":"Pull Requests","reason":"this module's business area"},{"from":"AGit Flow","to":"Push Hooks","reason":"the proc-receive hook goes through the same internal API as the others"},{"from":"AGit Flow","to":"Pull Request Lifecycle","reason":"ProcReceive calls NewPullRequest with the AGit flow"},{"from":"Access Tokens & OAuth2","to":"Authentication","reason":"this module's business area"},{"from":"Access Tokens & OAuth2","to":"Sign-in","reason":"auth.OAuth2 is one method in the request auth chain"},{"from":"Access Tokens & OAuth2","to":"Runners","reason":"Actions job tokens are accepted by the same method"},{"from":"Activity Feed","to":"Notifications & Webhooks","reason":"this module's business area"},{"from":"Activity Feed","to":"Notifier fan-out","reason":"the feed notifier is one of the registered notifiers"},{"from":"Activity Feed","to":"Pushing to a repository","reason":"every push writes feed rows for watchers"},{"from":"Artifacts","to":"Actions","reason":"this module's business area"},{"from":"Artifacts","to":"Cron Tasks","reason":"cleanup_actions deletes expired artifacts every midnight"},{"from":"Artifacts","to":"Runners","reason":"the upload token identifies the running task"},{"from":"Audit Log","to":"Site Administration","reason":"this module's business area"},{"from":"Audit Log","to":"Notifier fan-out","reason":"the audit notifier registers itself in a Go init()"},{"from":"Audit Log","to":"Repositories","reason":"repository create, fork, rename, transfer and delete are recorded"},{"from":"Auto-merge","to":"Pull Requests","reason":"this module's business area"},{"from":"Auto-merge","to":"Merging","reason":"the worker calls CheckPullMergeable and Merge with the scheduling user's permission"},{"from":"Auto-merge","to":"Commit Statuses","reason":"a successful status is the usual trigger"},{"from":"Branches & Protection","to":"Code","reason":"this module's business area"},{"from":"Branches & Protection","to":"Push Hooks","reason":"the rules are checked in HookPreReceive"},{"from":"Branches & Protection","to":"Merging","reason":"a merge the merger could not push directly is rechecked against the rule's status checks and reviews"},{"from":"Branches & Protection","to":"Commit Statuses","reason":"a rule lists the status contexts a pull request needs"},{"from":"Code Review","to":"Pull Requests","reason":"this module's business area"},{"from":"Code Review","to":"Pull Request Lifecycle","reason":"a review belongs to one pull request"},{"from":"Code Review","to":"Auto-merge","reason":"an approval or a dismissed review queues a scheduled merge for a recheck"},{"from":"Commit Statuses","to":"Code","reason":"this module's business area"},{"from":"Commit Statuses","to":"Auto-merge","reason":"a successful status queues scheduled merges waiting on that head commit"},{"from":"Commit Statuses","to":"Workflow Runs","reason":"each Actions job posts its state as a commit status"},{"from":"Cron Tasks","to":"Site Administration","reason":"this module's business area"},{"from":"Cron Tasks","to":"Mirrors","reason":"update_mirrors schedules mirror syncs"},{"from":"Cron Tasks","to":"Artifacts","reason":"cleanup_actions removes expired artifacts and old logs"},{"from":"Cron Tasks","to":"Audit Log","reason":"delete_old_audit_events prunes old events"},{"from":"Email","to":"Notifications & Webhooks","reason":"this module's business area"},{"from":"Email","to":"Notifier fan-out","reason":"the mail notifier only exists when mail notifications are enabled"},{"from":"Email","to":"Issues & Comments","reason":"incoming replies become comments through CreateIssueComment"},{"from":"Git LFS","to":"Code","reason":"this module's business area"},{"from":"Git LFS","to":"Git over HTTP and SSH","reason":"the SSH verbs are handled in cmd/serv.go"},{"from":"Git LFS","to":"Merging","reason":"with LFS_START_SERVER on, a merge pushes its LFS objects before the git push"},{"from":"Git over HTTP and SSH","to":"Code","reason":"this module's business area"},{"from":"Git over HTTP and SSH","to":"Push Hooks","reason":"the environment set here (GITEA_PUSHER_ID and the repository names) is how the hooks know who pushed"},{"from":"Git over HTTP and SSH","to":"SSH & GPG Keys","reason":"the forced command names the key that authenticated"},{"from":"Git over HTTP and SSH","to":"Repository Permissions","reason":"ServCommand decides read or write with GetDoerRepoPermission"},{"from":"Issues & Comments","to":"Issues","reason":"this module's business area"},{"from":"Issues & Comments","to":"Pull Request Lifecycle","reason":"a pull request is an issue row with IsPull set"},{"from":"Issues & Comments","to":"Notifications","reason":"new issues and comments land in participants' inboxes"},{"from":"Labels & Milestones","to":"Issues","reason":"this module's business area"},{"from":"Labels & Milestones","to":"Issues & Comments","reason":"labels and milestones are attached to issue rows"},{"from":"Mergeability Checks","to":"Pull Requests","reason":"this module's business area"},{"from":"Mergeability Checks","to":"Pull Request Lifecycle","reason":"pushes to head or base restart the check"},{"from":"Mergeability Checks","to":"Auto-merge","reason":"a pull request that becomes mergeable with a scheduled merge is queued again"},{"from":"Merging","to":"Pull Requests","reason":"this module's business area"},{"from":"Merging","to":"Push Hooks","reason":"the merge result is pushed to the base repository and goes through both hooks"},{"from":"Merging","to":"Mergeability Checks","reason":"CheckPullMergeable refuses while the pull request is still being checked or has conflicts"},{"from":"Merging","to":"Merging a pull request","reason":"the end-to-end journey"},{"from":"Mirrors","to":"Code","reason":"this module's business area"},{"from":"Mirrors","to":"Cron Tasks","reason":"update_mirrors drives both kinds on their intervals"},{"from":"Mirrors","to":"Notifier fan-out","reason":"a pull mirror sync announces SyncPushCommits, which webhooks, the feed and Actions handle"},{"from":"Notifications","to":"Notifications & Webhooks","reason":"this module's business area"},{"from":"Notifications","to":"Notifier fan-out","reason":"both the inbox writer and the live count are notifiers"},{"from":"Notifications","to":"Issues & Comments","reason":"inbox rows point at an issue or pull request and, when there is one, a comment"},{"from":"Organizations & Teams","to":"Users & Organizations","reason":"this module's business area"},{"from":"Organizations & Teams","to":"Repository Permissions","reason":"team unit modes are folded into each member's repository permission"},{"from":"Package Registry","to":"Packages","reason":"this module's business area"},{"from":"Package Registry","to":"Users","reason":"a package's owner is a user o <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
const COLORS = [
  ['module', '#e8832a', 'module'], ['stub', '#708090', 'stub'], ['deprecated', '#9b1c1c', 'deprecated'],
  ['domain', '#e0609a', 'domain'], ['flow', '#3aa65b', 'flow'], ['integration', '#3b7ddd', 'integration'],
  ['platform', '#8e5bd6', 'platform'], ['decision', '#d9b400', 'decision'], ['release', '#8d8d8d', 'release'],
  ['repo', '#2a9d8f', 'repo'], ['meta', '#b5b5b5', 'other']];
const COLOR = Object.fromEntries(COLORS.map(c => [c[0], c[1]]));
const colorOf = n => n.status === 'deprecated' ? COLOR.deprecated : n.depth === 'stub' ? COLOR.stub : (COLOR[n.type] || COLOR.meta);

// --- data shaping ----------------------------------------------------------
const nodes = Object.keys(data.notes).sort().map(id => Object.assign({id: id}, data.notes[id]));
const byId = new Map(nodes.map(n => [n.id, n]));
const pairs = new Map();            // one drawn line per unordered pair; every reason kept
for (const l of data.links) {
  const k = l.from < l.to ? l.from + '\u0001' + l.to : l.to + '\u0001' + l.from;
  let p = pairs.get(k);
  if (!p) { p = {source: l.from, target: l.to, reasons: []}; pairs.set(k, p); }
  p.reasons.push(l);
}
const links = Array.from(pairs.values());
const degree = new Map();
for (const l of links) { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); }
const radius = n => 4 + Math.sqrt(degree.get(n.id) || 0) * 1.6;
const lookup = new Map();           // lowercased name or alias -> id
for (const n of nodes) { lookup.set(n.id.toLowerCase(), n.id); for (const a of n.aliases || []) lookup.set(String(a).toLowerCase(), n.id); }
for (const a in data.aliases) if (byId.has(data.aliases[a])) lookup.set(a.toLowerCase(), data.aliases[a]);
const resolve = name => lookup.get(name.trim().toLowerCase()) || null;

document.getElementById('stats').textContent = nodes.length + ' notes · ' + data.links.length + ' links · ' + data.vault + (data.built_at ? ' · built ' + data.built_at : '');
document.getElementById('legend').innerHTML = COLORS.map(c => '<span style="--c:' + c[1] + '">' + c[2] + '</span>').join('');

// --- graph -----------------------------------------------------------------
const svg = d3.select('#graph');
const g = svg.append('g');
const tip = document.getElementById('tip');
const moveTip = e => { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 400) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); };
const hideTip = () => { tip.style.display = 'none'; };

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
// A wide transparent twin of each edge is the hover target: a 1px line is unhoverable.
const hit = g.append('g').attr('class', 'hits').selectAll('line').data(links).join('line')
  .on('mouseenter', (e, d) => { d.el.classList.add('hover'); showTip(e, d.reasons.map(r => '<b>' + esc(r.from) + '</b> → <b>' + esc(r.to) + '</b>' + (r.reason ? ': ' + esc(r.reason) : '')).join('<br>')); })
  .on('mousemove', moveTip).on('mouseleave', (e, d) => { d.el.classList.remove('hover'); hideTip(); });
link.each(function (d) { d.el = this; });
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
  .on('click', (e, d) => { e.stopPropagation(); select(d.id, false); })
  .on('mouseenter', (e, d) => showTip(e, '<b>' + esc(d.id) + '</b> <small>' + esc([d.type, d.status, d.depth].filter(Boolean).join(' · ')) + '</small>' + (d.summary ? '<br>' + esc(d.summary) : '')))
  .on('mousemove', moveTip).on('mouseleave', hideTip);
node.append('circle').attr('r', radius).attr('fill', colorOf);
node.append('text').attr('dx', d => radius(d) + 3).attr('dy', '0.35em').text(d => d.id);

const draw = () => {
  for (const s of [link, hit]) s.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .force('center', d3.forceCenter(0, 0))
  .force('x', d3.forceX(0).strength(0.04))   // keep unlinked notes near the rest
  .force('y', d3.forceY(0).strength(0.04))
  .on('tick', draw)
  .stop();
sim.tick(300);                      // settle synchronously: first paint is the final layout
draw();

let moved = false;                  // the viewer zoomed or panned: stop refitting for them
const zoom = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => {
  if (e.sourceEvent) moved = true;
  g.attr('transform', e.transform);
  node.selectAll('text').style('display', e.transform.k < 0.55 ? 'none' : null);
});
svg.call(zoom).on('click', () => select(null));
let fitted = true;
fit(false);                         // first paint lands fitted; later fits animate

function size() {               // falls back to the window: a hidden page reports a 0x0 svg
  const r = svg.node().getBoundingClientRect();
  return [r.width || window.innerWidth, r.height || window.innerHeight];
}
function fit(animate = true) {
  const [w, h] = size();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const k = Math.min(1, 0.9 * Math.min(w / (x1 - x0 + 1), h / (y1 - y0 + 1)));
  if (!(k > 0 && isFinite(k))) { fitted = false; return; }   // retried on the next resize
  const target = d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, target);
}
function centerOn(n) {
  const [w, h] = size(), k = Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
}
window.addEventListener('resize', () => { if (!fitted && sim.alpha() < sim.alphaMin()) { fitted = true; fit(); } });
// On narrow screens the reader panel sits under the graph; opening a note shrinks the graph, so refit it.
if (window.ResizeObserver) new ResizeObserver(() => { if (!moved) fit(false); }).observe(svg.node());
function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }

// --- selection, search, dimming ---------------------------------------------
let selected = null;
function focus(set) {               // ids to keep bright, or null for all
  node.classed('dim', d => !!set && !set.has(d.id)).classed('sel', d => d.id === selected);
  link.classed('dim', d => !!set && !(set.has(d.source.id) && set.has(d.target.id)))
      .classed('hot', d => !!selected && (d.source.id === selected || d.target.id === selected));
}
function neighbours(id) {           // [dir, other, reason], reasoned first, deduplicated
  const out = [], seen = new Set();
  for (const l of data.links) {
    const r = l.from === id ? ['→', l.to, l.reason] : l.to === id ? ['←', l.from, l.reason] : null;
    if (!r) continue;
    const k = r.join('\u0001');
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((a, b) => (a[2] == null) - (b[2] == null) || (a[0] > b[0]) - (a[0] < b[0]) || a[1].localeCompare(b[1]));
}
function focusSelected() {
  focus(selected ? new Set([selected].concat(neighbours(selected).map(x => x[1]))) : null);
}
const panel = document.getElementById('panel');
const obsidianUrl = n => 'obsidian://open?vault=' + encodeURIComponent(data.vault) + '&file=' + encodeURIComponent(n.path.replace(/\.md$/, ''));
function select(id, center) {
  selected = id;
  focusSelected();
  if (!id) { panel.className = 'empty'; panel.textContent = 'Click a node to read its note. Hover an edge for the link reason.'; return; }
  const n = byId.get(id), nb = neighbours(id);
  const meta = [n.type, n.status, n.depth, n.domain, n.repo, n.updated && 'updated ' + n.updated].filter(Boolean).map(esc).join(' · ');
  panel.className = '';
  panel.innerHTML = '<h2>' + esc(id) + '</h2><div class="meta">' + meta + '<br><a href="' + obsidianUrl(n) + '" title="Open in Obsidian">' + esc(n.path) + '</a></div>'
    + '<div class="body">' + md(n.body || n.summary || '') + '</div>'
    + '<div class="nb"><h3>Neighbours (' + nb.length + ')</h3><ul>'
    + nb.map(x => '<li>' + x[0] + ' <a href="#" data-node="' + esc(x[1]) + '">' + esc(x[1]) + '</a>' + (x[2] ? ' <span class="r">— ' + esc(x[2]) + '</span>' : '') + '</li>').join('')
    + '</ul></div>';
  panel.scrollTop = 0;
  if (center) centerOn(n);
}
panel.addEventListener('click', e => {
  const a = e.target.closest('a[data-node]');
  if (a) { e.preventDefault(); select(a.dataset.node, true); }
});

const q = document.getElementById('q'), hits = document.getElementById('hits');
function matches(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  return nodes.filter(n => n.id.toLowerCase().includes(t) || (n.aliases || []).some(a => String(a).toLowerCase().includes(t)));
}
q.addEventListener('input', () => {
  const m = matches(q.value);
  if (!m) { hits.innerHTML = ''; focusSelected(); return; }
  focus(new Set(m.map(n => n.id)));
  hits.innerHTML = m.slice(0, 30).map(n => '<li data-node="' + esc(n.id) + '">' + esc(n.id) + ' <small>' + esc(n.type || '') + '</small></li>').join('') || '<li><small>no matches</small></li>';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const m = matches(q.value); if (m && m.length) { select(m[0].id, true); hits.innerHTML = ''; } }
  if (e.key === 'Escape') { q.value = ''; hits.innerHTML = ''; focusSelected(); }
});
hits.addEventListener('click', e => { const li = e.target.closest('li[data-node]'); if (li) { select(li.dataset.node, true); hits.innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.innerHTML = ''; });

// --- minimal markdown --------------------------------------------------------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  const out = [];
  const keep = html => { out.push(html); return '\u0002' + (out.length - 1) + '\u0003'; };
  s = s.replace(/`([^`]+)`/g, (m, c) => keep('<code>' + esc(c) + '</code>'))
       .replace(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, a) => {
         const id = resolve(t), label = esc(a || t);
         return keep(id ? '<a href="#" data-node="' + esc(id) + '">' + label + '</a>' : '<span class="dead">' + label + '</span>');
       });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0003/g, (m, i) => out[i]);
}
function md(text) {
  const lines = text.replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n');
  const html = [];
  let i = 0, list = null, para = [], m;
  const flushPara = () => { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  const cells = r => r.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => inline(c.replace(/\\\|/g, '|').trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushPara(); closeList(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      flushPara(); closeList();
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      html.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => (k ? '<td>' : '<th>') + c + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {     // ponytail: nested lists flattened
      flushPara();
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); list = kind; html.push('<' + kind + '>'); }
      html.push('<li>' + inline(m[2]) + '</li>'); i++; continue;
    }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    closeList(); para.push(line); i++;
  }
  flushPara(); closeList();
  return html.join('\n');
}
})();
</script>
<script>(function () {  // open one note on arrival
  var t = [].find.call(document.querySelectorAll('.node text'), function (x) { return x.textContent === "Pushing to a repository"; });
  if (t) t.parentNode.dispatchEvent(new MouseEvent('click', {bubbles: true}));
})();</script>
</body>
</html>
