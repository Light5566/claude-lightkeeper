<script id="data" type="application/json">{"vault":"Gitea","built_at":"2026-10-19T10:26:15","notes":{"Actions":{"path":"1 Domains/Actions.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"The built-in CI: workflow runs created from repository events, the runners that execute their jobs, artifacts, secrets and variables.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Actions\n\n## What it is\n\nThe built-in CI: workflow runs created from repository events, the runners that execute their jobs, artifacts, secrets and variables.\n\n## Modules\n\n- [[Workflow Runs]] — Turning repository events into workflow runs\n- [[Runners]] — The machines that execute jobs\n- [[Artifacts]] — Files uploaded by workflow jobs, through either the older pipeline-style API under `/api/actions_pipeline` or the v4 API served by `ArtifactsV4Routes`\n- [[Secrets & Variables]] — Values that workflows read\n"},"Authentication":{"path":"1 Domains/Authentication.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"How a request proves who it is: sessions, passwords and login sources, two-factor, access tokens and the OAuth2 provider.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Authentication\n\n## What it is\n\nHow a request proves who it is: sessions, passwords and login sources, two-factor, access tokens and the OAuth2 provider.\n\n## Modules\n\n- [[Sign-in]] — Who a request is from\n- [[Access Tokens & OAuth2]] — Personal access tokens with scopes, and Gitea as an OAuth2 and OpenID Connect provider for other applications\n"},"Code":{"path":"1 Domains/Code.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Repositories and everything git: hosting over HTTP and SSH, the push hooks, branches and their protection, commit statuses, LFS, mirrors, releases, the wiki and search.","aliases":[],"tags":["domain"],"flags":[],"inbound":10,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Code\n\n## What it is\n\nRepositories and everything git: hosting over HTTP and SSH, the push hooks, branches and their protection, commit statuses, LFS, mirrors, releases, the wiki and search.\n\n## Modules\n\n- [[Repositories]] — A repository is a `Repository` row plus a git directory on disk\n- [[Git over HTTP and SSH]] — Clone, fetch and push over smart HTTP and over SSH\n- [[Push Hooks]] — What happens when git receives a push\n- [[Branches & Protection]] — Branch lists come from a `branch` table that `SyncBranchesToDB` updates on every push, not from git\n- [[Commit Statuses]] — Build and check results attached to a commit, posted by Actions or by outside CI through the API\n- [[Git LFS]] — Large files through the Git LFS batch API, plus file locks\n- [[Mirrors]] — Pull mirrors fetch a remote repository on a schedule and are read-only; push mirrors push this repository to a remote\n- [[Releases]] — Releases and tags share the `release` table: a pushed tag with no release still gets a row with `IsTag` set\n- [[Wiki]] — The wiki is a second git repository beside the code one (`\u003cname>.wiki`)\n- [[Search Indexers]] — Full-text search for issues and code\n"},"Issues":{"path":"1 Domains/Issues.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Issues and what organises them: comments, cross-references, labels, milestones and project boards.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Issues\n\n## What it is\n\nIssues and what organises them: comments, cross-references, labels, milestones and project boards.\n\n## Modules\n\n- [[Issues & Comments]] — Issues and the comment timeline\n- [[Labels & Milestones]] — Labels belong to a repository or to an organization (`OrgID`)\n- [[Projects]] — Kanban boards with columns\n"},"Notifications & Webhooks":{"path":"1 Domains/Notifications & Webhooks.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Telling people and systems what happened: the notification inbox, email, the activity feed and outgoing webhooks.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Notifications & Webhooks\n\n## What it is\n\nTelling people and systems what happened: the notification inbox, email, the activity feed and outgoing webhooks.\n\n## Modules\n\n- [[Webhooks]] — Outgoing HTTP calls on repository, organization and system events, in the Gitea format or the message format of a chat service\n- [[Notifications]] — The in-app inbox for issue and pull request activity and pending repository transfers\n- [[Email]] — Outgoing mail for account events and for issue, pull request, release and workflow activity, queued on `mail` and sent by SMTP or sendmail\n- [[Activity Feed]] — The dashboard and profile timelines and their RSS and Atom feeds\n"},"Packages":{"path":"1 Domains/Packages.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"The package registry: npm, Maven, PyPI, container images and other formats, owned by users and organizations.","aliases":[],"tags":["domain"],"flags":[],"inbound":1,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Packages\n\n## What it is\n\nThe package registry: npm, Maven, PyPI, container images and other formats, owned by users and organizations.\n\n## Modules\n\n- [[Package Registry]] — A registry that speaks each package manager's own protocol (npm, Maven, PyPI, container images and many more, one folder each under `routers/api/packages`) at `/api/packages`, with the container registry at `/v2`, which has to sit at the site root\n"},"Pull Requests":{"path":"1 Domains/Pull Requests.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Proposing, reviewing and merging changes: pull requests, code review, mergeability checks, merge styles, auto-merge and AGit pushes.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Pull Requests\n\n## What it is\n\nProposing, reviewing and merging changes: pull requests, code review, mergeability checks, merge styles, auto-merge and AGit pushes.\n\n## Modules\n\n- [[Pull Request Lifecycle]] — A pull request is an issue plus a `pull_request` row naming head and base\n- [[Code Review]] — Line comments either post at once or collect in a pending review until it is submitted as approve, comment or request changes (`SubmitReview`)\n- [[Merging]] — Performing a merge in one of five styles: merge, rebase, rebase-merge, squash or fast-forward-only\n- [[Auto-merge]] — Merge when checks succeed\n- [[Mergeability Checks]] — Whether a pull request merges cleanly\n- [[AGit Flow]] — Opening a pull request without a fork or a branch: push to a ref under refs/for/ named after the target branch\n"},"Site Administration":{"path":"1 Domains/Site Administration.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Instance-wide upkeep for administrators: scheduled cron tasks and the audit log.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Site Administration\n\n## What it is\n\nInstance-wide upkeep for administrators: scheduled cron tasks and the audit log.\n\n## Modules\n\n- [[Cron Tasks]] — Scheduled background jobs: mirror syncs, cleanup of artifacts, packages, webhook history and audit events, repository health checks and more\n- [[Audit Log]] — A record of security-relevant actions with actor, scope and metadata, viewable by admins and in user, organization and repository settings\n"},"Users & Organizations":{"path":"1 Domains/Users & Organizations.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"Who owns things and who may touch them: accounts, organizations and teams, repository permissions, SSH and GPG keys.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [domain]\n---\n# Users & Organizations\n\n## What it is\n\nWho owns things and who may touch them: accounts, organizations and teams, repository permissions, SSH and GPG keys.\n\n## Modules\n\n- [[Users]] — Accounts, profiles, email addresses and personal settings\n- [[Organizations & Teams]] — An organization is a `user` row of type organization (`type Organization user_model.User`)\n- [[Repository Permissions]] — `GetDoerRepoPermission` works out what the current actor may do in a repository, per repo unit\n- [[SSH & GPG Keys]] — Users' SSH and GPG public keys, plus per-repository deploy keys\n"},"AGit Flow":{"path":"2 Modules/AGit Flow.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"Opening a pull request without a fork or a branch: push to a ref under refs/for/ named after the target branch.","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# AGit Flow\n\n## What it is\n\nOpening a pull request without a fork or a branch: push to a ref under refs/for/ named after the target branch. Gitea sets `receive.procReceiveRefs` to that prefix, so git hands these refs to the `proc-receive` hook, and `ProcReceive` creates or updates the pull request. The topic comes from a `topic` push option or from the ref name after the target branch, and `title` and `description` push options fill in the pull request.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/agit/agit.go` |\n| Hook endpoint | `routers/private/hook_proc_receive.go` |\n| Git config | `modules/git/config.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Push Hooks]] — the proc-receive hook goes through the same internal API as the others\n- [[Pull Request Lifecycle]] — `ProcReceive` calls `NewPullRequest` with the AGit flow\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Access Tokens & OAuth2":{"path":"2 Modules/Access Tokens & OAuth2.md","type":"module","status":"shipped","depth":"stub","domain":"Authentication","repo":"gitea","updated":"2026-10-19","summary":"Personal access tokens with scopes, and Gitea as an OAuth2 and OpenID Connect provider for other applications.","aliases":[],"tags":["module","domain/authentication"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Authentication\nupdated: 2026-10-19\ntags: [module, domain/authentication]\n---\n# Access Tokens & OAuth2\n\n## What it is\n\nPersonal access tokens with scopes, and Gitea as an OAuth2 and OpenID Connect provider for other applications. `auth.OAuth2` reads the bearer token: a value with a dot is parsed as a JWT (an Actions job token or an OAuth2 access token), anything else is looked up with `GetAccessTokenBySHA`, falling back to a running Actions task's token.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/auth/access_token.go`, `models/auth/access_token_scope.go`, `models/auth/oauth2.go` |\n| Token check | `services/auth/oauth2.go` |\n| OAuth2 provider | `services/oauth2_provider/access_token.go`, `services/oauth2_provider/token.go`, `routers/web/auth/oauth2_provider.go` |\n| Web | `routers/web/user/setting/applications.go` |\n| API | `routers/api/v1/user/app.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Authentication]] — this module's business area\n- [[Sign-in]] — `auth.OAuth2` is one method in the request auth chain\n- [[Runners]] — Actions job tokens are accepted by the same method\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Activity Feed":{"path":"2 Modules/Activity Feed.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications & Webhooks","repo":"gitea","updated":"2026-10-19","summary":"The dashboard and profile timelines and their RSS and Atom feeds.","aliases":[],"tags":["module","domain/notifications-webhooks"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Notifications & Webhooks\nupdated: 2026-10-19\ntags: [module, domain/notifications-webhooks]\n---\n# Activity Feed\n\n## What it is\n\nThe dashboard and profile timelines and their RSS and Atom feeds. The feed notifier turns events into `Action` rows, and `NotifyWatchers` writes one copy for the actor, one for an owning organization, and one for each watcher whose watch settings and unit access allow that kind of event. Content over 65535 characters is cut, and JSON content that long is replaced with `{}`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Notifier | `services/feed/notifier.go`, `services/feed/feed.go` |\n| Models | `models/activities/action.go`, `models/activities/action_list.go`, `models/activities/user_heatmap.go` |\n| Feeds | `routers/web/feed/repo.go`, `routers/web/feed/profile.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications & Webhooks]] — this module's business area\n- [[Notifier fan-out]] — the feed notifier is one of the registered notifiers\n- [[Pushing to a repository]] — every push writes feed rows for watchers\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Artifacts":{"path":"2 Modules/Artifacts.md","type":"module","status":"shipped","depth":"stub","domain":"Actions","repo":"gitea","updated":"2026-10-19","summary":"Files uploaded by workflow jobs, through either the older pipeline-style API under `/api/actions_pipeline` or the v4 API served by `ArtifactsV4Routes`.","aliases":[],"tags":["module","domain/actions"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Actions\nupdated: 2026-10-19\ntags: [module, domain/actions]\n---\n# Artifacts\n\n## What it is\n\nFiles uploaded by workflow jobs, through either the older pipeline-style API under `/api/actions_pipeline` or the v4 API served by `ArtifactsV4Routes`. The pipeline API authenticates with the job's `ACTIONS_RUNTIME_TOKEN` and refuses tasks that are no longer running. Each artifact expires `ARTIFACT_RETENTION_DAYS` (90 by default) after upload unless the upload asks for its own retention.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Upload APIs | `routers/api/actions/artifacts.go`, `routers/api/actions/artifactsv4.go` |\n| Model | `models/actions/artifact.go` |\n| Cleanup | `services/actions/cleanup.go` |\n| Web | `routers/web/repo/actions/view_artifact.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Actions]] — this module's business area\n- [[Cron Tasks]] — `cleanup_actions` deletes expired artifacts every midnight\n- [[Runners]] — the upload token identifies the running task\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Audit Log":{"path":"2 Modules/Audit Log.md","type":"module","status":"shipped","depth":"stub","domain":"Site Administration","repo":"gitea","updated":"2026-10-19","summary":"A record of security-relevant actions with actor, scope and metadata, viewable by admins and in user, organization and repository settings.","aliases":[],"tags":["module","domain/site-administration"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Site Administration\nupdated: 2026-10-19\ntags: [module, domain/site-administration]\n---\n# Audit Log\n\n## What it is\n\nA record of security-relevant actions with actor, scope and metadata, viewable by admins and in user, organization and repository settings. Events arrive two ways: the audit notifier maps notifier events such as repository create, fork, rename and transfer, and code calls `audit.Record` directly (`DeleteRepository` does). Nothing is written unless `[audit] RECORD_OUTPUT` is `database`; the default is `disabled`, an unknown value also disables it, and `RETENTION_DAYS` (30 by default, 0 keeps forever) sets when `delete_old_audit_events` prunes.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/audit/event.go`, `services/audit/notifier.go`, `services/audit/export.go` |\n| Models | `models/audit/audit_event.go`, `models/audit/action.go` |\n| Settings | `modules/setting/audit.go` |\n| Web | `routers/web/admin/audit.go`, `routers/web/repo/setting/audit.go`, `routers/web/org/setting/audit.go`, `routers/web/user/setting/audit.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Site Administration]] — this module's business area\n- [[Notifier fan-out]] — the audit notifier registers itself in a Go `init()`\n- [[Repositories]] — repository create, fork, rename, transfer and delete are recorded\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Auto-merge":{"path":"2 Modules/Auto-merge.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"Merge when checks succeed.","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# Auto-merge\n\n## What it is\n\nMerge when checks succeed. `ScheduleAutoMerge` stores the request with a timeline comment; a successful commit status, an approving or dismissed review, or a finished mergeability check then queues the pull request on `pr_auto_merge`. The worker merges once the required checks pass and the head commit is unchanged, acting as the user who scheduled it.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/automerge/automerge.go`, `services/automerge/notify.go` |\n| Queue | `services/automergequeue/automergequeue.go` |\n| Model | `models/pull/automerge.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Merging]] — the worker calls `CheckPullMergeable` and `Merge` with the scheduling user's permission\n- [[Commit Statuses]] — a successful status is the usual trigger\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Branches & Protection":{"path":"2 Modules/Branches & Protection.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Branch lists come from a `branch` table that `SyncBranchesToDB` updates on every push, not from git.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Branches & Protection\n\n## What it is\n\nBranch lists come from a `branch` table that `SyncBranchesToDB` updates on every push, not from git. A protection rule matches a branch by exact name or glob, and only the first matching rule applies: `FindRepoProtectedBranchRules` sorts by priority, then exact names before globs, then age. Rules and protected tags are enforced in the pre-receive hook, so they also apply to merges made from the UI, which are pushed like any other.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/git/branch.go`, `models/git/protected_branch.go`, `models/git/protected_branch_list.go`, `models/git/protected_tag.go` |\n| Service | `services/repository/branch.go` |\n| Web | `routers/web/repo/branch.go`, `routers/web/repo/setting/protected_branch.go`, `routers/web/repo/setting/protected_tag.go` |\n| API | `routers/api/v1/repo/branch.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Push Hooks]] — the rules are checked in `HookPreReceive`\n- [[Merging]] — a merge the merger could not push directly is rechecked against the rule's status checks and reviews\n- [[Commit Statuses]] — a rule lists the status contexts a pull request needs\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Code Review":{"path":"2 Modules/Code Review.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"Line comments either post at once or collect in a pending review until it is submitted as approve, comment or request changes (`SubmitReview`).","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# Code Review\n\n## What it is\n\nLine comments either post at once or collect in a pending review until it is submitted as approve, comment or request changes (`SubmitReview`). When a pull request opens and is not a work in progress, a `CODEOWNERS` file at the root, in docs/ or in .gitea/ turns the changed paths into review requests. If a push changes the diff, existing reviews are marked stale, and approvals are dismissed when the branch rule sets `DismissStaleApprovals`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/issues/review.go`, `models/issues/review_list.go` |\n| Service | `services/pull/review.go`, `services/issue/review_request.go` |\n| Code owners | `services/issue/pull.go` |\n| Web | `routers/web/repo/pull_review.go` |\n| API | `routers/api/v1/repo/pull_review.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Pull Request Lifecycle]] — a review belongs to one pull request\n- [[Auto-merge]] — an approval or a dismissed review queues a scheduled merge for a recheck\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Commit Statuses":{"path":"2 Modules/Commit Statuses.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Build and check results attached to a commit, posted by Actions or by outside CI through the API.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Commit Statuses\n\n## What it is\n\nBuild and check results attached to a commit, posted by Actions or by outside CI through the API. `CreateCommitStatus` stores the status, updates the per-commit summary and raises the `CreateCommitStatus` notifier event. Branch rules name required contexts as globs; `MergeRequiredContextsCommitStatus` keeps the result pending until every required pattern has matched a status, unless one of them already failed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/git/commit_status.go`, `models/git/commit_status_summary.go` |\n| Service | `services/repository/commitstatus/commitstatus.go` |\n| Required checks | `services/pull/commit_status.go` |\n| API | `routers/api/v1/repo/status.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Auto-merge]] — a successful status queues scheduled merges waiting on that head commit\n- [[Workflow Runs]] — each Actions job posts its state as a commit status\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Cron Tasks":{"path":"2 Modules/Cron Tasks.md","type":"module","status":"shipped","depth":"full","domain":"Site Administration","repo":"gitea","updated":"2026-10-19","summary":"Scheduled background jobs: mirror syncs, cleanup of artifacts, packages, webhook history and audit events, repository health checks and more.","aliases":[],"tags":["module","domain/site-administration"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: gitea\ndomain: Site Administration\nupdated: 2026-10-19\ntags: [module, domain/site-administration]\n---\n# Cron Tasks\n\n## What it is\n\nScheduled background jobs: mirror syncs, cleanup of artifacts, packages, webhook history and audit events, repository health checks and more. Each task has a name, a schedule and an on/off switch in the config file, and can be run by hand from the admin dashboard.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Scheduler | `services/cron/cron.go`, `services/cron/tasks.go`, `services/cron/setting.go` |\n| Task lists | `services/cron/tasks_basic.go`, `services/cron/tasks_extended.go`, `services/cron/tasks_actions.go` |\n| Settings | `modules/setting/cron.go` |\n| Admin | `routers/web/admin/admin.go`, `routers/api/v1/admin/cron.go` |\n\n## How it works\n\nEach task is registered at startup with `RegisterTaskFatal(name, config, fn)`. The config value (`BaseConfig`, `OlderThanConfig` and friends) carries the defaults, which `GetCronSettings` overlays from the `[cron.\u003cname>]` section of the config file. Enabled tasks are added to the scheduler, and tasks with `RunAtStart` also run once at boot. The admin dashboard (`RunWithUser`, with the admin as doer) and the admin API in `routers/api/v1/admin/cron.go` (`Run`) can start any task by hand.\n\nA run first takes a global lock named `cron_task:\u003cname>` with `TryLock`. The task function then runs inside the graceful shutdown context with panics recovered; scheduled and API runs act as a placeholder user with ID -1 named `(Cron)`, dashboard runs as the admin who pressed the button. The outcome is kept on the task (`Status`, `LastMessage`, `LastRun`) for the admin page, and an error, or a success when the config asks for it, is written as a system notice with `CreateNotice`.\n\n## Connects to\n\n- [[Site Administration]] — this module's business area\n- [[Mirrors]] — `update_mirrors` schedules mirror syncs\n- [[Artifacts]] — `cleanup_actions` removes expired artifacts and old logs\n- [[Audit Log]] — `delete_old_audit_events` prunes old events\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `RegisterTask` refuses a task with no `admin.dashboard.\u003cname>` translation, and `RegisterTaskFatal` turns that into `log.Fatal`, so a new task without its locale string stops the server at startup.\n- A run that starts while the previous one is still going is dropped with only a trace log, because of the `cron_task:\u003cname>` lock.\n- Failures do not reach any caller: they show up only as a system notice and on the task's admin entry.\n\n## History\n\n-\n"},"Email":{"path":"2 Modules/Email.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications & Webhooks","repo":"gitea","updated":"2026-10-19","summary":"Outgoing mail for account events and for issue, pull request, release and workflow activity, queued on `mail` and sent by SMTP or sendmail.","aliases":[],"tags":["module","domain/notifications-webhooks"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Notifications & Webhooks\nupdated: 2026-10-19\ntags: [module, domain/notifications-webhooks]\n---\n# Email\n\n## What it is\n\nOutgoing mail for account events and for issue, pull request, release and workflow activity, queued on `mail` and sent by SMTP or sendmail. The mail notifier is registered only when a mailer is configured and `ENABLE_NOTIFY_MAIL` is on, and each user's `EmailNotificationsPreference` picks all activity, mentions only, also their own actions, or nothing. Incoming mail can turn replies into comments (`ReplyHandler`).\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Queue and notifier | `services/mailer/mailer.go`, `services/mailer/notify.go` |\n| Messages | `services/mailer/mail.go`, `services/mailer/mail_issue.go` |\n| Senders | `services/mailer/sender/smtp.go`, `services/mailer/sender/sendmail.go` |\n| Incoming | `services/mailer/incoming/incoming.go`, `services/mailer/incoming/incoming_handler.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications & Webhooks]] — this module's business area\n- [[Notifier fan-out]] — the mail notifier only exists when mail notifications are enabled\n- [[Issues & Comments]] — incoming replies become comments through `CreateIssueComment`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Git LFS":{"path":"2 Modules/Git LFS.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Large files through the Git LFS batch API, plus file locks.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Git LFS\n\n## What it is\n\nLarge files through the Git LFS batch API, plus file locks. `BatchHandler` answers which objects to upload or download, the bytes go to the LFS storage backend, and an `LFSMetaObject` row records that a repository may reach an object. Over SSH, `gitea serv` either hands out a token for the HTTP API (`git-lfs-authenticate`) or speaks the transfer protocol itself (`git-lfs-transfer`).\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Server | `services/lfs/server.go`, `services/lfs/locks.go` |\n| Models | `models/git/lfs.go`, `models/git/lfs_lock.go` |\n| Protocol | `modules/lfs/pointer.go` |\n| SSH transfer | `modules/lfstransfer/main.go` |\n| Settings page | `routers/web/repo/setting/lfs.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Git over HTTP and SSH]] — the SSH verbs are handled in `cmd/serv.go`\n- [[Merging]] — with `LFS_START_SERVER` on, a merge pushes its LFS objects before the git push\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Git over HTTP and SSH":{"path":"2 Modules/Git over HTTP and SSH.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Clone, fetch and push over smart HTTP and over SSH.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Git over HTTP and SSH\n\n## What it is\n\nClone, fetch and push over smart HTTP and over SSH. Both SSH paths, OpenSSH with a forced command in `authorized_keys` and the built-in server in `modules/ssh/ssh.go`, end in `gitea serv key-\u003cid>`, which asks the internal API (`ServCommand`) whether that key may read or write, refuses writes to mirrors and archived repositories, then runs git with the pusher in its environment.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| HTTP | `routers/web/repo/githttp.go` |\n| SSH command | `cmd/serv.go` |\n| Built-in SSH server | `modules/ssh/ssh.go` |\n| Access check | `routers/private/serv.go`, `modules/private/serv.go` |\n| authorized_keys | `models/asymkey/ssh_key_authorized_keys.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Push Hooks]] — the environment set here (`GITEA_PUSHER_ID` and the repository names) is how the hooks know who pushed\n- [[SSH & GPG Keys]] — the forced command names the key that authenticated\n- [[Repository Permissions]] — `ServCommand` decides read or write with `GetDoerRepoPermission`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Issues & Comments":{"path":"2 Modules/Issues & Comments.md","type":"module","status":"shipped","depth":"stub","domain":"Issues","repo":"gitea","updated":"2026-10-19","summary":"Issues and the comment timeline.","aliases":[],"tags":["module","domain/issues"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Issues\nupdated: 2026-10-19\ntags: [module, domain/issues]\n---\n# Issues & Comments\n\n## What it is\n\nIssues and the comment timeline. A pull request is also an issue row (`IsPull`), so both share labels, assignees, comments and one per-repository number sequence (`issue_index`). Text that mentions another issue creates a cross-reference (`AddCrossReferences`); closing keywords close the issue when the pull request carrying them merges, or when a commit carrying them is pushed to the default branch.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/issues/issue.go`, `models/issues/issue_update.go`, `models/issues/comment.go` |\n| Cross references | `models/issues/issue_xref.go`, `modules/references/references.go` |\n| Service | `services/issue/issue.go`, `services/issue/comments.go`, `services/issue/commit.go` |\n| Web | `routers/web/repo/issue_new.go`, `routers/web/repo/issue_view.go`, `routers/web/repo/issue_comment.go` |\n| API | `routers/api/v1/repo/issue.go`, `routers/api/v1/repo/issue_comment.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Issues]] — this module's business area\n- [[Pull Request Lifecycle]] — a pull request is an issue row with `IsPull` set\n- [[Notifications]] — new issues and comments land in participants' inboxes\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Labels & Milestones":{"path":"2 Modules/Labels & Milestones.md","type":"module","status":"shipped","depth":"stub","domain":"Issues","repo":"gitea","updated":"2026-10-19","summary":"Labels belong to a repository or to an organization (`OrgID`).","aliases":[],"tags":["module","domain/issues"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Issues\nupdated: 2026-10-19\ntags: [module, domain/issues]\n---\n# Labels & Milestones\n\n## What it is\n\nLabels belong to a repository or to an organization (`OrgID`). An exclusive label named scope/name removes any other label with the same scope from the issue when it is added (`RemoveDuplicateExclusiveIssueLabels`). Milestones group issues and pull requests inside one repository.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/issues/label.go`, `models/issues/issue_label.go`, `models/issues/milestone.go` |\n| Service | `services/issue/label.go`, `services/issue/milestone.go` |\n| Web | `routers/web/repo/issue_label.go`, `routers/web/repo/milestone.go`, `routers/web/org/org_labels.go` |\n| API | `routers/api/v1/repo/label.go`, `routers/api/v1/repo/milestone.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Issues]] — this module's business area\n- [[Issues & Comments]] — labels and milestones are attached to issue rows\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Mergeability Checks":{"path":"2 Modules/Mergeability Checks.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"Whether a pull request merges cleanly.","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# Mergeability Checks\n\n## What it is\n\nWhether a pull request merges cleanly. A pull request is marked checking and its ID goes on the `pr_patch_checker` queue; the worker tests the merge with `git merge-tree` when git supports it, or in a temporary clone otherwise, and stores the status and conflicted files on the row. The same worker finishes interrupted merges and, when the repository enables `AutodetectManualMerge`, marks pull requests whose commits were pushed to the base branch by hand as merged.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Queue and checks | `services/pull/check.go` |\n| Conflict test | `services/pull/patch.go`, `services/pull/merge_tree.go`, `services/pull/patch_unmerged.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Pull Request Lifecycle]] — pushes to head or base restart the check\n- [[Auto-merge]] — a pull request that becomes mergeable with a scheduled merge is queued again\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Merging":{"path":"2 Modules/Merging.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"Performing a merge in one of five styles: merge, rebase, rebase-merge, squash or fast-forward-only.","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# Merging\n\n## What it is\n\nPerforming a merge in one of five styles: merge, rebase, rebase-merge, squash or fast-forward-only. `Merge` works in a temporary clone of the base branch, records the merge commit on the pull request, then pushes it to the base repository like any user push, so the pre-receive hook enforces branch protection and post-receive emits the push events. Callers run `CheckPullMergeable` first.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/pull/merge.go`, `services/pull/merge_prepare.go`, `services/pull/temp_repo.go` |\n| Styles | `services/pull/merge_merge.go`, `services/pull/merge_rebase.go`, `services/pull/merge_squash.go`, `services/pull/merge_ff_only.go` |\n| Web | `routers/web/repo/pull_merge_form.go`, `routers/web/repo/pull_merge_box.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Push Hooks]] — the merge result is pushed to the base repository and goes through both hooks\n- [[Mergeability Checks]] — `CheckPullMergeable` refuses while the pull request is still being checked or has conflicts\n- [[Merging a pull request]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Mirrors":{"path":"2 Modules/Mirrors.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Pull mirrors fetch a remote repository on a schedule and are read-only; push mirrors push this repository to a remote.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Mirrors\n\n## What it is\n\nPull mirrors fetch a remote repository on a schedule and are read-only; push mirrors push this repository to a remote. A push mirror with `SyncOnCommit` (on by default) is also queued after every push, by the mirror notifier.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Pull mirrors | `services/mirror/mirror_pull.go`, `models/repo/mirror.go` |\n| Push mirrors | `services/mirror/mirror_push.go`, `models/repo/pushmirror.go` |\n| Scheduling | `services/mirror/mirror.go`, `services/mirror/queue.go`, `services/mirror/notifier.go` |\n| API | `routers/api/v1/repo/mirror.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Cron Tasks]] — `update_mirrors` drives both kinds on their intervals\n- [[Notifier fan-out]] — a pull mirror sync announces `SyncPushCommits`, which webhooks, the feed and Actions handle\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Notifications":{"path":"2 Modules/Notifications.md","type":"module","status":"shipped","depth":"stub","domain":"Notifications & Webhooks","repo":"gitea","updated":"2026-10-19","summary":"The in-app inbox for issue and pull request activity and pending repository transfers.","aliases":[],"tags":["module","domain/notifications-webhooks"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Notifications & Webhooks\nupdated: 2026-10-19\ntags: [module, domain/notifications-webhooks]\n---\n# Notifications\n\n## What it is\n\nThe in-app inbox for issue and pull request activity and pending repository transfers. The `notificationService` notifier queues each event on `notification-service`; the worker writes rows with `CreateOrUpdateIssueNotifications` and raises `NotificationCountChange`, which the websocket notifier turns into a live unread count for connected browsers. A plain push creates no inbox entry; a push to a pull request's head branch does, through `PullRequestPushCommits`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Notifier | `services/uinotification/notify.go` |\n| Models | `models/activities/notification.go`, `models/activities/notification_list.go` |\n| Live count | `services/websocket/notification_notifier.go` |\n| Web | `routers/web/user/notification.go` |\n| API | `routers/api/v1/notify/notifications.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Notifications & Webhooks]] — this module's business area\n- [[Notifier fan-out]] — both the inbox writer and the live count are notifiers\n- [[Issues & Comments]] — inbox rows point at an issue or pull request and, when there is one, a comment\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Organizations & Teams":{"path":"2 Modules/Organizations & Teams.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Organizations","repo":"gitea","updated":"2026-10-19","summary":"An organization is a `user` row of type organization (`type Organization user_model.User`).","aliases":[],"tags":["module","domain/users-organizations"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Users & Organizations\nupdated: 2026-10-19\ntags: [module, domain/users-organizations]\n---\n# Organizations & Teams\n\n## What it is\n\nAn organization is a `user` row of type organization (`type Organization user_model.User`). Teams give members access to some or all of its repositories (`IncludesAllRepositories`) with an access mode per repo unit, and members of the `Owners` team get owner access to every repository.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/organization/org.go`, `models/organization/team.go`, `models/organization/team_unit.go`, `models/organization/team_repo.go` |\n| Service | `services/org/org.go`, `services/org/team.go` |\n| Web | `routers/web/org/teams.go`, `routers/web/org/members.go` |\n| API | `routers/api/v1/org/org.go`, `routers/api/v1/org/team.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Organizations]] — this module's business area\n- [[Repository Permissions]] — team unit modes are folded into each member's repository permission\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Package Registry":{"path":"2 Modules/Package Registry.md","type":"module","status":"shipped","depth":"stub","domain":"Packages","repo":"gitea","updated":"2026-10-19","summary":"A registry that speaks each package manager's own protocol (npm, Maven, PyPI, container images and many more, one folder each under `routers/api/packages`) at `/api/packages`, with the container registry at `/v2`, which has to sit at the si","aliases":[],"tags":["module","domain/packages"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Packages\nupdated: 2026-10-19\ntags: [module, domain/packages]\n---\n# Package Registry\n\n## What it is\n\nA registry that speaks each package manager's own protocol (npm, Maven, PyPI, container images and many more, one folder each under `routers/api/packages`) at `/api/packages`, with the container registry at `/v2`, which has to sit at the site root. Packages belong to a user or organization and can be linked to a repository; blobs are stored once per content hash (`GetOrInsertBlob`). None of it is mounted unless `setting.Packages.Enabled`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Routes | `routers/api/packages/api.go` |\n| Container registry | `routers/api/packages/container/container.go`, `routers/api/packages/container/blob.go` |\n| Service | `services/packages/packages.go` |\n| Models | `models/packages/package.go`, `models/packages/package_version.go`, `models/packages/package_blob.go` |\n| Cleanup rules | `models/packages/package_cleanup_rule.go`, `services/packages/cleanup/cleanup.go` |\n| Web | `routers/web/user/package.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Packages]] — this module's business area\n- [[Users]] — a package's owner is a user or organization row\n- [[Cron Tasks]] — `cleanup_packages` runs the owners' cleanup rules and removes expired data\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Projects":{"path":"2 Modules/Projects.md","type":"module","status":"shipped","depth":"stub","domain":"Issues","repo":"gitea","updated":"2026-10-19","summary":"Kanban boards with columns.","aliases":[],"tags":["module","domain/issues"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Issues\nupdated: 2026-10-19\ntags: [module, domain/issues]\n---\n# Projects\n\n## What it is\n\nKanban boards with columns. A project belongs to a repository or to a user or organization (`RepoID` or `OwnerID`), and issues and pull requests are placed on its columns.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/project/project.go`, `models/project/column.go`, `models/issues/issue_project.go` |\n| Web | `routers/web/repo/projects.go`, `routers/web/org/projects.go`, `routers/web/shared/project/project.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Issues]] — this module's business area\n- [[Issues & Comments]] — the cards are issues and pull requests\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Pull Request Lifecycle":{"path":"2 Modules/Pull Request Lifecycle.md","type":"module","status":"shipped","depth":"stub","domain":"Pull Requests","repo":"gitea","updated":"2026-10-19","summary":"A pull request is an issue plus a `pull_request` row naming head and base.","aliases":[],"tags":["module","domain/pull-requests"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Pull Requests\nupdated: 2026-10-19\ntags: [module, domain/pull-requests]\n---\n# Pull Request Lifecycle\n\n## What it is\n\nA pull request is an issue plus a `pull_request` row naming head and base. `NewPullRequest` copies the head commits into the base repository at refs/pull/N/head (`PushToBaseRepo`), so diffs, checks and merges run against the base repository even for forks. Each later push to the head branch reaches the PR through `AddTestPullRequestTask`, which adds a push comment, marks reviews stale when the diff changed and restarts the mergeability check.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/issues/pull.go`, `models/issues/pull_list.go` |\n| Service | `services/pull/pull.go` |\n| Web | `routers/web/repo/pull.go`, `routers/web/repo/compare.go` |\n| API | `routers/api/v1/repo/pull.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Pull Requests]] — this module's business area\n- [[Mergeability Checks]] — every head or base update restarts the check\n- [[Code Review]] — reviews and code owner requests hang off the pull request\n- [[Merging a pull request]] — the end-to-end journey of the merge button\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Push Hooks":{"path":"2 Modules/Push Hooks.md","type":"module","status":"shipped","depth":"full","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"What happens when git receives a push.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":12,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Push Hooks\n\n## What it is\n\nWhat happens when git receives a push. Gitea's hook scripts call back into the server, which enforces branch protection before the refs land and queues the push for the rest of the system afterwards.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Hook command | `cmd/hook.go` |\n| Hook scripts | `modules/git/hooks.go` |\n| Internal client | `modules/private/hook.go` |\n| Pre-receive | `routers/private/hook_pre_receive.go` |\n| Post-receive | `routers/private/hook_post_receive.go` |\n| Push queue | `services/repository/push.go` |\n\n## How it works\n\nEvery repository's hooks directory holds dispatcher scripts written by `createDelegateHooks`: hooks/pre-receive runs each executable in hooks/pre-receive.d/, where Gitea's own script calls the Gitea binary as `hook --config=... pre-receive`. The same goes for `update` and `post-receive`; `proc-receive` calls the binary directly, with no dispatcher. The hook process does no database work. It reads the ref updates from stdin, takes the pusher and repository from environment variables that `gitea serv` or the HTTP handler set (`GITEA_PUSHER_ID`, `GITEA_REPO_NAME`, `GITEA_PR_ID`), and posts them to the internal API at `/api/internal/hook/pre-receive` and its siblings, in batches of 500 refs.\n\nOn the server, `HookPreReceive` checks each ref before git accepts it: branches against their protection rule, tags against protected tags, refs under refs/for/ against permission to open a pull request. One rejection fails the whole push. After git has written the refs, `HookPostReceive` keeps only branch and tag updates, marks deleted branches, syncs the rest into the `branch` table with `SyncBranchesToDB`, and hands the updates to `PushUpdates`, which only enqueues them on `push_update`. The queue worker `pushQueueHandleUpdates` loads the new commits, updates the repository size, starts `AddTestPullRequestTask` for pull requests whose head branch moved, adds reference comments for issues named in commit messages (`UpdateIssuesCommit`), and calls `notify_service.PushCommits`.\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Branches & Protection]] — pre-receive enforces the protection rules and post-receive syncs the `branch` table\n- [[Notifier fan-out]] — `pushQueueHandleUpdates` ends in `notify_service.PushCommits`\n- [[Pushing to a repository]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Without `SSH_ORIGINAL_COMMAND` in the environment (a push made straight into the repository on disk) the hooks skip all processing. `ONLY_ALLOW_PUSH_IF_GITEA_ENVIRONMENT_SET` (default true) rejects such pushes; turned off, they land with no branch sync, feed entry, webhook or workflow run.\n- `hookPostReceiveCollectPushUpdates` keeps only branches and tags, so pushes to other refs (refs/notes, refs/changes) produce no events at all.\n- Nothing after the refs are written can fail the push: `HookPostReceive` logs errors and carries on, and the fan-out runs later from the `push_update` queue. A successful `git push` does not mean its webhooks or workflow runs were created.\n- The hook scripts embed the binary and config paths (`setting.AppPath`, `setting.CustomConf`). If either changes, pushes keep calling the old paths until `syncAppConfForGit` rewrites the hooks at the next start or the `resync_all_hooks` cron task runs.\n\n## History\n\n-\n"},"Releases":{"path":"2 Modules/Releases.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Releases and tags share the `release` table: a pushed tag with no release still gets a row with `IsTag` set.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Releases\n\n## What it is\n\nReleases and tags share the `release` table: a pushed tag with no release still gets a row with `IsTag` set. `CreateRelease` creates the git tag only when the release is published, not for drafts, checks protected tag rules first, and only published releases notify.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/release/release.go`, `services/release/tag.go` |\n| Model | `models/repo/release.go` |\n| Web | `routers/web/repo/release.go` |\n| API | `routers/api/v1/repo/release.go`, `routers/api/v1/repo/tag.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Push Hooks]] — pushed tags become `release` rows in `PushUpdateAddDeleteTags`\n- [[Branches & Protection]] — protected tag rules are checked before a release creates its tag\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Repositories":{"path":"2 Modules/Repositories.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"A repository is a `Repository` row plus a git directory on disk.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Repositories\n\n## What it is\n\nA repository is a `Repository` row plus a git directory on disk. Each tab (code, issues, pull requests, releases, wiki, projects, packages, actions) is a repo unit from `models/unit/unit.go` that can be switched off per repository. `CreateRepository`, `ForkRepository`, `StartRepositoryTransfer` and `DeleteRepository` wrap the model work with notifications; a delete notifies before the rows go, so the repository's own webhooks still fire.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/repo/repo.go`, `models/repo/repo_unit.go` |\n| Units | `models/unit/unit.go` |\n| Service | `services/repository/repository.go`, `services/repository/create.go`, `services/repository/fork.go`, `services/repository/transfer.go`, `services/repository/delete.go` |\n| Web | `routers/web/repo/repo.go`, `routers/web/repo/setting/setting.go` |\n| API | `routers/api/v1/repo/repo.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Repository Permissions]] — permissions are computed per repo unit of the repository\n- [[Notifier fan-out]] — create, fork, rename, transfer and delete are announced through `notify_service`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Repository Permissions":{"path":"2 Modules/Repository Permissions.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Organizations","repo":"gitea","updated":"2026-10-19","summary":"`GetDoerRepoPermission` works out what the current actor may do in a repository, per repo unit.","aliases":[],"tags":["module","domain/users-organizations"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Users & Organizations\nupdated: 2026-10-19\ntags: [module, domain/users-organizations]\n---\n# Repository Permissions\n\n## What it is\n\n`GetDoerRepoPermission` works out what the current actor may do in a repository, per repo unit. Actions task users and deploy keys get their own rules; site admins and the owner get owner access; collaborators get their mode; for organization repositories each unit takes the highest mode across the user's teams. `services/context/repo.go` loads the result into each repository request as `ctx.Repo.Permission`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Computation | `models/perm/access/repo_permission.go`, `models/perm/access/access.go`, `models/perm/access_mode.go` |\n| Collaborators | `models/repo/collaboration.go`, `services/repository/collaboration.go`, `routers/web/repo/setting/collaboration.go` |\n| Request context | `services/context/repo.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Organizations]] — this module's business area\n- [[Organizations & Teams]] — team unit modes feed the per-unit result\n- [[Repositories]] — permissions are computed over the repository's enabled units\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Runners":{"path":"2 Modules/Runners.md","type":"module","status":"shipped","depth":"full","domain":"Actions","repo":"gitea","updated":"2026-10-19","summary":"The machines that execute jobs.","aliases":[],"tags":["module","domain/actions"],"flags":[],"inbound":7,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: gitea\ndomain: Actions\nupdated: 2026-10-19\ntags: [module, domain/actions]\n---\n# Runners\n\n## What it is\n\nThe machines that execute jobs. Runners poll the server over a Connect API, and a per-scope version counter decides whether a poll is worth a scan of the waiting jobs.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Runner API | `routers/api/actions/runner/runner.go`, `routers/api/actions/runner/interceptor.go` |\n| Task assignment | `services/actions/task.go` |\n| Models | `models/actions/runner.go`, `models/actions/task.go`, `models/actions/tasks_version.go`, `models/actions/runner_token.go` |\n| Web | `routers/web/shared/actions/runners.go` |\n\n## How it works\n\nA runner registers once with a registration token and from then on is identified on every call by its UUID and token headers, checked in `routers/api/actions/runner/interceptor.go`. It polls `FetchTask`, sending the `TasksVersion` it last saw. The server keeps a tasks version per scope in `models/actions/tasks_version.go`; `IncreaseTaskVersion` bumps the instance-wide counter and, when set, the owner's and the repository's, whenever a job becomes waiting, a job finishes while others still wait, or a runner is enabled or disabled. If the runner's version matches the stored one, `FetchTask` returns no task without touching the jobs table.\n\nOtherwise it reloads the runner and calls `TryPickTask`, which takes a slot from a semaphore sized by `MAX_CONCURRENT_TASK_PICKS` and runs `PickTask`. `CreateTaskForRunner` pages through waiting jobs in the runner's scope (one repository, one owner's repositories with Actions enabled, or everything for an instance runner) oldest first, skips jobs whose `runs-on` labels the runner lacks, and claims the first match in its own transaction with `claimJobForRunner`; losing the race to another runner moves on to the next job. The task payload, with secrets from `GetSecretsOfTask` and variables from `GetVariablesOfRun`, is then built. If that fails, or the poll request was cancelled meanwhile, the claim is released so the job goes back to waiting.\n\n## Connects to\n\n- [[Actions]] — this module's business area\n- [[Workflow Runs]] — runners execute the jobs that runs create\n- [[Secrets & Variables]] — the task payload carries secrets from `GetSecretsOfTask` and variables from `GetVariablesOfRun`\n- [[Running a workflow job]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `CanMatchLabels` requires the runner to carry every label in the job's `runs-on`, compared case-insensitively, and a job with an empty `runs-on` matches no runner. Unmatched jobs wait silently until `cancel_abandoned_jobs` cancels them after `ABANDONED_JOB_TIMEOUT` (24 hours by default).\n- Any code path that moves a job to waiting must call `IncreaseTaskVersion`. Idle runners whose version equals the stored one never reach `PickTask`, as the comment in `models/actions/run_job.go` explains.\n- When the pick semaphore is full, `FetchTask` returns no task and hands back the runner's old version so it retries on its next poll. A steady stream of these means `MAX_CONCURRENT_TASK_PICKS` (default 16) is too low for the fleet.\n- An ephemeral runner gets one task: on its next poll after that task is done, `PickTask` deletes the runner and returns an error.\n\n## History\n\n-\n"},"SSH & GPG Keys":{"path":"2 Modules/SSH & GPG Keys.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Organizations","repo":"gitea","updated":"2026-10-19","summary":"Users' SSH and GPG public keys, plus per-repository deploy keys.","aliases":[],"tags":["module","domain/users-organizations"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Users & Organizations\nupdated: 2026-10-19\ntags: [module, domain/users-organizations]\n---\n# SSH & GPG Keys\n\n## What it is\n\nUsers' SSH and GPG public keys, plus per-repository deploy keys. SSH keys authenticate git over SSH; signatures on commits are checked against the stored keys (`ParseCommitWithSignature`), and `services/asymkey/sign.go` decides whether Gitea signs the commits it makes itself (`SignMerge`, `SignWikiCommit`, `SignCRUDAction`).\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `models/asymkey/ssh_key.go`, `models/asymkey/gpg_key.go`, `models/asymkey/gpg_key_commit_verification.go`, `models/deploykey/deploykey.go` |\n| Service | `services/asymkey/ssh_key.go`, `services/asymkey/commit.go`, `services/asymkey/sign.go` |\n| Web | `routers/web/user/setting/keys.go`, `routers/web/repo/setting/deploy_key.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Organizations]] — this module's business area\n- [[Git over HTTP and SSH]] — an SSH key is how `gitea serv` knows the user\n- [[Merging]] — `SignMerge` decides whether a merge commit is signed\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Search Indexers":{"path":"2 Modules/Search Indexers.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"Full-text search for issues and code.","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Search Indexers\n\n## What it is\n\nFull-text search for issues and code. The issue indexer defaults to the built-in `bleve`; the code indexer is off by default (`RepoIndexerEnabled`), and repository code search then falls back to `git grep` on the one repository (`gitgrep.PerformSearch`). The indexer notifier reindexes code only for pushes to the default branch.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Code indexer | `modules/indexer/code/indexer.go`, `modules/indexer/code/gitgrep/gitgrep.go` |\n| Issue indexer | `modules/indexer/issues/indexer.go` |\n| Notifier | `services/indexer/notify.go`, `services/indexer/indexer.go` |\n| Settings | `modules/setting/indexer.go` |\n| Web | `routers/web/repo/search.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Notifier fan-out]] — the indexer notifier reacts to pushes and to issue and comment changes\n- [[Issues & Comments]] — issue search goes through the issue indexer\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Secrets & Variables":{"path":"2 Modules/Secrets & Variables.md","type":"module","status":"shipped","depth":"stub","domain":"Actions","repo":"gitea","updated":"2026-10-19","summary":"Values that workflows read.","aliases":[],"tags":["module","domain/actions"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Actions\nupdated: 2026-10-19\ntags: [module, domain/actions]\n---\n# Secrets & Variables\n\n## What it is\n\nValues that workflows read. Variables exist at instance, owner and repository level and secrets at owner and repository level; on a name clash the repository wins (`GetVariablesOfRun`, `GetSecretsOfTask`). Secrets are stored encrypted with `SECRET_KEY`, and runs from fork pull requests get only the automatic `GITEA_TOKEN`, except for `pull_request_target`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Secrets | `models/secret/secret.go`, `services/secrets/secrets.go`, `routers/web/shared/secrets/secrets.go` |\n| Variables | `models/actions/variable.go`, `routers/web/shared/actions/variables.go` |\n| Repo settings | `routers/web/repo/setting/secrets.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Actions]] — this module's business area\n- [[Runners]] — both are resolved when a task is handed to a runner\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Sign-in":{"path":"2 Modules/Sign-in.md","type":"module","status":"shipped","depth":"stub","domain":"Authentication","repo":"gitea","updated":"2026-10-19","summary":"Who a request is from.","aliases":[],"tags":["module","domain/authentication"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Authentication\nupdated: 2026-10-19\ntags: [module, domain/authentication]\n---\n# Sign-in\n\n## What it is\n\nWho a request is from. Each request runs a chain of auth methods (`auth.Group`) and the first that returns a user wins; on the web the chain is OAuth2, deploy token and Basic where a route allows them, then the reverse-proxy header if enabled, then the session, with SSPI last on Windows. Password sign-in goes through `UserSignIn`, which checks the local password or asks the user's login source (LDAP, SMTP, PAM); outside OAuth2 and OpenID providers sign in through `routers/web/auth/oauth.go`, and the web flow adds TOTP two-factor and WebAuthn passkeys.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Request auth | `services/auth/group.go`, `services/auth/session.go`, `services/auth/basic.go`, `services/auth/reverseproxy.go` |\n| Password sign-in | `services/auth/signin.go`, `models/auth/source.go` |\n| Login sources | `services/auth/source/ldap/source.go`, `services/auth/source/oauth2/providers.go` |\n| Second factor | `models/auth/twofactor.go`, `models/auth/webauthn.go`, `routers/web/auth/2fa.go`, `routers/web/auth/webauthn.go` |\n| Web | `routers/web/auth/auth.go`, `routers/web/auth/oauth.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Authentication]] — this module's business area\n- [[Access Tokens & OAuth2]] — the OAuth2 method in the chain verifies bearer tokens\n- [[Users]] — every method ends by returning a `user_model.User`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Users":{"path":"2 Modules/Users.md","type":"module","status":"shipped","depth":"stub","domain":"Users & Organizations","repo":"gitea","updated":"2026-10-19","summary":"Accounts, profiles, email addresses and personal settings.","aliases":[],"tags":["module","domain/users-organizations"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Users & Organizations\nupdated: 2026-10-19\ntags: [module, domain/users-organizations]\n---\n# Users\n\n## What it is\n\nAccounts, profiles, email addresses and personal settings. Organizations and bots are rows in the same `user` table with a different `Type`, so the owner of a repository, package or webhook is always a `user_model.User`. Blocking is checked with `IsUserBlockedBy` before issues and repository transfers.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `models/user/user.go`, `models/user/email_address.go` |\n| Service | `services/user/user.go`, `services/user/block.go`, `services/user/delete.go` |\n| Web | `routers/web/user/profile.go`, `routers/web/user/setting/profile.go`, `routers/web/user/setting/account.go` |\n| API | `routers/api/v1/user/user.go` |\n| Admin | `routers/web/admin/users.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Users & Organizations]] — this module's business area\n- [[Organizations & Teams]] — an organization is a `user` row of type organization\n- [[Email]] — `EmailNotificationsPreference` on the user decides which mail they get\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Webhooks":{"path":"2 Modules/Webhooks.md","type":"module","status":"shipped","depth":"full","domain":"Notifications & Webhooks","repo":"gitea","updated":"2026-10-19","summary":"Outgoing HTTP calls on repository, organization and system events, in the Gitea format or the message format of a chat service.","aliases":[],"tags":["module","domain/notifications-webhooks"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: gitea\ndomain: Notifications & Webhooks\nupdated: 2026-10-19\ntags: [module, domain/notifications-webhooks]\n---\n# Webhooks\n\n## What it is\n\nOutgoing HTTP calls on repository, organization and system events, in the Gitea format or the message format of a chat service. Preparation stores a task per matching hook; a queue worker delivers it and keeps the request and response for the delivery history.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Prepare and queue | `services/webhook/webhook.go`, `services/webhook/notifier.go` |\n| Deliver | `services/webhook/deliver.go`, `services/webhook/payloader.go`, `services/webhook/general.go` |\n| Models | `models/webhook/webhook.go`, `models/webhook/hooktask.go`, `models/webhook/webhook_system.go` |\n| Events | `modules/webhook/events.go` |\n| Web | `routers/web/repo/setting/webhook.go`, `routers/web/admin/hooks.go` |\n| API | `routers/api/v1/repo/hook.go` |\n\n## How it works\n\nEvery event that has a webhook equivalent reaches `webhookNotifier` in `services/webhook/notifier.go`, which builds the API payload and calls `PrepareWebhooks`. That collects the active hooks of the repository, then of its owner, then the admin-defined system hooks. `PrepareWebhook` skips a hook that does not subscribe to the event (`HasEvent`) or whose branch filter, a glob, matches neither the branch name nor the full ref, and otherwise stores a `HookTask` row with the payload as JSON. Only the task ID goes on the `webhook_sender` queue.\n\nThe queue worker calls `Deliver`. It picks the request builder registered for the hook's type with `RegisterWebhookRequester` (chat and other services get their own request format; the Gitea and Gogs types fall back to `newDefaultRequest`, which adds `X-Gitea-Signature` and `X-Hub-Signature-256` HMACs of the body when the hook has a secret), marks the task delivered with `MarkTaskDelivered` so a second worker cannot send it again, sends it through an HTTP client whose egress policy checks the target against `setting.Webhook.AllowedHostList`, and stores the request and response on the task for the hook's delivery history.\n\n## Connects to\n\n- [[Notifications & Webhooks]] — this module's business area\n- [[Notifier fan-out]] — `webhookNotifier` is one of the registered notifiers\n- [[Cron Tasks]] — `cleanup_hook_task_table` prunes the delivery history\n- [[Pushing to a repository]] — push events reach webhooks through `webhookNotifier.PushCommits`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Push events with no commits are dropped for every hook type except `GITEA` and `GOGS`, so Gitea-format hooks see them and every other type does not.\n- A task is marked delivered before the request is sent and the worker never retries, so a failed delivery stays failed until someone replays it (`ReplayHookTask` copies it into a new task). At startup `populateWebhookSendingQueue` re-queues only tasks that were never attempted.\n- `PrepareWebhooks` returns on the first hook whose task cannot be created, so the hooks after it in the list (owner and system hooks come after the repository's own) get nothing for that event.\n- `DISABLE_WEBHOOKS` turns preparation into a silent no-op, and the `cleanup_hook_task_table` cron task deletes delivered tasks older than 168 hours by default, which is as far back as the delivery history goes.\n\n## History\n\n-\n"},"Wiki":{"path":"2 Modules/Wiki.md","type":"module","status":"shipped","depth":"stub","domain":"Code","repo":"gitea","updated":"2026-10-19","summary":"The wiki is a second git repository beside the code one (`\u003cname>.wiki`).","aliases":[],"tags":["module","domain/code"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Code\nupdated: 2026-10-19\ntags: [module, domain/code]\n---\n# Wiki\n\n## What it is\n\nThe wiki is a second git repository beside the code one (`\u003cname>.wiki`). A web edit takes a per-repository lock, clones the wiki into a temporary repository, commits and pushes back. Wiki events are raised by the web and API handlers; both hooks skip the refs of a `git push` to the wiki, so it raises none.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Service | `services/wiki/wiki.go`, `services/wiki/wiki_path.go` |\n| Model | `models/repo/wiki.go` |\n| Web | `routers/web/repo/wiki.go` |\n| API | `routers/api/v1/repo/wiki.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Code]] — this module's business area\n- [[Push Hooks]] — the hook commands skip wiki refs\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Workflow Runs":{"path":"2 Modules/Workflow Runs.md","type":"module","status":"shipped","depth":"stub","domain":"Actions","repo":"gitea","updated":"2026-10-19","summary":"Turning repository events into workflow runs.","aliases":[],"tags":["module","domain/actions"],"flags":[],"inbound":7,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: gitea\ndomain: Actions\nupdated: 2026-10-19\ntags: [module, domain/actions]\n---\n# Workflow Runs\n\n## What it is\n\nTurning repository events into workflow runs. The Actions notifier receives pushes and pull request, issue, release and other events, reads workflow files from the first directory in `WORKFLOW_DIRS` that exists in the commit, and inserts an `ActionRun` with one `ActionRunJob` per job. The job emitter later resolves `needs` and concurrency to decide which jobs may start.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Notifier | `services/actions/notifier.go`, `services/actions/notifier_helper.go` |\n| Runs and jobs | `services/actions/run.go`, `services/actions/job_emitter.go` |\n| Workflow files | `modules/actions/workflows.go` |\n| Models | `models/actions/run.go`, `models/actions/run_job.go` |\n| Web | `routers/web/repo/actions/actions.go`, `routers/web/repo/actions/view.go` |\n| API | `routers/api/v1/repo/actions_run.go` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Actions]] — this module's business area\n- [[Runners]] — the waiting jobs it inserts are what runners pick up\n- [[Commit Statuses]] — jobs post their state through `CreateCommitStatusForRunJobs`\n- [[Running a workflow job]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Merging a pull request":{"path":"3 Flows/Merging a pull request.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"gitea","updated":"2026-10-19","summary":"A user presses the merge button.","aliases":[],"tags":["flow"],"flags":[],"inbound":3,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: gitea\nupdated: 2026-10-19\ntags: [flow]\n---\n# Merging a pull request\n\n## What happens\n\nA user presses the merge button. The checks run first, then the merge is made in a temporary clone and pushed to the base branch through the same hooks as any push; only after that is the pull request marked merged and the merge announced.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the merge form arrives | `MergePullRequest` | [[Pull Request Lifecycle]] |\n| 2 | permission, work in progress, conflicts, branch protection, signing and dependencies are checked | `pull_service.CheckPullMergeable` | [[Merging]] |\n| 3 | with merge when checks succeed, the merge is scheduled instead | `automerge.ScheduleAutoMerge` | [[Auto-merge]] |\n| 4 | `Merge` holds a per-pull-request global lock for the whole operation | `pull_service.Merge` | [[Merging]] |\n| 5 | the base branch is cloned into a temporary repository and merged in the chosen style | `createTemporaryRepoForMerge` | [[Merging]]
