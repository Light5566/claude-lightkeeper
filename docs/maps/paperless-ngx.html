gs, correspondents, document types, storage paths, a custom field query and the original filename.\n\nDuring consumption the actions write into the `DocumentMetadataOverrides` that `ConsumerPlugin` applies later. For the other triggers they change the document, which is saved with a fixed `update_fields` list, and a `WorkflowRun` row is written. Document Added runs from `document_consumption_finished`, Document Updated from `document_updated`, and Scheduled from the hourly `check_scheduled_workflows` task, which picks documents by added, created, modified or a date custom field plus an offset in days (custom field dates only from the last 365 days) and uses `WorkflowRun` to run non-recurring workflows once per document.\n\n## Connects to\n\n- [[Workflows]] — this module's business area\n- [[Running workflows on an edited document]] — the Document Updated journey\n- [[Workflow actions]] — what a matched workflow then does\n- [[Consumer]] — `WorkflowTriggerPlugin` runs Consumption Started workflows before parsing\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A Consumption Started trigger can only filter on source, mail rule, filename and path, because the file has not been parsed yet; `consumable_document_matches_workflow` never reads the content, tag or other document filters.\n- Consumption Started workflows run after barcode splitting (`WorkflowTriggerPlugin` comes after `BarcodePlugin`), so each split part is matched on its own, and its path filter is compared with `original_path`, the file that was split.\n- Move to trash always happens last: `run_workflows` only notes the action while looping and calls `execute_move_to_trash_action` after the other actions and the save, wherever it sits in the list.\n- A workflow's save does not send `document_updated`, so one workflow's changes never fire Document Updated workflows. Within one run, each workflow on a saved document starts with `document.refresh_from_db()`, so it sees what earlier workflows assigned.\n\n## History\n\n-\n"},"Consuming a document":{"path":"3 Flows/Consuming a document.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"A file arrives by upload, the consume folder or mail and becomes a stored document.","aliases":[],"tags":["flow"],"flags":[],"inbound":4,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [flow]\n---\n# Consuming a document\n\n## What happens\n\nA file arrives by upload, the consume folder or mail and becomes a stored document. One `consume_file` task runs a chain of plugins; the consumer parses the file with the best parser, saves the record, lets matching, workflows and the index react to `document_consumption_finished`, and copies the files into place.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | an upload is written to the scratch directory and queued | `PostDocumentView` | [[Upload]] |\n| 2 | or the folder watcher queues a file that stopped changing | `_consume_file` | [[Consume folder]] |\n| 3 | the task runs its plugin chain | `consume_file` | [[Consumer]] |\n| 4 | preflight checks the file exists and looks for duplicates | `ConsumerPreflightPlugin.pre_check_duplicate` | [[Consumer]] |\n| 5 | barcodes split the file or set ASN and tags | `BarcodePlugin` | [[Barcodes]] |\n| 6 | Consumption Started workflows edit the overrides | `WorkflowTriggerPlugin` | [[Workflow triggers]] |\n| 7 | the highest-scoring parser is chosen | `ParserRegistry.get_parser_for_file` | [[Parser registry]] |\n| 8 | the parser extracts text, runs OCR and builds the archive PDF | `RasterisedDocumentParser.parse` | [[OCR parser]] |\n| 9 | the document row is created and the overrides applied | `ConsumerPlugin._store` | [[Consumer]] |\n| 10 | inbox tags and matching fill the empty fields | `set_correspondent` | [[Matching]] |\n| 11 | Document Added workflows run | `run_workflows_added` | [[Workflow triggers]] |\n| 12 | the document is indexed | `add_to_index` | [[Full-text search]] |\n| 13 | files are copied to their generated names | `generate_unique_filename` | [[Storage paths]] |\n\n## Modules crossed\n\n- [[Upload]] — an upload is written to the scratch directory and queued\n- [[Consume folder]] — or the folder watcher queues a file that stopped changing\n- [[Consumer]] — the task runs its plugin chain\n- [[Barcodes]] — barcodes split the file or set ASN and tags\n- [[Workflow triggers]] — Consumption Started workflows edit the overrides\n- [[Parser registry]] — the highest-scoring parser is chosen\n- [[OCR parser]] — the parser extracts text, runs OCR and builds the archive PDF\n- [[Matching]] — inbox tags and matching fill the empty fields\n- [[Full-text search]] — the document is indexed\n- [[Storage paths]] — files are copied to their generated names\n\n## Where it breaks\n\n- Everything hanging off `document_consumption_finished` runs inside the database transaction and before the files are on disk. If copying the files fails the record rolls back, but emails and webhooks from Document Added workflows have already been sent or queued.\n"},"Fetching mail into documents":{"path":"3 Flows/Fetching mail into documents.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Every ten minutes by default, Celery beat runs `process_mail_accounts`.","aliases":[],"tags":["flow"],"flags":[],"inbound":3,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [flow]\n---\n# Fetching mail into documents\n\n## What happens\n\nEvery ten minutes by default, Celery beat runs `process_mail_accounts`. Each account's rules search their folder, skip mail already recorded as processed, and queue the message or its attachments for consumption; the rule's mail action runs only after the consume tasks queued with it succeed.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | beat starts the fetch, guarded by a cache lock | `process_mail_accounts` | [[Mail accounts]] |\n| 2 | each account is opened, refreshing an expired OAuth token | `MailAccountHandler.handle_mail_account` | [[Mail accounts]] |\n| 3 | enabled rules run in order | `MailAccountHandler._handle_mail_rule` | [[Mail rules]] |\n| 4 | filters and the action become an IMAP search | `make_criterias` | [[Mail rules]] |\n| 5 | UIDs with a processed-mail row are dropped | `ProcessedMail` | [[Mail rules]] |\n| 6 | matching attachments are staged | `MailAccountHandler._process_attachments` | [[Mail rules]] |\n| 7 | or the whole message is staged as .eml | `MailAccountHandler._process_eml` | [[Mail rules]] |\n| 8 | consume tasks are chained to the mail action | `queue_consumption_tasks` | [[Mail rules]] |\n| 9 | each staged file is consumed | `consume_file` | [[Consumer]] |\n| 10 | .eml files are rendered to PDF | `MailDocumentParser` | [[Mail parser]] |\n| 11 | the action runs and the mail is recorded | `apply_mail_action` | [[Mail rules]] |\n| 12 | or a failure is recorded | `error_callback` | [[Mail rules]] |\n\n## Modules crossed\n\n- [[Mail accounts]] — beat starts the fetch, guarded by a cache lock\n- [[Mail rules]] — enabled rules run in order\n- [[Consumer]] — each staged file is consumed\n- [[Mail parser]] — .eml files are rendered to PDF\n\n## Where it breaks\n\n- A failed consume task stops its chord: `error_callback` records the message as FAILED and that chord's mail action never runs. Because any `ProcessedMail` row counts as processed, that message is not fetched again until the row is deleted.\n"},"Running workflows on an edited document":{"path":"3 Flows/Running workflows on an edited document.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"A user saves a document, or a bulk edit finishes.","aliases":[],"tags":["flow"],"flags":[],"inbound":4,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [flow]\n---\n# Running workflows on an edited document\n\n## What happens\n\nA user saves a document, or a bulk edit finishes. `document_updated` fires, and `run_workflows` checks every enabled workflow with a Document Updated trigger and applies the actions of those that match, in order.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the edit is saved through the API | `DocumentViewSet.update` | [[Document detail]] |\n| 2 | or a bulk edit replays the signal per document | `bulk_update_documents` | [[Bulk edit]] |\n| 3 | the signal reaches the workflow runner | `run_workflows_updated` | [[Workflow triggers]] |\n| 4 | enabled workflows for the trigger are loaded in order | `get_workflows_for_trigger` | [[Workflow triggers]] |\n| 5 | each trigger's filters are checked against the saved document | `existing_document_matches_workflow` | [[Workflow triggers]] |\n| 6 | assignment and removal actions change the document | `apply_assignment_to_document` | [[Workflow actions]] |\n| 7 | email is sent and webhooks are queued | `execute_webhook_action` | [[Workflow actions]] |\n| 8 | the document is saved and the run recorded | `WorkflowRun` | [[Workflow triggers]] |\n| 9 | a move-to-trash action runs last | `execute_move_to_trash_action` | [[Workflow actions]] |\n| 10 | open screens are told the document changed | `send_websocket_document_updated` | [[Consumption status]] |\n\n## Modules crossed\n\n- [[Document detail]] — the edit is saved through the API\n- [[Bulk edit]] — or a bulk edit replays the signal per document\n- [[Workflow triggers]] — the signal reaches the workflow runner\n- [[Workflow actions]] — assignment and removal actions change the document\n- [[Consumption status]] — open screens are told the document changed\n\n## Where it breaks\n\n- The workflow's own save does not send `document_updated`, so a change made by one workflow never triggers Document Updated workflows again.\n"},"Celery tasks and signals":{"path":"5 Platform/Celery tasks and signals.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Web requests stay short.","aliases":[],"tags":["platform"],"flags":[],"inbound":5,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [platform]\n---\n# Celery tasks and signals\n\n## What it is\n\nWeb requests stay short. Uploads, mail fetches, bulk edits, reprocessing and scheduled jobs become Celery tasks, and inside a task the side effects hang off three Django signals from `src/documents/signals/__init__.py`: `document_consumption_started`, `document_consumption_finished` and `document_updated`. `DocumentsConfig.ready` connects inbox tags, matching, Document Added workflows, indexing and the LLM index to the finish signal, and Document Updated workflows, the websocket update and the LLM index to the update signal. Celery beat runs the schedule built by `parse_beat_schedule`; each entry reads a cron expression from its own environment variable, such as `PAPERLESS_TRAIN_TASK_CRON`, and the value `disable` drops it. Task messages and results use a `signed-pickle` serializer keyed on the secret key, and Celery's own publish, prerun, postrun and failure signals keep a `PaperlessTask` row per tracked task.\n\n## Connects to\n\n- [[Consumer]] — the main task, `consume_file`\n- [[Tasks]] — the screen over the `PaperlessTask` rows\n- [[Workflow triggers]] — Document Added and Document Updated workflows are signal receivers\n- [[Full-text search]] — `add_to_index` is a receiver of the finish signal\n- [[Mail accounts]] — `process_mail_accounts` is a beat entry\n\n## Gotchas\n\n- Only task names listed in `TRACKED_TASKS` get a `PaperlessTask` row. `send_webhook`, `index_document` and `process_cf_select_update` run without one and never appear on the Tasks screen.\n- `CELERY_WORKER_MAX_TASKS_PER_CHILD` is 1, so every worker process runs one task and is replaced, and module-level state such as the parser registry lasts for that one task.\n- `CELERY_TASK_TIME_LIMIT` comes from `PAPERLESS_WORKER_TIMEOUT`, 1800 seconds by default, and a task that runs longer is killed.\n- Receivers run in the order `ready()` connected them, so a Document Added workflow sees what matching assigned, and `add_to_index` runs after both.\n- When `PAPERLESS_EMAIL_TASK_CRON` is unset the mail schedule is not plain every ten minutes: the minute offset comes from a hash of `PAPERLESS_SECRET_KEY`, so instances do not all poll at the same minute.\n"},"Parser registry":{"path":"5 Platform/Parser registry.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Every file type is handled by a parser class held in one `ParserRegistry`.","aliases":[],"tags":["platform"],"flags":[],"inbound":7,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [platform]\n---\n# Parser registry\n\n## What it is\n\nEvery file type is handled by a parser class held in one `ParserRegistry`. `register_defaults` adds the five built-ins (`TextDocumentParser`, `RemoteDocumentParser`, `TikaDocumentParser`, `MailDocumentParser`, `RasterisedDocumentParser`), and `discover` loads third-party classes from the `paperless_ngx.parsers` entry point group, keeping only those with `name`, `version`, `author`, `url`, `supported_mime_types` and `score`. For a file, `get_parser_for_file` asks every parser whose `supported_mime_types` lists the MIME type for a `score`: `None` means not available, the highest number wins, and on a tie an external parser beats a built-in. Parsers flagged `uses_remote_service` are skipped unless remote processing is allowed. The consumer then drives the chosen class through `ParserProtocol`: `configure`, `parse`, `get_thumbnail`, `get_text`, `get_date`, `get_archive_path`, `get_page_count`.\n\n## Connects to\n\n- [[Consumer]] — the only caller that runs a full parse\n- [[OCR parser]] — the built-in for PDFs and images, score 10\n- [[Remote OCR]] — scores 20 when configured and is the one parser with `uses_remote_service`\n- [[Office and text parsers]] — Tika scores `None` while disabled\n- [[Mail parser]] — the built-in for `.eml` files\n\n## Gotchas\n\n- Celery workers register only the built-ins at start (`init_builtin_parsers` in `worker_process_init`); third-party parsers are discovered on the first `get_parser_registry()` call inside a task.\n- Three checks decide whether a type is supported. The consume folder filters on `get_supported_file_extensions`, which lists every parser's types without scoring, so a `.docx` is picked up with Tika off and then fails in the consumer as an unsupported type. Upload validation and mail attachments use `is_mime_type_supported`, which scores, so the same file is refused or skipped.\n- `should_produce_archive` must get a parser instance: `requires_pdf_rendition` and `can_produce_archive` are instance properties, and read on the class they are always truthy.\n"},"Configuration screen overrides the environment":{"path":"6 Decisions/Configuration screen overrides the environment.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Settings edited on the Configuration screen are stored in one `ApplicationConfiguration` row, and each config class in `src/paperless/config.py` prefers that row's value over the environment variable for the same setting.","aliases":[],"tags":["decision"],"flags":[],"inbound":2,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Configuration screen overrides the environment\n\n## Decision\n\nSettings edited on the Configuration screen are stored in one `ApplicationConfiguration` row, and each config class in `src/paperless/config.py` prefers that row's value over the environment variable for the same setting.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nThe config classes are built at the moment of use (`OcrConfig()` in the OCR parser's `__init__`, `BarcodeConfig()` in the barcode plugin, `RemoteOCRConfig()` in the consumer), so a value changed on the screen applies to the next document without a restart, and the environment stays the default for anything left blank.\n\n## Consequences\n\nMost fields fall back with `or`, so a falsy value on the screen, such as an empty string or 0 pages, means use the environment, not zero. Booleans like `deskew` are compared with `is not None`, so an unticked box does override the environment. Settings outside the row, such as `PAPERLESS_CONSUMER_DELETE_DUPLICATES` or `PAPERLESS_TIKA_ENABLED`, can only be set in the environment.\n\n## Affects\n\n- [[Configuration]] — the screen and the row\n- [[OCR parser]] — reads `OcrConfig` for every document\n- [[Barcodes]] — reads `BarcodeConfig` for every consume task\n"},"Duplicate files are consumed by default":{"path":"6 Decisions/Duplicate files are consumed by default.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A file whose SHA-256 matches an existing document is still consumed.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Duplicate files are consumed by default\n\n## Decision\n\nA file whose SHA-256 matches an existing document is still consumed. `ConsumerPreflightPlugin.pre_check_duplicate` only logs a warning unless `PAPERLESS_CONSUMER_DELETE_DUPLICATES` is set, and `checksum` has an index but no unique constraint.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nKeeping the copy means nothing sent in is dropped silently. The document API's `duplicate_documents` field, filled on the detail view, lists the other documents with the same checksum that the user may see, so the document screen can point at them.\n\n## Consequences\n\nThe same file sent twice, by upload, folder or mail, becomes two documents unless the setting is on. With it on, the incoming file is deleted, the task ends with a `duplicate_of` result, and the Tasks screen shows it as a failure.\n\n## Affects\n\n- [[Consumer]] — the preflight check lives there\n- [[Document detail]] — shows `duplicate_documents`\n- [[Tasks]] — a rejected duplicate is recorded as a failed task\n"},"paperless-ngx":{"path":"8 Repos/paperless-ngx.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Paperless-ngx is a self-hosted document management system under GPL-3.0.","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [repo]\n---\n# paperless-ngx\n\n## What it is\n\nPaperless-ngx is a self-hosted document management system under GPL-3.0. It takes scans, PDFs, office files and mail, runs OCR, assigns metadata, stores the files under predictable names and makes the text searchable. This vault is a demo map of its code, written from the checkout and checked against it.\n\n## Where it lives\n\n`src/` is the Django project: `src/documents` (documents, consumption, matching, workflows, search), `src/paperless` (settings, auth, parsers, configuration, websockets), `src/paperless_mail` (mail fetching) and `src/paperless_ai` (LLM features). `src-ui/` is the Angular front end and `docker/` builds the container image. The changelog is `docs/changelog.md`. This checkout is the `dev` branch, the repository's default.\n\n## How it works\n\nThe container's s6 services in `docker/rootfs/etc/s6-overlay/s6-rc.d/` start the ASGI web server (Granian serving `paperless.asgi`), a Celery worker, Celery beat and the consume-folder watcher `document_consumer`, plus Flower when `PAPERLESS_ENABLE_FLOWER` is set. Requests stay short; anything slow becomes a Celery task, and side effects hang off Django signals. File types are handled by pluggable parsers.\n\n## Connects to\n\n- [[Home]] — the domains\n- [[Consuming a document]] — the main journey through the code\n- [[Celery tasks and signals]] — how the work is split between requests, tasks and signals\n- [[Parser registry]] — how a file type finds its parser\n\n## Gotchas\n\n- The REST API version is set twice: `DEFAULT_VERSION` in `src/paperless/settings/__init__.py` and `apiVersion` in `src-ui/src/environments/environment.prod.ts`, which the UI sends in its `Accept` header through `src-ui/src/app/interceptors/api-version.interceptor.ts`.\n- Settings live in the `src/paperless/settings/` package, not a single settings module; the comment next to `apiVersion` still names the old single file.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A living map of how Paperless-ngx is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Paperless-ngx — the world\n\nA living map of how Paperless-ngx is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[paperless-ngx]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Documents]] | The list, the document screen, versions, bulk edit, saved views and share links |\n| [[Consumption]] | Upload, consume folder, barcodes and the consume task |\n| [[Parsers & OCR]] | OCR, remote OCR, office, text and date parsers |\n| [[Attributes]] | Tags, correspondents, document types, storage paths and custom fields |\n| [[Matching & Classification]] | Rule matching, the trained classifier and AI suggestions |\n| [[Mail]] | Mail accounts, mail rules and the mail parser |\n| [[Workflows]] | Triggers and actions |\n| [[Search]] | The full-text index, global search and document chat |\n| [[Administration]] | Users and permissions, sign-in, configuration, tasks and trash |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[Consuming a document]] — A file arrives by upload, the consume folder or mail and becomes a stored document\n- [[Fetching mail into documents]] — Every ten minutes by default, Celery beat runs `process_mail_accounts`\n- [[Running workflows on an edited document]] — A user saves a document, or a bulk edit finishes\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n- [[Parser registry]] · [[Celery tasks and signals]]\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Configuration screen overrides the environment]] — Settings edited on the Configuration screen are stored in one `ApplicationConfiguration` row, and each config class in `src/paperless/config.py` prefers that row's value over the environment variable for the same setting\n- [[Duplicate files are consumed by default]] — A file whose SHA-256 matches an existing document is still consumed\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/vault:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**4 of 36 module notes are `full`.** 59 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n- [[Consumer]] — Consumption\n- [[Mail rules]] — Mail\n- [[Matching]] — Matching & Classification\n- [[Workflow triggers]] — Workflows\n\n## Stub — promote on next touch\n\n- [[AI suggestions]] — Matching & Classification\n- [[Barcodes]] — Consumption\n- [[Bulk edit]] — Documents\n- [[Classifier]] — Matching & Classification\n- [[Configuration]] — Administration\n- [[Consume folder]] — Consumption\n- [[Consumption status]] — Consumption\n- [[Correspondents]] — Attributes\n- [[Custom fields]] — Attributes\n- [[Date parsing]] — Parsers & OCR\n- [[Document chat]] — Search\n- [[Document detail]] — Documents\n- [[Document list]] — Documents\n- [[Document types]] — Attributes\n- [[Document versions]] — Documents\n- [[Double-sided collation]] — Consumption\n- [[Full-text search]] — Search\n- [[Mail accounts]] — Mail\n- [[Mail parser]] — Mail\n- [[OCR parser]] — Parsers & OCR\n- [[Office and text parsers]] — Parsers & OCR\n- [[Remote OCR]] — Parsers & OCR\n- [[Saved views]] — Documents\n- [[Share links]] — Documents\n- [[Sign-in & profile]] — Administration\n- [[Storage paths]] — Attributes\n- [[Tags]] — Attributes\n- [[Tasks]] — Administration\n- [[Trash]] — Administration\n- [[Upload]] — Consumption\n- [[Users & groups]] — Administration\n- [[Workflow actions]] — Workflows\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/vault:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-19 · Seed the Paperless-ngx map: 9 domains, 36 modules, 3 flows, 2 platform notes, 2 decisions · `4f19604` · 1 Domains: Administration, Attributes, Consumption, Documents, Mail, Matching & Classification (+3); 2 Modules: AI suggestions, Barcodes, Bulk edit, Classifier, Configuration, Consume folder (+30); 3 Flows: Consuming a document, Fetching mail into documents, Running workflows on an edited document; 5 Platform: Celery tasks and signals, Parser registry; 6 Decisions: Configuration screen overrides the environment, Duplicate files are consumed by default; 8 Repos: paperless-ngx; .: Home\n- 2026-10-19 · Start the Paperless-ngx knowledge vault · `62cc335` · 8 Repos: paperless-ngx; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"Administration","to":"Users & groups","reason":"Users, groups and two layers of permission: model permissions decide which kinds of object a user may view, add, change or delete, and an owner plus per-object view and change grants (django-guardian) decide which objects"},{"from":"Administration","to":"Sign-in & profile","reason":"Browser sign-in goes through django-allauth, with optional social accounts and TOTP; the API also accepts basic auth, tokens and the session"},{"from":"Administration","to":"Configuration","reason":"The Configuration screen edits one ApplicationConfiguration row holding OCR, barcode, remote OCR, AI and branding settings"},{"from":"Administration","to":"Tasks","reason":"A PaperlessTask row per tracked Celery task, created when the task is published and updated from Celery's prerun, postrun and failure signals"},{"from":"Administration","to":"Trash","reason":"Deleting a document only sets deleted_at; the trash lists those documents, restores them, or removes them for good with empty_trash, which also runs daily for documents older than PAPERLESS_EMPTY_TRASH_DELAY days (30 by default)"},{"from":"Attributes","to":"Tags","reason":"Tags nest up to five levels deep (MAX_NESTING_DEPTH), and add_nested_tags adds every ancestor along with the tag"},{"from":"Attributes","to":"Correspondents","reason":"Who a document is from or to; a document has at most one"},{"from":"Attributes","to":"Document types","reason":"The kind of document; a document has at most one"},{"from":"Attributes","to":"Storage paths","reason":"A storage path is a Jinja template for where a document's files live under the originals and archive folders"},{"from":"Attributes","to":"Custom fields","reason":"Typed extra fields (string, URL, date, boolean, integer, float, monetary, document link, select, long text) stored per document as CustomFieldInstance rows"},{"from":"Consumption","to":"Consumer","reason":"Turns one incoming file into a stored document"},{"from":"Consumption","to":"Upload","reason":"POST /api/documents/post_document/ refuses types no parser can handle, writes the file to the scratch directory and queues consume_file with the form fields as overrides and the uploader as owner"},{"from":"Consumption","to":"Consume folder","reason":"The document_consumer command watches CONSUMPTION_DIR with watchfiles, using native events or polling when PAPERLESS_CONSUMER_POLLING_INTERVAL is set, and queues consume_file once a file has stopped changing"},{"from":"Consumption","to":"Barcodes","reason":"BarcodePlugin reads barcodes from PDFs, and from TIFFs when enabled, before the document is parsed"},{"from":"Consumption","to":"Double-sided collation","reason":"With PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED on, scans dropped into the double-sided subfolder are paired: the first file is kept for up to 30 minutes as a staging PDF of the odd pages, and the next one is interleaved with it in reverse page order"},{"from":"Consumption","to":"Consumption status","reason":"Consume tasks report progress to the channel layer group status_updates, and StatusConsumer forwards each message over /ws/status/ to signed-in users allowed to see that document"},{"from":"Documents","to":"Document list","reason":"The documents screen and GET /api/documents/: filtering, sorting and paging over the documents a user may see"},{"from":"Documents","to":"Document detail","reason":"The single-document screen: preview, metadata form, content, notes, history and suggestions"},{"from":"Documents","to":"Document versions","reason":"A document can hold several files as versions"},{"from":"Documents","to":"Bulk edit","reason":"Changes many documents at once: correspondent, type, storage path, tags, custom fields, permissions, delete and reprocess, plus PDF operations such as rotate, merge, split and delete pages"},{"from":"Documents","to":"Saved views","reason":"A named document list: filter rules, sort, page size and display fields"},{"from":"Documents","to":"Share links","reason":"A share link is a public URL, /share/\u003cslug>, that serves one document's archive or original file to anyone until it expires"},{"from":"Mail","to":"Mail accounts","reason":"An IMAP account that signs in with a password or with an OAuth token from one of two built-in providers, refreshed when it has expired"},{"from":"Mail","to":"Mail rules","reason":"A mail rule says which messages in one folder of a mail account become documents, which parts to consume, what metadata to give them and what to do with the message afterwards"},{"from":"Mail","to":"Mail parser","reason":"MailDocumentParser handles .eml files: it reads the message, renders it to PDF through Gotenberg with the rule's pdf_layout or PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT, and extracts HTML text through Tika"},{"from":"Matching & Classification","to":"Matching","reason":"Decides which correspondent, document type, tags and storage path a document gets from its text"},{"from":"Matching & Classification","to":"Classifier","reason":"A scikit-learn model, a CountVectorizer feeding one MLPClassifier per field, that learns tags, correspondent, document type and storage path from documents whose objects use the Automatic algorithm"},{"from":"Matching & Classification","to":"AI suggestions","reason":"With AI enabled, get_ai_document_classification asks the configured LLM for a title, tags, correspondent, document type, storage path and dates, giving it similar documents and the existing taxonomy as context"},{"from":"Parsers & OCR","to":"OCR parser","reason":"RasterisedDocumentParser handles PDFs and images with OCRmyPDF and Tesseract, steered by PAPERLESS_OCR_MODE (auto, force, redo, off)"},{"from":"Parsers & OCR","to":"Remote OCR","reason":"RemoteDocumentParser sends PDFs and images to a cloud OCR engine and gets back text and a searchable PDF"},{"from":"Parsers & OCR","to":"Office and text parsers","reason":"Word processor, spreadsheet, presentation and RTF files go to TikaDocumentParser, which takes the text from a Tika server and a PDF rendition from Gotenberg; it is only offered when PAPERLESS_TIKA_ENABLED is on"},{"from":"Parsers & OCR","to":"Date parsing","reason":"When a parser returns no date, the consumer takes the first date yielded by the parser that get_date_parser() returns"},{"from":"Search","to":"Full-text search","reason":"A Tantivy index under INDEX_DIR, written by add_to_index and the document update paths, and read when the document list sends text, title_search, query or more_like_id"},{"from":"Search","to":"Document chat","reason":"Questions about one document, or about every document the user may view, are answered by an LLM over an embedding index kept in a SQLite vector store, and streamed back as server-sent events from /api/documents/chat/"},{"from":"Workflows","to":"Workflow triggers","reason":"A workflow is a set of triggers and an ordered list of actions"},{"from":"Workflows","to":"Workflow actions","reason":"The code behind each action type: assignment, removal, email, webhook, password removal, move to trash, remote OCR and AI suggestions"},{"from":"AI suggestions","to":"Matching & Classification","reason":"this module's business area"},{"from":"AI suggestions","to":"Document chat","reason":"both read their LLM settings from AIConfig"},{"from":"AI suggestions","to":"Workflow actions","reason":"apply_ai_suggestions is queued with delay_on_commit by the workflow runner"},{"from":"Barcodes","to":"Consumption","reason":"this module's business area"},{"from":"Barcodes","to":"Consumer","reason":"it runs as a consume plugin between collation and the workflow trigger"},{"from":"Barcodes","to":"Configuration","reason":"BarcodeConfig takes the Configuration screen's barcode values before the environment"},{"from":"Bulk edit","to":"Documents","reason":"this module's business area"},{"from":"Bulk edit","to":"Running workflows on an edited document","reason":"bulk_update_documents sends document_updated for each changed document"},{"from":"Bulk edit","to":"Storage paths","reason":"it also sends post_save, which renames and moves files"},{"from":"Classifier","to":"Matching & Classification","reason":"this module's business area"},{"from":"Classifier","to":"Matching","reason":"the match_correspondents family accepts a prediction only for objects set to MATCH_AUTO"},{"from":"Classifier","to":"Celery tasks and signals","reason":"training is a beat entry controlled by PAPERLESS_TRAIN_TASK_CRON"},{"from":"Configuration","to":"Administration","reason":"this module's business area"},{"from":"Configuration","to":"Configuration screen overrides the environment","reason":"the rule and its consequences"},{"from":"Configuration","to":"OCR parser","reason":"OcrConfig is the largest reader of the row"},{"from":"Consume folder","to":"Consumption","reason":"this module's business area"},{"from":"Consume folder","to":"Consumer","reason":"each stable file becomes a consume_file task with source ConsumeFolder"},{"from":"Consume folder","to":"Parser registry","reason":"the watcher's extension filter comes from get_supported_file_extensions"},{"from":"Consumer","to":"Consumption","reason":"this module's business area"},{"from":"Consumer","to":"Consuming a document","reason":"the end-to-end journey"},{"from":"Consumer","to":"Parser registry","reason":"get_parser_for_file picks the parser"},{"from":"Consumer","to":"Matching","reason":"matching runs as receivers of document_consumption_finished"},{"from":"Consumption status","to":"Consumption","reason":"this module's business area"},{"from":"Consumption status","to":"Upload","reason":"the upload widget follows its task id through these messages"},{"from":"Consumption status","to":"Consumer","reason":"_send_progress sends the owner and view grants with every message"},{"from":"Correspondents","to":"Attributes","reason":"this module's business area"},{"from":"Correspondents","to":"Matching","reason":"set_correspondent fills it only when it is empty"},{"from":"C <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
const COLORS = [
  ['module', '#e8832a', 'module'], ['stub', '#708090', 'stub'], ['deprecated', '#9b1c1c', 'deprecated'],
  ['domain', '#e0609a', 'domain'], ['flow', '#3aa65b', 'flow'], ['integration', '#3b7ddd', 'integration'],
  ['platform', '#8e5bd6', 'platform'], ['decision', '#d9b400', 'decision'], ['release', '#8d8d8d', 'release'],
  ['repo', '#2a9d8f', 'repo'], ['meta', '#b5b5b5', 'other']];
const COLOR = Object.fromEntries(COLORS.map(c => [c[0], c[1]]));
const colorOf = n => n.status === 'deprecated' ? COLOR.deprecated : n.depth === 'stub' ? COLOR.stub : (COLOR[n.type] || COLOR.meta);

// --- data shaping ----------------------------------------------------------
const nodes = Object.keys(data.notes).sort().map(id => Object.assign({id: id}, data.notes[id]));
const byId = new Map(nodes.map(n => [n.id, n]));
const pairs = new Map();            // one drawn line per unordered pair; every reason kept
for (const l of data.links) {
  const k = l.from < l.to ? l.from + '\u0001' + l.to : l.to + '\u0001' + l.from;
  let p = pairs.get(k);
  if (!p) { p = {source: l.from, target: l.to, reasons: []}; pairs.set(k, p); }
  p.reasons.push(l);
}
const links = Array.from(pairs.values());
const degree = new Map();
for (const l of links) { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); }
const radius = n => 4 + Math.sqrt(degree.get(n.id) || 0) * 1.6;
const lookup = new Map();           // lowercased name or alias -> id
for (const n of nodes) { lookup.set(n.id.toLowerCase(), n.id); for (const a of n.aliases || []) lookup.set(String(a).toLowerCase(), n.id); }
for (const a in data.aliases) if (byId.has(data.aliases[a])) lookup.set(a.toLowerCase(), data.aliases[a]);
const resolve = name => lookup.get(name.trim().toLowerCase()) || null;

document.getElementById('stats').textContent = nodes.length + ' notes · ' + data.links.length + ' links · ' + data.vault + (data.built_at ? ' · built ' + data.built_at : '');
document.getElementById('legend').innerHTML = COLORS.map(c => '<span style="--c:' + c[1] + '">' + c[2] + '</span>').join('');

// --- graph -----------------------------------------------------------------
const svg = d3.select('#graph');
const g = svg.append('g');
const tip = document.getElementById('tip');
const moveTip = e => { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 400) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); };
const hideTip = () => { tip.style.display = 'none'; };

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
// A wide transparent twin of each edge is the hover target: a 1px line is unhoverable.
const hit = g.append('g').attr('class', 'hits').selectAll('line').data(links).join('line')
  .on('mouseenter', (e, d) => { d.el.classList.add('hover'); showTip(e, d.reasons.map(r => '<b>' + esc(r.from) + '</b> → <b>' + esc(r.to) + '</b>' + (r.reason ? ': ' + esc(r.reason) : '')).join('<br>')); })
  .on('mousemove', moveTip).on('mouseleave', (e, d) => { d.el.classList.remove('hover'); hideTip(); });
link.each(function (d) { d.el = this; });
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
  .on('click', (e, d) => { e.stopPropagation(); select(d.id, false); })
  .on('mouseenter', (e, d) => showTip(e, '<b>' + esc(d.id) + '</b> <small>' + esc([d.type, d.status, d.depth].filter(Boolean).join(' · ')) + '</small>' + (d.summary ? '<br>' + esc(d.summary) : '')))
  .on('mousemove', moveTip).on('mouseleave', hideTip);
node.append('circle').attr('r', radius).attr('fill', colorOf);
node.append('text').attr('dx', d => radius(d) + 3).attr('dy', '0.35em').text(d => d.id);

const draw = () => {
  for (const s of [link, hit]) s.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .force('center', d3.forceCenter(0, 0))
  .force('x', d3.forceX(0).strength(0.04))   // keep unlinked notes near the rest
  .force('y', d3.forceY(0).strength(0.04))
  .on('tick', draw)
  .stop();
sim.tick(300);                      // settle synchronously: first paint is the final layout
draw();

let moved = false;                  // the viewer zoomed or panned: stop refitting for them
const zoom = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => {
  if (e.sourceEvent) moved = true;
  g.attr('transform', e.transform);
  node.selectAll('text').style('display', e.transform.k < 0.55 ? 'none' : null);
});
svg.call(zoom).on('click', () => select(null));
let fitted = true;
fit(false);                         // first paint lands fitted; later fits animate

function size() {               // falls back to the window: a hidden page reports a 0x0 svg
  const r = svg.node().getBoundingClientRect();
  return [r.width || window.innerWidth, r.height || window.innerHeight];
}
function fit(animate = true) {
  const [w, h] = size();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const k = Math.min(1, 0.9 * Math.min(w / (x1 - x0 + 1), h / (y1 - y0 + 1)));
  if (!(k > 0 && isFinite(k))) { fitted = false; return; }   // retried on the next resize
  const target = d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, target);
}
function centerOn(n) {
  const [w, h] = size(), k = Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
}
window.addEventListener('resize', () => { if (!fitted && sim.alpha() < sim.alphaMin()) { fitted = true; fit(); } });
// On narrow screens the reader panel sits under the graph; opening a note shrinks the graph, so refit it.
if (window.ResizeObserver) new ResizeObserver(() => { if (!moved) fit(false); }).observe(svg.node());
function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }

// --- selection, search, dimming ---------------------------------------------
let selected = null;
function focus(set) {               // ids to keep bright, or null for all
  node.classed('dim', d => !!set && !set.has(d.id)).classed('sel', d => d.id === selected);
  link.classed('dim', d => !!set && !(set.has(d.source.id) && set.has(d.target.id)))
      .classed('hot', d => !!selected && (d.source.id === selected || d.target.id === selected));
}
function neighbours(id) {           // [dir, other, reason], reasoned first, deduplicated
  const out = [], seen = new Set();
  for (const l of data.links) {
    const r = l.from === id ? ['→', l.to, l.reason] : l.to === id ? ['←', l.from, l.reason] : null;
    if (!r) continue;
    const k = r.join('\u0001');
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((a, b) => (a[2] == null) - (b[2] == null) || (a[0] > b[0]) - (a[0] < b[0]) || a[1].localeCompare(b[1]));
}
function focusSelected() {
  focus(selected ? new Set([selected].concat(neighbours(selected).map(x => x[1]))) : null);
}
const panel = document.getElementById('panel');
const obsidianUrl = n => 'obsidian://open?vault=' + encodeURIComponent(data.vault) + '&file=' + encodeURIComponent(n.path.replace(/\.md$/, ''));
function select(id, center) {
  selected = id;
  focusSelected();
  if (!id) { panel.className = 'empty'; panel.textContent = 'Click a node to read its note. Hover an edge for the link reason.'; return; }
  const n = byId.get(id), nb = neighbours(id);
  const meta = [n.type, n.status, n.depth, n.domain, n.repo, n.updated && 'updated ' + n.updated].filter(Boolean).map(esc).join(' · ');
  panel.className = '';
  panel.innerHTML = '<h2>' + esc(id) + '</h2><div class="meta">' + meta + '<br><a href="' + obsidianUrl(n) + '" title="Open in Obsidian">' + esc(n.path) + '</a></div>'
    + '<div class="body">' + md(n.body || n.summary || '') + '</div>'
    + '<div class="nb"><h3>Neighbours (' + nb.length + ')</h3><ul>'
    + nb.map(x => '<li>' + x[0] + ' <a href="#" data-node="' + esc(x[1]) + '">' + esc(x[1]) + '</a>' + (x[2] ? ' <span class="r">— ' + esc(x[2]) + '</span>' : '') + '</li>').join('')
    + '</ul></div>';
  panel.scrollTop = 0;
  if (center) centerOn(n);
}
panel.addEventListener('click', e => {
  const a = e.target.closest('a[data-node]');
  if (a) { e.preventDefault(); select(a.dataset.node, true); }
});

const q = document.getElementById('q'), hits = document.getElementById('hits');
function matches(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  return nodes.filter(n => n.id.toLowerCase().includes(t) || (n.aliases || []).some(a => String(a).toLowerCase().includes(t)));
}
q.addEventListener('input', () => {
  const m = matches(q.value);
  if (!m) { hits.innerHTML = ''; focusSelected(); return; }
  focus(new Set(m.map(n => n.id)));
  hits.innerHTML = m.slice(0, 30).map(n => '<li data-node="' + esc(n.id) + '">' + esc(n.id) + ' <small>' + esc(n.type || '') + '</small></li>').join('') || '<li><small>no matches</small></li>';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const m = matches(q.value); if (m && m.length) { select(m[0].id, true); hits.innerHTML = ''; } }
  if (e.key === 'Escape') { q.value = ''; hits.innerHTML = ''; focusSelected(); }
});
hits.addEventListener('click', e => { const li = e.target.closest('li[data-node]'); if (li) { select(li.dataset.node, true); hits.innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.innerHTML = ''; });

// --- minimal markdown --------------------------------------------------------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  const out = [];
  const keep = html => { out.push(html); return '\u0002' + (out.length - 1) + '\u0003'; };
  s = s.replace(/`([^`]+)`/g, (m, c) => keep('<code>' + esc(c) + '</code>'))
       .replace(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, a) => {
         const id = resolve(t), label = esc(a || t);
         return keep(id ? '<a href="#" data-node="' + esc(id) + '">' + label + '</a>' : '<span class="dead">' + label + '</span>');
       });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0003/g, (m, i) => out[i]);
}
function md(text) {
  const lines = text.replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n');
  const html = [];
  let i = 0, list = null, para = [], m;
  const flushPara = () => { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  const cells = r => r.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => inline(c.replace(/\\\|/g, '|').trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushPara(); closeList(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      flushPara(); closeList();
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      html.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => (k ? '<td>' : '<th>') + c + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {     // ponytail: nested lists flattened
      flushPara();
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); list = kind; html.push('<' + kind + '>'); }
      html.push('<li>' + inline(m[2]) + '</li>'); i++; continue;
    }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    closeList(); para.push(line); i++;
  }
  flushPara(); closeList();
  return html.join('\n');
}
})();
</script>
<script>(function () {  // open one note on arrival
  var t = [].find.call(document.querySelectorAll('.node text'), function (x) { return x.textContent === "Consuming a document"; });
  if (t) t.parentNode.dispatchEvent(new MouseEvent('click', {bubbles: true}));
})();</script>
