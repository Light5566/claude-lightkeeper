<script id="data" type="application/json">{"vault":"Paperless-ngx","built_at":"2026-10-19T12:56:49","notes":{"Administration":{"path":"1 Domains/Administration.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Users and permissions, sign-in, configuration, tasks and trash: running the instance.","aliases":[],"tags":["domain"],"flags":[],"inbound":5,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Administration\n\n## What it is\n\nUsers and permissions, sign-in, configuration, tasks and trash: running the instance.\n\n## Modules\n\n- [[Users & groups]] — Users, groups and two layers of permission: model permissions decide which kinds of object a user may view, add, change or delete, and an owner plus per-object view and change grants (django-guardian) decide which objects\n- [[Sign-in & profile]] — Browser sign-in goes through django-allauth, with optional social accounts and TOTP; the API also accepts basic auth, tokens and the session\n- [[Configuration]] — The Configuration screen edits one `ApplicationConfiguration` row holding OCR, barcode, remote OCR, AI and branding settings\n- [[Tasks]] — A `PaperlessTask` row per tracked Celery task, created when the task is published and updated from Celery's prerun, postrun and failure signals\n- [[Trash]] — Deleting a document only sets `deleted_at`; the trash lists those documents, restores them, or removes them for good with `empty_trash`, which also runs daily for documents older than `PAPERLESS_EMPTY_TRASH_DELAY` days (30 by default)\n"},"Attributes":{"path":"1 Domains/Attributes.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Tags, correspondents, document types, storage paths and custom fields: the metadata a document carries.","aliases":[],"tags":["domain"],"flags":[],"inbound":5,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Attributes\n\n## What it is\n\nTags, correspondents, document types, storage paths and custom fields: the metadata a document carries.\n\n## Modules\n\n- [[Tags]] — Tags nest up to five levels deep (`MAX_NESTING_DEPTH`), and `add_nested_tags` adds every ancestor along with the tag\n- [[Correspondents]] — Who a document is from or to; a document has at most one\n- [[Document types]] — The kind of document; a document has at most one\n- [[Storage paths]] — A storage path is a Jinja template for where a document's files live under the originals and archive folders\n- [[Custom fields]] — Typed extra fields (string, URL, date, boolean, integer, float, monetary, document link, select, long text) stored per document as `CustomFieldInstance` rows\n"},"Consumption":{"path":"1 Domains/Consumption.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Upload, consume folder, barcodes and the consume task: how a file becomes a document.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Consumption\n\n## What it is\n\nUpload, consume folder, barcodes and the consume task: how a file becomes a document.\n\n## Modules\n\n- [[Consumer]] — Turns one incoming file into a stored document\n- [[Upload]] — `POST /api/documents/post_document/` refuses types no parser can handle, writes the file to the scratch directory and queues `consume_file` with the form fields as overrides and the uploader as owner\n- [[Consume folder]] — The `document_consumer` command watches `CONSUMPTION_DIR` with `watchfiles`, using native events or polling when `PAPERLESS_CONSUMER_POLLING_INTERVAL` is set, and queues `consume_file` once a file has stopped changing\n- [[Barcodes]] — `BarcodePlugin` reads barcodes from PDFs, and from TIFFs when enabled, before the document is parsed\n- [[Double-sided collation]] — With `PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED` on, scans dropped into the `double-sided` subfolder are paired: the first file is kept for up to 30 minutes as a staging PDF of the odd pages, and the next one is interleaved with it in reverse page order\n- [[Consumption status]] — Consume tasks report progress to the channel layer group `status_updates`, and `StatusConsumer` forwards each message over `/ws/status/` to signed-in users allowed to see that document\n"},"Documents":{"path":"1 Domains/Documents.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"The list, the document screen, versions, bulk edit, saved views and share links: what a user does with documents once they exist.","aliases":[],"tags":["domain"],"flags":[],"inbound":6,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Documents\n\n## What it is\n\nThe list, the document screen, versions, bulk edit, saved views and share links: what a user does with documents once they exist.\n\n## Modules\n\n- [[Document list]] — The documents screen and `GET /api/documents/`: filtering, sorting and paging over the documents a user may see\n- [[Document detail]] — The single-document screen: preview, metadata form, content, notes, history and suggestions\n- [[Document versions]] — A document can hold several files as versions\n- [[Bulk edit]] — Changes many documents at once: correspondent, type, storage path, tags, custom fields, permissions, delete and reprocess, plus PDF operations such as rotate, merge, split and delete pages\n- [[Saved views]] — A named document list: filter rules, sort, page size and display fields\n- [[Share links]] — A share link is a public URL, `/share/\u003cslug>`, that serves one document's archive or original file to anyone until it expires\n"},"Mail":{"path":"1 Domains/Mail.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Mail accounts, mail rules and the mail parser: turning messages and attachments into documents.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Mail\n\n## What it is\n\nMail accounts, mail rules and the mail parser: turning messages and attachments into documents.\n\n## Modules\n\n- [[Mail accounts]] — An IMAP account that signs in with a password or with an OAuth token from one of two built-in providers, refreshed when it has expired\n- [[Mail rules]] — A mail rule says which messages in one folder of a mail account become documents, which parts to consume, what metadata to give them and what to do with the message afterwards\n- [[Mail parser]] — `MailDocumentParser` handles `.eml` files: it reads the message, renders it to PDF through Gotenberg with the rule's `pdf_layout` or `PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT`, and extracts HTML text through Tika\n"},"Matching & Classification":{"path":"1 Domains/Matching & Classification.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Rule matching, the trained classifier and AI suggestions: how metadata gets assigned without a person.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Matching & Classification\n\n## What it is\n\nRule matching, the trained classifier and AI suggestions: how metadata gets assigned without a person.\n\n## Modules\n\n- [[Matching]] — Decides which correspondent, document type, tags and storage path a document gets from its text\n- [[Classifier]] — A scikit-learn model, a `CountVectorizer` feeding one `MLPClassifier` per field, that learns tags, correspondent, document type and storage path from documents whose objects use the Automatic algorithm\n- [[AI suggestions]] — With AI enabled, `get_ai_document_classification` asks the configured LLM for a title, tags, correspondent, document type, storage path and dates, giving it similar documents and the existing taxonomy as context\n"},"Parsers & OCR":{"path":"1 Domains/Parsers & OCR.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"OCR, remote OCR, office, text and date parsers: what turns a file into text, a thumbnail and an archive PDF.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Parsers & OCR\n\n## What it is\n\nOCR, remote OCR, office, text and date parsers: what turns a file into text, a thumbnail and an archive PDF.\n\n## Modules\n\n- [[OCR parser]] — `RasterisedDocumentParser` handles PDFs and images with OCRmyPDF and Tesseract, steered by `PAPERLESS_OCR_MODE` (`auto`, `force`, `redo`, `off`)\n- [[Remote OCR]] — `RemoteDocumentParser` sends PDFs and images to a cloud OCR engine and gets back text and a searchable PDF\n- [[Office and text parsers]] — Word processor, spreadsheet, presentation and RTF files go to `TikaDocumentParser`, which takes the text from a Tika server and a PDF rendition from Gotenberg; it is only offered when `PAPERLESS_TIKA_ENABLED` is on\n- [[Date parsing]] — When a parser returns no date, the consumer takes the first date yielded by the parser that `get_date_parser()` returns\n"},"Search":{"path":"1 Domains/Search.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"The full-text index, global search and document chat: finding documents by what they say.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Search\n\n## What it is\n\nThe full-text index, global search and document chat: finding documents by what they say.\n\n## Modules\n\n- [[Full-text search]] — A Tantivy index under `INDEX_DIR`, written by `add_to_index` and the document update paths, and read when the document list sends `text`, `title_search`, `query` or `more_like_id`\n- [[Document chat]] — Questions about one document, or about every document the user may view, are answered by an LLM over an embedding index kept in a SQLite vector store, and streamed back as server-sent events from `/api/documents/chat/`\n"},"Workflows":{"path":"1 Domains/Workflows.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"paperless-ngx","updated":"2026-10-19","summary":"Triggers and actions: automation that runs when documents arrive, change or come due.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\nupdated: 2026-10-19\ntags: [domain]\n---\n# Workflows\n\n## What it is\n\nTriggers and actions: automation that runs when documents arrive, change or come due.\n\n## Modules\n\n- [[Workflow triggers]] — A workflow is a set of triggers and an ordered list of actions\n- [[Workflow actions]] — The code behind each action type: assignment, removal, email, webhook, password removal, move to trash, remote OCR and AI suggestions\n"},"AI suggestions":{"path":"2 Modules/AI suggestions.md","type":"module","status":"shipped","depth":"stub","domain":"Matching & Classification","repo":"paperless-ngx","updated":"2026-10-19","summary":"With AI enabled, `get_ai_document_classification` asks the configured LLM for a title, tags, correspondent, document type, storage path and dates, giving it similar documents and the existing taxonomy as context.","aliases":[],"tags":["module","domain/matching-classification"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Matching & Classification\nupdated: 2026-10-19\ntags: [module, domain/matching-classification]\n---\n# AI suggestions\n\n## What it is\n\nWith AI enabled, `get_ai_document_classification` asks the configured LLM for a title, tags, correspondent, document type, storage path and dates, giving it similar documents and the existing taxonomy as context. The document screen shows the result as suggestions, and the Apply AI suggestions workflow action applies it in a background task.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Classification | `src/paperless_ai/ai_classifier.py`, `src/paperless_ai/matching.py` |\n| Client | `src/paperless_ai/client.py` |\n| Workflow action | `src/documents/workflows/ai.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Matching & Classification]] — this module's business area\n- [[Document chat]] — both read their LLM settings from `AIConfig`\n- [[Workflow actions]] — `apply_ai_suggestions` is queued with `delay_on_commit` by the workflow runner\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Barcodes":{"path":"2 Modules/Barcodes.md","type":"module","status":"shipped","depth":"stub","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"`BarcodePlugin` reads barcodes from PDFs, and from TIFFs when enabled, before the document is parsed.","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Barcodes\n\n## What it is\n\n`BarcodePlugin` reads barcodes from PDFs, and from TIFFs when enabled, before the document is parsed. A separator barcode splits the file into new consume tasks, an ASN barcode sets the archive serial number, tag barcodes add tags, and with value storage on every barcode is kept as a `DocumentBarcode` row.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Plugin | `src/documents/barcodes.py` |\n| Settings | `src/paperless/config.py` |\n| Screen | `src-ui/src/app/components/document-detail/document-barcodes/document-barcodes.component.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Consumer]] — it runs as a consume plugin between collation and the workflow trigger\n- [[Configuration]] — `BarcodeConfig` takes the Configuration screen's barcode values before the environment\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Bulk edit":{"path":"2 Modules/Bulk edit.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"Changes many documents at once: correspondent, type, storage path, tags, custom fields, permissions, delete and reprocess, plus PDF operations such as rotate, merge, split and delete pages.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Bulk edit\n\n## What it is\n\nChanges many documents at once: correspondent, type, storage path, tags, custom fields, permissions, delete and reprocess, plus PDF operations such as rotate, merge, split and delete pages. Field changes are written in bulk, with a queryset `update()` or a `bulk_create` on the tag table, which skips model signals, and `bulk_update_documents` then replays the side effects in the background. Removing a tag in bulk also removes its child tags.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Operations | `src/documents/bulk_edit.py` |\n| API | `src/documents/views.py` |\n| Screen | `src-ui/src/app/components/document-list/bulk-editor/bulk-editor.component.ts`, `src-ui/src/app/components/common/pdf-editor/pdf-editor.component.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Running workflows on an edited document]] — `bulk_update_documents` sends `document_updated` for each changed document\n- [[Storage paths]] — it also sends `post_save`, which renames and moves files\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Classifier":{"path":"2 Modules/Classifier.md","type":"module","status":"shipped","depth":"stub","domain":"Matching & Classification","repo":"paperless-ngx","updated":"2026-10-19","summary":"A scikit-learn model, a `CountVectorizer` feeding one `MLPClassifier` per field, that learns tags, correspondent, document type and storage path from documents whose objects use the Automatic algorithm.","aliases":[],"tags":["module","domain/matching-classification"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Matching & Classification\nupdated: 2026-10-19\ntags: [module, domain/matching-classification]\n---\n# Classifier\n\n## What it is\n\nA scikit-learn model, a `CountVectorizer` feeding one `MLPClassifier` per field, that learns tags, correspondent, document type and storage path from documents whose objects use the Automatic algorithm. `train_classifier` runs hourly, skips training when no document changed and the labels are the same, and deletes the model file when no Automatic objects remain.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Model | `src/documents/classifier.py` |\n| Task | `src/documents/tasks.py` |\n| Command | `src/documents/management/commands/document_create_classifier.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Matching & Classification]] — this module's business area\n- [[Matching]] — the `match_correspondents` family accepts a prediction only for objects set to `MATCH_AUTO`\n- [[Celery tasks and signals]] — training is a beat entry controlled by `PAPERLESS_TRAIN_TASK_CRON`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Configuration":{"path":"2 Modules/Configuration.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"paperless-ngx","updated":"2026-10-19","summary":"The Configuration screen edits one `ApplicationConfiguration` row holding OCR, barcode, remote OCR, AI and branding settings.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Configuration\n\n## What it is\n\nThe Configuration screen edits one `ApplicationConfiguration` row holding OCR, barcode, remote OCR, AI and branding settings. The config classes in `src/paperless/config.py` read that row first and fall back to the matching environment variable.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Config classes | `src/paperless/config.py` |\n| Model | `src/paperless/models.py` |\n| API | `src/paperless/views.py`, `src/paperless/serialisers.py` |\n| Screen | `src-ui/src/app/components/admin/config/config.component.ts`, `src-ui/src/app/services/config.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Configuration screen overrides the environment]] — the rule and its consequences\n- [[OCR parser]] — `OcrConfig` is the largest reader of the row\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Consume folder":{"path":"2 Modules/Consume folder.md","type":"module","status":"shipped","depth":"stub","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"The `document_consumer` command watches `CONSUMPTION_DIR` with `watchfiles`, using native events or polling when `PAPERLESS_CONSUMER_POLLING_INTERVAL` is set, and queues `consume_file` once a file has stopped changing.","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Consume folder\n\n## What it is\n\nThe `document_consumer` command watches `CONSUMPTION_DIR` with `watchfiles`, using native events or polling when `PAPERLESS_CONSUMER_POLLING_INTERVAL` is set, and queues `consume_file` once a file has stopped changing. With `PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS` each subfolder name becomes a tag, created if it does not exist.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Watcher | `src/documents/management/commands/document_consumer.py` |\n| Service | `docker/rootfs/etc/s6-overlay/s6-rc.d/svc-consumer/run` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Consumer]] — each stable file becomes a `consume_file` task with source `ConsumeFolder`\n- [[Parser registry]] — the watcher's extension filter comes from `get_supported_file_extensions`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Consumer":{"path":"2 Modules/Consumer.md","type":"module","status":"shipped","depth":"full","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"Turns one incoming file into a stored document.","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":16,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Consumer\n\n## What it is\n\nTurns one incoming file into a stored document. The `consume_file` task runs a fixed chain of plugins, and `ConsumerPlugin` does the main work: pick a parser, parse, save the record, send the finish signal and copy the files into place.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Plugins | `src/documents/consumer.py` |\n| Task | `src/documents/tasks.py` |\n| Plugin interface | `src/documents/plugins/base.py` |\n| Input | `src/documents/data_models.py` |\n\n## How it works\n\n`consume_file` builds a list of `ConsumeTaskPlugin` classes and, for each one whose `able_to_run` is true, calls `setup`, `run` and `cleanup`, handing the `DocumentMetadataOverrides` from one plugin to the next. A new file goes through `ConsumerPreflightPlugin`, `AsnCheckPlugin`, `CollatePlugin`, `BarcodePlugin`, `AsnCheckPlugin` again, `WorkflowTriggerPlugin` and `ConsumerPlugin`. A new version of an existing document (`root_document_id` set) only goes through the preflight and the consumer. Any plugin can end the task early by raising `StopConsumeTaskError`.\n\n`ConsumerPlugin.run` copies the file into a scratch directory, detects its MIME type with `magic.from_file`, asks the parser registry for a parser and runs the pre-consume script. The parser is used inside a `with` block: `parse`, then `get_thumbnail`, `get_text`, `get_date`, `get_archive_path` and `get_page_count`. When the parser has no date, `get_date_parser()` looks for one. Then, inside one `transaction.atomic()` block, `_store` creates the `Document` and `apply_overrides` sets correspondent, type, tags, storage path, ASN, owner, permissions and custom fields. `document_consumption_finished` is sent, and under `MEDIA_LOCK` the original, thumbnail and archive are copied to names from `generate_unique_filename`. The source file is deleted last. After the transaction the post-consume script runs and a final progress message goes out with the new document id.\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Consuming a document]] — the end-to-end journey\n- [[Parser registry]] — `get_parser_for_file` picks the parser\n- [[Matching]] — matching runs as receivers of `document_consumption_finished`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Duplicates are consumed. `pre_check_duplicate` compares the SHA-256 of the file with every document's original and archive checksum, trashed documents included, but only refuses the file when `PAPERLESS_CONSUMER_DELETE_DUPLICATES` is on, and then it also deletes the incoming file.\n- The MIME type and the parser are chosen before the pre-consume script runs. A script that converts the working copy to another format still gets it parsed by the parser picked for the original type.\n- Receivers of `document_consumption_finished` (matching, Document Added workflows, indexing) run inside the transaction and before the files are on disk. If copying fails the database rolls back, but emails and webhooks from those workflows have already been sent or queued.\n- With no date from the parser, the date parser or a `created` override, `created` falls back to the file's modification time. `PostDocumentView` sets that time to the moment of upload with `os.utime`, so an uploaded scan without a readable date is dated the day it was uploaded.\n\n## History\n\n-\n"},"Consumption status":{"path":"2 Modules/Consumption status.md","type":"module","status":"shipped","depth":"stub","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"Consume tasks report progress to the channel layer group `status_updates`, and `StatusConsumer` forwards each message over `/ws/status/` to signed-in users allowed to see that document.","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Consumption status\n\n## What it is\n\nConsume tasks report progress to the channel layer group `status_updates`, and `StatusConsumer` forwards each message over `/ws/status/` to signed-in users allowed to see that document. The same socket carries `document_updated` and `documents_deleted` events that make open screens refresh. A progress message for a file with no owner and no view grants reaches only superusers, because `_can_view` needs an owner match or an explicit grant.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Socket | `src/paperless/consumers.py` |\n| Messages | `src/documents/plugins/helpers.py` |\n| Client | `src-ui/src/app/services/websocket-status.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Upload]] — the upload widget follows its task id through these messages\n- [[Consumer]] — `_send_progress` sends the owner and view grants with every message\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Correspondents":{"path":"2 Modules/Correspondents.md","type":"module","status":"shipped","depth":"stub","domain":"Attributes","repo":"paperless-ngx","updated":"2026-10-19","summary":"Who a document is from or to; a document has at most one.","aliases":[],"tags":["module","domain/attributes"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Attributes\nupdated: 2026-10-19\ntags: [module, domain/attributes]\n---\n# Correspondents\n\n## What it is\n\nWho a document is from or to; a document has at most one. It can be set at upload, by a mail rule, by a workflow, or by matching.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Screens | `src-ui/src/app/components/manage/document-attributes/management-list/correspondent-list/correspondent-list.component.ts`, `src-ui/src/app/components/common/edit-dialog/correspondent-edit-dialog/correspondent-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/correspondent.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Attributes]] — this module's business area\n- [[Matching]] — `set_correspondent` fills it only when it is empty\n- [[Mail rules]] — `assign_correspondent_from` picks the sender's address, the sender's name or a fixed correspondent\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Custom fields":{"path":"2 Modules/Custom fields.md","type":"module","status":"shipped","depth":"stub","domain":"Attributes","repo":"paperless-ngx","updated":"2026-10-19","summary":"Typed extra fields (string, URL, date, boolean, integer, float, monetary, document link, select, long text) stored per document as `CustomFieldInstance` rows.","aliases":[],"tags":["module","domain/attributes"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Attributes\nupdated: 2026-10-19\ntags: [module, domain/attributes]\n---\n# Custom fields\n\n## What it is\n\nTyped extra fields (string, URL, date, boolean, integer, float, monetary, document link, select, long text) stored per document as `CustomFieldInstance` rows. Removing a select option clears that value on every document, and deleting a field drops it from saved views' columns and sort.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Screens | `src-ui/src/app/components/manage/document-attributes/custom-fields/custom-fields.component.ts`, `src-ui/src/app/components/common/edit-dialog/custom-field-edit-dialog/custom-field-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/custom-fields.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Attributes]] — this module's business area\n- [[Storage paths]] — select labels can appear in file names, so `process_cf_select_update` re-runs the file moves after a change\n- [[Workflow triggers]] — triggers can filter on a custom field query, and scheduled triggers can count from a date field\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Date parsing":{"path":"2 Modules/Date parsing.md","type":"module","status":"shipped","depth":"stub","domain":"Parsers & OCR","repo":"paperless-ngx","updated":"2026-10-19","summary":"When a parser returns no date, the consumer takes the first date yielded by the parser that `get_date_parser()` returns.","aliases":[],"tags":["module","domain/parsers-ocr"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Parsers & OCR\nupdated: 2026-10-19\ntags: [module, domain/parsers-ocr]\n---\n# Date parsing\n\n## What it is\n\nWhen a parser returns no date, the consumer takes the first date yielded by the parser that `get_date_parser()` returns. The built-in `RegexDateParserPlugin` searches the filename first when `PAPERLESS_FILENAME_DATE_ORDER` is set, then the content using `PAPERLESS_DATE_ORDER`, and a package can replace it through the `paperless_ngx.date_parsers` entry point.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Factory | `src/documents/plugins/date_parsing/__init__.py` |\n| Base | `src/documents/plugins/date_parsing/base.py` |\n| Default | `src/documents/plugins/date_parsing/regex_parser.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Parsers & OCR]] — this module's business area\n- [[Consumer]] — called from `ConsumerPlugin.run` only when the parser's `get_date` returned `None`\n- [[OCR parser]] — `RasterisedDocumentParser` never sets a date, so PDFs and images always reach this plugin\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Document chat":{"path":"2 Modules/Document chat.md","type":"module","status":"shipped","depth":"stub","domain":"Search","repo":"paperless-ngx","updated":"2026-10-19","summary":"Questions about one document, or about every document the user may view, are answered by an LLM over an embedding index kept in a SQLite vector store, and streamed back as server-sent events from `/api/documents/chat/`.","aliases":[],"tags":["module","domain/search"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Search\nupdated: 2026-10-19\ntags: [module, domain/search]\n---\n# Document chat\n\n## What it is\n\nQuestions about one document, or about every document the user may view, are answered by an LLM over an embedding index kept in a SQLite vector store, and streamed back as server-sent events from `/api/documents/chat/`. The index follows `document_consumption_finished` and `document_updated`, and the daily `llmindex_index` run by default re-embeds only documents whose `modified` time changed.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Chat | `src/paperless_ai/chat.py` |\n| Index | `src/paperless_ai/indexing.py`, `src/paperless_ai/vector_store.py`, `src/paperless_ai/embedding.py` |\n| Screen | `src-ui/src/app/components/chat/chat/chat.component.ts`, `src-ui/src/app/services/chat.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Search]] — this module's business area\n- [[Configuration]] — changing the embedding settings on the Configuration screen queues a full rebuild\n- [[Trash]] — trashed documents stay in the index until they are deleted for good, so chat has to exclude them\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Document detail":{"path":"2 Modules/Document detail.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"The single-document screen: preview, metadata form, content, notes, history and suggestions.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Document detail\n\n## What it is\n\nThe single-document screen: preview, metadata form, content, notes, history and suggestions. Saving sends only the changed fields as a `PATCH`; `DocumentViewSet.update` saves them, reindexes the document and sends `document_updated`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/serialisers.py` |\n| Screen | `src-ui/src/app/components/document-detail/document-detail.component.ts`, `src-ui/src/app/components/document-detail/metadata-collapse/metadata-collapse.component.ts`, `src-ui/src/app/components/document-detail/document-history/document-history.component.ts` |\n| Notes | `src-ui/src/app/components/document-notes/document-notes.component.ts`, `src-ui/src/app/services/rest/document-notes.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Running workflows on an edited document]] — every save from this screen starts that journey\n- [[Matching]] — the `suggestions` endpoint calls the same `match_correspondents`, `match_tags` and siblings, filtered by the requesting user\n- [[AI suggestions]] — the screen can also ask `ai_suggestions` for proposals from the LLM\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Document list":{"path":"2 Modules/Document list.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"The documents screen and `GET /api/documents/`: filtering, sorting and paging over the documents a user may see.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Document list\n\n## What it is\n\nThe documents screen and `GET /api/documents/`: filtering, sorting and paging over the documents a user may see. Filters come from `DocumentFilterSet`, and `PermittedObjectsFilter` cuts the queryset down to documents the user owns, that have no owner, or that were shared with the user or one of their groups.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/filters.py` |\n| Screen | `src-ui/src/app/components/document-list/document-list.component.ts`, `src-ui/src/app/components/document-list/filter-editor/filter-editor.component.ts` |\n| State | `src-ui/src/app/services/document-list-view.service.ts`, `src-ui/src/app/services/rest/document.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Full-text search]] — a request with `query`, `text`, `title_search` or `more_like_id` is answered from the index by `UnifiedSearchViewSet`, the same endpoint\n- [[Saved views]] — a saved view stores this screen's filter rules, sort and columns\n- [[Users & groups]] — visibility comes from `permitted_object_ids`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Document types":{"path":"2 Modules/Document types.md","type":"module","status":"shipped","depth":"stub","domain":"Attributes","repo":"paperless-ngx","updated":"2026-10-19","summary":"The kind of document; a document has at most one.","aliases":[],"tags":["module","domain/attributes"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Attributes\nupdated: 2026-10-19\ntags: [module, domain/attributes]\n---\n# Document types\n\n## What it is\n\nThe kind of document; a document has at most one. Like correspondents it is a `MatchingModel`, so it carries its own match rule and can be learned by the classifier.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Screens | `src-ui/src/app/components/manage/document-attributes/management-list/document-type-list/document-type-list.component.ts`, `src-ui/src/app/components/common/edit-dialog/document-type-edit-dialog/document-type-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/document-type.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Attributes]] — this module's business area\n- [[Matching]] — `set_document_type` fills it only when it is empty\n- [[Classifier]] — `document_type_classifier` learns the types set to Automatic\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Document versions":{"path":"2 Modules/Document versions.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"A document can hold several files as versions.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Document versions\n\n## What it is\n\nA document can hold several files as versions. Each version is its own `Document` row that points at the root through `root_document` and has a `version_index`, and the root shows the latest version's content.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Helpers | `src/documents/versioning.py` |\n| API | `src/documents/views.py`, `src/documents/bulk_edit.py` |\n| Screen | `src-ui/src/app/components/document-detail/document-version-dropdown/document-version-dropdown.component.ts`, `src-ui/src/app/components/document-detail/document-version-dropdown/add-existing-document-version-dialog/add-existing-document-version-dialog.component.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Consumer]] — `update_version` queues `consume_file` with `root_document_id`, which runs only the preflight and consumer plugins\n- [[Workflow triggers]] — `run_workflows` skips version rows, so workflows only ever see the root\n- [[Full-text search]] — `add_to_index` indexes the root in place of a new version\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Double-sided collation":{"path":"2 Modules/Double-sided collation.md","type":"module","status":"shipped","depth":"stub","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"With `PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED` on, scans dropped into the `double-sided` subfolder are paired: the first file is kept for up to 30 minutes as a staging PDF of the odd pages, and the next one is interleaved with it in ","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Double-sided collation\n\n## What it is\n\nWith `PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED` on, scans dropped into the `double-sided` subfolder are paired: the first file is kept for up to 30 minutes as a staging PDF of the odd pages, and the next one is interleaved with it in reverse page order. The collated PDF is saved back into the consumption folder outside the subfolder, where the watcher consumes it as a new file.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Plugin | `src/documents/double_sided.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Consume folder]] — the collated file is picked up by the watcher, not consumed in place\n- [[Consumer]] — `CollatePlugin` ends the original task with `StopConsumeTaskError`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Full-text search":{"path":"2 Modules/Full-text search.md","type":"module","status":"shipped","depth":"stub","domain":"Search","repo":"paperless-ngx","updated":"2026-10-19","summary":"A Tantivy index under `INDEX_DIR`, written by `add_to_index` and the document update paths, and read when the document list sends `text`, `title_search`, `query` or `more_like_id`.","aliases":[],"tags":["module","domain/search"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Search\nupdated: 2026-10-19\ntags: [module, domain/search]\n---\n# Full-text search\n\n## What it is\n\nA Tantivy index under `INDEX_DIR`, written by `add_to_index` and the document update paths, and read when the document list sends `text`, `title_search`, `query` or `more_like_id`. The top-bar search calls `/api/search/`, which returns at most three of each object type and takes its documents from the same index unless `db_only` is set.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Backend | `src/documents/search/_backend.py`, `src/documents/search/_query.py` |\n| Schema | `src/documents/search/_schema.py` |\n| Command | `src/documents/management/commands/document_index.py` |\n| Global search | `src-ui/src/app/components/app-frame/global-search/global-search.component.ts`, `src-ui/src/app/services/rest/search.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Search]] — this module's business area\n- [[Document list]] — index hits are intersected with the list's database queryset, so filters and permissions still apply\n- [[Celery tasks and signals]] — a write that cannot get the index lock is retried later as an `index_document` task\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Mail accounts":{"path":"2 Modules/Mail accounts.md","type":"module","status":"shipped","depth":"stub","domain":"Mail","repo":"paperless-ngx","updated":"2026-10-19","summary":"An IMAP account that signs in with a password or with an OAuth token from one of two built-in providers, refreshed when it has expired.","aliases":[],"tags":["module","domain/mail"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Mail\nupdated: 2026-10-19\ntags: [module, domain/mail]\n---\n# Mail accounts\n\n## What it is\n\nAn IMAP account that signs in with a password or with an OAuth token from one of two built-in providers, refreshed when it has expired. `process_mail_accounts` runs every ten minutes by default under a cache lock, so a manual Process click during a running fetch is skipped.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Models | `src/paperless_mail/models.py` |\n| API | `src/paperless_mail/views.py` |\n| OAuth | `src/paperless_mail/oauth.py` |\n| Task | `src/paperless_mail/tasks.py` |\n| Screens | `src-ui/src/app/components/manage/mail/mail.component.ts`, `src-ui/src/app/components/common/edit-dialog/mail-account-edit-dialog/mail-account-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/mail-account.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Mail]] — this module's business area\n- [[Mail rules]] — an account is skipped until it has an enabled rule\n- [[Fetching mail into documents]] — the end-to-end journey\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Mail parser":{"path":"2 Modules/Mail parser.md","type":"module","status":"shipped","depth":"stub","domain":"Mail","repo":"paperless-ngx","updated":"2026-10-19","summary":"`MailDocumentParser` handles `.eml` files: it reads the message, renders it to PDF through Gotenberg with the rule's `pdf_layout` or `PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT`, and extracts HTML text through Tika.","aliases":[],"tags":["module","domain/mail"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Mail\nupdated: 2026-10-19\ntags: [module, domain/mail]\n---\n# Mail parser\n\n## What it is\n\n`MailDocumentParser` handles `.eml` files: it reads the message, renders it to PDF through Gotenberg with the rule's `pdf_layout` or `PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT`, and extracts HTML text through Tika. A PDF rendition is always made, because a browser cannot show an `.eml`, and the parser uses `TIKA_ENDPOINT` without checking `TIKA_ENABLED`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Parser | `src/paperless/parsers/mail.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Mail]] — this module's business area\n- [[Mail rules]] — the consumer passes the rule id through `ParserContext` so the parser can read `pdf_layout`\n- [[Office and text parsers]] — shares the Tika and Gotenberg endpoints\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Mail rules":{"path":"2 Modules/Mail rules.md","type":"module","status":"shipped","depth":"full","domain":"Mail","repo":"paperless-ngx","updated":"2026-10-19","summary":"A mail rule says which messages in one folder of a mail account become documents, which parts to consume, what metadata to give them and what to do with the message afterwards.","aliases":[],"tags":["module","domain/mail"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\ndomain: Mail\nupdated: 2026-10-19\ntags: [module, domain/mail]\n---\n# Mail rules\n\n## What it is\n\nA mail rule says which messages in one folder of a mail account become documents, which parts to consume, what metadata to give them and what to do with the message afterwards. Every handled message gets a `ProcessedMail` row so it is not taken twice.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Fetcher | `src/paperless_mail/mail.py` |\n| Models | `src/paperless_mail/models.py` |\n| API | `src/paperless_mail/views.py`, `src/paperless_mail/serialisers.py` |\n| Screens | `src-ui/src/app/components/common/edit-dialog/mail-rule-edit-dialog/mail-rule-edit-dialog.component.ts`, `src-ui/src/app/components/manage/mail/processed-mail-dialog/processed-mail-dialog.component.ts` |\n| Services | `src-ui/src/app/services/rest/mail-rule.service.ts`, `src-ui/src/app/services/rest/processed-mail.service.ts` |\n\n## How it works\n\n`MailAccountHandler.handle_mail_account` logs in once per account and walks its enabled rules by `order`. For each rule, `make_criterias` turns the age, from, to, subject and body filters, plus the action's own criterion (unseen for mark-read, unflagged for flag), into an IMAP search. UIDs that already have a `ProcessedMail` row for this rule and folder, with the folder's current UIDVALIDITY or none recorded, are dropped, and the rest are fetched.\n\n`_handle_message` runs the message preprocessors, then, depending on `consumption_scope`, writes the whole message as an `.eml` file, the matching attachments, or both, to the scratch directory. Each file becomes a `consume_file` signature with the rule's tags, document type, title and correspondent as overrides. Each call to `queue_consumption_tasks`, one for the `.eml` and one for the attachments, sends its signatures as a Celery chord whose body, `apply_mail_action`, logs in again, applies the move, delete, flag, mark-read or tag action and writes the `ProcessedMail` row.\n\n## Connects to\n\n- [[Mail]] — this module's business area\n- [[Fetching mail into documents]] — the end-to-end journey\n- [[Consumer]] — each staged file becomes a `consume_file` task\n- [[Workflow triggers]] — a Consumption Started trigger can filter on the rule through `mailrule_id`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `apply_mail_action`, which applies the mail action and writes the success row, runs only after every consume task in its chord has succeeded. If one fails, `error_callback` writes a FAILED `ProcessedMail` row instead, and because any row counts as processed, the message is skipped on later runs until that row is deleted in the processed-mail dialog.\n- `stop_processing` tests the running total for the whole account, not the rule's own count: once an earlier rule has queued a file, the first rule with `stop_processing` set stops the account's run after it, even if that rule matched nothing.\n- Attachment documents get the rule's owner only when `assign_owner_from_rule` is ticked, but the `.eml` document gets the rule's owner whenever the rule has one.\n- Attachment types are sniffed with `magic.from_buffer`, and types no parser accepts are skipped with only a debug log. If nothing in the message qualifies, it is still recorded as `PROCESSED_WO_CONSUMPTION` and the mail action is not applied.\n\n## History\n\n-\n"},"Matching":{"path":"2 Modules/Matching.md","type":"module","status":"shipped","depth":"full","domain":"Matching & Classification","repo":"paperless-ngx","updated":"2026-10-19","summary":"Decides which correspondent, document type, tags and storage path a document gets from its text.","aliases":[],"tags":["module","domain/matching-classification"],"flags":[],"inbound":10,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\ndomain: Matching & Classification\nupdated: 2026-10-19\ntags: [module, domain/matching-classification]\n---\n# Matching\n\n## What it is\n\nDecides which correspondent, document type, tags and storage path a document gets from its text. Each of those objects carries a `match` string and a `matching_algorithm`, and the Automatic algorithm defers to the trained classifier.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Rules | `src/documents/matching.py` |\n| Handlers | `src/documents/signals/handlers.py` |\n| Fields | `src/documents/models.py` |\n| Retagger | `src/documents/management/commands/document_retagger.py` |\n| UI | `src-ui/src/app/data/matching-model.ts`, `src-ui/src/app/components/common/edit-dialog/edit-dialog.component.ts` |\n\n## How it works\n\nAt the end of consumption, `document_consumption_finished` calls `add_inbox_tags`, `set_correspondent`, `set_document_type`, `set_tags` and `set_storage_path`, in the order `DocumentsConfig.ready` connected them. Each of these handlers gets its candidates from `match_correspondents`, `match_document_types`, `match_tags` or `match_storage_paths`: every object the document's owner may view (all objects when there is no owner) that either passes `matches()` against the document text, or uses `MATCH_AUTO` and is what the classifier predicted.\n\n`matches()` implements the algorithms on the effective content: any word, all words, exact string, regular expression through `safe_regex_search`, fuzzy (a `rapidfuzz` partial ratio of at least 90) and none; `is_insensitive` makes the comparison case-insensitive. Tags take every match, the single-value fields take the first. The same functions answer the document screen's `suggestions` endpoint with `request.user` in place of the owner, and the `document_retagger` command re-runs the handlers with its `--use-first` and `--overwrite` options.\n\n## Connects to\n\n- [[Matching & Classification]] — this module's business area\n- [[Classifier]] — the Automatic algorithm defers to its predictions\n- [[Consuming a document]] — matching runs near the end of consumption\n- [[Users & groups]] — candidates come from `permitted_object_ids` for the document owner\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A field that already has a value is never replaced: `set_correspondent`, `set_document_type` and `set_storage_path` return early when it is filled. A value from the upload form, a mail rule or a Consumption Started workflow therefore always beats matching.\n- When several objects match during consumption, the first in name order wins, because `MatchingModel` orders by `name`, and a log line only reports how many matched. The `document_retagger` command does the opposite by default: without `--use-first` it assigns nothing when more than one matches.\n- Candidates are limited to what the document's owner can view, so a tag owned by one user is never matched onto another user's document. A document with no owner is matched against every object.\n- An object with an empty `match` never matches by text, whatever its algorithm; only Automatic objects can still be picked, through the classifier.\n\n## History\n\n-\n"},"OCR parser":{"path":"2 Modules/OCR parser.md","type":"module","status":"shipped","depth":"stub","domain":"Parsers & OCR","repo":"paperless-ngx","updated":"2026-10-19","summary":"`RasterisedDocumentParser` handles PDFs and images with OCRmyPDF and Tesseract, steered by `PAPERLESS_OCR_MODE` (`auto`, `force`, `redo`, `off`).","aliases":[],"tags":["module","domain/parsers-ocr"],"flags":[],"inbound":7,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Parsers & OCR\nupdated: 2026-10-19\ntags: [module, domain/parsers-ocr]\n---\n# OCR parser\n\n## What it is\n\n`RasterisedDocumentParser` handles PDFs and images with OCRmyPDF and Tesseract, steered by `PAPERLESS_OCR_MODE` (`auto`, `force`, `redo`, `off`). In `auto` mode a PDF that already has text goes through OCRmyPDF with `skip_text`, and if no archive copy is wanted OCRmyPDF is not run at all. If OCR finds no text it retries once with forced OCR.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Parser | `src/paperless/parsers/tesseract.py` |\n| Helpers | `src/paperless/parsers/utils.py` |\n| Settings | `src/paperless/config.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Parsers & OCR]] — this module's business area\n- [[Parser registry]] — registered as a built-in with score 10 for PDFs and images\n- [[Consumer]] — `should_produce_archive` tells it whether to produce an archive PDF\n- [[Configuration]] — `OcrConfig` is read when the parser is created, so screen changes apply to the next document\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Office and text parsers":{"path":"2 Modules/Office and text parsers.md","type":"module","status":"shipped","depth":"stub","domain":"Parsers & OCR","repo":"paperless-ngx","updated":"2026-10-19","summary":"Word processor, spreadsheet, presentation and RTF files go to `TikaDocumentParser`, which takes the text from a Tika server and a PDF rendition from Gotenberg; it is only offered when `PAPERLESS_TIKA_ENABLED` is on.","aliases":[],"tags":["module","domain/parsers-ocr"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Parsers & OCR\nupdated: 2026-10-19\ntags: [module, domain/parsers-ocr]\n---\n# Office and text parsers\n\n## What it is\n\nWord processor, spreadsheet, presentation and RTF files go to `TikaDocumentParser`, which takes the text from a Tika server and a PDF rendition from Gotenberg; it is only offered when `PAPERLESS_TIKA_ENABLED` is on. Plain text and CSV go to `TextDocumentParser`, which keeps the file as it is with no archive.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Office | `src/paperless/parsers/tika.py` |\n| Text | `src/paperless/parsers/text.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Parsers & OCR]] — this module's business area\n- [[Parser registry]] — `TikaDocumentParser.score` returns `None` while Tika is disabled\n- [[Mail parser]] — the mail parser talks to the same `TIKA_ENDPOINT` and `TIKA_GOTENBERG_ENDPOINT`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Remote OCR":{"path":"2 Modules/Remote OCR.md","type":"module","status":"shipped","depth":"stub","domain":"Parsers & OCR","repo":"paperless-ngx","updated":"2026-10-19","summary":"`RemoteDocumentParser` sends PDFs and images to a cloud OCR engine and gets back text and a searchable PDF.","aliases":[],"tags":["module","domain/parsers-ocr"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Parsers & OCR\nupdated: 2026-10-19\ntags: [module, domain/parsers-ocr]\n---\n# Remote OCR\n\n## What it is\n\n`RemoteDocumentParser` sends PDFs and images to a cloud OCR engine and gets back text and a searchable PDF. Once an engine is configured it scores 20, above the local parser's 10, but the consumer only allows it when `PAPERLESS_REMOTE_OCR_MODE` is `always` (the default) or a workflow asked for remote OCR. For a PDF that needs no archive it skips the remote call and uses the locally extracted text.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Parser | `src/paperless/parsers/remote.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Parsers & OCR]] — this module's business area\n- [[Workflow actions]] — the Remote OCR action sets `remote_ocr` on the overrides during consumption\n- [[OCR parser]] — the local parser handles the same types when remote OCR is not allowed\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Saved views":{"path":"2 Modules/Saved views.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"A named document list: filter rules, sort, page size and display fields.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Saved views\n\n## What it is\n\nA named document list: filter rules, sort, page size and display fields. Whether a view appears on the dashboard or in the sidebar is stored per user in `UiSettings`, not on the view itself.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/serialisers.py` |\n| Screens | `src-ui/src/app/components/manage/saved-views/saved-views.component.ts`, `src-ui/src/app/components/dashboard/dashboard.component.ts`, `src-ui/src/app/components/dashboard/widgets/saved-view-widget/saved-view-widget.component.ts` |\n| Service | `src-ui/src/app/services/rest/saved-view.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Document list]] — opening a view applies its rules to the list screen\n- [[Custom fields]] — deleting a custom field removes it from every view's columns and sort\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Share links":{"path":"2 Modules/Share links.md","type":"module","status":"shipped","depth":"stub","domain":"Documents","repo":"paperless-ngx","updated":"2026-10-19","summary":"A share link is a public URL, `/share/\u003cslug>`, that serves one document's archive or original file to anyone until it expires.","aliases":[],"tags":["module","domain/documents"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Documents\nupdated: 2026-10-19\ntags: [module, domain/documents]\n---\n# Share links\n\n## What it is\n\nA share link is a public URL, `/share/\u003cslug>`, that serves one document's archive or original file to anyone until it expires. A bundle shares several documents as one zip, built in the background by `build_share_link_bundle`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Bundles | `src/documents/tasks.py` |\n| Screens | `src-ui/src/app/components/common/share-links-dialog/share-links-dialog.component.ts`, `src-ui/src/app/components/common/share-link-bundle-dialog/share-link-bundle-dialog.component.ts`, `src-ui/src/app/components/manage/share-links/share-links.component.ts` |\n| Services | `src-ui/src/app/services/rest/share-link.service.ts`, `src-ui/src/app/services/rest/share-link-bundle.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Documents]] — this module's business area\n- [[Document detail]] — the share dialog is opened from the document screen\n- [[Tasks]] — bundle building is a tracked task, so it shows on the Tasks screen\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Sign-in & profile":{"path":"2 Modules/Sign-in & profile.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"paperless-ngx","updated":"2026-10-19","summary":"Browser sign-in goes through django-allauth, with optional social accounts and TOTP; the API also accepts basic auth, tokens and the session.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Sign-in & profile\n\n## What it is\n\nBrowser sign-in goes through django-allauth, with optional social accounts and TOTP; the API also accepts basic auth, tokens and the session. `PAPERLESS_AUTO_LOGIN_USERNAME` logs every request in as one user, and `PAPERLESS_ENABLE_HTTP_REMOTE_USER` trusts a proxy's user header.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Auth | `src/paperless/auth.py`, `src/paperless/adapter.py` |\n| Profile API | `src/paperless/views.py` |\n| Screen | `src-ui/src/app/components/common/profile-edit-dialog/profile-edit-dialog.component.ts`, `src-ui/src/app/services/profile.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Users & groups]] — a signed-in user's permissions come from there\n- [[Consumption status]] — `StatusConsumer` closes the socket for anyone not signed in\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Storage paths":{"path":"2 Modules/Storage paths.md","type":"module","status":"shipped","depth":"stub","domain":"Attributes","repo":"paperless-ngx","updated":"2026-10-19","summary":"A storage path is a Jinja template for where a document's files live under the originals and archive folders.","aliases":[],"tags":["module","domain/attributes"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Attributes\nupdated: 2026-10-19\ntags: [module, domain/attributes]\n---\n# Storage paths\n\n## What it is\n\nA storage path is a Jinja template for where a document's files live under the originals and archive folders. A document's storage path wins over `PAPERLESS_FILENAME_FORMAT`, and with neither the file is named by its zero-padded id. `update_filename_and_move_files` re-renders the name on every document save and tag change and moves the files when it differs.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/serialisers.py` |\n| Naming | `src/documents/file_handling.py`, `src/documents/templating/filepath.py` |\n| Moves | `src/documents/signals/handlers.py` |\n| Screens | `src-ui/src/app/components/manage/document-attributes/management-list/storage-path-list/storage-path-list.component.ts`, `src-ui/src/app/components/common/edit-dialog/storage-path-edit-dialog/storage-path-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/storage-path.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Attributes]] — this module's business area\n- [[Custom fields]] — a template that uses custom fields is re-rendered when a field value is saved\n- [[Matching]] — a storage path is matched like a correspondent, by `set_storage_path`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Tags":{"path":"2 Modules/Tags.md","type":"module","status":"shipped","depth":"stub","domain":"Attributes","repo":"paperless-ngx","updated":"2026-10-19","summary":"Tags nest up to five levels deep (`MAX_NESTING_DEPTH`), and `add_nested_tags` adds every ancestor along with the tag.","aliases":[],"tags":["module","domain/attributes"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Attributes\nupdated: 2026-10-19\ntags: [module, domain/attributes]\n---\n# Tags\n\n## What it is\n\nTags nest up to five levels deep (`MAX_NESTING_DEPTH`), and `add_nested_tags` adds every ancestor along with the tag. Tags marked `is_inbox_tag` go on every newly consumed document, limited to inbox tags its owner can view. Moving a tag under a new parent adds that parent to all its documents but leaves the old parent in place.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Screens | `src-ui/src/app/components/manage/document-attributes/management-list/tag-list/tag-list.component.ts`, `src-ui/src/app/components/common/edit-dialog/tag-edit-dialog/tag-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/tag.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Attributes]] — this module's business area\n- [[Matching]] — `set_tags` adds every matching tag, not just the first\n- [[Classifier]] — documents carrying an inbox tag are left out of training\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Tasks":{"path":"2 Modules/Tasks.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"paperless-ngx","updated":"2026-10-19","summary":"A `PaperlessTask` row per tracked Celery task, created when the task is published and updated from Celery's prerun, postrun and failure signals.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Tasks\n\n## What it is\n\nA `PaperlessTask` row per tracked Celery task, created when the task is published and updated from Celery's prerun, postrun and failure signals. The Tasks screen lists these rows, and a consume task rejected as a duplicate is stored as a failure.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Tracking | `src/documents/signals/handlers.py` |\n| API | `src/documents/views.py`, `src/documents/models.py` |\n| Screen | `src-ui/src/app/components/admin/tasks/tasks.component.ts`, `src-ui/src/app/services/tasks.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Celery tasks and signals]] — only names in `TRACKED_TASKS` get a row\n- [[Upload]] — the task id an upload returns is the `task_id` of its row\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Trash":{"path":"2 Modules/Trash.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"paperless-ngx","updated":"2026-10-19","summary":"Deleting a document only sets `deleted_at`; the trash lists those documents, restores them, or removes them for good with `empty_trash`, which also runs daily for documents older than `PAPERLESS_EMPTY_TRASH_DELAY` days (30 by default).","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Trash\n\n## What it is\n\nDeleting a document only sets `deleted_at`; the trash lists those documents, restores them, or removes them for good with `empty_trash`, which also runs daily for documents older than `PAPERLESS_EMPTY_TRASH_DELAY` days (30 by default). The file cleanup handler is connected to `post_delete` only while `empty_trash` runs, and with `EMPTY_TRASH_DIR` set the original is moved there instead of deleted.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py` |\n| Task | `src/documents/tasks.py` |\n| Screen | `src-ui/src/app/components/admin/trash/trash.component.ts`, `src-ui/src/app/services/trash.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Workflow actions]] — the Move to trash action soft-deletes the same way\n- [[Document chat]] — the LLM index entry is removed only when the document is deleted for good\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Upload":{"path":"2 Modules/Upload.md","type":"module","status":"shipped","depth":"stub","domain":"Consumption","repo":"paperless-ngx","updated":"2026-10-19","summary":"`POST /api/documents/post_document/` refuses types no parser can handle, writes the file to the scratch directory and queues `consume_file` with the form fields as overrides and the uploader as owner.","aliases":[],"tags":["module","domain/consumption"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Consumption\nupdated: 2026-10-19\ntags: [module, domain/consumption]\n---\n# Upload\n\n## What it is\n\n`POST /api/documents/post_document/` refuses types no parser can handle, writes the file to the scratch directory and queues `consume_file` with the form fields as overrides and the uploader as owner. It answers with the Celery task id, which the UI then follows over the status websocket.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/documents/views.py`, `src/documents/serialisers.py` |\n| Service | `src-ui/src/app/services/upload-documents.service.ts` |\n| Screens | `src-ui/src/app/components/file-drop/file-drop.component.ts`, `src-ui/src/app/components/dashboard/widgets/upload-file-widget/upload-file-widget.component.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Consumption]] — this module's business area\n- [[Consumer]] — the upload becomes a `consume_file` task\n- [[Consumption status]] — progress for the returned task id arrives over `/ws/status/`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Users & groups":{"path":"2 Modules/Users & groups.md","type":"module","status":"shipped","depth":"stub","domain":"Administration","repo":"paperless-ngx","updated":"2026-10-19","summary":"Users, groups and two layers of permission: model permissions decide which kinds of object a user may view, add, change or delete, and an owner plus per-object view and change grants (django-guardian) decide which objects.","aliases":[],"tags":["module","domain/administration"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Administration\nupdated: 2026-10-19\ntags: [module, domain/administration]\n---\n# Users & groups\n\n## What it is\n\nUsers, groups and two layers of permission: model permissions decide which kinds of object a user may view, add, change or delete, and an owner plus per-object view and change grants (django-guardian) decide which objects. `permitted_object_ids` turns the second layer into one filter: objects the user owns, objects with no owner, and objects granted to the user or one of their groups. An object with no owner passes `has_object_permission` for anyone who holds the model permission.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| API | `src/paperless/views.py`, `src/paperless/serialisers.py` |\n| Permissions | `src/documents/permissions.py` |\n| Screens | `src-ui/src/app/components/admin/users-groups/users-groups.component.ts`, `src-ui/src/app/components/common/edit-dialog/user-edit-dialog/user-edit-dialog.component.ts`, `src-ui/src/app/components/common/edit-dialog/group-edit-dialog/group-edit-dialog.component.ts`, `src-ui/src/app/components/common/permissions-dialog/permissions-dialog.component.ts` |\n| Services | `src-ui/src/app/services/rest/user.service.ts`, `src-ui/src/app/services/rest/group.service.ts`, `src-ui/src/app/services/permissions.service.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Administration]] — this module's business area\n- [[Document list]] — the list's `PermittedObjectsFilter` is built on `permitted_object_ids`\n- [[Matching]] — matching only considers objects the document owner can view\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Workflow actions":{"path":"2 Modules/Workflow actions.md","type":"module","status":"shipped","depth":"stub","domain":"Workflows","repo":"paperless-ngx","updated":"2026-10-19","summary":"The code behind each action type: assignment, removal, email, webhook, password removal, move to trash, remote OCR and AI suggestions.","aliases":[],"tags":["module","domain/workflows"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: paperless-ngx\ndomain: Workflows\nupdated: 2026-10-19\ntags: [module, domain/workflows]\n---\n# Workflow actions\n\n## What it is\n\nThe code behind each action type: assignment, removal, email, webhook, password removal, move to trash, remote OCR and AI suggestions. Email is sent on the spot through `send_email` and only logs an error when `EMAIL_ENABLED` is off, while webhooks are queued as `send_webhook` tasks that retry on HTTP errors and check the URL against `WEBHOOKS_ALLOWED_SCHEMES` and `WEBHOOKS_ALLOWED_PORTS`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Actions | `src/documents/workflows/actions.py`, `src/documents/workflows/mutations.py` |\n| Webhooks | `src/documents/workflows/webhooks.py` |\n| Placeholders | `src/documents/templating/workflows.py` |\n| Email | `src/documents/mail.py` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Workflows]] — this module's business area\n- [[Workflow triggers]] — the runner calls these in each workflow's action order\n- [[Remote OCR]] — the Remote OCR action only has an effect during consumption\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Workflow triggers":{"path":"2 Modules/Workflow triggers.md","type":"module","status":"shipped","depth":"full","domain":"Workflows","repo":"paperless-ngx","updated":"2026-10-19","summary":"A workflow is a set of triggers and an ordered list of actions.","aliases":[],"tags":["module","domain/workflows"],"flags":[],"inbound":8,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: paperless-ngx\ndomain: Workflows\nupdated: 2026-10-19\ntags: [module, domain/workflows]\n---\n# Workflow triggers\n\n## What it is\n\nA workflow is a set of triggers and an ordered list of actions. Triggers fire when consumption starts, when a document is added or updated, or on a schedule, and every run goes through `run_workflows`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Runner | `src/documents/signals/handlers.py` |\n| Trigger matching | `src/documents/matching.py` |\n| Query | `src/documents/workflows/utils.py` |\n| Scheduled | `src/documents/tasks.py` |\n| Models | `src/documents/models.py` |\n| Screens | `src-ui/src/app/components/manage/workflows/workflows.component.ts`, `src-ui/src/app/components/common/edit-dialog/workflow-edit-dialog/workflow-edit-dialog.component.ts` |\n| Service | `src-ui/src/app/services/rest/workflow.service.ts` |\n\n## How it works\n\n`get_workflows_for_trigger` loads the enabled workflows that have a trigger of the given type, ordered by `order`, with their actions ordered by `order` then `pk`. For each one, `document_matches_workflow` checks the triggers of that type and stops at the first that matches. A Consumption Started trigger is checked against the incoming file by `consumable_document_matches_workflow`: source, mail rule, filename glob and path glob. The other three are checked against the saved document by `existing_document_matches_workflow`: content match, ta
