<script id="data" type="application/json">{"vault":"Excalidraw","built_at":"2026-10-20T09:57:15","notes":{"Editing":{"path":"1 Domains/Editing.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"What a user does on the canvas: tools, actions, selection, moving and resizing, text, lines and arrows, snapping and the clipboard.","aliases":[],"tags":["domain"],"flags":[],"inbound":9,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Editing\n\n## What it is\n\nWhat a user does on the canvas: tools, actions, selection, moving and resizing, text, lines and arrows, snapping and the clipboard.\n\n## Modules\n\n- [[Editor App]] — `App` is one React class component that owns the `Scene`, `Store`, `History`, `ActionManager` and `Renderer`, and handles every pointer and keyboard event on the canvas\n- [[Actions]] — Most editor commands (delete, align, z-order, styles, export, zoom, undo) are action objects with a `perform` function and optional `keyTest` and `PanelComponent`\n- [[App State]] — `AppState` is the editor state that is not elements: tool, selection, zoom, scroll, theme, open dialogs and the style defaults for new shapes\n- [[Selection]] — Selection lives in app state as `selectedElementIds` and `selectedGroupIds`, not on the elements\n- [[Drag & Resize]] — Moving the selection (`dragSelectedElements`), resizing and rotating it (`transformElements`), and sizing a shape while it is being drawn (`dragNewElement`)\n- [[Linear Elements]] — Lines and arrows store `points` relative to the element's `x` and `y`, and `LinearElementEditor` edits them point by point\n- [[Text Editing]] — Editing text puts a DOM `textarea` over the canvas, and each keystroke replaces the text element with `newElementWith`, keeping what was typed in `originalText` and the wrapped result in `text`\n- [[Snapping]] — Object snapping lines moved or drawn elements up with points and gaps of other elements within `getSnapDistance`, 8 pixels divided by the zoom\n- [[Clipboard]] — Copy writes the selected elements and their image files as JSON of type `EXPORT_DATA_TYPES.excalidrawClipboard`, under both the Excalidraw clipboard MIME type and plain text\n"},"Elements & Scene":{"path":"1 Domains/Elements & Scene.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Elements, the scene that holds them, and the rules that keep them consistent: versions, z-order, bindings, groups, frames and restoring outside data.","aliases":[],"tags":["domain"],"flags":[],"inbound":7,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Elements & Scene\n\n## What it is\n\nElements, the scene that holds them, and the rules that keep them consistent: versions, z-order, bindings, groups, frames and restoring outside data.\n\n## Modules\n\n- [[Element Model]] — Every shape, text, arrow, image and frame is a plain readonly object with an `id`, geometry, style, `version`, `versionNonce` and a fractional `index`\n- [[Element Mutation]] — `mutateElement` changes an element in place and bumps `version`, `versionNonce` and `updated`; `newElementWith` returns a changed copy with the same bumps\n- [[Scene]] — `Scene` holds every element of the drawing, deleted ones included, and tells its subscribers when anything changes\n- [[Fractional Indexing]] — Z-order is the array order, mirrored into each element's `index` string so it survives merges between users\n- [[Scene Restore]] — Data from outside the editor (files, share links, local storage, collaborators) goes through `restoreElements` and `restoreAppState`, which fill missing fields, migrate legacy properties such as `strokeSharpness`, drop `selection` elements and give duplicate ids a fresh `randomId`\n- [[Groups & Frames]] — A group is only a shared id in each member's `groupIds`, listed deepest first; there is no group element\n- [[Arrow Binding]] — A bound arrow end stores a `FixedPointBinding` in `startBinding` or `endBinding`, and the shape lists the arrow in its `boundElements`, so a binding is recorded on both sides\n"},"Embedding API":{"path":"1 Domains/Embedding API.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"What a host app gets from the npm packages: the Excalidraw component, its imperative API and the geometry helpers.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Embedding API\n\n## What it is\n\nWhat a host app gets from the npm packages: the Excalidraw component, its imperative API and the geometry helpers.\n\n## Modules\n\n- [[Excalidraw Component]] — `Excalidraw` is `React.memo` over `ExcalidrawBase` with a custom `areEqual`; it passes props to `App` and hands hosts an `ExcalidrawImperativeAPI` (`updateScene`, `getSceneElements`, `onChange` and more) through `onExcalidrawAPI`\n- [[Geometry Packages]] — The math package holds geometry on branded tuples: `GlobalPoint` for scene coordinates, `LocalPoint` for coordinates relative to an element, and `Radians` for angles, so the type checker keeps them apart\n"},"Export & Sharing":{"path":"1 Domains/Export & Sharing.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Getting a scene out: PNG, JPEG and SVG images, .excalidraw files, and encrypted shareable links.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Export & Sharing\n\n## What it is\n\nGetting a scene out: PNG, JPEG and SVG images, .excalidraw files, and encrypted shareable links.\n\n## Modules\n\n- [[Image Export]] — `exportScene` renders elements to a canvas, a PNG or JPEG blob, or an SVG element, sized by an export config (`padding`, `scale`, `fit`, `maxWidthOrHeight` and others)\n- [[Scene Files]] — Saving writes a .excalidraw JSON file through browser-fs-access, keeping only image files that non-deleted elements still use\n- [[Shareable Links]] — `exportToBackend` serializes the scene, compresses and encrypts it with a fresh AES-GCM key through `compressData`, uploads it, and puts `#json=\u003cid>,\u003ckey>` in the URL hash so the key never reaches the server\n"},"History":{"path":"1 Domains/History.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Undo and redo: the Store that turns committed changes into deltas, and the stacks that replay them.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# History\n\n## What it is\n\nUndo and redo: the Store that turns committed changes into deltas, and the stacks that replay them.\n\n## Modules\n\n- [[Store]] — The `Store` decides which committed changes become undo entries\n- [[Deltas]] — A `StoreDelta` pairs an `ElementsDelta` (added, removed and updated elements) with an `AppStateDelta`\n- [[Undo & Redo]] — `History` keeps undo and redo stacks of inverted deltas recorded from the Store's durable increments\n"},"Hosted App":{"path":"1 Domains/Hosted App.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"The excalidraw.com app around the editor: how a scene is picked on load, and saving to this browser.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Hosted App\n\n## What it is\n\nThe excalidraw.com app around the editor: how a scene is picked on load, and saving to this browser.\n\n## Modules\n\n- [[Hosted App Shell]] — The excalidraw.com app wraps `Excalidraw` with collaboration, share links and local saving\n- [[Local Persistence]] — Non-deleted elements and app state are saved to `localStorage` after a debounce, and image files to IndexedDB; nothing is saved while the tab is hidden or a lock such as collaboration is held\n"},"Library":{"path":"1 Domains/Library.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Reusable items a user saves, browses in the sidebar and drops onto the canvas.","aliases":[],"tags":["domain"],"flags":[],"inbound":2,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Library\n\n## What it is\n\nReusable items a user saves, browses in the sidebar and drops onto the canvas.\n\n## Modules\n\n- [[Library Store]] — `Library` holds the user's reusable items and runs updates through a promise queue, so each `setLibrary` waits for the one before it\n- [[Library Menu]] — The sidebar tab that lists library items and inserts chosen ones on the canvas, laid out by `distributeLibraryItemsOnSquareGrid`\n"},"Live Collaboration":{"path":"1 Domains/Live Collaboration.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Rooms on the hosted app: the encrypted socket, merging remote elements, and the room copy kept in Firebase.","aliases":[],"tags":["domain"],"flags":[],"inbound":4,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Live Collaboration\n\n## What it is\n\nRooms on the hosted app: the encrypted socket, merging remote elements, and the room copy kept in Firebase.\n\n## Modules\n\n- [[Collaboration Session]] — `Collab` starts and stops live rooms on the hosted app, applies what collaborators send, and keeps the room copy in Firebase in step\n- [[Socket Portal]] — `Portal` owns the socket.io connection to one room and encrypts scene, pointer, idle and viewport messages with the room key through `encryptData`; the room join and follow notifications are sent unencrypted\n- [[Reconciliation]] — `reconcileElements` merges a local and a remote element list one element at a time\n- [[Room Storage]] — Each room's scene is stored encrypted with the room key in a Firestore document in the `scenes` collection, and `saveToFirebase` reconciles with the stored copy inside `runTransaction`\n"},"Rendering":{"path":"1 Domains/Rendering.md","type":"domain","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Painting the scene: the stacked canvases, the rough.js shapes and their caches, and fonts.","aliases":[],"tags":["domain"],"flags":[],"inbound":3,"body":"---\ntype: domain\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [domain]\n---\n# Rendering\n\n## What it is\n\nPainting the scene: the stacked canvases, the rough.js shapes and their caches, and fonts.\n\n## Modules\n\n- [[Canvas Rendering]] — The editor paints on three stacked canvases: the scene, the element being drawn, and the interactive layer with selection, handles, snap lines and remote cursors\n- [[Shape Generation]] — Each element's rough.js drawable is generated from its `seed` and kept in `ShapeCache`, a `WeakMap` keyed by the element object and checked against the theme\n- [[Fonts]] — Font faces are loaded for the characters the scene's text actually uses\n"},"Actions":{"path":"2 Modules/Actions.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Most editor commands (delete, align, z-order, styles, export, zoom, undo) are action objects with a `perform` function and optional `keyTest` and `PanelComponent`.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Actions\n\n## What it is\n\nMost editor commands (delete, align, z-order, styles, export, zoom, undo) are action objects with a `perform` function and optional `keyTest` and `PanelComponent`. Style actions such as `actionChangeOpacity` map the selected elements through `newElementWith` and also store the value (here `currentItemOpacity`) as the default for the next shape.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Manager | `packages/excalidraw/actions/manager.tsx` |\n| Registry | `packages/excalidraw/actions/register.ts`, `packages/excalidraw/actions/index.ts` |\n| Types | `packages/excalidraw/actions/types.ts` |\n| Style actions | `packages/excalidraw/actions/actionProperties.tsx`, `packages/excalidraw/actions/actionStyles.ts` |\n| Panel | `packages/excalidraw/components/Actions.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Action dispatch]] — how a keyboard, UI or API call reaches `perform` and back into the scene\n- [[Element Mutation]] — actions return new elements built with `newElementWith`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"App State":{"path":"2 Modules/App State.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"`AppState` is the editor state that is not elements: tool, selection, zoom, scroll, theme, open dialogs and the style defaults for new shapes.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# App State\n\n## What it is\n\n`AppState` is the editor state that is not elements: tool, selection, zoom, scroll, theme, open dialogs and the style defaults for new shapes. `getDefaultAppState` builds it, and `APP_STATE_STORAGE_CONF` says for every key whether it is kept in browser storage, in exported files and on the server.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Defaults and storage rules | `packages/excalidraw/appState.ts` |\n| Type | `packages/excalidraw/types.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Local Persistence]] — `clearAppStateForLocalStorage` decides what the hosted app saves\n- [[Scene Files]] — `cleanAppStateForExport` decides what a .excalidraw file keeps\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Arrow Binding":{"path":"2 Modules/Arrow Binding.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"A bound arrow end stores a `FixedPointBinding` in `startBinding` or `endBinding`, and the shape lists the arrow in its `boundElements`, so a binding is recorded on both sides.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Arrow Binding\n\n## What it is\n\nA bound arrow end stores a `FixedPointBinding` in `startBinding` or `endBinding`, and the shape lists the arrow in its `boundElements`, so a binding is recorded on both sides. `updateBoundElements` moves the bound ends of those arrows when the shape changes, and `unbindBindingElement` clears the arrow's record and, unless its other end is bound to the same shape, the shape's.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Binding | `packages/element/src/binding.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Linear Elements]] — bound ends are moved with `LinearElementEditor.movePoints`\n- [[Scene Restore]] — `repairBindings` fixes the two records when they disagree\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Canvas Rendering":{"path":"2 Modules/Canvas Rendering.md","type":"module","status":"shipped","depth":"full","domain":"Rendering","repo":"excalidraw","updated":"2026-10-19","summary":"The editor paints on three stacked canvases: the scene, the element being drawn, and the interactive layer with selection, handles, snap lines and remote cursors.","aliases":[],"tags":["module","domain/rendering"],"flags":[],"inbound":9,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: excalidraw\ndomain: Rendering\nupdated: 2026-10-19\ntags: [module, domain/rendering]\n---\n# Canvas Rendering\n\n## What it is\n\nThe editor paints on three stacked canvases: the scene, the element being drawn, and the interactive layer with selection, handles, snap lines and remote cursors. What gets repainted is decided by memoization on the scene's `sceneNonce`, not by diffing elements.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Renderer | `packages/excalidraw/scene/Renderer.ts` |\n| Canvas components | `packages/excalidraw/components/canvases/StaticCanvas.tsx`, `packages/excalidraw/components/canvases/NewElementCanvas.tsx`, `packages/excalidraw/components/canvases/InteractiveCanvas.tsx` |\n| Painters | `packages/excalidraw/renderer/staticScene.ts`, `packages/excalidraw/renderer/renderNewElementScene.ts`, `packages/excalidraw/renderer/interactiveScene.ts` |\n\n## How it works\n\n`StaticCanvas` paints the scene. `NewElementCanvas` paints only the element being drawn. `InteractiveCanvas` paints selection borders, transform handles, snap lines and remote cursors, and receives the pointer events.\n\nOn each `App.render`, `Renderer.getRenderableElements` returns the element map to paint and the visible subset, memoized on the viewport and a `canvasNonce` built from the scene's `sceneNonce`. The element being drawn (unless it sits in a frame) and the text being edited are left out of the static map. `StaticCanvas` is a `React.memo` whose `areEqual` compares `canvasNonce`, the element map, the visible list, a fixed list of app state keys from `getRelevantAppStateProps`, and the render config. When it does re-render, `renderStaticScene` paints the visible elements in order, draws bound text right after its container instead of in its own slot, and paints embeddables last.\n\n## Connects to\n\n- [[Rendering]] — this module's business area\n- [[Scene]] — memoization keys on the nonce `triggerUpdate` sets\n- [[Shape Generation]] — `renderElement` draws each element from its cached shape or canvas\n- [[Scene versions and re-rendering]] — the convention this module depends on\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- A repaint of the static canvas needs a new `sceneNonce` or another compared prop. Code that mutates with `informMutation: false` must call `scene.triggerUpdate()` afterwards, as the pointer-up handler does after `getNormalizedDimensions`.\n- An app state key the static canvas reads must be added to `getRelevantAppStateProps` in `packages/excalidraw/components/canvases/StaticCanvas.tsx`; otherwise changing it does not repaint.\n- Throttling paints to animation frames is off by default: `isRenderThrottlingEnabled` is true only when `window.EXCALIDRAW_THROTTLE_RENDER` is `true` and React is 18 or newer.\n- A new element inside a frame stays in the static map and is drawn from the live object, so `getRenderableElements` folds that element's `versionNonce` into `canvasNonce`; without it a drag-sized framed element would not repaint.\n\n## History\n\n-\n"},"Clipboard":{"path":"2 Modules/Clipboard.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Copy writes the selected elements and their image files as JSON of type `EXPORT_DATA_TYPES.excalidrawClipboard`, under both the Excalidraw clipboard MIME type and plain text.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Clipboard\n\n## What it is\n\nCopy writes the selected elements and their image files as JSON of type `EXPORT_DATA_TYPES.excalidrawClipboard`, under both the Excalidraw clipboard MIME type and plain text. Paste parses that JSON, images, SVG, Mermaid, URLs, spreadsheets or text, and inserts elements through `addElementsFromPasteOrLibrary`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Clipboard | `packages/excalidraw/clipboard.ts` |\n| Paste handling | `packages/excalidraw/components/App.clipboard.ts` |\n| Actions | `packages/excalidraw/actions/actionClipboard.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Scene Restore]] — pasted elements are restored before they are inserted\n- [[Groups & Frames]] — copied elements whose frame is not copied lose their `frameId`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Collaboration Session":{"path":"2 Modules/Collaboration Session.md","type":"module","status":"shipped","depth":"full","domain":"Live Collaboration","repo":"excalidraw","updated":"2026-10-19","summary":"`Collab` starts and stops live rooms on the hosted app, applies what collaborators send, and keeps the room copy in Firebase in step.","aliases":[],"tags":["module","domain/live-collaboration"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: excalidraw\ndomain: Live Collaboration\nupdated: 2026-10-19\ntags: [module, domain/live-collaboration]\n---\n# Collaboration Session\n\n## What it is\n\n`Collab` starts and stops live rooms on the hosted app, applies what collaborators send, and keeps the room copy in Firebase in step. Room links carry the room id and the encryption key in the URL hash.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Session | `excalidraw-app/collab/Collab.tsx` |\n| Errors | `excalidraw-app/collab/CollabError.tsx` |\n\n## How it works\n\n`startCollaboration` takes the room from the link, or makes a new one with `generateCollaborationLinkData` (a random id and an AES-GCM key) and pushes its `#room=` link into the address bar. It calls `LocalData.pauseSave(\"collaboration\")`, loads socket.io lazily and opens the socket through `Portal.open`. Joining an existing room resets the local scene; creating one saves the current scene to Firebase first.\n\nThe initial scene arrives one of three ways: a peer's `WS_SUBTYPES.INIT` on `client-broadcast` (peers send it on `new-user`), `first-in-room`, or a fallback after `INITIAL_SCENE_UPDATE_TIMEOUT` or a `connect_error`; the last two run `initializeRoom`, which loads the room from Firebase when it was joined by link. Until `initializeRoom` sets `socketInitialized`, `Portal.isOpen` is false and nothing is broadcast.\n\nOutgoing: the hosted app's `onChange` calls `syncElements`, which broadcasts changed elements, queues a full sync every `SYNC_FULL_SCENE_INTERVAL_MS` (20 seconds) and a throttled Firebase save. Incoming: `_reconcileElements` restores and reconciles the remote elements, then `handleRemoteSceneUpdate` applies them with `CaptureUpdateAction.NEVER` and fetches images.\n\n## Connects to\n\n- [[Live Collaboration]] — this module's business area\n- [[Socket Portal]] — all socket traffic goes through the `Portal` instance\n- [[Reconciliation]] — remote elements are merged with `reconcileElements`\n- [[Receiving a collaborator's change]] — the incoming path step by step\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `_reconcileElements` records the received scene version with `setLastBroadcastedOrReceivedSceneVersion` before `updateScene`, because the update renders synchronously and `onChange` would otherwise broadcast the scene straight back.\n- `broadcastElements` only sends when `getSceneVersion`, a plain sum of element versions marked deprecated in favour of `hashElementsVersion`, is above the last sent or received sum; anything it misses waits for the periodic full sync.\n- Local saving is paused for the whole session, so a room's scene is not written to this browser's local storage; `stopCollaboration` resumes it.\n- `isSyncableElement` never sends invisibly small elements, and stops sending deleted ones once their `updated` time is older than `DELETED_ELEMENT_TIMEOUT` (one day).\n\n## History\n\n-\n"},"Deltas":{"path":"2 Modules/Deltas.md","type":"module","status":"shipped","depth":"stub","domain":"History","repo":"excalidraw","updated":"2026-10-19","summary":"A `StoreDelta` pairs an `ElementsDelta` (added, removed and updated elements) with an `AppStateDelta`.","aliases":[],"tags":["module","domain/history"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: History\nupdated: 2026-10-19\ntags: [module, domain/history]\n---\n# Deltas\n\n## What it is\n\nA `StoreDelta` pairs an `ElementsDelta` (added, removed and updated elements) with an `AppStateDelta`. Each entry is a `Delta` of two partial objects, `deleted` and `inserted`, so it can be inverted and applied in either direction.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Deltas | `packages/element/src/delta.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[History]] — this module's business area\n- [[Store]] — deltas are calculated between two store snapshots\n- [[Undo & Redo]] — history applies inverted deltas to the current scene\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Drag & Resize":{"path":"2 Modules/Drag & Resize.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Moving the selection (`dragSelectedElements`), resizing and rotating it (`transformElements`), and sizing a shape while it is being drawn (`dragNewElement`).","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Drag & Resize\n\n## What it is\n\nMoving the selection (`dragSelectedElements`), resizing and rotating it (`transformElements`), and sizing a shape while it is being drawn (`dragNewElement`). `getTransformHandles` places the handles and `resizeTest` finds which one the pointer is on.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Dragging | `packages/element/src/dragElements.ts` |\n| Resizing and rotating | `packages/element/src/resizeElements.ts` |\n| Handles | `packages/element/src/transformHandles.ts`, `packages/element/src/resizeTest.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Arrow Binding]] — moved or resized shapes drag their bound arrow ends along\n- [[Snapping]] — drag and draw offsets are adjusted by snap results first\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Editor App":{"path":"2 Modules/Editor App.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"`App` is one React class component that owns the `Scene`, `Store`, `History`, `ActionManager` and `Renderer`, and handles every pointer and keyboard event on the canvas.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Editor App\n\n## What it is\n\n`App` is one React class component that owns the `Scene`, `Store`, `History`, `ActionManager` and `Renderer`, and handles every pointer and keyboard event on the canvas. Parts of its behaviour live in helper classes (`AppPan`, `AppSelection`, `AppClipboard`, `AppDrawShape` and others) that are constructed with the `App` instance.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Component | `packages/excalidraw/components/App.tsx` |\n| Pointer and view helpers | `packages/excalidraw/components/App.pan.ts`, `packages/excalidraw/components/App.wheel.ts`, `packages/excalidraw/components/App.cursor.ts`, `packages/excalidraw/components/App.modifiers.ts`, `packages/excalidraw/components/App.viewport.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Scene]] — it creates one `Scene` and re-renders on its `onUpdate`\n- [[Store]] — `componentDidUpdate` calls `Store.commit` after each render\n- [[Drawing a rectangle]] — the pointer lifecycle from press to commit\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Element Model":{"path":"2 Modules/Element Model.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"Every shape, text, arrow, image and frame is a plain readonly object with an `id`, geometry, style, `version`, `versionNonce` and a fractional `index`.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Element Model\n\n## What it is\n\nEvery shape, text, arrow, image and frame is a plain readonly object with an `id`, geometry, style, `version`, `versionNonce` and a fractional `index`. Constructors such as `newElement` and `newTextElement` start at `version` 1 with a random `seed` for the rough.js stroke and `index` null until the scene assigns one.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Types | `packages/element/src/types.ts` |\n| Constructors | `packages/element/src/newElement.ts` |\n| Type guards | `packages/element/src/typeChecks.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Element Mutation]] — edits are expected to go through its helpers so the version moves\n- [[Fractional Indexing]] — the `index` field is filled in when an element is inserted into the scene\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Element Mutation":{"path":"2 Modules/Element Mutation.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"`mutateElement` changes an element in place and bumps `version`, `versionNonce` and `updated`; `newElementWith` returns a changed copy with the same bumps.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":7,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Element Mutation\n\n## What it is\n\n`mutateElement` changes an element in place and bumps `version`, `versionNonce` and `updated`; `newElementWith` returns a changed copy with the same bumps. Both return the element untouched when no value actually changed, unless `newElementWith` is called with `force`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Mutation helpers | `packages/element/src/mutateElement.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Scene]] — `Scene.mutateElement` wraps it and triggers a re-render\n- [[Shape Generation]] — it deletes the cached rough.js shape when `width`, `height`, `points` or `fileId` change\n- [[Linear Elements]] — an elbow arrow whose `points` or `fixedSegments` change is rerouted inside it by `updateElbowArrowPoints`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Excalidraw Component":{"path":"2 Modules/Excalidraw Component.md","type":"module","status":"shipped","depth":"stub","domain":"Embedding API","repo":"excalidraw","updated":"2026-10-19","summary":"`Excalidraw` is `React.memo` over `ExcalidrawBase` with a custom `areEqual`; it passes props to `App` and hands hosts an `ExcalidrawImperativeAPI` (`updateScene`, `getSceneElements`, `onChange` and more) through `onExcalidrawAPI`.","aliases":[],"tags":["module","domain/embedding-api"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Embedding API\nupdated: 2026-10-19\ntags: [module, domain/embedding-api]\n---\n# Excalidraw Component\n\n## What it is\n\n`Excalidraw` is `React.memo` over `ExcalidrawBase` with a custom `areEqual`; it passes props to `App` and hands hosts an `ExcalidrawImperativeAPI` (`updateScene`, `getSceneElements`, `onChange` and more) through `onExcalidrawAPI`. `initialData` is read once, in `App.initializeScene` after mount, so later scene changes must go through `updateScene`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Component and exports | `packages/excalidraw/index.tsx` |\n| Props and API types | `packages/excalidraw/types.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Embedding API]] — this module's business area\n- [[Editor App]] — the API object is built by `createExcalidrawAPI` on the `App` instance\n- [[Store]] — `updateScene` turns its `captureUpdate` option into a store micro action\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Fonts":{"path":"2 Modules/Fonts.md","type":"module","status":"shipped","depth":"stub","domain":"Rendering","repo":"excalidraw","updated":"2026-10-19","summary":"Font faces are loaded for the characters the scene's text actually uses.","aliases":[],"tags":["module","domain/rendering"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Rendering\nupdated: 2026-10-19\ntags: [module, domain/rendering]\n---\n# Fonts\n\n## What it is\n\nFont faces are loaded for the characters the scene's text actually uses. When new faces finish loading, `onLoaded` drops the cached shapes of text elements and their containers, clears the `charWidth` cache and triggers a scene update so text first drawn with a fallback font is redrawn; SVG export inlines fonts subset to the used glyphs with `subsetWoff2GlyphsByCodepoints`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Font registry | `packages/excalidraw/fonts/Fonts.ts`, `packages/excalidraw/fonts/ExcalidrawFontFace.ts` |\n| Subsetting | `packages/excalidraw/subset/subset-main.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Rendering]] — this module's business area\n- [[Shape Generation]] — loaded fonts invalidate `ShapeCache` entries\n- [[Image Export]] — exports wait for `Fonts.loadElementsFonts` before rendering\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Fractional Indexing":{"path":"2 Modules/Fractional Indexing.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"Z-order is the array order, mirrored into each element's `index` string so it survives merges between users.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Fractional Indexing\n\n## What it is\n\nZ-order is the array order, mirrored into each element's `index` string so it survives merges between users. `syncMovedIndices` and `syncInvalidIndices` regenerate indices that are missing or out of order, and `orderByFractionalIndex` sorts by them with the element `id` as tie-breaker.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Index sync | `packages/element/src/fractionalIndex.ts` |\n| Key generator | `packages/fractional-indexing/src/index.ts` |\n| Z-order | `packages/element/src/zindex.ts`, `packages/excalidraw/actions/actionZindex.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Reconciliation]] — merged element lists are re-sorted with `orderByFractionalIndex`\n- [[Scene]] — `replaceAllElements` runs `syncInvalidIndices` on every update\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Geometry Packages":{"path":"2 Modules/Geometry Packages.md","type":"module","status":"shipped","depth":"stub","domain":"Embedding API","repo":"excalidraw","updated":"2026-10-19","summary":"The math package holds geometry on branded tuples: `GlobalPoint` for scene coordinates, `LocalPoint` for coordinates relative to an element, and `Radians` for angles, so the type checker keeps them apart.","aliases":[],"tags":["module","domain/embedding-api"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Embedding API\nupdated: 2026-10-19\ntags: [module, domain/embedding-api]\n---\n# Geometry Packages\n\n## What it is\n\nThe math package holds geometry on branded tuples: `GlobalPoint` for scene coordinates, `LocalPoint` for coordinates relative to an element, and `Radians` for angles, so the type checker keeps them apart. The utils package re-exports `exportScene` and a few bounds helpers for use without the editor.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Math | `packages/math/src/index.ts`, `packages/math/src/types.ts`, `packages/math/src/point.ts` |\n| Utils | `packages/utils/src/index.ts`, `packages/utils/src/shape.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Embedding API]] — this module's business area\n- [[Linear Elements]] — line and arrow `points` are `LocalPoint` values\n- [[Image Export]] — the utils package re-exports the same `exportScene`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Groups & Frames":{"path":"2 Modules/Groups & Frames.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"A group is only a shared id in each member's `groupIds`, listed deepest first; there is no group element.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Groups & Frames\n\n## What it is\n\nA group is only a shared id in each member's `groupIds`, listed deepest first; there is no group element. A frame is a real element, its children point at it with `frameId`, and new children are placed in z-order next to the frame's existing children by `getFrameChildrenInsertionIndex`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Groups | `packages/element/src/groups.ts`, `packages/excalidraw/actions/actionGroup.tsx` |\n| Frames | `packages/element/src/frame.ts`, `packages/excalidraw/actions/actionFrame.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Scene]] — `getElementsFromId` resolves a group id to its member elements\n- [[Canvas Rendering]] — the static renderer clips frame children to their frame with `frameClip`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Hosted App Shell":{"path":"2 Modules/Hosted App Shell.md","type":"module","status":"shipped","depth":"stub","domain":"Hosted App","repo":"excalidraw","updated":"2026-10-19","summary":"The excalidraw.com app wraps `Excalidraw` with collaboration, share links and local saving.","aliases":[],"tags":["module","domain/hosted-app"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Hosted App\nupdated: 2026-10-19\ntags: [module, domain/hosted-app]\n---\n# Hosted App Shell\n\n## What it is\n\nThe excalidraw.com app wraps `Excalidraw` with collaboration, share links and local saving. On load its `initializeScene` takes the scene from local storage, a `#json=` share link (after asking, if the local scene is not empty), a `#room=` collaboration link or a `#url=` link.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| App | `excalidraw-app/App.tsx`, `excalidraw-app/index.tsx` |\n| Menus | `excalidraw-app/components/AppMainMenu.tsx`, `excalidraw-app/components/AppWelcomeScreen.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Hosted App]] — this module's business area\n- [[Collaboration Session]] — a `#room=` link starts or joins a room\n- [[Shareable Links]] — a `#json=` link is loaded with `importFromBackend`\n- [[Local Persistence]] — every `onChange` is saved locally unless saving is paused\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Image Export":{"path":"2 Modules/Image Export.md","type":"module","status":"shipped","depth":"stub","domain":"Export & Sharing","repo":"excalidraw","updated":"2026-10-19","summary":"`exportScene` renders elements to a canvas, a PNG or JPEG blob, or an SVG element, sized by an export config (`padding`, `scale`, `fit`, `maxWidthOrHeight` and others).","aliases":[],"tags":["module","domain/export-sharing"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Export & Sharing\nupdated: 2026-10-19\ntags: [module, domain/export-sharing]\n---\n# Image Export\n\n## What it is\n\n`exportScene` renders elements to a canvas, a PNG or JPEG blob, or an SVG element, sized by an export config (`padding`, `scale`, `fit`, `maxWidthOrHeight` and others). The editor's dialog builds that config from app state with `getExportConfigFromAppState` and saves through `exportCanvas`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Export API | `packages/excalidraw/scene/export.ts` |\n| Editor entry | `packages/excalidraw/data/index.ts`, `packages/excalidraw/components/ImageExportDialog.tsx` |\n| SVG renderer | `packages/excalidraw/renderer/staticSvgScene.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Export & Sharing]] — this module's business area\n- [[Canvas Rendering]] — PNG export reuses `renderStaticScene` on a fresh canvas\n- [[Scene Files]] — an embedded scene is written into the PNG or SVG with `serializeAsJSON`\n- [[Exporting the scene to PNG]] — the export path step by step\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Library Menu":{"path":"2 Modules/Library Menu.md","type":"module","status":"shipped","depth":"stub","domain":"Library","repo":"excalidraw","updated":"2026-10-19","summary":"The sidebar tab that lists library items and inserts chosen ones on the canvas, laid out by `distributeLibraryItemsOnSquareGrid`.","aliases":[],"tags":["module","domain/library"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Library\nupdated: 2026-10-19\ntags: [module, domain/library]\n---\n# Library Menu\n\n## What it is\n\nThe sidebar tab that lists library items and inserts chosen ones on the canvas, laid out by `distributeLibraryItemsOnSquareGrid`. It also offers publishing selected items to the public library.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Sidebar | `packages/excalidraw/components/LibraryMenu.tsx`, `packages/excalidraw/components/LibraryMenuItems.tsx` |\n| Publishing | `packages/excalidraw/components/PublishLibrary.tsx` |\n| Add to library | `packages/excalidraw/actions/actionAddToLibrary.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Library]] — this module's business area\n- [[Library Store]] — items are read from and written to `Library`\n- [[Editor App]] — inserting goes through the app's `onInsertElements`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Library Store":{"path":"2 Modules/Library Store.md","type":"module","status":"shipped","depth":"stub","domain":"Library","repo":"excalidraw","updated":"2026-10-19","summary":"`Library` holds the user's reusable items and runs updates through a promise queue, so each `setLibrary` waits for the one before it.","aliases":[],"tags":["module","domain/library"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Library\nupdated: 2026-10-19\ntags: [module, domain/library]\n---\n# Library Store\n\n## What it is\n\n`Library` holds the user's reusable items and runs updates through a promise queue, so each `setLibrary` waits for the one before it. `mergeLibraryItems` skips an incoming item when an existing one has the same elements in the same order (same ids and `versionNonce` values), and hosts persist the library through a `LibraryPersistenceAdapter` given to `useHandleLibrary`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Library | `packages/excalidraw/data/library.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Library]] — this module's business area\n- [[Library Menu]] — the sidebar reads the items this store publishes\n- [[Local Persistence]] — the hosted app stores the library in IndexedDB through `LibraryIndexedDBAdapter`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Linear Elements":{"path":"2 Modules/Linear Elements.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Lines and arrows store `points` relative to the element's `x` and `y`, and `LinearElementEditor` edits them point by point.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Linear Elements\n\n## What it is\n\nLines and arrows store `points` relative to the element's `x` and `y`, and `LinearElementEditor` edits them point by point. Elbow arrows are rerouted by `updateElbowArrowPoints`, which `mutateElement` calls whenever their points change.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Point editor | `packages/element/src/linearElementEditor.ts`, `packages/excalidraw/actions/actionLinearEditor.tsx` |\n| Elbow arrows | `packages/element/src/elbowArrow.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Arrow Binding]] — an arrow's end points can be bound to shapes\n- [[Element Mutation]] — elbow routing runs inside `mutateElement`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Local Persistence":{"path":"2 Modules/Local Persistence.md","type":"module","status":"shipped","depth":"stub","domain":"Hosted App","repo":"excalidraw","updated":"2026-10-19","summary":"Non-deleted elements and app state are saved to `localStorage` after a debounce, and image files to IndexedDB; nothing is saved while the tab is hidden or a lock such as collaboration is held.","aliases":[],"tags":["module","domain/hosted-app"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Hosted App\nupdated: 2026-10-19\ntags: [module, domain/hosted-app]\n---\n# Local Persistence\n\n## What it is\n\nNon-deleted elements and app state are saved to `localStorage` after a debounce, and image files to IndexedDB; nothing is saved while the tab is hidden or a lock such as collaboration is held. On focus, a tab that is not collaborating reloads the saved state when `isBrowserStorageStateNewer` sees a save timestamp later than its own.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Saving | `excalidraw-app/data/LocalData.ts`, `excalidraw-app/data/localStorage.ts` |\n| Tab sync | `excalidraw-app/data/tabSync.ts` |\n| Save lock | `excalidraw-app/data/Locker.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Hosted App]] — this module's business area\n- [[App State]] — `clearAppStateForLocalStorage` filters what is written\n- [[Hosted App Shell]] — the shell calls `LocalData.save` from `onChange` and syncs tabs on focus\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Reconciliation":{"path":"2 Modules/Reconciliation.md","type":"module","status":"shipped","depth":"stub","domain":"Live Collaboration","repo":"excalidraw","updated":"2026-10-19","summary":"`reconcileElements` merges a local and a remote element list one element at a time.","aliases":[],"tags":["module","domain/live-collaboration"],"flags":[],"inbound":6,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Live Collaboration\nupdated: 2026-10-19\ntags: [module, domain/live-collaboration]\n---\n# Reconciliation\n\n## What it is\n\n`reconcileElements` merges a local and a remote element list one element at a time. The local copy wins when it is the text being edited, the element being drawn or the one being resized, has a higher `version`, or has the same version and a lower or equal `versionNonce`; the result is sorted with `orderByFractionalIndex`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Reconcile | `packages/excalidraw/data/reconcile.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Live Collaboration]] — this module's business area\n- [[Fractional Indexing]] — merged elements are ordered by `index` and de-duplicated with `syncInvalidIndices`\n- [[Room Storage]] — `saveToFirebase` reconciles against the stored scene inside a transaction\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Room Storage":{"path":"2 Modules/Room Storage.md","type":"module","status":"shipped","depth":"stub","domain":"Live Collaboration","repo":"excalidraw","updated":"2026-10-19","summary":"Each room's scene is stored encrypted with the room key in a Firestore document in the `scenes` collection, and `saveToFirebase` reconciles with the stored copy inside `runTransaction`.","aliases":[],"tags":["module","domain/live-collaboration"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Live Collaboration\nupdated: 2026-10-19\ntags: [module, domain/live-collaboration]\n---\n# Room Storage\n\n## What it is\n\nEach room's scene is stored encrypted with the room key in a Firestore document in the `scenes` collection, and `saveToFirebase` reconciles with the stored copy inside `runTransaction`. Image files are uploaded separately, encrypted with the same key, and the `FileManager` tracks which ones are being fetched, saved or errored.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Firebase | `excalidraw-app/data/firebase.ts` |\n| File manager | `excalidraw-app/data/FileManager.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Live Collaboration]] — this module's business area\n- [[Reconciliation]] — the save merges with `reconcileElements`\n- [[Collaboration Session]] — a session joined by link loads the room from here when it is first in the room or no peer answers in time\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Scene Files":{"path":"2 Modules/Scene Files.md","type":"module","status":"shipped","depth":"stub","domain":"Export & Sharing","repo":"excalidraw","updated":"2026-10-19","summary":"Saving writes a .excalidraw JSON file through browser-fs-access, keeping only image files that non-deleted elements still use.","aliases":[],"tags":["module","domain/export-sharing"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Export & Sharing\nupdated: 2026-10-19\ntags: [module, domain/export-sharing]\n---\n# Scene Files\n\n## What it is\n\nSaving writes a .excalidraw JSON file through browser-fs-access, keeping only image files that non-deleted elements still use. Opening accepts that JSON or a PNG or SVG with an embedded scene, and always passes it through `restoreElements` and `restoreAppState`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| JSON | `packages/excalidraw/data/json.ts` |\n| Loading blobs | `packages/excalidraw/data/blob.ts` |\n| File system | `packages/excalidraw/data/filesystem.ts` |\n| PNG metadata | `packages/excalidraw/data/image.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Export & Sharing]] — this module's business area\n- [[Scene Restore]] — every loaded file is restored before it reaches the scene\n- [[App State]] — `serializeAsJSON` keeps only the keys `cleanAppStateForExport` allows\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Scene Restore":{"path":"2 Modules/Scene Restore.md","type":"module","status":"shipped","depth":"stub","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"Data from outside the editor (files, share links, local storage, collaborators) goes through `restoreElements` and `restoreAppState`, which fill missing fields, migrate legacy properties such as `strokeSharpness`, drop `selection` elements ","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":5,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Scene Restore\n\n## What it is\n\nData from outside the editor (files, share links, local storage, collaborators) goes through `restoreElements` and `restoreAppState`, which fill missing fields, migrate legacy properties such as `strokeSharpness`, drop `selection` elements and give duplicate ids a fresh `randomId`. With `repairBindings` it also repairs container, bound text and frame references; an element that throws while restoring is dropped with only a console error.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Restore | `packages/excalidraw/data/restore.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Arrow Binding]] — `repairBindings` fixes one-sided binding records on load\n- [[Fractional Indexing]] — restored elements get indices through `syncInvalidIndices`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Scene":{"path":"2 Modules/Scene.md","type":"module","status":"shipped","depth":"full","domain":"Elements & Scene","repo":"excalidraw","updated":"2026-10-19","summary":"`Scene` holds every element of the drawing, deleted ones included, and tells its subscribers when anything changes.","aliases":[],"tags":["module","domain/elements-scene"],"flags":[],"inbound":9,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: excalidraw\ndomain: Elements & Scene\nupdated: 2026-10-19\ntags: [module, domain/elements-scene]\n---\n# Scene\n\n## What it is\n\n`Scene` holds every element of the drawing, deleted ones included, and tells its subscribers when anything changes. Writes go through `replaceAllElements` (which `insertElementsAtIndex` and `mapElements` also end in) or `Scene.mutateElement`.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Scene | `packages/element/src/Scene.ts` |\n\n## How it works\n\n`Scene` keeps the full element array plus caches derived from it: a map by id, the non-deleted list and map, and the frames. Every bulk write goes through `replaceAllElements`, which runs `syncInvalidIndices` on the incoming array, rebuilds those caches and calls `triggerUpdate`. `triggerUpdate` draws a new random `sceneNonce` and runs every `onUpdate` callback; `App` registers its `triggerRender` there, so any scene write re-renders the editor.\n\n`insertElementsAtIndex` splices new elements in and gives them indices with `syncMovedIndices` before replacing the array. `Scene.mutateElement` edits one element in place through `mutateElement`, and triggers an update only when the element is in the scene, its version moved and `informMutation` is true. `getSelectedElements` caches its result per options hash and reuses it while both the elements array and the `selectedElementIds` object are the same objects as last time.\n\n## Connects to\n\n- [[Elements & Scene]] — this module's business area\n- [[Element Mutation]] — `Scene.mutateElement` delegates the actual write and version bump\n- [[Fractional Indexing]] — every update syncs indices with the array order\n- [[Canvas Rendering]] — the renderer memoizes on the `sceneNonce` that `triggerUpdate` sets\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- `mutateElement` from the element package does not re-render; use `scene.mutateElement`, or call `triggerUpdate` after a batch of silent mutations.\n- `replaceAllElements` runs `syncInvalidIndices`, which writes a new `index` (and so bumps `version`) on elements of the array you passed whenever their index is missing or out of order.\n- The selection cache is keyed on object identity: changing `selectedElementIds` in place returns the old selection. `App.componentDidUpdate` builds a new object only when ids are stale for the same reason.\n- `onUpdate` throws if the same callback is registered twice, and its remover throws if called twice.\n\n## History\n\n-\n"},"Selection":{"path":"2 Modules/Selection.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Selection lives in app state as `selectedElementIds` and `selectedGroupIds`, not on the elements.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Selection\n\n## What it is\n\nSelection lives in app state as `selectedElementIds` and `selectedGroupIds`, not on the elements. Click, box and lasso selection all resolve to those maps, with hit testing in `hitElementItself` and its neighbours.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| App helpers | `packages/excalidraw/components/App.selection.ts`, `packages/excalidraw/components/App.selectionTool.ts` |\n| Queries | `packages/element/src/selection.ts` |\n| Lasso | `packages/excalidraw/lasso/index.ts` |\n| Hit testing | `packages/element/src/collision.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Groups & Frames]] — `selectGroup` adds every member of a group to `selectedElementIds` and marks it in `selectedGroupIds`\n- [[Scene]] — `Scene.getSelectedElements` turns the id map into elements, cached\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Shape Generation":{"path":"2 Modules/Shape Generation.md","type":"module","status":"shipped","depth":"stub","domain":"Rendering","repo":"excalidraw","updated":"2026-10-19","summary":"Each element's rough.js drawable is generated from its `seed` and kept in `ShapeCache`, a `WeakMap` keyed by the element object and checked against the theme.","aliases":[],"tags":["module","domain/rendering"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Rendering\nupdated: 2026-10-19\ntags: [module, domain/rendering]\n---\n# Shape Generation\n\n## What it is\n\nEach element's rough.js drawable is generated from its `seed` and kept in `ShapeCache`, a `WeakMap` keyed by the element object and checked against the theme. Outside exports, `renderElement` draws most element types from a per-element offscreen canvas in `elementWithCanvasCache`, regenerated when zoom, theme, image crop or frame opacity change.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Shapes | `packages/element/src/shape.ts` |\n| Element drawing | `packages/element/src/renderElement.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Rendering]] — this module's business area\n- [[Element Mutation]] — `mutateElement` invalidates the cache on size, points or `fileId` changes\n- [[Fonts]] — a font finishing loading deletes the cached shapes of text elements\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Shareable Links":{"path":"2 Modules/Shareable Links.md","type":"module","status":"shipped","depth":"stub","domain":"Export & Sharing","repo":"excalidraw","updated":"2026-10-19","summary":"`exportToBackend` serializes the scene, compresses and encrypts it with a fresh AES-GCM key through `compressData`, uploads it, and puts `#json=\u003cid>,\u003ckey>` in the URL hash so the key never reaches the server.","aliases":[],"tags":["module","domain/export-sharing"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Export & Sharing\nupdated: 2026-10-19\ntags: [module, domain/export-sharing]\n---\n# Shareable Links\n\n## What it is\n\n`exportToBackend` serializes the scene, compresses and encrypts it with a fresh AES-GCM key through `compressData`, uploads it, and puts `#json=\u003cid>,\u003ckey>` in the URL hash so the key never reaches the server. Opening such a link runs `importFromBackend`, which falls back to the legacy format when decoding fails.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Backend | `excalidraw-app/data/index.ts` |\n| Dialog | `excalidraw-app/share/ShareDialog.tsx` |\n| Crypto and encoding | `packages/excalidraw/data/encryption.ts`, `packages/excalidraw/data/encode.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Export & Sharing]] — this module's business area\n- [[Scene Files]] — the payload is `serializeAsJSON` in its database form, without files\n- [[Room Storage]] — images in a shared scene are uploaded to Firebase with `saveFilesToFirebase`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Snapping":{"path":"2 Modules/Snapping.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Object snapping lines moved or drawn elements up with points and gaps of other elements within `getSnapDistance`, 8 pixels divided by the zoom.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":2,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Snapping\n\n## What it is\n\nObject snapping lines moved or drawn elements up with points and gaps of other elements within `getSnapDistance`, 8 pixels divided by the zoom. It follows `objectsSnapModeEnabled`, and holding Ctrl or Cmd inverts that setting (snapping cannot be turned on this way while the grid is on).\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Snapping | `packages/excalidraw/snapping.ts` |\n| Snap lines | `packages/excalidraw/renderer/renderSnaps.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Drag & Resize]] — drag and new-element sizing apply the snap offset\n- [[Canvas Rendering]] — snap lines are drawn on the interactive canvas\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Socket Portal":{"path":"2 Modules/Socket Portal.md","type":"module","status":"shipped","depth":"stub","domain":"Live Collaboration","repo":"excalidraw","updated":"2026-10-19","summary":"`Portal` owns the socket.io connection to one room and encrypts scene, pointer, idle and viewport messages with the room key through `encryptData`; the room join and follow notifications are sent unencrypted.","aliases":[],"tags":["module","domain/live-collaboration"],"flags":[],"inbound":3,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Live Collaboration\nupdated: 2026-10-19\ntags: [module, domain/live-collaboration]\n---\n# Socket Portal\n\n## What it is\n\n`Portal` owns the socket.io connection to one room and encrypts scene, pointer, idle and viewport messages with the room key through `encryptData`; the room join and follow notifications are sent unencrypted. Scene updates carry only elements whose `version` is above the one it last broadcast for that id, unless the caller asks to sync everything.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Portal | `excalidraw-app/collab/Portal.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Live Collaboration]] — this module's business area\n- [[Collaboration Session]] — `Collab` opens and closes the portal and handles what it receives\n- [[Shareable Links]] — it uses the same AES-GCM helpers in `packages/excalidraw/data/encryption.ts`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Store":{"path":"2 Modules/Store.md","type":"module","status":"shipped","depth":"full","domain":"History","repo":"excalidraw","updated":"2026-10-19","summary":"The `Store` decides which committed changes become undo entries.","aliases":[],"tags":["module","domain/history"],"flags":[],"inbound":9,"body":"---\ntype: module\nstatus: shipped\ndepth: full\nrepo: excalidraw\ndomain: History\nupdated: 2026-10-19\ntags: [module, domain/history]\n---\n# Store\n\n## What it is\n\nThe `Store` decides which committed changes become undo entries. After every render it compares the scene against a snapshot and emits durable increments, which history records, or ephemeral ones, which only `onIncrement` listeners see.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Store | `packages/element/src/store.ts` |\n\n## How it works\n\nThe `Store` keeps a `StoreSnapshot`: its own copies of the elements (deep-copied when they change) and the observed slice of app state from `getObservedAppState` (name, selection, editing group, background colour, cropping and lock state). Code says what the next commit should do: `scheduleCapture` asks for `CaptureUpdateAction.IMMEDIATELY`, and `updateScene` with a `captureUpdate` queues a micro action against the current state.\n\nAfter each render `App.componentDidUpdate` calls `Store.commit`. It runs the queued micro actions, then one macro action, where IMMEDIATELY wins over NEVER and NEVER over EVENTUALLY. IMMEDIATELY diffs against the snapshot, emits a `DurableIncrement` that `History.record` turns into an undo entry, and moves the snapshot. NEVER moves the snapshot and emits only an `EphemeralIncrement`. EVENTUALLY leaves the snapshot where it is, so the change is folded into the next durable increment.\n\n## Connects to\n\n- [[History]] — this module's business area\n- [[Deltas]] — durable increments carry a `StoreDelta` computed from two snapshots\n- [[Undo & Redo]] — `App` feeds every `onDurableIncrementEmitter` event into `History.record`\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n- Edits are found by `version` alone: `detectChangedElements` counts an existing element as changed only when its `version` is higher than in the snapshot, so a property written without a bump never reaches undo.\n- Updates to image elements that have no `fileId` yet are ignored by change detection.\n- Only the keys in `getObservedAppState` are tracked; zoom, scroll, the active tool and the rest of app state are never undoable.\n- `scheduleCapture` is called from many places (the code carries a TODO calling this error-prone). A path that forgets it leaves its change to be swept into whatever the next captured step is.\n\n## History\n\n-\n"},"Text Editing":{"path":"2 Modules/Text Editing.md","type":"module","status":"shipped","depth":"stub","domain":"Editing","repo":"excalidraw","updated":"2026-10-19","summary":"Editing text puts a DOM `textarea` over the canvas, and each keystroke replaces the text element with `newElementWith`, keeping what was typed in `originalText` and the wrapped result in `text`.","aliases":[],"tags":["module","domain/editing"],"flags":[],"inbound":1,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: Editing\nupdated: 2026-10-19\ntags: [module, domain/editing]\n---\n# Text Editing\n\n## What it is\n\nEditing text puts a DOM `textarea` over the canvas, and each keystroke replaces the text element with `newElementWith`, keeping what was typed in `originalText` and the wrapped result in `text`. Submitting text that is empty after trimming marks the element deleted.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| Editor overlay | `packages/excalidraw/wysiwyg/textWysiwyg.tsx` |\n| App helpers | `packages/excalidraw/components/App.text.ts`, `packages/excalidraw/components/App.textTool.ts` |\n| Layout | `packages/element/src/textElement.ts`, `packages/element/src/textMeasurements.ts`, `packages/element/src/textWrapping.ts` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[Editing]] — this module's business area\n- [[Canvas Rendering]] — the text being edited is left out of the static canvas while the textarea shows it\n- [[Arrow Binding]] — after each change `updateBoundElements` moves arrows bound to the text\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Undo & Redo":{"path":"2 Modules/Undo & Redo.md","type":"module","status":"shipped","depth":"stub","domain":"History","repo":"excalidraw","updated":"2026-10-19","summary":"`History` keeps undo and redo stacks of inverted deltas recorded from the Store's durable increments.","aliases":[],"tags":["module","domain/history"],"flags":[],"inbound":4,"body":"---\ntype: module\nstatus: shipped\ndepth: stub\nrepo: excalidraw\ndomain: History\nupdated: 2026-10-19\ntags: [module, domain/history]\n---\n# Undo & Redo\n\n## What it is\n\n`History` keeps undo and redo stacks of inverted deltas recorded from the Store's durable increments. Undo and redo are actions made per instance by `createUndoAction` and `createRedoAction`, and they do nothing while a drag, resize, text edit or new element is in progress.\n\n## Where it lives\n\n| Surface | Path |\n|---|---|\n| History | `packages/excalidraw/history.ts` |\n| Actions | `packages/excalidraw/actions/actionHistory.tsx` |\n\n## How it works\n\n_Stub: written up the first time someone works on this module for real._\n\n## Connects to\n\n- [[History]] — this module's business area\n- [[Deltas]] — each stack entry is a `HistoryDelta`\n- [[Store]] — applying an entry schedules an IMMEDIATELY micro action, so the change is still emitted as an increment\n\n## Config & flags\n\n| Key | Default | Effect |\n|---|---|---|\n\n## Gotchas\n\n-\n\n## History\n\n-\n"},"Drawing a rectangle":{"path":"3 Flows/Drawing a rectangle.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"A user presses, drags and releases with the rectangle tool.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [flow]\n---\n# Drawing a rectangle\n\n## What happens\n\nA user presses, drags and releases with the rectangle tool. The element is created and inserted on pointer down, resized in place on its own canvas while dragging, then normalized and captured for undo on pointer up.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the canvas pointer-down is routed by the active tool | `App.handleCanvasPointerDown` | [[Editor App]] |\n| 2 | a new element is built from the current style defaults | `newElement` | [[Element Model]] |\n| 3 | it is inserted into the scene and given a fractional index | `Scene.insertElementsAtIndex` | [[Scene]] |\n| 4 | pointer moves resize it in place without informing the scene | `dragNewElement` | [[Drag & Resize]] |\n| 5 | the element being drawn is painted on its own canvas | `renderNewElementScene` | [[Canvas Rendering]] |\n| 6 | pointer up normalizes its size and calls `triggerUpdate` | `App.onPointerUpFromPointerDownHandler` | [[Editor App]] |\n| 7 | the change is scheduled as an undoable step | `Store.scheduleCapture` | [[Store]] |\n| 8 | the commit after render records the delta | `History.record` | [[Undo & Redo]] |\n| 9 | the static canvas repaints with the finished element | `renderStaticScene` | [[Canvas Rendering]] |\n\n## Modules crossed\n\n- [[Editor App]] — the canvas pointer-down is routed by the active tool\n- [[Element Model]] — a new element is built from the current style defaults\n- [[Scene]] — it is inserted into the scene and given a fractional index\n- [[Drag & Resize]] — pointer moves resize it in place without informing the scene\n- [[Canvas Rendering]] — the element being drawn is painted on its own canvas\n- [[Store]] — the change is scheduled as an undoable step\n- [[Undo & Redo]] — the commit after render records the delta\n\n## Where it breaks\n\n- A shape whose width and height are both 0 at pointer up (a click without a drag) is removed with `CaptureUpdateAction.NEVER`, so it leaves nothing in the scene or the undo stack; and if the pointer-up never arrives, `missingPointerEventCleanupEmitter` replays the up handler at the next press or on `pointercancel`.\n"},"Exporting the scene to PNG":{"path":"3 Flows/Exporting the scene to PNG.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"A user exports from the image dialog.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [flow]\n---\n# Exporting the scene to PNG\n\n## What happens\n\nA user exports from the image dialog. The chosen elements are cloned, restored and measured, fonts and images are loaded, the static renderer paints them on a fresh canvas, and the PNG is saved with the scene optionally embedded.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the dialog picks the selection or the whole scene and clones it | `prepareElementsForExport` | [[Image Export]] |\n| 2 | the app hands the export to `exportCanvas` | `App.onExportImage` | [[Editor App]] |\n| 3 | export settings in app state become an export config | `getExportConfigFromAppState` | [[Image Export]] |\n| 4 | elements are restored and the output size is computed | `configExportDimension` | [[Image Export]] |\n| 5 | the fonts the text uses are loaded first | `Fonts.loadElementsFonts` | [[Fonts]] |\n| 6 | the static renderer paints on a new canvas with `isExporting` | `renderStaticScene` | [[Canvas Rendering]] |\n| 7 | the canvas becomes a PNG blob | `canvasToBlob` | [[Scene Files]] |\n| 8 | the scene JSON is embedded in the PNG when asked | `encodePngMetadata` | [[Scene Files]] |\n| 9 | the file is saved through the browser file API | `fileSave` | [[Scene Files]] |\n\n## Modules crossed\n\n- [[Image Export]] — the dialog picks the selection or the whole scene and clones it\n- [[Editor App]] — the app hands the export to `exportCanvas`\n- [[Fonts]] — the fonts the text uses are loaded first\n- [[Canvas Rendering]] — the static renderer paints on a new canvas with `isExporting`\n- [[Scene Files]] — the canvas becomes a PNG blob\n\n## Where it breaks\n\n- `exportCanvas` throws `alerts.cannotExportEmptyCanvas` when there is nothing to export, and when the only selected element is a frame, `prepareElementsForExport` exports every element overlapping that frame, not just its children.\n"},"Receiving a collaborator's change":{"path":"3 Flows/Receiving a collaborator's change.md","type":"flow","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"A peer in the same room edits the drawing.","aliases":[],"tags":["flow"],"flags":[],"inbound":2,"body":"---\ntype: flow\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [flow]\n---\n# Receiving a collaborator's change\n\n## What happens\n\nA peer in the same room edits the drawing. The encrypted message is decrypted, its elements are restored and merged with the local scene, and the result replaces the scene without touching local undo.\n\n## Steps\n\n| # | Step | Where | Module |\n|---|---|---|---|\n| 1 | the socket delivers an encrypted `client-broadcast` | `Collab.startCollaboration` | [[Collaboration Session]] |\n| 2 | the payload is decrypted with the room key | `decryptData` | [[Shareable Links]] |\n| 3 | remote elements are restored against the local ones | `restoreElements` | [[Scene Restore]] |\n| 4 | each element is merged by version and nonce | `reconcileElements` | [[Reconciliation]] |\n| 5 | the merged list is ordered by fractional index | `orderByFractionalIndex` | [[Fractional Indexing]] |\n| 6 | the received version is recorded so it is not echoed back | `Collab.setLastBroadcastedOrReceivedSceneVersion` | [[Collaboration Session]] |\n| 7 | the scene is replaced with `CaptureUpdateAction.NEVER` | `App.updateScene` | [[Excalidraw Component]] |\n| 8 | images marked saved are fetched from Firebase | `Collab.fetchImageFilesFromFirebase` | [[Room Storage]] |\n\n## Modules crossed\n\n- [[Collaboration Session]] — the socket delivers an encrypted `client-broadcast`\n- [[Shareable Links]] — the payload is decrypted with the room key\n- [[Scene Restore]] — remote elements are restored against the local ones\n- [
