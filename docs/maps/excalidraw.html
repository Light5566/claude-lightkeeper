[Reconciliation]] — each element is merged by version and nonce\n- [[Fractional Indexing]] — the merged list is ordered by fractional index\n- [[Excalidraw Component]] — the scene is replaced with `CaptureUpdateAction.NEVER`\n- [[Room Storage]] — images marked saved are fetched from Firebase\n\n## Where it breaks\n\n- `shouldDiscardRemoteElement` drops the remote copy of any element that is locally the text being edited, the element being resized or the element being drawn, whatever its version, so concurrent edits to one element do not merge: one side's whole element wins.\n"},"Action dispatch":{"path":"5 Platform/Action dispatch.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"An action is an object passed to `register`, which appends it to a module-level `actions` array when its file is imported; `App` hands that array to `ActionManager.registerAll` in its constructor, and adds undo and redo separately.","aliases":[],"tags":["platform"],"flags":[],"inbound":3,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [platform]\n---\n# Action dispatch\n\n## What it is\n\nAn action is an object passed to `register`, which appends it to a module-level `actions` array when its file is imported; `App` hands that array to `ActionManager.registerAll` in its constructor, and adds undo and redo separately. The manager runs `perform` from three places: `handleKeyDown` for shortcuts (through each action's `keyTest`), `renderAction` for UI panels (through `updateData`), and `executeAction` for the context menu, internal callers and the host API, each call tagged with a `source`. `perform` returns an `ActionResult` with optional `elements`, `appState` and `files` and a required `captureUpdate`; `App.syncActionResult` schedules that on the Store, replaces the scene's elements and merges the app state.\n\n## Connects to\n\n- [[Actions]] — the action files this convention covers\n- [[Store]] — every result's `captureUpdate` is scheduled on the Store\n- [[Editor App]] — `syncActionResult` is the updater the manager calls\n\n## Gotchas\n\n- When more than one action's `keyTest` matches a key event, `handleKeyDown` runs none of them and logs a warning; `keyPriority` only sorts the list and does not break the tie.\n- `syncActionResult` reads `viewModeEnabled`, `zenModeEnabled` and `theme` from the returned `appState` and falls back to off, off and the `theme` prop (or light) when they are missing, so an action must spread the current `appState` into its result.\n- Returning `false` from `perform` cancels the update entirely.\n- In a non-interactive editor, `executeAction` ignores calls from the UI, keyboard and menus (any source but `api`), except `navigation` actions while navigation is enabled.\n"},"Scene versions and re-rendering":{"path":"5 Platform/Scene versions and re-rendering.md","type":"platform","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Two different counters drive the editor.","aliases":[],"tags":["platform"],"flags":[],"inbound":3,"body":"---\ntype: platform\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [platform]\n---\n# Scene versions and re-rendering\n\n## What it is\n\nTwo different counters drive the editor. Each element's `version` and `versionNonce` change on every edit; the Store, reconciliation and the broadcast filter compare them. The `Scene` also draws a random `sceneNonce` on every `triggerUpdate`; it is render-only, and `Renderer.getRenderableElements` and the `StaticCanvas` memo key on it. `mutateElement` bumps the element version but does not trigger anything; `Scene.mutateElement` and `replaceAllElements` trigger, and `App` re-renders on every trigger because it registers `triggerRender` with `onUpdate`. Shape caches are keyed by the element object itself, so a new object from `newElementWith` always gets a fresh shape.\n\n## Connects to\n\n- [[Scene]] — where `sceneNonce` lives and `triggerUpdate` runs\n- [[Element Mutation]] — where `version` and `versionNonce` are bumped\n- [[Canvas Rendering]] — memoizes on the nonce rather than diffing elements\n\n## Gotchas\n\n- An element changed in place keeps its object identity, so `ShapeCache` keeps the old drawable unless `mutateElement` deleted it, which it does only for `width`, `height`, `points` and `fileId`. The style actions use `newElementWith`, which makes a new object and so gets a fresh shape.\n- While a new element is drag-sized it is mutated with `informMutation: false`, so `sceneNonce` does not move; it is visible only because the new-element canvas draws it from the live object.\n- Undo and redo apply deltas with `version` and `versionNonce` excluded (`excludedProperties`), so each undo produces a new version that collaborators accept as a fresh edit.\n"},"Elements carry their own version":{"path":"6 Decisions/Elements carry their own version.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Every element has an integer `version` and a random `versionNonce` that change on each edit, and collaborators exchange whole elements, not operations.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Elements carry their own version\n\n## Decision\n\nEvery element has an integer `version` and a random `versionNonce` that change on each edit, and collaborators exchange whole elements, not operations. Reconciliation compares both fields; the Store's change detection and the broadcast filter compare `version`.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nWhole elements with a version can be merged one at a time by comparing two numbers, and the same comparison serves the socket in `reconcileElements`, the Firestore transaction in `saveToFirebase` and share-link imports through `bumpElementVersions`. A dropped message is repaired by the periodic full sync in `queueBroadcastAllElements` rather than by replaying a log.\n\n## Consequences\n\nEvery change to an element must move its version through `mutateElement`, `newElementWith` or `bumpVersion`; a direct property write is invisible to undo, to the broadcast filter and to peers. Concurrent edits to one element do not merge field by field: one side's whole element wins.\n\n## Affects\n\n- [[Reconciliation]] — picks the winner by `version`, then `versionNonce`\n- [[Store]] — detects changes by a higher `version`\n- [[Socket Portal]] — sends only elements whose `version` grew since the last broadcast\n"},"Outside changes never enter local undo":{"path":"6 Decisions/Outside changes never enter local undo.md","type":"decision","status":"accepted","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Collaborator updates, Firebase saves, tab sync and scene initialization are all applied with `CaptureUpdateAction.NEVER`, which moves the Store's snapshot without emitting a durable increment.","aliases":[],"tags":["decision"],"flags":[],"inbound":1,"body":"---\ntype: decision\nstatus: accepted\ndate: 2026-10-19\nupdated: 2026-10-19\ntags: [decision]\n---\n# Outside changes never enter local undo\n\n## Decision\n\nCollaborator updates, Firebase saves, tab sync and scene initialization are all applied with `CaptureUpdateAction.NEVER`, which moves the Store's snapshot without emitting a durable increment.\n\n## Context\n\nObserved in the code while seeding this vault; the project does not record the reason itself.\n\n## Why this and not the alternative\n\nThe next local delta is then computed against a snapshot that already contains the outside change, so the undo stack holds only this tab's own edits. Capturing those changes instead would put a collaborator's edits on this user's undo stack.\n\n## Consequences\n\nA new path that loads outside data must pass `CaptureUpdateAction.NEVER` to `updateScene`. Leaving `captureUpdate` out means EVENTUALLY, and the change is folded into the user's next undo step.\n\n## Affects\n\n- [[Store]] — NEVER updates the snapshot and emits only an ephemeral increment\n- [[Collaboration Session]] — `handleRemoteSceneUpdate` applies remote elements this way\n- [[Local Persistence]] — tab sync reloads the other tab's state this way\n"},"excalidraw":{"path":"8 Repos/excalidraw.md","type":"repo","status":"shipped","depth":"full","domain":"","repo":"excalidraw","updated":"2026-10-19","summary":"Excalidraw is an open-source (MIT) whiteboard for diagrams with a hand-drawn look.","aliases":[],"tags":["repo"],"flags":[],"inbound":0,"body":"---\ntype: repo\nstatus: shipped\ndepth: full\nrepo: excalidraw\nupdated: 2026-10-19\ntags: [repo]\n---\n# excalidraw\n\n## What it is\n\nExcalidraw is an open-source (MIT) whiteboard for diagrams with a hand-drawn look. This vault is a demo map of its codebase at one commit of the master branch, seeded from the package layout, with every flow step, fact and gotcha checked against the code.\n\n## Where it lives\n\nA Yarn workspaces monorepo. The editor is the React component in `packages/excalidraw`; element logic is in `packages/element`, geometry in `packages/math`, shared constants and helpers in `packages/common`, and export helpers in `packages/utils`. The hosted app, with live collaboration and share links, is `excalidraw-app`. Integration examples are under `examples`.\n\n## How it works\n\nThe editor is one `App` class component holding a `Scene` of elements. Edits go through actions or through scene mutation helpers, a `Store` turns each committed change into a delta for undo, and three stacked canvases paint the result. The hosted app listens to `onChange` to broadcast elements to a room and to save to local storage. `yarn start` runs the hosted app and `yarn test` runs Vitest.\n\n## Connects to\n\n- [[Home]] — the entry page lists the domains\n- [[Scene versions and re-rendering]] — the counters every module relies on\n- [[Action dispatch]] — how commands reach the scene\n\n## Gotchas\n\n- Changelogs live in `packages/excalidraw/CHANGELOG.md` and `packages/utils/CHANGELOG.md`; `excalidraw-app` has none.\n"},"Home":{"path":"Home.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"A living map of how Excalidraw is built and how the pieces connect.","aliases":[],"tags":["meta"],"flags":[],"inbound":1,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Excalidraw — the world\n\nA living map of how Excalidraw is built and how the pieces connect. Business areas live in `1 Domains`, the things you can point at in `2 Modules`, the journeys that cross them in `3 Flows`, the outside systems they call in `4 Integrations`, the conventions and traps every module inherits in `5 Platform`, the reasons things are the way they are in `6 Decisions`, what moved in each version in `7 Releases`, and one orientation note per codebase in `8 Repos`: [[excalidraw]].\n\n> **[[World.canvas|World]]** — the visual map: domains as groups, modules inside them, the strongest links between them. The tool regenerates it on every `vault check --write`. Never edit it by hand.\n>\n> **Before writing anything here**, read [[Conventions]]. **After shipping anything**, read [[How to update]].\n\n## Finding things\n\nThe vault is queryable. People and agents use the same tool:\n\n```bash\nvault find payment capture                            # topic → notes + blast radius\nvault find --paths app/Services/PaymentService.php    # file → the notes that own it\nvault status                                          # coverage, stale notes, what needs attention\nvault sync                                            # what landed on the production branch since the vault last caught up\nvault check --write                                   # lint, rebuild the index, regenerate the generated files\n```\n\nEvery hit prints the note's one-liner, its `status` and `updated`, and its linked neighbours **with the reason each link exists**. That neighbour list is the blast radius of a change: the other notes to check before you touch this one. Inside a repo this vault covers, the Claude Code hooks surface the same notes without being asked.\n\n## The domains\n\nOne note per business area in `1 Domains`. Fill this table as the domains take shape, one line each.\n\n| Domain | What lives there |\n|---|---|\n| [[Elements & Scene]] | Elements, the scene that holds them, and the rules that keep them consistent |\n| [[Editing]] | What a user does on the canvas |\n| [[Rendering]] | Painting the scene |\n| [[History]] | Undo and redo |\n| [[Live Collaboration]] | Rooms on the hosted app |\n| [[Export & Sharing]] | Getting a scene out |\n| [[Library]] | Reusable items a user saves, browses in the sidebar and drops onto the canvas. |\n| [[Embedding API]] | What a host app gets from the npm packages |\n| [[Hosted App]] | The excalidraw.com app around the editor |\n\n## The journeys\n\nA module tells you what one thing does. A flow tells you what actually happens to a customer, an order or a payment, start to finish. One note per journey in `3 Flows`. List them here.\n\n- [[Drawing a rectangle]] — A user presses, drags and releases with the rectangle tool\n- [[Receiving a collaborator's change]] — A peer in the same room edits the drawing\n- [[Exporting the scene to PNG]] — A user exports from the image dialog\n\n## The mechanics\n\nConventions every module inherits, and traps that have bitten more than once. One note each in `5 Platform`. Read these before writing code; most review comments turn out to be one of them.\n\n- [[Action dispatch]] · [[Scene versions and re-rendering]]\n\n## Why it's like that\n\nDecisions worth remembering, above all the ones that surprise newcomers: reversals, rulings from the client, refactors that were deliberately deferred. The full list lives in `6 Decisions`. Put the ones that catch people out here.\n\n- [[Elements carry their own version]] — Every element has an integer `version` and a random `versionNonce` that change on each edit, and collaborators exchange whole elements, not operations\n- [[Outside changes never enter local undo]] — Collaborator updates, Firebase saves, tab sync and scene initialization are all applied with `CaptureUpdateAction.NEVER`, which moves the Store's snapshot without emitting a durable increment\n\n## Reading the graph\n\nOpen the graph view. Colours come from query patterns on the frontmatter, not from folders.\n\n| Colour | What it means |\n|---|---|\n| 🟠 Orange | A module, written up |\n| ⚫ Slate | A note nobody has written up yet — `depth: stub` |\n| 🔴 Dark red | Deprecated — don't build on it |\n| 🌸 Pink | Domain |\n| 🟢 Green | Flow |\n| 🔵 Blue | Integration |\n| 🟣 Purple | Platform convention or trap |\n| 🟡 Yellow | Decision |\n| ⚪ Grey | Release |\n| 🩵 Teal | Repo |\n\nBecause the groups are queries, a note turns slate the moment its `depth` says `stub` and orange when it is written up. The graph shows coverage without anyone maintaining a list.\n\n## Views\n\nObsidian Bases over the frontmatter, in `_meta/views`. They read the notes live; nothing to regenerate.\n\n- [[Coverage.base|Coverage]] — every note by `type` and `depth`, so you can see what is still a stub\n- [[Stale.base|Stale]] — notes whose `updated` is older than `stale_days` in `vault.json`\n- [[Recent.base|Recent]] — what changed in the vault lately\n- [[Decisions.base|Decisions]] — every decision with its status, open ones first\n\n## Honesty\n\nThis vault is only worth what it is worth if it is true. Each note records what was true when it was last `updated`. If the code disagrees, the code wins and the note gets fixed. `status: shipped` means the code is on the production branch named in `vault.json`; anything else is `in-progress`, `planned` or `deprecated`. `depth: stub` means the note is thin, not that the module is small. [[Coverage]] counts the stubs, [[Attention]] lists what needs a human, and [[Vault Changelog]] shows what the vault itself learned and when.\n"},"Attention":{"path":"_meta/Attention.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Attention\n\n> Regenerated by `vault check --write`. Each line is a note the signals say needs a look;\n> `/lightkeeper:tidy` works the list. Don't hand-edit.\n\n_Nothing needs attention._\n"},"Conventions":{"path":"_meta/Conventions.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"How notes in this vault are written.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Conventions\n\nHow notes in this vault are written. A note that doesn't follow this is a bug. Fix it.\n\n## The one rule that matters\n\n> **Every `[[link]]` carries a reason.**\n\n```markdown\n- [[Invoice]] — an order confirmation bills through `InvoiceService::create()`\n```\n\nnot\n\n```markdown\n- [[Invoice]]\n```\n\nA bare link makes the graph a hairball. You can see that two things touch but not how, so the picture tells you nothing you couldn't have guessed. The reason clause turns it into a map you can navigate. It is also the part that rots first: when the reason stops being true the link is a lie, and that is your signal to fix the note.\n\nThe machine index reads the reasons too. They become the \"blast radius\" printed beside every `vault find` hit, so a bare link also hides a relationship from the tooling.\n\n## Folders\n\n| Folder | Holds | One note per |\n|---|---|---|\n| `1 Domains` | Business areas, grouped the way the product groups them (navigation, route groups) | Area |\n| `2 Modules` | The citizens of the world: a feature you can point at in the UI or the API | Module |\n| `3 Flows` | End-to-end journeys that cross several modules | Journey |\n| `4 Integrations` | Anything outside the codebase that it talks to | External system |\n| `5 Platform` | Cross-cutting mechanics every module inherits, and traps that bite again | Convention or trap |\n| `6 Decisions` | Why something is the way it is, decision-record style | Decision |\n| `7 Releases` | Which parts of the world moved in a version | Version |\n| `8 Repos` | Orientation for one codebase | Repo |\n| `_templates` | Copy these to start a note | — |\n| `_meta` | Conventions, How to update, `vault.json`, optional `local.md`, the generated files, `views/` | — |\n\n`Home.md` and `World.canvas` sit at the root. The canvas is regenerated by `vault check --write`. Never edit it by hand.\n\nDomains follow the product. Take them from the navigation or the route groups, and when the product regroups, the domains follow. Don't invent a parallel taxonomy.\n\n## Frontmatter\n\nEvery note carries these. Obsidian renders them as properties; the tool reads them line by line.\n\n| Key | Values | Why it exists |\n|---|---|---|\n| `type` | `module` `domain` `flow` `integration` `platform` `decision` `release` `repo` `meta` | Filtering, graph colour, the views |\n| `aliases` | `[Billing, INV]` — a flat inline list | Other names this note answers to. `[[INV]]` resolves, `vault find` matches them, and the prompt hook watches for them |\n| `status` | `shipped` `in-progress` `planned` `deprecated`; decisions use `accepted` `open` `superseded` | A note about unmerged work must say so, or the vault lies about production |\n| `depth` | `full` `stub` | Honest coverage. A stub is a real note with real links, just thin |\n| `repo` | A key from `repos` in `vault.json`, or `both` | Where the code is |\n| `domain` | The name of a `1 Domains` note | Groups modules |\n| `since` | `v1.4.0` | The release it first shipped in, when known. Leave it empty rather than guess |\n| `updated` | `YYYY-MM-DD` | The staleness detector. Bump it every time you touch the note |\n| `flags` | `[FEATURE_X_ENABLED]` | Every flag-gated thing at a glance; the prompt hook matches these too |\n| `tags` | `[module, domain/billing]` | Tag-pane navigation |\n\nFrontmatter stays **flat, one `key: value` per line**. Lists are inline: `flags: [A, B]`. Nested YAML parses wrong in the tool and in Obsidian's queries.\n\n### What `status` means\n\n**`shipped` means the code is on the production branch**: the `production_ref` of that repo in `vault.json`, typically `origin/main`. Work that exists only on a staging branch or a feature branch is `in-progress`, however finished it feels.\n\nVerify, don't assume:\n\n```bash\ngit merge-base --is-ancestor \u003csha> origin/main && grep -rn \"the thing you expect\" app/\n```\n\nThe content grep matters. A commit in the production branch's history is not proof the feature is live; it may have been reworked away later.\n\n`status` and `depth` do different jobs. `status: in-progress` means the code isn't on production. `depth: stub` means the note is thin. A shipped module with a stub note is the normal starting state.\n\n### Alias rules\n\n`vault check` enforces these.\n\n- A flat one-line list only.\n- Aliases are other names and abbreviations of **this** note: what the team, the client or the code call it. Never a related-but-different concept; that is a link's job.\n- No `[[`, `]]`, `|` or `#` inside an alias.\n- An alias may not collide with another note's name or alias.\n\n## Section order\n\nModule and integration notes always use this order, so any two diff cleanly and you learn where to look:\n\n1. **What it is** — plain language, two or three sentences\n2. **Where it lives** — the paths table\n3. **How it works** — in the order the code runs\n4. **Connects to** — linked, with reasons\n5. **Config & flags**\n6. **Gotchas**\n7. **History**\n\nDon't add sections. If something doesn't fit, it belongs in *Gotchas* or in its own `6 Decisions` note.\n\n## Writing style\n\n- **Paths are code-spans, not links**: `app/Services/PaymentService.php`. The vault points at code; it isn't a code browser.\n- **The *Where it lives* table is machine-read**, so it must be true. Real files only. The first path in a cell is fully qualified; siblings in the same cell may be bare filenames. **Never cite a container directory** such as `app/Services/` there. Delete a row you can't fill.\n- **Only the owning note cites a file by its full path.** Every full path in a note's body counts as ownership in the index, so a flow, platform or decision note that writes `app/Services/PaymentService.php` starts competing with the Payment note for that file in the pre-edit hook. Elsewhere, name the code by class and method: `PaymentService::capture()`. It reads just as well and claims nothing.\n- **Plain language in *What it is*.** If a non-engineer can't follow it, rewrite it. Everything technical has six other sections to live in.\n- **Gotchas are specific.** \"Be careful with totals\" is worthless. \"`Order::total()` returns minor units and the CSV export multiplies by 100 again if you hand it a float\" is worth keeping forever.\n- **Say what the code does, not what someone remembers.** When the why of a deliberate-looking choice isn't recorded anywhere, write \"reason not recorded\". A wrong why is the one thing the vault can never recover from.\n- **No screenshots.** They rot faster than text.\n\n## Stub → full\n\nA stub gets promoted the first time you touch that module for real. Promotion means: fill *How it works*, add at least two reasoned links, list the real gotchas, set `depth: full`, bump `updated`. Don't promote by padding. A stub that is honestly thin beats a full note that is half invented.\n\n## Machine index\n\nThe vault is read by machines as well as people. `vault find` and the Claude Code hooks run off `_meta/index.json`, which `vault check --write` rebuilds and which is gitignored on purpose: the Stop reminder goes quiet while the vault is dirty, so a tracked, auto-rebuilt index would silence it for good.\n\nWhat the index extracts, and therefore what your writing feeds:\n\n- the **Where it lives** table → the file-to-note reverse lookup behind the pre-edit hook and `vault find --paths`. Container directories are ignored and reported by `vault check`.\n- reasoned `- [[link]] — why` bullets, and the `See [[X]] — why` idiom → the edge list whose reasons become the blast radius beside every hit. One more reason the one rule matters.\n- the first sentence of **What it is** → the one-liner shown in search results.\n- `aliases` and `flags` → extra search names, and what the prompt hook matches on.\n- `updated`, `depth` and `status` → the honesty fields printed with every hit, and the inputs to `Coverage.md`, `Attention.md` and the views.\n\n## What does NOT go here\n\n- **Code.** Snippets only where the shape itself is the point.\n- **The release log.** The repo's `CHANGELOG.md` (or whatever `version_log` names in `vault.json`) owns release history and deploy commands. `7 Releases` only records which parts of the world moved.\n- **Secrets, credentials, personal data.** No keys, tokens or passwords. No real names, emails, phone numbers or account identifiers; use obvious placeholders. The vault syncs to other machines.\n- **Task lists.** Those live in your tracker.\n- **Docs with an external audience.** Client guides, runbooks and API references stay in the repo's docs folder. The vault links to them rather than absorbing them.\n\nRules that apply only to this vault go in `_meta/local.md`. Every skill reads it last, so it is the right place for a house style, a naming rule or a branch convention that this file doesn't cover.\n"},"Coverage":{"path":"_meta/Coverage.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write`.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Coverage\n\n> Regenerated by `vault check --write`. Don't hand-edit;\n> change a note's `depth:` field instead.\n\n**4 of 35 module notes are `full`.** 58 notes in the vault.\n\nA `stub` is a real note with real paths and real links — just thin. It gets\npromoted the first time we work on that module. See [[How to update]].\n\n## Full\n\n- [[Canvas Rendering]] — Rendering\n- [[Collaboration Session]] — Live Collaboration\n- [[Scene]] — Elements & Scene\n- [[Store]] — History\n\n## Stub — promote on next touch\n\n- [[Actions]] — Editing\n- [[App State]] — Editing\n- [[Arrow Binding]] — Elements & Scene\n- [[Clipboard]] — Editing\n- [[Deltas]] — History\n- [[Drag & Resize]] — Editing\n- [[Editor App]] — Editing\n- [[Element Model]] — Elements & Scene\n- [[Element Mutation]] — Elements & Scene\n- [[Excalidraw Component]] — Embedding API\n- [[Fonts]] — Rendering\n- [[Fractional Indexing]] — Elements & Scene\n- [[Geometry Packages]] — Embedding API\n- [[Groups & Frames]] — Elements & Scene\n- [[Hosted App Shell]] — Hosted App\n- [[Image Export]] — Export & Sharing\n- [[Library Menu]] — Library\n- [[Library Store]] — Library\n- [[Linear Elements]] — Editing\n- [[Local Persistence]] — Hosted App\n- [[Reconciliation]] — Live Collaboration\n- [[Room Storage]] — Live Collaboration\n- [[Scene Files]] — Export & Sharing\n- [[Scene Restore]] — Elements & Scene\n- [[Selection]] — Editing\n- [[Shape Generation]] — Rendering\n- [[Shareable Links]] — Export & Sharing\n- [[Snapping]] — Editing\n- [[Socket Portal]] — Live Collaboration\n- [[Text Editing]] — Editing\n- [[Undo & Redo]] — History\n"},"How to update":{"path":"_meta/How to update.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"The human-readable copy of the ritual.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# How to update this vault\n\nThe human-readable copy of the ritual. The machine-readable copy is the `knowledge-vault` skill the Claude Code plugin loads, and `vault-sync` is the catch-up for work that landed without a vault update. Keep this note and the skill in step. Rules specific to this vault go in `_meta/local.md`.\n\n## Read before you write\n\nThe vault is the retrieval layer. Query it before a change, not only after:\n\n```bash\nvault find order refund                               # topic → notes + blast radius\nvault find --paths app/Services/RefundService.php     # the files you'll touch → owning notes\n```\n\nRead the matched note's *How it works* and *Gotchas* before changing that area. The neighbours `vault find` prints, each with the reason the link exists, are the blast radius: the other notes to check when your change ripples. Inside a covered repo the hooks do the lookup for you: a hint on your prompt, a pointer before your first edit of a documented file. When a hook surfaces a note, actually read it.\n\n## The rule\n\n> Updating this vault is part of the definition of done, exactly like the changelog entry. A change that ships without its note is incomplete.\n\nDo it in the same working session as the code, while the reasoning is still in your head. A week later you remember what you changed but not why, and the why is the only part the diff can't give back.\n\n## Trigger table\n\n| What changed | What to touch |\n|---|---|\n| **New module** | New note in `2 Modules` + a reasoned link from its `1 Domains` note |\n| **Enhanced module** | That note's *How it works* / *Gotchas*; bump `updated`; promote `depth: stub → full` |\n| **Behaviour spanning modules** | A `3 Flows` note, plus the reasoned link on **both** module notes |\n| **New or changed third party** | `4 Integrations` |\n| **New convention, or a trap that will bite again** | `5 Platform` |\n| **A non-obvious why**: a client ruling, a reversal, a deferred refactor | `6 Decisions` |\n| **Renamed or removed module** | Rename the note (Obsidian fixes inbound links) or set `status: deprecated`. Never delete silently |\n| **Release reached the production branch** | `7 Releases/vX.Y.Z.md` + the reconcile sweep below |\n\nThe canvas is not on the list. `vault check --write` regenerates `World.canvas` from the notes.\n\n## The 60-second version\n\nMost changes are an enhancement to one existing module. That is three edits:\n\n1. Open `2 Modules/\u003cThing>.md`.\n2. Amend *How it works*, and *Gotchas* if you just lost an hour to something.\n3. Bump `updated` to today.\n\nIf the change made two modules touch in a new way, add the reasoned link on **both** notes. One-directional links are how the map starts drifting from reality.\n\nIf the work is still on a branch, say so: `status: in-progress` on a new note, or a \"(on `develop`, not yet on `main`)\" marker on the paragraph you added to a shipped note. Flip it when you verify the merge.\n\nThen:\n\n```bash\nvault check --write      # must exit 0\ngit -C \u003cvault> add -A && git commit -m \"Payment: capture retries; Gotcha on webhook ordering\"\n```\n\nThe vault is its own repo. The vault commit is part of the ritual and is separate from the code commit.\n\n## Release-cut reconcile\n\nWhen a version reaches the production branch:\n\n1. Create `7 Releases/vX.Y.Z.md` from the Release template. `vault release vX.Y.Z` prints the window and the notes whose files moved.\n2. List every module note the release touched, each with what changed.\n3. Sweep for misses: a note whose `updated` predates the previous release but whose files moved in this one was skipped. Fix it now.\n4. Record the commands the release needs (migrations, seeders, one-off patches) under *Commands to run*, and the flags it flips under *Flags flipped*.\n5. Flip `in-progress` claims the release made true, after verifying each one.\n\n`/lightkeeper:release vX.Y.Z` walks these steps.\n\n## Catching up\n\nIf a session shipped code without updating the vault, don't reconstruct from memory. Read the changelog entry and the actual diff, then write what the code says. A note written from a hazy recollection is worse than a stub: a stub is honestly thin, a bad note is confidently wrong.\n\nOther people's pushes have no hooks pointed at this vault. `vault sync` reports everything that landed on each watched repo's production branch since the vault last reconciled, grouped by owning note. The `vault-sync` skill walks the catch-up.\n\n## Keeping yourself honest\n\n- **Five advisory hooks** run in every repo this vault covers: a session primer; prompt-matched note hints, with a once-per-session nudge when a prompt sounds like a decision; a pointer at the owning note before an edit; a Stop reminder that names the notes the session's changed files belong to when the vault didn't move; and a reminder to re-query the vault before context is compacted. None of them block anything, and none can tell a typo fix from a new module. Use judgement. `VAULT_STOP_NUDGE=quiet` silences the Stop reminder for one shell when you need it to.\n- **`vault sync`** closes the gap the hooks can't see: colleagues' pushes, merges done on the hosting site, sessions on another machine. `--advance` moves the cursor only once the notes are updated.\n- **`_meta/Attention.md`** is regenerated on every check and lists what needs a human: notes to consolidate, notes to re-verify because their code moved, stubs to promote because their files keep changing, and paths or link reasons that no longer match the code. The `vault-tidy` skill works the list.\n- **`vault status`** shows all of this in one screen. Run it when you come back to a project after a while.\n- Sort by *Modified* in Obsidian. A module you know is active with a three-month-old note is a lie waiting to be found.\n"},"Vault Changelog":{"path":"_meta/Vault Changelog.md","type":"meta","status":"","depth":"","domain":"","repo":"","updated":"2026-10-19","summary":"Regenerated by `vault check --write` from this vault's git history.","aliases":[],"tags":["meta"],"flags":[],"inbound":0,"body":"---\ntype: meta\nupdated: 2026-10-19\ntags: [meta]\n---\n\n# Vault Changelog\n\n> Regenerated by `vault check --write` from this vault's git history. Don't hand-edit.\n\n- 2026-10-19 · Seed the Excalidraw map: 9 domains, 35 modules, 3 flows, 2 platform notes, 2 decisions · `c8696a0` · 1 Domains: Editing, Elements & Scene, Embedding API, Export & Sharing, History, Hosted App (+3); 2 Modules: Actions, App State, Arrow Binding, Canvas Rendering, Clipboard, Collaboration Session (+29); 3 Flows: Drawing a rectangle, Exporting the scene to PNG, Receiving a collaborator's change; 5 Platform: Action dispatch, Scene versions and re-rendering; 6 Decisions: Elements carry their own version, Outside changes never enter local undo; 8 Repos: excalidraw; .: Home\n- 2026-10-19 · Start the Excalidraw knowledge vault · `0f273ce` · 8 Repos: excalidraw; .: Home; _templates: Decision, Flow, Integration, Module, Release\n"}},"links":[{"from":"Editing","to":"Editor App","reason":"App is one React class component that owns the Scene, Store, History, ActionManager and Renderer, and handles every pointer and keyboard event on the canvas"},{"from":"Editing","to":"Actions","reason":"Most editor commands (delete, align, z-order, styles, export, zoom, undo) are action objects with a perform function and optional keyTest and PanelComponent"},{"from":"Editing","to":"App State","reason":"AppState is the editor state that is not elements: tool, selection, zoom, scroll, theme, open dialogs and the style defaults for new shapes"},{"from":"Editing","to":"Selection","reason":"Selection lives in app state as selectedElementIds and selectedGroupIds, not on the elements"},{"from":"Editing","to":"Drag & Resize","reason":"Moving the selection (dragSelectedElements), resizing and rotating it (transformElements), and sizing a shape while it is being drawn (dragNewElement)"},{"from":"Editing","to":"Linear Elements","reason":"Lines and arrows store points relative to the element's x and y, and LinearElementEditor edits them point by point"},{"from":"Editing","to":"Text Editing","reason":"Editing text puts a DOM textarea over the canvas, and each keystroke replaces the text element with newElementWith, keeping what was typed in originalText and the wrapped result in text"},{"from":"Editing","to":"Snapping","reason":"Object snapping lines moved or drawn elements up with points and gaps of other elements within getSnapDistance, 8 pixels divided by the zoom"},{"from":"Editing","to":"Clipboard","reason":"Copy writes the selected elements and their image files as JSON of type EXPORT_DATA_TYPES.excalidrawClipboard, under both the Excalidraw clipboard MIME type and plain text"},{"from":"Elements & Scene","to":"Element Model","reason":"Every shape, text, arrow, image and frame is a plain readonly object with an id, geometry, style, version, versionNonce and a fractional index"},{"from":"Elements & Scene","to":"Element Mutation","reason":"mutateElement changes an element in place and bumps version, versionNonce and updated; newElementWith returns a changed copy with the same bumps"},{"from":"Elements & Scene","to":"Scene","reason":"Scene holds every element of the drawing, deleted ones included, and tells its subscribers when anything changes"},{"from":"Elements & Scene","to":"Fractional Indexing","reason":"Z-order is the array order, mirrored into each element's index string so it survives merges between users"},{"from":"Elements & Scene","to":"Scene Restore","reason":"Data from outside the editor (files, share links, local storage, collaborators) goes through restoreElements and restoreAppState, which fill missing fields, migrate legacy properties such as strokeSharpness, drop selection elements and give duplicate ids a fresh randomId"},{"from":"Elements & Scene","to":"Groups & Frames","reason":"A group is only a shared id in each member's groupIds, listed deepest first; there is no group element"},{"from":"Elements & Scene","to":"Arrow Binding","reason":"A bound arrow end stores a FixedPointBinding in startBinding or endBinding, and the shape lists the arrow in its boundElements, so a binding is recorded on both sides"},{"from":"Embedding API","to":"Excalidraw Component","reason":"Excalidraw is React.memo over ExcalidrawBase with a custom areEqual; it passes props to App and hands hosts an ExcalidrawImperativeAPI (updateScene, getSceneElements, onChange and more) through onExcalidrawAPI"},{"from":"Embedding API","to":"Geometry Packages","reason":"The math package holds geometry on branded tuples: GlobalPoint for scene coordinates, LocalPoint for coordinates relative to an element, and Radians for angles, so the type checker keeps them apart"},{"from":"Export & Sharing","to":"Image Export","reason":"exportScene renders elements to a canvas, a PNG or JPEG blob, or an SVG element, sized by an export config (padding, scale, fit, maxWidthOrHeight and others)"},{"from":"Export & Sharing","to":"Scene Files","reason":"Saving writes a .excalidraw JSON file through browser-fs-access, keeping only image files that non-deleted elements still use"},{"from":"Export & Sharing","to":"Shareable Links","reason":"exportToBackend serializes the scene, compresses and encrypts it with a fresh AES-GCM key through compressData, uploads it, and puts #json=\u003cid>,\u003ckey> in the URL hash so the key never reaches the server"},{"from":"History","to":"Store","reason":"The Store decides which committed changes become undo entries"},{"from":"History","to":"Deltas","reason":"A StoreDelta pairs an ElementsDelta (added, removed and updated elements) with an AppStateDelta"},{"from":"History","to":"Undo & Redo","reason":"History keeps undo and redo stacks of inverted deltas recorded from the Store's durable increments"},{"from":"Hosted App","to":"Hosted App Shell","reason":"The excalidraw.com app wraps Excalidraw with collaboration, share links and local saving"},{"from":"Hosted App","to":"Local Persistence","reason":"Non-deleted elements and app state are saved to localStorage after a debounce, and image files to IndexedDB; nothing is saved while the tab is hidden or a lock such as collaboration is held"},{"from":"Library","to":"Library Store","reason":"Library holds the user's reusable items and runs updates through a promise queue, so each setLibrary waits for the one before it"},{"from":"Library","to":"Library Menu","reason":"The sidebar tab that lists library items and inserts chosen ones on the canvas, laid out by distributeLibraryItemsOnSquareGrid"},{"from":"Live Collaboration","to":"Collaboration Session","reason":"Collab starts and stops live rooms on the hosted app, applies what collaborators send, and keeps the room copy in Firebase in step"},{"from":"Live Collaboration","to":"Socket Portal","reason":"Portal owns the socket.io connection to one room and encrypts scene, pointer, idle and viewport messages with the room key through encryptData; the room join and follow notifications are sent unencrypted"},{"from":"Live Collaboration","to":"Reconciliation","reason":"reconcileElements merges a local and a remote element list one element at a time"},{"from":"Live Collaboration","to":"Room Storage","reason":"Each room's scene is stored encrypted with the room key in a Firestore document in the scenes collection, and saveToFirebase reconciles with the stored copy inside runTransaction"},{"from":"Rendering","to":"Canvas Rendering","reason":"The editor paints on three stacked canvases: the scene, the element being drawn, and the interactive layer with selection, handles, snap lines and remote cursors"},{"from":"Rendering","to":"Shape Generation","reason":"Each element's rough.js drawable is generated from its seed and kept in ShapeCache, a WeakMap keyed by the element object and checked against the theme"},{"from":"Rendering","to":"Fonts","reason":"Font faces are loaded for the characters the scene's text actually uses"},{"from":"Actions","to":"Editing","reason":"this module's business area"},{"from":"Actions","to":"Action dispatch","reason":"how a keyboard, UI or API call reaches perform and back into the scene"},{"from":"Actions","to":"Element Mutation","reason":"actions return new elements built with newElementWith"},{"from":"App State","to":"Editing","reason":"this module's business area"},{"from":"App State","to":"Local Persistence","reason":"clearAppStateForLocalStorage decides what the hosted app saves"},{"from":"App State","to":"Scene Files","reason":"cleanAppStateForExport decides what a .excalidraw file keeps"},{"from":"Arrow Binding","to":"Elements & Scene","reason":"this module's business area"},{"from":"Arrow Binding","to":"Linear Elements","reason":"bound ends are moved with LinearElementEditor.movePoints"},{"from":"Arrow Binding","to":"Scene Restore","reason":"repairBindings fixes the two records when they disagree"},{"from":"Canvas Rendering","to":"Rendering","reason":"this module's business area"},{"from":"Canvas Rendering","to":"Scene","reason":"memoization keys on the nonce triggerUpdate sets"},{"from":"Canvas Rendering","to":"Shape Generation","reason":"renderElement draws each element from its cached shape or canvas"},{"from":"Canvas Rendering","to":"Scene versions and re-rendering","reason":"the convention this module depends on"},{"from":"Clipboard","to":"Editing","reason":"this module's business area"},{"from":"Clipboard","to":"Scene Restore","reason":"pasted elements are restored before they are inserted"},{"from":"Clipboard","to":"Groups & Frames","reason":"copied elements whose frame is not copied lose their frameId"},{"from":"Collaboration Session","to":"Live Collaboration","reason":"this module's business area"},{"from":"Collaboration Session","to":"Socket Portal","reason":"all socket traffic goes through the Portal instance"},{"from":"Collaboration Session","to":"Reconciliation"," mage Export","to":"Export & Sharing","reason":"this module's business area"},{"from":"Image Export","to":"Canvas Rendering","reason":"PNG export reuses renderStaticScene on a fresh canvas"},{"from":"Image Export","to":"Scene Files","reason":"an embedded scene is written into the PNG or SVG with serializeAsJSON"},{"from":"Image Export","to":"Exporting the scene to PNG","reason":"the export path step by step"},{"from":"Library Menu","to":"Library","reason":"this module's business area"},{"from":"Library Menu","to":"Library Store","reason":"items are read from and written to Library"},{"from":"Library Menu","to":"Editor App","reason":"inserting goes through the app's onInsertElements"},{"from":"Library Store","to":"Library","reason":"this module's business area"},{"from":"Library Store","to":"Library Menu","reason":"the sidebar reads the items this store publishes"},{"from":"Library Store","to":"Local Persistence","reason":"the hosted app stores the library in IndexedDB through LibraryIndexedDBAdapter"},{"from":"Linear Elements","to":"Editing","reason":"this module's business area"},{"from":"Linear Elements","to":"Arrow Binding","reason":"an arrow's end points can be bound to shapes"},{"from":"Linear Elements","to":"Element Mutation","reason":"elbow routing runs inside mutateElement"},{"from":"Local Persistence","to":"Hosted App","reason":"this module's business area"},{"from":"Local Persistence","to":"App State","reason":"clearAppStateForLocalStorage filters what is written"},{"from":"Local Persistence","to":"Hosted App Shell","reason":"the shell calls LocalData.save from onChange and syncs tabs on focus"},{"from":"Reconciliation","to":"Live Collaboration","reason":"this module's business area"},{"from":"Reconciliation","to":"Fractional Indexing","reason":"merged elements are ordered by index and de-duplicated with syncInvalidIndices"},{"from":"Reconciliation","to":"Room Storage","reason":"saveToFirebase reconciles against the stored scene inside a transaction"},{"fro n":"a font finishing loading deletes the cached shapes of text elements"},{"from":"Shareable Links","to":"Export & Sharing","reason":"this module's business area"},{"from":"Shareable Links","to":"Scene Files","reason":"the payload is serializeAsJSON in its database form, without files"},{"from":"Shareable Links","to":"Room Storage","reason":"images in a shared scene are uploaded to Firebase with saveFilesToFirebase"},{"from":"Snapping","to":"Editing","reason":"this module's business area"},{"from":"Snapping","to":"Drag & Resize","reason":"drag and new-element sizing apply the snap offset"},{"from":"Snapping","to":"Canvas Rendering","reason":"snap lines are drawn on the interactive canvas"},{"from":"Socket Portal","to":"Live Collaboration","reason":"this module's business area"},{"from":"Socket Portal","to":"Collaboration Session","reason":"Collab opens and closes the portal and handles what it receives"},{"from":"Socket Portal","to":"Shareable Links","reason":"it uses the same AES-GCM helpers in packages/excalidraw/data/encryption.ts"},{"from":"Store","to":"History","reason":"this module's business area"},{"from":"Store","to":"Deltas","reason":"durable increments carry a StoreDelta computed from two snapshots"},{"from":"Store","to":"Undo & Redo","reason":"App feeds every onDurableIncrementEmitter event into History.record"},{"from":"Text Editing","to":"Editing","reason":"this module's business area"},{"from":"Text Editing","to":"Canvas Rendering","reason":"the text being edited is left out of the static canvas while the textarea shows it"},{"from":"Text Editing","to":"Arrow Binding","reason":"after each change updateBoundElements moves arrows bound to the text"},{"from":"Undo & Redo","to":"History","reason":"this module's business area"},{"from":"Undo & Redo","to":"Deltas","reason":"each stack entry is a HistoryDelta"},{"from":"Undo & Redo","to":"Store","reason":"applying an entry schedules an IMMEDIATELY micro action, so the change is still emitted as an increment"},{"from":"Drawing a rectangle","to":"Editor App","reason":"the canvas pointer-down is routed by the active tool"},{"from":"Drawing a rectangle","to":"Element Model","reason":"a new element is built from the current style defaults"},{"from":"Drawing a rectangle","to":"Scene","reason":"it is inserted into the scene and given a fractional index"},{"from":"Drawing a rectangle","to":"Drag & Resize","reason":"pointer moves resize it in place without informing the scene"},{"from":"Drawing a rectangle","to":"Canvas Rendering","reason":"the element being drawn is painted on its own canvas"},{"from":"Drawing a rectangle","to":"Store","reason":"the change is scheduled as an undoable step"},{"from":"Drawing a rectangle","to":"Undo & Redo","reason":"the commit after render records the delta"},{"from":"Exporting the scene to PNG","to":"Image Export","reason":"the dialog picks the selection or the whole scene and clones it"},{"from":"Exporting the scene to PNG","to":"Editor App","reason":"the app hands the export to exportCanvas"},{"from":"Exporting the scene to PNG","to":"Fonts","reason":"the fonts the text uses are loaded first"},{"from":"Exporting the scene to PNG","to":"Canvas Rendering","reason":"the static renderer paints on a new canvas with isExporting"},{"from":"Exporting the scene to PNG","to":"Scene Files","reason":"the canvas becomes a PNG blob"},{"from":"Receiving a collaborator's change","to":"Collaboration Session","reason":"the socket delivers an encrypted client-broadcast"},{"from":"Receiving a collaborator's change","to":"Shareable Links","reason":"the payload is decrypted with the room key"},{"from":"Receiving a collaborator's change","to":"Scene Restore","reason":"remote elements are restored against the local ones"},{"from":"Receiving a collaborator's change","to":"Reconciliation","reason":"each element is merged by version and nonce"},{"from":"Receiving a collaborator's change","to":"Fractional Indexing","reason":"the merged list is ordered by fractional ind <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
const COLORS = [
  ['module', '#e8832a', 'module'], ['stub', '#708090', 'stub'], ['deprecated', '#9b1c1c', 'deprecated'],
  ['domain', '#e0609a', 'domain'], ['flow', '#3aa65b', 'flow'], ['integration', '#3b7ddd', 'integration'],
  ['platform', '#8e5bd6', 'platform'], ['decision', '#d9b400', 'decision'], ['release', '#8d8d8d', 'release'],
  ['repo', '#2a9d8f', 'repo'], ['meta', '#b5b5b5', 'other']];
const COLOR = Object.fromEntries(COLORS.map(c => [c[0], c[1]]));
const colorOf = n => n.status === 'deprecated' ? COLOR.deprecated : n.depth === 'stub' ? COLOR.stub : (COLOR[n.type] || COLOR.meta);

// --- data shaping ----------------------------------------------------------
const nodes = Object.keys(data.notes).sort().map(id => Object.assign({id: id}, data.notes[id]));
const byId = new Map(nodes.map(n => [n.id, n]));
const pairs = new Map();            // one drawn line per unordered pair; every reason kept
for (const l of data.links) {
  const k = l.from < l.to ? l.from + '\u0001' + l.to : l.to + '\u0001' + l.from;
  let p = pairs.get(k);
  if (!p) { p = {source: l.from, target: l.to, reasons: []}; pairs.set(k, p); }
  p.reasons.push(l);
}
const links = Array.from(pairs.values());
const degree = new Map();
for (const l of links) { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); }
const radius = n => 4 + Math.sqrt(degree.get(n.id) || 0) * 1.6;
const lookup = new Map();           // lowercased name or alias -> id
for (const n of nodes) { lookup.set(n.id.toLowerCase(), n.id); for (const a of n.aliases || []) lookup.set(String(a).toLowerCase(), n.id); }
for (const a in data.aliases) if (byId.has(data.aliases[a])) lookup.set(a.toLowerCase(), data.aliases[a]);
const resolve = name => lookup.get(name.trim().toLowerCase()) || null;

document.getElementById('stats').textContent = nodes.length + ' notes · ' + data.links.length + ' links · ' + data.vault + (data.built_at ? ' · built ' + data.built_at : '');
document.getElementById('legend').innerHTML = COLORS.map(c => '<span style="--c:' + c[1] + '">' + c[2] + '</span>').join('');

// --- graph -----------------------------------------------------------------
const svg = d3.select('#graph');
const g = svg.append('g');
const tip = document.getElementById('tip');
const moveTip = e => { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 400) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); };
const hideTip = () => { tip.style.display = 'none'; };

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
// A wide transparent twin of each edge is the hover target: a 1px line is unhoverable.
const hit = g.append('g').attr('class', 'hits').selectAll('line').data(links).join('line')
  .on('mouseenter', (e, d) => { d.el.classList.add('hover'); showTip(e, d.reasons.map(r => '<b>' + esc(r.from) + '</b> → <b>' + esc(r.to) + '</b>' + (r.reason ? ': ' + esc(r.reason) : '')).join('<br>')); })
  .on('mousemove', moveTip).on('mouseleave', (e, d) => { d.el.classList.remove('hover'); hideTip(); });
link.each(function (d) { d.el = this; });
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'node')
  .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
  .on('click', (e, d) => { e.stopPropagation(); select(d.id, false); })
  .on('mouseenter', (e, d) => showTip(e, '<b>' + esc(d.id) + '</b> <small>' + esc([d.type, d.status, d.depth].filter(Boolean).join(' · ')) + '</small>' + (d.summary ? '<br>' + esc(d.summary) : '')))
  .on('mousemove', moveTip).on('mouseleave', hideTip);
node.append('circle').attr('r', radius).attr('fill', colorOf);
node.append('text').attr('dx', d => radius(d) + 3).attr('dy', '0.35em').text(d => d.id);

const draw = () => {
  for (const s of [link, hit]) s.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
};
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50))
  .force('charge', d3.forceManyBody().strength(-160))
  .force('collide', d3.forceCollide(d => radius(d) + 4))
  .force('center', d3.forceCenter(0, 0))
  .force('x', d3.forceX(0).strength(0.04))   // keep unlinked notes near the rest
  .force('y', d3.forceY(0).strength(0.04))
  .on('tick', draw)
  .stop();
sim.tick(300);                      // settle synchronously: first paint is the final layout
draw();

let moved = false;                  // the viewer zoomed or panned: stop refitting for them
const zoom = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => {
  if (e.sourceEvent) moved = true;
  g.attr('transform', e.transform);
  node.selectAll('text').style('display', e.transform.k < 0.55 ? 'none' : null);
});
svg.call(zoom).on('click', () => select(null));
let fitted = true;
fit(false);                         // first paint lands fitted; later fits animate

function size() {               // falls back to the window: a hidden page reports a 0x0 svg
  const r = svg.node().getBoundingClientRect();
  return [r.width || window.innerWidth, r.height || window.innerHeight];
}
function fit(animate = true) {
  const [w, h] = size();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const k = Math.min(1, 0.9 * Math.min(w / (x1 - x0 + 1), h / (y1 - y0 + 1)));
  if (!(k > 0 && isFinite(k))) { fitted = false; return; }   // retried on the next resize
  const target = d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, target);
}
function centerOn(n) {
  const [w, h] = size(), k = Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
}
window.addEventListener('resize', () => { if (!fitted && sim.alpha() < sim.alphaMin()) { fitted = true; fit(); } });
// On narrow screens the reader panel sits under the graph; opening a note shrinks the graph, so refit it.
if (window.ResizeObserver) new ResizeObserver(() => { if (!moved) fit(false); }).observe(svg.node());
function dragStart(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }

// --- selection, search, dimming ---------------------------------------------
let selected = null;
function focus(set) {               // ids to keep bright, or null for all
  node.classed('dim', d => !!set && !set.has(d.id)).classed('sel', d => d.id === selected);
  link.classed('dim', d => !!set && !(set.has(d.source.id) && set.has(d.target.id)))
      .classed('hot', d => !!selected && (d.source.id === selected || d.target.id === selected));
}
function neighbours(id) {           // [dir, other, reason], reasoned first, deduplicated
  const out = [], seen = new Set();
  for (const l of data.links) {
    const r = l.from === id ? ['→', l.to, l.reason] : l.to === id ? ['←', l.from, l.reason] : null;
    if (!r) continue;
    const k = r.join('\u0001');
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }
  return out.sort((a, b) => (a[2] == null) - (b[2] == null) || (a[0] > b[0]) - (a[0] < b[0]) || a[1].localeCompare(b[1]));
}
function focusSelected() {
  focus(selected ? new Set([selected].concat(neighbours(selected).map(x => x[1]))) : null);
}
const panel = document.getElementById('panel');
const obsidianUrl = n => 'obsidian://open?vault=' + encodeURIComponent(data.vault) + '&file=' + encodeURIComponent(n.path.replace(/\.md$/, ''));
function select(id, center) {
  selected = id;
  focusSelected();
  if (!id) { panel.className = 'empty'; panel.textContent = 'Click a node to read its note. Hover an edge for the link reason.'; return; }
  const n = byId.get(id), nb = neighbours(id);
  const meta = [n.type, n.status, n.depth, n.domain, n.repo, n.updated && 'updated ' + n.updated].filter(Boolean).map(esc).join(' · ');
  panel.className = '';
  panel.innerHTML = '<h2>' + esc(id) + '</h2><div class="meta">' + meta + '<br><a href="' + obsidianUrl(n) + '" title="Open in Obsidian">' + esc(n.path) + '</a></div>'
    + '<div class="body">' + md(n.body || n.summary || '') + '</div>'
    + '<div class="nb"><h3>Neighbours (' + nb.length + ')</h3><ul>'
    + nb.map(x => '<li>' + x[0] + ' <a href="#" data-node="' + esc(x[1]) + '">' + esc(x[1]) + '</a>' + (x[2] ? ' <span class="r">— ' + esc(x[2]) + '</span>' : '') + '</li>').join('')
    + '</ul></div>';
  panel.scrollTop = 0;
  if (center) centerOn(n);
}
panel.addEventListener('click', e => {
  const a = e.target.closest('a[data-node]');
  if (a) { e.preventDefault(); select(a.dataset.node, true); }
});

const q = document.getElementById('q'), hits = document.getElementById('hits');
function matches(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  return nodes.filter(n => n.id.toLowerCase().includes(t) || (n.aliases || []).some(a => String(a).toLowerCase().includes(t)));
}
q.addEventListener('input', () => {
  const m = matches(q.value);
  if (!m) { hits.innerHTML = ''; focusSelected(); return; }
  focus(new Set(m.map(n => n.id)));
  hits.innerHTML = m.slice(0, 30).map(n => '<li data-node="' + esc(n.id) + '">' + esc(n.id) + ' <small>' + esc(n.type || '') + '</small></li>').join('') || '<li><small>no matches</small></li>';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const m = matches(q.value); if (m && m.length) { select(m[0].id, true); hits.innerHTML = ''; } }
  if (e.key === 'Escape') { q.value = ''; hits.innerHTML = ''; focusSelected(); }
});
hits.addEventListener('click', e => { const li = e.target.closest('li[data-node]'); if (li) { select(li.dataset.node, true); hits.innerHTML = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.innerHTML = ''; });

// --- minimal markdown --------------------------------------------------------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inline(s) {
  const out = [];
  const keep = html => { out.push(html); return '\u0002' + (out.length - 1) + '\u0003'; };
  s = s.replace(/`([^`]+)`/g, (m, c) => keep('<code>' + esc(c) + '</code>'))
       .replace(/!?\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, t, a) => {
         const id = resolve(t), label = esc(a || t);
         return keep(id ? '<a href="#" data-node="' + esc(id) + '">' + label + '</a>' : '<span class="dead">' + label + '</span>');
       });
  s = esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0003/g, (m, i) => out[i]);
}
function md(text) {
  const lines = text.replace(/^---\n[\s\S]*?\n---\n?/, '').split('\n');
  const html = [];
  let i = 0, list = null, para = [], m;
  const flushPara = () => { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  const cells = r => r.replace(/^\s*\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => inline(c.replace(/\\\|/g, '|').trim()));
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara(); closeList();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushPara(); closeList(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*\|/.test(line)) {
      flushPara(); closeList();
      const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      html.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => (k ? '<td>' : '<th>') + c + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {     // ponytail: nested lists flattened
      flushPara();
      const kind = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== kind) { closeList(); list = kind; html.push('<' + kind + '>'); }
      html.push('<li>' + inline(m[2]) + '</li>'); i++; continue;
    }
    if ((m = line.match(/^>\s?(.*)/))) { flushPara(); closeList(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeList(); html.push('<hr>'); i++; continue; }
    if (!line.trim()) { flushPara(); closeList(); i++; continue; }
    closeList(); para.push(line); i++;
  }
  flushPara(); closeList();
  return html.join('\n');
}
})();
</script>
<script>(function () {  // open one note on arrival
  var t = [].find.call(document.querySelectorAll('.node text'), function (x) { return x.textContent === "Drawing a rectangle"; });
  if (t) t.parentNode.dispatchEvent(new MouseEvent('click', {bubbles: true}));
})();</script>
</body>
