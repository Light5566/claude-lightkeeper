name: Lightkeeper PR notes
description: Comments on a pull request with the knowledge-vault notes that own its changed files. Advisory only; never fails.
author: Light5566
branding:
  icon: book-open
  color: orange
inputs:
  vault_repo:
    description: The vault repository, owner/name (its own git repo, outside the code).
    required: true
  vault_ref:
    description: Branch or tag of the vault repository to read.
    required: false
    default: main
  vault_path:
    description: Folder inside the vault repository that holds the vault, when it is not the root.
    required: false
    default: ""
  vault_token:
    description: Token that can read the vault repository (needed when it is private). Pass a secret.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Check out the vault
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.vault_repo }}
        ref: ${{ inputs.vault_ref }}
        token: ${{ inputs.vault_token }}
        path: .claude-vault-notes
        persist-credentials: false
    - name: Map changed files to owning notes
      id: notes
      shell: bash
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        VAULT_DIR: .claude-vault-notes/${{ inputs.vault_path }}
      run: |
        set +e
        git fetch -q --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null
        base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
        git diff --name-only "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
        python3 "$GITHUB_ACTION_PATH/pr_notes.py" --vault "$VAULT_DIR" --files "$RUNNER_TEMP/changed.txt" --repo "$PWD" > "$RUNNER_TEMP/comment.md"
        echo "changed=$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Post or update the comment
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/comment.md`;
          if (!fs.existsSync(path)) return;
          const body = fs.readFileSync(path, 'utf8');
          const marker = '<!-- claude-vault -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request && context.payload.pull_request.number;
          if (!issue_number) return;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find(c => c.body && c.body.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
